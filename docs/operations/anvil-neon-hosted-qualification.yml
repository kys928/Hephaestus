name: Anvil Neon hosted qualification
on:
  push:
    branches: [feature/anvil-integration]
    paths: [.github/workflows/anvil-neon-hosted-qualification.yml]
permissions:
  contents: read
jobs:
  hosted:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checkpoint: ${{ steps.exercise.outputs.backup_ref }}
      frontier: ${{ steps.exercise.outputs.frontier }}
      accepted: ${{ steps.exercise.outputs.accepted_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - id: exercise
        env:
          ANVIL_POSTGRES_DSN: ${{ secrets.ANVIL_POSTGRES_DSN }}
          PYTHONPATH: src
        run: python scripts/anvil_neon_qualification.py hosted synthetic-backup
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-anvil-neon-backup
          path: synthetic-backup/
          if-no-files-found: error
  restore:
    needs: hosted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: anvil_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-anvil-neon-backup
          path: synthetic-backup
      - env:
          PYTHONPATH: src
          ANVIL_RESTORE_DSN: postgresql://postgres:fixture@127.0.0.1:5432/anvil_fixture
          BACKUP_REF: ${{ needs.hosted.outputs.checkpoint }}
          EXPECTED_FRONTIER: ${{ needs.hosted.outputs.frontier }}
          EXPECTED_ACCEPTED_ID: ${{ needs.hosted.outputs.accepted }}
        run: python scripts/anvil_neon_qualification.py restore synthetic-backup
