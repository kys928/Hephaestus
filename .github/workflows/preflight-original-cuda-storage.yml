name: Verify free original volume capacity and required pinned model shards (CPU only)
on:
  push:
    branches: [feature/original-cuda-45-full-budget-launch-20261029]
    paths: ['.github/workflows/preflight-original-cuda-storage.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q boto3 huggingface_hub
      - name: Inventory storage and required immutable model revisions without downloading weights
        run: |
          python - <<'PY'
          import json,os,boto3
          from collections import defaultdict
          from huggingface_hub import HfApi
          from hephaestus.llm.cpu_causal_research import MODEL_ID,MODEL_REVISION
          volume=os.environ['RUNPOD_NETWORK_VOLUME_ID']
          if volume!='cviwpryzao':
              raise SystemExit('UNKNOWN_ORIGINAL_VOLUME')
          client=boto3.client('s3',endpoint_url=os.environ['RUNPOD_S3_ENDPOINT_URL'],
              region_name='eu-cz-1',
              aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'])
          used=0; count=0; prefixes=defaultdict(int)
          for page in client.get_paginator('list_objects_v2').paginate(Bucket=volume,PaginationConfig={'PageSize':1000}):
              for row in page.get('Contents',[]):
                  used+=int(row['Size']);count+=1
                  key=row['Key']
                  if key.startswith('.cache/'):bucket='.cache'
                  elif key.startswith('hephaestus/'):bucket='hephaestus'
                  else:bucket='other'
                  prefixes[bucket]+=int(row['Size'])
          print('CURRENT_VOLUME_VISIBLE_OBJECT_COUNT='+str(count))
          print('CURRENT_VOLUME_VISIBLE_GIB='+str(round(used/2**30,2)))
          print('ORIGINAL_VOLUME_CAPACITY_GB=100')
          print('VOLUME_PREFIX_GROUP_SIZES_GIB='+json.dumps({
              name:round(value/2**30,2) for name,value in prefixes.items()},sort_keys=True))
          registry=json.load(open('configs/models/hephaestus_role_model_stack_v1.json'))
          models=[(role,info['model_id'],info['revision']) for role,info in registry['roles'].items()]
          models.append(('target',MODEL_ID,MODEL_REVISION))
          api=HfApi()
          total=0
          for role,repo,revision in models:
              m=api.model_info(repo,revision=revision,files_metadata=True)
              # Exclude consolidated duplicate weights and non-PyTorch weights.
              candidates=[s for s in m.siblings if s.rfilename.endswith('.safetensors')]
              print('MODEL_ROLE='+role+' LARGE_WEIGHT_BLOBS='+json.dumps([
                [s.rfilename,round((s.size or 0)/2**30,2)] for s in candidates if (s.size or 0)>1024**3],
                sort_keys=True))
              selected=[s for s in candidates if 'consolidated' not in s.rfilename.lower()
                and not s.rfilename.startswith(('original/','fp8/','gguf/'))]
              amount=sum(s.size or 0 for s in selected)
              total+=amount
              print('MODEL_SELECTED_ROLE='+role+' WEIGHT_GIB='+str(round(amount/2**30,2)))
          print('MODELS_SELECTED_TOTAL_WEIGHT_GIB='+str(round(total/2**30,2)))
          print('STORAGE_PREFLIGHT_EXECUTED_GPU_OPERATIONS=0')
          PY
