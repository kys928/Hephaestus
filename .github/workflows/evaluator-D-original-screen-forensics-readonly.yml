name: D original-format 64-case comparator (CPU S3 READ ONLY)
on:
  push:
    branches: [diagnostic/D-contrast-56-output-forensics-20261023]
permissions: {contents: read}
jobs:
  source-screen-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts:src:.
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3,test]'
      - name: Rescore archived original-format D outputs with saved references
        run: |
          python -m py_compile scripts/forensic_D_original_screen_readonly.py
          python scripts/forensic_D_original_screen_readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: D-original-format-screen-readonly-comparison
          path: D-contrast-original-D-screen-forensic/
          if-no-files-found: error
          retention-days: 90
