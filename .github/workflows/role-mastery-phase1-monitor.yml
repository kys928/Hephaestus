name: Role Mastery Phase I monitor
# funded-role-mastery-v1-check-12
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths: [.github/workflows/role-mastery-phase1-monitor.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:scripts
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: |
          python - <<'PY'
          import json
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider
          from hephaestus.providers.runpod import RunPodConfig,RunPodExecutionAdapter
          import launch_first_bounded_scientific_training as storage
          gid='35596791201'
          run_id=f'role-mastery-v1-{gid}'
          roles=['controller','diagnosis','planner','evaluator','judge']
          ex=RunPodExecutionAdapter(RunPodConfig.from_env(),EnvironmentSecretsProvider())
          status,payload=ex._request('GET','pods')
          pods=payload if isinstance(payload,list) else payload.get('pods',[]) if isinstance(payload,dict) else []
          client=storage.s3_client();out={}
          for role in roles:
              target=f'hephaestus-role-mastery-{role}-{run_id}'
              matches=[{k:p.get(k) for k in ('id','name','desiredStatus','costPerHr','gpu')} for p in pods if target in str(p.get('name',''))]
              prefix=f'hephaestus/scientific/v1/role_mastery/{run_id}/roles/{role}'
              progress=result=None
              try:
                  raw=storage.maybe_read_key(client,prefix+'/progress.json')
                  if raw: progress=json.loads(raw)
              except Exception as exc:
                  progress={'read_error':f'{type(exc).__name__}: {exc}'}
              try:
                  raw=storage.maybe_read_key(client,prefix+'/result.json')
                  if raw:
                      obj=json.loads(raw)
                      result={k:obj.get(k) for k in ('status','model_id','selected_dev_step','error_type','error')}
                      result['certification']=obj.get('certification')
                      result['certification_summary']=obj.get('certification_summary')
                      result['selected_adapter']=obj.get('selected_adapter')
              except Exception as exc:
                  result={'read_error':f'{type(exc).__name__}: {exc}'}
              out[role]={'pods':matches,'progress':progress,'result':result}
          print('ROLE_MASTERY_MONITOR_JSON '+json.dumps({'pods_status':status,'run_id':run_id,'roles':out},sort_keys=True))
          PY
