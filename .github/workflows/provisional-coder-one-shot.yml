name: Provisional original-parent Coder qualification one-shot
on:
  push:
    branches: [ops/provisional-coder-qualification-20261117]
    paths: [.github/workflows/provisional-coder-one-shot.yml]
permissions: {contents: read}
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {ref: 083221af322c0d54562b08bc53a26f47491367bd, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: test "$(git rev-parse HEAD)" = "083221af322c0d54562b08bc53a26f47491367bd"
      - run: python -m pip install -e '.[test,independent-certification]'
      - run: python -m pytest -q tests/test_provisional_ministral_coder_qualification.py tests/test_autonomous_repair_episode.py tests/test_exact_span_model_patch_contract.py tests/test_constrained_research_self_repair.py
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: 083221af322c0d54562b08bc53a26f47491367bd, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: test "$(git rev-parse HEAD)" = "083221af322c0d54562b08bc53a26f47491367bd"
      - run: python -m pip install -e '.[test,independent-certification]'
      - run: python -m pytest -q
