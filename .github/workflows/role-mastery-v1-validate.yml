name: Role Mastery V1 validate
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - scripts/build_role_mastery_v1.py
      - tests/test_role_mastery_v1.py
      - configs/experiments/hephaestus_role_mastery_v1.json
      - .github/workflows/role-mastery-v1-validate.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet -e '.[test,s3]'
      - run: python scripts/build_role_mastery_v1.py
      - run: pytest -q tests/test_role_mastery_v1.py
      - run: python -m py_compile scripts/build_role_mastery_v1.py scripts/run_role_mastery_v1.py scripts/launch_role_mastery_v1.py
      - run: |
          for role in controller diagnosis planner evaluator judge; do
            python scripts/launch_role_mastery_v1.py --role "$role" >/dev/null
          done
