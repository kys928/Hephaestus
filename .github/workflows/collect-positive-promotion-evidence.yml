name: Collect positive promotion evidence

on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/collect-positive-promotion-evidence.yml
      - scripts/collect_positive_promotion_evidence.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      HEPHAESTUS_PROOF_RUN_ID: positive-real-model-promotion-001-33957215257
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - run: python scripts/collect_positive_promotion_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: preserved-positive-promotion-evidence
          path: positive_promotion_preserved_evidence
          retention-days: 30
