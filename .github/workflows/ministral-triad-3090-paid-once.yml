name: REAL original Ministral triad on RTX3090 prepaid limited
on:
  push:
    branches: [ops/ministral-triad-3090-paid-20261124]
    paths: [.github/workflows/ministral-triad-3090-paid-once.yml]
permissions: {contents: read}
concurrency: {group: original-ministral-triad-3090-paid-202611240002, cancel-in-progress: false}
jobs:
  actual-three-model-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io
      RUNPOD_API_BASE_URL: https://api.runpod.io/v2
    steps:
      - uses: actions/checkout@v4
        with: {ref: c8c883497b8d8dd97373aa7bb98c148acac7f11b, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: test "$(git rev-parse HEAD)" = c8c883497b8d8dd97373aa7bb98c148acac7f11b
      - run: python -m pip install -e '.[s3,test,independent-certification]'
      - name: Build immutable offline external repair checker
        run: |
          docker build -t hephaestus-triad-review-sandbox:local - <<'DOCKER'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir pytest==8.4.2
          DOCKER
      - name: Actual 3 original-model CUDA inferencing and independently verified patch; $2 prepaid cap
        run: |
          python -u scripts/launch_approved_ministral_triad_cuda.py \
            --source-commit c8c883497b8d8dd97373aa7bb98c148acac7f11b \
            --run-tag 202611240002
