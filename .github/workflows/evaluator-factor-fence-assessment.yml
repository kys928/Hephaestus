name: Evaluator 64 saved factor reports exact-fence independent assessment
on:
  push:
    branches: [diagnostic/evaluator-factor-probe-protocol-v1]
permissions:
  contents: read
jobs:
  assess:
    if: contains(github.event.head_commit.message, '[assess-factor-fence-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts:src:.
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3,test]'
      - name: Verify normalization rejects prose and invalid six-factor JSON
        run: pytest -q tests/test_evaluator_factor_probe_fence.py
      - name: Recompute factor accuracy from unmodified stored outputs
        run: python scripts/assess_evaluator_factor_probe_fenced.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluator-factor-only-D-exploratory-fence-scoring
          path: evaluator-factor-probe-fence-normalized.json
