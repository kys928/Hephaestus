name: Evaluator Semantic V2 explicitly approved D proof
on:
  push:
    branches: [repair/evaluator-semantic-v2-D]
permissions:
  contents: read
concurrency:
  group: evaluator-semantic-v2-approved-D
  cancel-in-progress: false
jobs:
  training:
    if: contains(github.event.head_commit.message, '[launch-approved-evaluator-semantic-v2-D]')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_EVALUATOR_V2_AUTHORIZED: LAUNCH_APPROVED_EVALUATOR_SEMANTIC_V2
      HEPHAESTUS_EVALUATOR_V2_RUN_ID: evaluator-semantic-v2-D-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Validate frozen parent, new D schedule, and budget before allocation
        run: |
          python scripts/validate_evaluator_semantic_repair_v2.py > /tmp/d-preflight-validation.json
          python - <<'PY'
          from prepare_evaluator_semantic_repair_v2 import prepare
          import json
          cfg, pack, selected, manifest = prepare('D')
          from evaluator_semantic_v2_screen import screen_cases, screen_hash
          diagnostic=pack['partitions']['evaluator']['development_diagnostic']
          screen=screen_cases(diagnostic)
          approval=json.load(open(cfg['governance']['approval_record_path']))
          assert approval['arm']=='D'
          assert cfg['governance']['budget_approval_id']==approval['approval_id']
          assert cfg['execution']['max_estimated_total_usd_train']<=1.5
          assert cfg['execution']['max_estimated_total_usd_evaluate']<=1.5
          assert len(screen)==64 and len(diagnostic)==256
          print('D_PREPAID_SCREEN_VERIFIED '+json.dumps(dict(manifest=manifest['selected_schedule_sha256'],screen_sha=screen_hash(screen),screen_count=len(screen)),sort_keys=True))
          PY
      - name: Train exactly one approved D proof from the frozen parent
        run: python scripts/launch_evaluator_semantic_repair_v2.py --mode train --arm D --execute
  evaluate:
    needs: training
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_EVALUATOR_V2_AUTHORIZED: LAUNCH_APPROVED_EVALUATOR_SEMANTIC_V2
      HEPHAESTUS_EVALUATOR_V2_RUN_ID: evaluator-semantic-v2-D-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Evaluate balanced 64-case screen; continue only if gates remain achievable
        run: python scripts/launch_evaluator_semantic_repair_v2.py --mode evaluate --arm D --execute
