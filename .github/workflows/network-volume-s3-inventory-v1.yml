name: Hephaestus network volume S3 inventory V1

on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/network-volume-s3-inventory-v1.yml
      - scripts/scan_network_volume_s3_v1.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-volume-s3-inventory-cviwpryzao
  cancel-in-progress: false

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[scan-network-volume-s3-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install S3 inventory dependencies
        run: python -m pip install -e '.[s3]'
      - name: Compile read-only inventory script
        run: python -m py_compile scripts/scan_network_volume_s3_v1.py
      - name: Scan actual Network Volume through S3 API
        run: python scripts/scan_network_volume_s3_v1.py | tee network_volume_s3_scan.log
      - name: Preserve byte-level inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-volume-s3-inventory-v1
          path: |
            network_volume_s3_inventory.json
            network_volume_s3_largest.tsv
            network_volume_s3_scan.log
          if-no-files-found: warn
          retention-days: 90
