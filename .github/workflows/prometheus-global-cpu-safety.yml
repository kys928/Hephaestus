name: Prometheus Unbound global CPU safety gate (one-shot branch)
on:
  push:
    branches: [ops/prometheus-unbound-global-20261114]
    paths:
      - .github/workflows/prometheus-global-cpu-safety.yml
permissions:
  contents: read
  issues: write
concurrency:
  group: prometheus-global-cpu-gates-20261114
  cancel-in-progress: false
jobs:
  test:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' requests
      - name: Compile all new code and perform source-format checks
        run: |
          python -m py_compile src/hephaestus/development/prometheus_global_supervision.py
          python -m py_compile src/hephaestus/development/prometheus_global_launcher.py
          python -m py_compile src/hephaestus/development/prometheus_global_watchdog.py
          python -m py_compile src/hephaestus/development/prometheus_global_envelope.py
          python -m py_compile src/hephaestus/development/prometheus_gpu_campaign.py
      - name: Offline only, negative path tests
        run: |
          pytest -q tests/test_prometheus_global_supervised_launch.py tests/test_prometheus_global_adapter_source.py tests/test_prometheus_gpu_provider_guard.py tests/test_prometheus_scientific_decision.py
      - name: Publish immutable CI run locator (no scientific claims)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          link="https://github.com/kys928/Hephaestus/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          text="Prometheus Global offline CPU safety gate: "+os.environ["CI_JOB_STATUS"]+" — "+link
          payload=json.dumps({"body":text}).encode()
          request=urllib.request.Request(
              "https://api.github.com/repos/kys928/Hephaestus/issues/206/comments",
              data=payload,method="POST",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "Content-Type":"application/json",
                       "Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request,timeout=30) as response:
              print("PROMETHEUS_CPU_GATE_LOCATOR_RECORDED="+str(response.status==201))
          PY
