name: GLM Tiny Adaptation V1 paid probe

on:
  workflow_dispatch:
    inputs:
      confirm_paid_probe:
        description: Explicitly confirm the bounded paid tiny-adaptation probe
        required: true
        type: boolean
        default: false
      screen_result_key:
        description: Governed S3 result.json key from a passed GLM Cheap Screen V1 run
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3,test]' 'peft==0.20.0'
      - run: python scripts/validate_glm_tiny_adaptation_v1.py
      - run: python -m pytest -q tests/test_glm_tiny_adaptation_v1.py
      - run: python scripts/launch_glm_tiny_adaptation_v1.py --screen-result-key '${{ inputs.screen_result_key }}'

  launch:
    needs: validate
    if: ${{ inputs.confirm_paid_probe == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      HEPHAESTUS_GLM_TINY_ADAPT_LAUNCH_AUTHORIZED: 'YES'
      HEPHAESTUS_GLM_SCREEN_RESULT_KEY: ${{ inputs.screen_result_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]' 'peft==0.20.0'
      - name: Launch bounded tiny adaptation
        run: python scripts/launch_glm_tiny_adaptation_v1.py --execute