name: D multi-region read-only GPU pricing (NO GPU)
on:
  push:
    branches: [experiment/D-contrast-flex-gpu-budget2-20261023]
permissions: {contents: read}
jobs:
  regional-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/inspect_D_gpu_multiregion_readonly.py
