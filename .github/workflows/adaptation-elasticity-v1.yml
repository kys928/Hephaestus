name: Hephaestus adaptation elasticity V1

# Resume launch after validated PEFT target-path normalization at ed0b543;
# scientific protocol, dataset, model identities, and training dose remain frozen.
on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/adaptation-elasticity-v1.yml
      - configs/experiments/hephaestus_adaptation_elasticity_v1.json
      - scripts/build_adaptation_elasticity_dataset_v1.py
      - scripts/preflight_adaptation_elasticity_v1.py
      - scripts/run_adaptation_elasticity_v1.py
      - scripts/adaptation_elasticity_resume_v1.py
      - scripts/launch_adaptation_elasticity_v1.py
      - scripts/collect_adaptation_elasticity_v1.py
      - tests/test_adaptation_elasticity_v1.py
      - configs/eval_packs/hephaestus_cognitive_topology_v1.json
      - src/hephaestus/providers/models/**
      - src/hephaestus/policy/action_registry.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptation-elasticity-cviwpryzao
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_XET: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen admission dependencies
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[s3,test]' 'transformers==5.17.0' 'accelerate==1.15.0' 'safetensors==0.8.0' 'huggingface-hub==1.31.0' 'peft==0.20.0'
      - name: Test frozen elasticity protocol and contamination boundary
        run: python -m pytest -q tests/test_adaptation_elasticity_v1.py tests/test_model_admission.py tests/test_autonomy_boundary_policy.py
      - name: Compile elasticity adapters
        run: python -m compileall -q scripts/build_adaptation_elasticity_dataset_v1.py scripts/preflight_adaptation_elasticity_v1.py scripts/adaptation_elasticity_resume_v1.py scripts/run_adaptation_elasticity_v1.py scripts/launch_adaptation_elasticity_v1.py scripts/collect_adaptation_elasticity_v1.py
      - name: Admit dataset and all four immutable model identities
        run: python scripts/preflight_adaptation_elasticity_v1.py
      - name: Preserve elasticity admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptation-elasticity-v1-admission
          path: |
            adaptation_elasticity_preflight/admission.json
            adaptation_elasticity_preflight/requirements.txt
            adaptation_elasticity_preflight/dataset_manifest.json
            adaptation_elasticity_preflight/contamination_report.json
            adaptation_elasticity_preflight/training.jsonl
          if-no-files-found: warn
          retention-days: 90

  prove:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-adaptation-elasticity-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      HEPHAESTUS_ELASTICITY_RUN_ID: adaptation-elasticity-v1-34961824753
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governed RunPod/S3 launcher
        run: python -m pip install -e '.[s3]'
      - name: Inspect existing Pod inventory
        run: python scripts/collect_adaptation_elasticity_v1.py --inventory-only
      - name: Execute frozen four-model adaptation elasticity cohort
        run: |
          set -o pipefail
          python scripts/launch_adaptation_elasticity_v1.py | tee adaptation_elasticity_run.log
      - name: Retrieve Network Volume evidence and independently verify teardown
        if: always()
        run: python scripts/collect_adaptation_elasticity_v1.py
      - name: Preserve compact elasticity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptation-elasticity-v1-evidence
          path: |
            adaptation_elasticity_evidence/
            adaptation_elasticity_launcher.json
            adaptation_elasticity_verification.json
            adaptation_elasticity_run.log
          if-no-files-found: warn
          retention-days: 90
