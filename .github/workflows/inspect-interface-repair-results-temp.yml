name: Inspect interface repair results temp
on:
  push:
    branches: [phase-ii-targeted-interface-repair]
    paths: [.github/workflows/inspect-interface-repair-results-temp.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install boto3
      - shell: bash
        run: |
          python - <<'PY'
          import json, os, boto3
          from botocore.config import Config
          c=boto3.client("s3",endpoint_url=os.environ["RUNPOD_S3_ENDPOINT_URL"].rstrip("/"),region_name=os.environ["RUNPOD_DATACENTER_ID"],aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"],config=Config(retries={"mode":"standard","max_attempts":10}))
          b=os.environ["RUNPOD_NETWORK_VOLUME_ID"]
          prefix="hephaestus/scientific/v1/interface_repair_training/interface-repair-v1-35830231064"
          for key in [
            prefix+"/roles/controller/result.json",
            prefix+"/roles/evaluator/result.json",
            prefix+"/roles/judge/result.json",
            prefix+"/aggregate.json",
          ]:
              try:
                  r=c.get_object(Bucket=b,Key=key)
                  try: data=json.loads(r["Body"].read().decode())
                  finally: r["Body"].close()
                  print("S3_RESULT_JSON "+json.dumps({"key":key,"value":data},sort_keys=True))
              except Exception as e:
                  print("S3_RESULT_MISSING "+json.dumps({"key":key,"error":str(e)},sort_keys=True))
          PY
