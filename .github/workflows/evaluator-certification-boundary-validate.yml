name: Evaluator certification boundary validate

on:
  push:
    branches:
      - feature/evaluator-certification-boundary-v1
    paths:
      - 'src/hephaestus/control/evaluator_boundary.py'
      - 'src/hephaestus/control/evaluator_evidence_refs.py'
      - 'scripts/run_interface_repair_v3_evaluator.py'
      - 'tests/test_evaluator_certification_boundary.py'
      - 'tests/test_interface_repair_v3_evaluator.py'
      - 'configs/experiments/hephaestus_interface_repair_v3_1_neutral_holdout.json'
      - 'configs/experiments/interface_repair_v3_1_neutral_holdout.launch.json'
      - '.github/workflows/evaluator-certification-boundary-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Compile boundary and scorer
        run: python -m py_compile src/hephaestus/control/evaluator_boundary.py src/hephaestus/control/evaluator_evidence_refs.py scripts/run_interface_repair_v3_evaluator.py
      - name: Run targeted boundary tests
        run: python -m pytest -q tests/test_evaluator_certification_boundary.py tests/test_interface_repair_v3_evaluator.py tests/test_interface_repair_v3_1_neutral_holdout.py
      - name: Run full repository tests
        run: python -m pytest -q
