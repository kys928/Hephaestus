name: Evaluator certification boundary validate

on:
  push:
    branches:
      - feature/evaluator-certification-boundary-v1
    paths:
      - 'src/hephaestus/control/evaluator_boundary.py'
      - 'src/hephaestus/control/evaluator_evidence_refs.py'
      - 'scripts/run_interface_repair_v3_evaluator.py'
      - 'scripts/build_evaluator_certification_sealed_v1.py'
      - 'scripts/run_evaluator_sealed_certification_v1.py'
      - 'scripts/launch_evaluator_sealed_certification_v1.py'
      - 'tests/test_evaluator_certification_boundary.py'
      - 'tests/test_evaluator_certification_sealed_pack.py'
      - 'tests/test_evaluator_sealed_certification_runtime.py'
      - 'tests/test_interface_repair_v3_evaluator.py'
      - 'configs/experiments/hephaestus_evaluator_certification_candidate_v1.json'
      - 'configs/experiments/hephaestus_evaluator_sealed_certification_v1.json'
      - 'configs/experiments/hephaestus_evaluator_sealed_certification_v1.launch.json'
      - 'configs/experiments/hephaestus_interface_repair_v3_1_neutral_holdout.json'
      - 'configs/experiments/interface_repair_v3_1_neutral_holdout.launch.json'
      - '.github/workflows/evaluator-sealed-certification-paid.yml'
      - '.github/workflows/evaluator-certification-boundary-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Compile certification boundary and runtime
        run: >-
          python -m py_compile
          src/hephaestus/control/evaluator_boundary.py
          src/hephaestus/control/evaluator_evidence_refs.py
          scripts/run_interface_repair_v3_evaluator.py
          scripts/build_evaluator_certification_sealed_v1.py
          scripts/run_evaluator_sealed_certification_v1.py
          scripts/launch_evaluator_sealed_certification_v1.py
      - name: Validate sealed pack without exposing case bodies
        run: python scripts/build_evaluator_certification_sealed_v1.py
      - name: Dry-render locked paid request
        run: python scripts/launch_evaluator_sealed_certification_v1.py >/tmp/evaluator-certification-dry-run.json
      - name: Run targeted boundary, sealed-pack, and runtime tests
        run: >-
          python -m pytest -q
          tests/test_evaluator_certification_boundary.py
          tests/test_evaluator_certification_sealed_pack.py
          tests/test_evaluator_sealed_certification_runtime.py
          tests/test_interface_repair_v3_evaluator.py
          tests/test_interface_repair_v3_1_neutral_holdout.py
      - name: Run full repository tests
        run: python -m pytest -q
