name: Governed 45-operation campaign genuine-state admission (CPU read only)
on:
  push:
    branches:
      - integration/governed-45-resume-admission-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-real-prefix-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual state and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify original 45 operation order and authenticated partial resume denial
        run: |
          python -m py_compile src/hephaestus/production/governed_campaign_admission.py
          python -m py_compile scripts/inspect_governed_45_campaign.py
          pytest -q tests/test_governed_campaign_admission.py tests/test_staged_production_composition.py tests/test_staged_autonomous_orchestration.py tests/test_staged_dataset_approval_custody.py
      - name: Assert actual campaign never substituted by test fixture or independent CPU experiment
        run: |
          python - <<'PY'
          from hephaestus.control.staged_state import PHASE_SUBSTEPS
          from hephaestus.control.spine import SPINE_ORDER
          from hephaestus.production.governed_campaign_admission import _ORDER
          assert tuple(f'{p.value}.{s}' for p in SPINE_ORDER for s in PHASE_SUBSTEPS[p]) == _ORDER
          assert len(_ORDER) == 45
          print('45/45 original operator contracts checked, ZERO original 45 campaign stages executed in CI')
          PY
