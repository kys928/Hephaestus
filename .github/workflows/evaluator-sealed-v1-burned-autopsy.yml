name: Evaluator sealed v1 burned autopsy

on:
  push:
    branches:
      - diagnostic/evaluator-sealed-v1-autopsy
    paths:
      - 'scripts/autopsy_evaluator_sealed_certification_v1.py'
      - '.github/workflows/evaluator-sealed-v1-burned-autopsy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]'
      - name: Compile read-only autopsy
        run: python -m py_compile scripts/autopsy_evaluator_sealed_certification_v1.py
      - name: Autopsy burned sealed evidence
        run: python scripts/autopsy_evaluator_sealed_certification_v1.py
