name: Real CPU development JSON format ablation
on:
  push:
    branches: ['feature/cpu-dev-format-ablation-20261028']
    paths:
      - 'configs/research/cpu_dev_format_ablation_v1.json'
      - 'scripts/run_cpu_dev_format_ablation.py'
      - 'tests/test_cpu_dev_format_ablation.py'
      - '.github/workflows/cpu-development-format-ablation.yml'
  pull_request:
    paths:
      - 'configs/research/cpu_dev_format_ablation_v1.json'
      - 'scripts/run_cpu_dev_format_ablation.py'
      - 'tests/test_cpu_dev_format_ablation.py'
      - '.github/workflows/cpu-development-format-ablation.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_cpu_dev_format_ablation.py
  actual-cpu-development-ablation:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,peft-training]'
      - run: python -m pytest -q tests/test_cpu_dev_format_ablation.py
      - name: Pinned original development split and real pretrained CPU inference
        run: python scripts/run_cpu_dev_format_ablation.py --output /tmp/cpu-development-format-ablation.json
      - name: Record original experiment JSON SHA
        if: success()
        run: sha256sum /tmp/cpu-development-format-ablation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-original-development-format-ablation
          path: /tmp/cpu-development-format-ablation.json
