name: First targeted post-failure diagnostics

on:
  push:
    branches:
      - integration/targeted-post-failure-diagnostics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-and-plan:
    runs-on: ubuntu-latest
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check -e . 'pytest>=8,<9' 'boto3>=1.35,<2'
      - name: Verify diagnosis and planner subsystems
        run: >-
          pytest -q
          tests/test_targeted_post_failure_probes.py
          tests/test_resolved_evidence_planner.py
          tests/test_evidence_based_diagnosis.py
          tests/test_closed_loop_planner.py
      - name: Compile diagnostic bridge
        run: >-
          python -m py_compile
          src/hephaestus/diagnosis/probes.py
          src/hephaestus/planning/resolved.py
          scripts/run_first_targeted_post_failure_diagnostics.py
      - name: Collect targeted evidence, diagnose, and plan
        run: python scripts/run_first_targeted_post_failure_diagnostics.py
      - name: Upload targeted diagnostic proof
        uses: actions/upload-artifact@v4
        with:
          name: first-targeted-post-failure-diagnostics
          if-no-files-found: error
          retention-days: 30
          path: |
            first_targeted_post_failure_diagnostics.json
            first_targeted_post_failure_probe.json
            first_targeted_post_failure_diagnosis.json
            first_targeted_post_failure_planner.json
