name: One real local coder repair of authentic Diagnostician defect
on:
  push:
    branches: [ops/genuine-coder-repair-proof-20261117]
    paths: [.github/workflows/genuine-coder-repair-once.yml]
permissions: {contents: read}
jobs:
  real-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9b639361a50258c6bf474e2a9d8e1a35d360e8d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: test "$(git rev-parse HEAD)" = "a9b639361a50258c6bf474e2a9d8e1a35d360e8d"
      - run: python -m pip install -e '.[test]'
      - name: Build immutable local offline-test container (actual subprocess)
        run: |
          docker build -t hephaestus-real-coder-test:local - <<'DOCKER'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir pytest==8.4.2
          DOCKER
      - name: Bring up genuine local CPU coder model on isolated runner
        run: |
          docker pull ollama/ollama:latest
          docker run -d --rm --name hephaestus-coder -p 127.0.0.1:11434:11434 \
            --memory=4500m --cpus=3 ollama/ollama:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version; then break; fi
            sleep 2
          done
          docker exec hephaestus-coder ollama pull qwen2.5-coder:1.5b
          docker exec hephaestus-coder ollama list
      - name: Let real coder propose one source edit, then independently run offline red-green
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib,json,shutil,subprocess,tempfile
          from pathlib import Path
          from hephaestus.research.exact_span_repair import ExactSpanPatchProposer
          from hephaestus.research.self_repair_controller import LoopbackOllamaPatchModel
          from hephaestus.research.constrained_repair import (
              ConstrainedSelfRepair,OfflineDockerPytestRunner,RepairScope,
              RepairBoundaryError,
          )
          from hephaestus.storage.filesystem import FileSystemArtifactStore
          from hephaestus.storage.verified import canonical_bytes
          from hephaestus.storage.verified import read_verified_json

          source=Path("src/hephaestus/diagnosis/probes.py")
          assert 'text = str(row.get("text", ""))' in source.read_text(), "Genuine unmodified defect absent"
          with tempfile.TemporaryDirectory(prefix="hephaestus-real-coder-") as folder:
            d=Path(folder)
            checkout=d/"reviewed-source"
            checkout.mkdir()
            shutil.copytree("src",checkout/"src")
            shutil.copytree("tests",checkout/"tests")
            shutil.copytree("configs",checkout/"configs")
            shutil.copy2("pyproject.toml",checkout/"pyproject.toml")
            regression=checkout/"tests"/"test_targeted_post_failure_probes.py"
            regression.write_text(regression.read_text()+"\n\n"+
                "def test_null_text_is_not_literal_supervised_text():\n"+
                "    from hephaestus.diagnosis.probes import analyze_dataset_task_coverage\n"+
                "    _, measurement = analyze_dataset_task_coverage([{'text': None}], {}, source_ref='sha256:real-input')\n"+
                "    assert measurement['text_rows'] == 0\n")
            for args in (
                ["git","init","-q",str(checkout)],
                ["git","-C",str(checkout),"config","user.name","real-coder-test"],
                ["git","-C",str(checkout),"config","user.email","real-coder@example.invalid"],
                ["git","-C",str(checkout),"add","src","tests","configs","pyproject.toml"],
                ["git","-C",str(checkout),"commit","-qm","real-original-diagnosis-plus-new-regression"],
            ):subprocess.run(args,check=True)
            head=subprocess.run(["git","-C",str(checkout),"rev-parse","HEAD"],
                                check=True,capture_output=True,text=True).stdout.strip()
            scope=RepairScope(head,"src/hephaestus/diagnosis/probes.py",
                "tests/test_targeted_post_failure_probes.py")
            image=subprocess.run(["docker","image","inspect","--format={{.Id}}",
                                  "hephaestus-real-coder-test:local"],
                                 capture_output=True,text=True,check=True).stdout.strip()
            assert image.startswith("sha256:") and len(image)==71
            runner=OfflineDockerPytestRunner(image,
                docker_executable=shutil.which("docker"),timeout_seconds=120)
            from hephaestus.research.constrained_repair import _prepare_copy
            clean=d/"baseline"
            clean.mkdir()
            _prepare_copy(checkout,clean)
            red=runner.run(clean,fixed_test=scope.fixed_test)
            print("GENUINE_PREEXISTING_DEFECT_BASELINE="+json.dumps({
                "status":red.status,"exit":red.exit_code,
                "stdout_digest":red.output_sha256,
                "test_is_new":True,"source_was_unchanged":True},sort_keys=True),flush=True)
            assert red.status=="failed" and "test_null_text_is_not_literal_supervised_text" in red.output_excerpt,red
            artifacts=FileSystemArtifactStore(d/"immutable-artifacts")
            fault={
                "schema":"reviewed-code-failure.v1",
                "status":"verified_failed",
                "target_file":scope.allowed_file,
                "source_commit":head,
                "source_sha256":"sha256:"+hashlib.sha256((checkout/scope.allowed_file).read_bytes()).hexdigest(),
                "exact_failing_regression":"test_null_text_is_not_literal_supervised_text",
                "input":{"text":None},
                "expected_text_rows":0,
                "observed_text_rows":1,
                "test_output_sha256":red.output_sha256,
                "unmodified_implementation":True,
                "scientific_certification":False,
            }
            ref=artifacts.put_bytes(canonical_bytes(fault)).artifact_ref
            coder=LoopbackOllamaPatchModel("qwen2.5-coder:1.5b",timeout_seconds=500)
            proposer=ExactSpanPatchProposer(coder)
            try:
                patch=proposer.propose(scope=scope,
                    original=(checkout/scope.allowed_file).read_bytes(),
                    verified_fault=fault,evidence_ref=ref)
                print("GENUINE_CODER_INFERENCE_RECEIPT="+json.dumps(
                    coder.last_receipt,sort_keys=True),flush=True)
                print("GENUINE_CODER_PROPOSED_SPAN="+json.dumps({
                    "source_sha256":patch.expected_source_sha256,
                    "changed_source_sha256":"sha256:"+hashlib.sha256(patch.replacement.encode()).hexdigest(),
                    "hypothesis":patch.hypothesis},sort_keys=True),flush=True)
                trial=ConstrainedSelfRepair(artifacts,runner).trial(
                    checkout=checkout,scope=scope,candidate=patch,
                    verified_fault_ref=ref)
                print("GENUINE_CODER_REPAIR_TRIAL="+json.dumps({
                    "status":trial["status"],
                    "red_to_green_verified":trial["red_to_green_verified"],
                    "baseline_status":trial["baseline"]["status"],
                    "candidate_status":trial["candidate"]["status"],
                    "trial_ref":trial["trial_ref"]},sort_keys=True),flush=True)
                assert (checkout/scope.allowed_file).read_bytes()==source.read_bytes()
                print("GENUINE_CODER_NO_PRODUCTION_MUTATION=PASS",flush=True)
                if trial["red_to_green_verified"]:
                    print("GENUINE_CODER_CODE_REPAIR_DEMONSTRATED=PASS",flush=True)
                else:
                    print("GENUINE_CODER_CODE_REPAIR_DEMONSTRATED=NOT_PROVEN",flush=True)
            except (RepairBoundaryError,ValueError) as exc:
                print("GENUINE_CODER_REPAIR_UNSUCCESSFUL="+type(exc).__name__,flush=True)
                if coder.last_receipt:
                    print("GENUINE_CODER_INFERENCE_RECEIPT="+json.dumps(coder.last_receipt,sort_keys=True),flush=True)
                print("GENUINE_CODER_CODE_REPAIR_DEMONSTRATED=NOT_PROVEN",flush=True)
          PY
      - name: Ensure real model container is stopped
        if: always()
        run: docker rm -f hephaestus-coder || true
