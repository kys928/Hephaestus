name: Model selection V5
on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/model-selection-v5.yml
      - configs/models/promotion_wave_v5.json
      - scripts/preflight_model_wave.py
      - scripts/*_v5.py
      - src/hephaestus/providers/models/admission.py
      - tests/test_model_admission.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-selection-cviwpryzao
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_XET: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native admission dependencies
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[s3,test]' 'transformers==5.17.0' 'accelerate>=1,<2' 'safetensors>=0.4,<1'
      - name: Test admission and existing governance
        run: python -m pytest -q tests/test_model_admission.py tests/test_governed_model_discovery.py tests/test_production_loop_v1.py tests/test_semantic_judge_integration.py tests/test_promotion_reject_rollback_branch_gates.py
      - name: Inspect immutable candidates and persist verified metadata
        run: python scripts/preflight_model_wave.py
      - name: Preserve admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-selection-v5-admission
          path: |
            model_wave_preflight/admission.json
            model_wave_preflight/requirements.txt
          if-no-files-found: warn
          retention-days: 90
