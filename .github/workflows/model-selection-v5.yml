name: Model selection V5
on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/model-selection-v5.yml
      - configs/models/promotion_wave_v5.json
      - scripts/preflight_model_wave.py
      - scripts/*_v5.py
      - src/hephaestus/providers/models/**
      - tests/test_model_admission.py
      - tests/test_model_wave_v5.py
      - configs/programs/positive_promotion_runpod_v5.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-selection-cviwpryzao
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_XET: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native admission dependencies
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[s3,test]' 'transformers==5.17.0' 'accelerate>=1,<2' 'safetensors>=0.4,<1'
      - name: Test admission and existing governance
        run: python -m pytest -q tests/test_model_admission.py tests/test_model_wave_v5.py tests/test_governed_model_discovery.py tests/test_production_loop_v1.py tests/test_semantic_judge_integration.py tests/test_promotion_reject_rollback_branch_gates.py
      - name: Compile model-wave execution adapters
        run: python -m compileall -q scripts src/hephaestus/providers/models
      - name: Inspect immutable candidates and persist verified metadata
        run: python scripts/preflight_model_wave.py
      - name: Preserve admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-selection-v5-admission
          path: |
            model_wave_preflight/admission.json
            model_wave_preflight/requirements.txt
          if-no-files-found: warn
          retention-days: 90

  prove:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-model-selection-v5]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governed launcher
        run: python -m pip install -e '.[s3]'
      - name: Inspect existing Pod inventory
        run: python scripts/collect_model_wave_v5.py --inventory-only
      - name: Execute admitted V5 wave through production loop
        run: hephaestus run --config configs/programs/positive_promotion_runpod_v5.json --fresh > model_selection_v5_run.json
      - name: Retrieve S3 scientific evidence and verify teardown
        if: always()
        run: python scripts/collect_model_wave_v5.py
      - name: Preserve full wave evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-selection-v5-evidence
          path: |
            model_wave_evidence/
            model_selection_v5_launcher.json
            model_selection_v5_run.json
            positive_promotion_verification.json
            state/positive-promotion-runpod-v5-live/
            artifacts/positive-promotion-runpod-v5-live/
          if-no-files-found: warn
          retention-days: 90
