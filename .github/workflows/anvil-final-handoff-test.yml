name: Anvil final handoff fixture qualification
on:
  push:
    branches: [ops/anvil-final-handoff-test-20261125]
    paths: [.github/workflows/anvil-final-handoff-test.yml]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,independent-certification,postgres,s3]'
      - name: Compile bounded mission and run focused tests
        run: |
          python -m compileall -q src/hephaestus/control/anvil_live*.py src/hephaestus/providers/runpod/anvil_live*.py scripts/anvil_live*.py scripts/anvil_effective_environment.py scripts/anvil_qualify_cuda_offline.py
          python -m pytest -q tests/test_anvil_live.py tests/test_anvil_live_lease.py tests/test_anvil_live_gateway.py tests/test_anvil_attestation.py tests/test_anvil_live_runtime.py tests/test_anvil_live_retention.py tests/test_anvil_live_mission.py
