name: Anvil failed Pod read-only reconciliation
on:
  push:
    branches: [feature/anvil-integration]
    paths: [.github/workflows/anvil-live-terminal-readback.yml]
permissions:
  contents: read
  actions: read
jobs:
  readback:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[s3]'
      - name: Read exact historical allocation and sanitized provider logs
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          from hephaestus.providers.runpod.config import RunPodConfig
          from hephaestus.providers.runpod.storage import RunPodNetworkVolumeStorage
          from hephaestus.providers.runpod.anvil_live_retention import AnvilRetainedWriter
          from hephaestus.providers.runpod.anvil_live_lease import AnvilPodIdentity
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider

          activation = "c280e97b5e917a638429bbb2889403290020767f"
          pod = "rfjuzxnbi0qr60"
          plan = "sha256:a7d8d0e9bf44fec0981b5639fc3bce1d735865ed9fa0ab44256df6c6b63e1950"
          identity = AnvilPodIdentity(activation)
          config = RunPodConfig("EU-CZ-1","cviwpryzao","https://s3api-eu-cz-1.runpod.io","https://api.runpod.io/v2")
          storage = RunPodNetworkVolumeStorage.from_boto3(config, EnvironmentSecretsProvider())
          storage.head_volume()
          mailbox = AnvilRetainedWriter(storage.client,config.network_volume_id,activation)
          intent = mailbox.allocation_intent(plan)
          assert intent and intent["activation"] == activation and intent["operation_id"] == identity.operation_id
          assert intent["maximum_pods"] == 1 and intent["maximum_usd"] == "0.65"
          print("ANVIL_DURABLE_CONSUMPTION_VERIFIED=true")
          print("ANVIL_INTENT_SHA256="+__import__("hashlib").sha256(__import__("hephaestus.storage.verified",fromlist=["canonical_bytes"]).canonical_bytes(intent)).hexdigest())
          terminal = mailbox.read_message("terminal-request")
          assert terminal["known_pod_ids"] == [pod] and terminal["primary_cleanup_confirmed"]
          print("ANVIL_TERMINAL_MAILBOX_VERIFIED=true")
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=build_opener(NoRedirect())
          def get(path,accept="application/json"):
              req=Request("https://api.runpod.io/v2/"+path,headers={"Authorization":"Bearer "+os.environ["RUNPOD_API_KEY"],"Accept":accept})
              return opener.open(req,timeout=12)
          for _ in range(2):
              try:
                  with get("pods/"+pod) as response:
                      print("ANVIL_EXACT_POD_READ_HTTP="+str(response.status))
                      raise SystemExit("Historical exact Pod still returned; no mutations performed")
              except HTTPError as exc:
                  print("ANVIL_EXACT_POD_READ_HTTP="+str(exc.code))
                  assert exc.code == 404
              time.sleep(2)
          with get("pods") as response:
              rows=json.load(response)
              if isinstance(rows,dict): rows=rows.get("pods")
              assert isinstance(rows,list)
              assert not any(x.get("name")==identity.name or x.get("id")==pod for x in rows)
              print("ANVIL_EXACT_POD_ABSENT=true")
          for source in ("system","container"):
              result={"source":source,"status":None,"events":0,"signals":[]}
              try:
                  with get("pods/"+pod+"/logs?source="+source+"&tail=40","text/event-stream") as response:
                      result["status"]=response.status
                      deadline=time.monotonic()+12
                      while time.monotonic()<deadline and result["events"]<40:
                          raw=response.readline(65537)
                          if not raw: break
                          if len(raw)>65536 or not raw.startswith(b"data:"): continue
                          row=json.loads(raw[5:])
                          line=str(row.get("line","")).lower()
                          result["events"]+=1
                          for label, needles in {
                              "image_pull":("pulling image","pull image","image pull"),
                              "container_start":("start container","starting container"),
                              "entrypoint_error":("executable file not found","exec format error","permission denied"),
                              "python_traceback":("traceback (most recent call last)","modulenotfounderror","keyerror:"),
                              "oom":("out of memory","oomkilled"),
                              "port_bind_error":("address already in use","cannot assign requested address"),
                          }.items():
                              if any(n in line for n in needles) and label not in result["signals"]: result["signals"].append(label)
              except HTTPError as exc: result["status"]=exc.code
              except Exception as exc: result["error_type"]=type(exc).__name__
              print("ANVIL_HISTORICAL_LOG_READ="+json.dumps(result,sort_keys=True))
          PY
