name: Independent Hephaestus triad RunPod hard-stop watchdog
on:
  push:
    branches: [ops/ministral-triad-independent-watchdog-20261124]
    paths: [.github/workflows/ministral-triad-watchdog-once.yml]
permissions: {contents: read}
jobs:
  independent-pod-terminator:
    runs-on: ubuntu-latest
    timeout-minutes: 112
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io
      RUNPOD_API_BASE_URL: https://api.runpod.io/v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b60fdb6591fd1f62e969d97db24acc33f4ce0983
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: test "$(git rev-parse HEAD)" = b60fdb6591fd1f62e969d97db24acc33f4ce0983
      - run: python -m pip install -e '.[s3,independent-certification]'
      - name: Independent actual Pod deletion and live prepaid enforcement
        run: python -u scripts/watchdog_approved_ministral_triad_cuda.py --run-tag 202611240001
