name: Freeze first autonomous dataset discovery proof

on:
  push:
    branches:
      - integration/first-autonomous-dataset-discovery
    paths:
      - .github/workflows/freeze-first-autonomous-dataset-discovery.yml

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact original Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9938053158'
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o original.zip
          echo '60a2adc1aa8ec08e341c645c5e0eda1415e3f1d8a5993f9331479a50065650e6  original.zip' | sha256sum -c -
          mkdir exact
          unzip -q original.zip -d exact
      - name: Verify exact proof bytes
        run: |
          set -euo pipefail
          echo '5beff6b9f7582a86ad5bcda1f6dbcec3b0fb9a92e0c254cc0c4e89c614353424  exact/first_autonomous_dataset_discovery.json' | sha256sum -c -
          echo 'ea9edae30ff261df28e9b3e98a9c8154c699295f9527b99d21c79c6adcfb8aec  exact/first_autonomous_dataset_candidates.json' | sha256sum -c -
          echo 'f9b379a36106927d8b1d395baf475df072a837b9babbc4acdcd15b101a8d300b  exact/first_autonomous_dataset_selection.json' | sha256sum -c -
          echo '530032d5bf2ab1b443592fbd8d3bb61616ca11e293a6ca30d327cc020ff73ffc  exact/first_autonomous_dataset_experiment.json' | sha256sum -c -
      - name: Commit exact frozen evidence
        run: |
          set -euo pipefail
          dest=docs/evidence/first-autonomous-dataset-discovery-001-33876486327
          mkdir -p "$dest"
          cp exact/first_autonomous_dataset_discovery.json "$dest/discovery.json"
          cp exact/first_autonomous_dataset_candidates.json "$dest/candidates.json"
          cp exact/first_autonomous_dataset_selection.json "$dest/selection.json"
          cp exact/first_autonomous_dataset_experiment.json "$dest/experiment.json"
          cat > "$dest/SHA256SUMS" <<'EOF'
          5beff6b9f7582a86ad5bcda1f6dbcec3b0fb9a92e0c254cc0c4e89c614353424  discovery.json
          ea9edae30ff261df28e9b3e98a9c8154c699295f9527b99d21c79c6adcfb8aec  candidates.json
          f9b379a36106927d8b1d395baf475df072a837b9babbc4acdcd15b101a8d300b  selection.json
          530032d5bf2ab1b443592fbd8d3bb61616ca11e293a6ca30d327cc020ff73ffc  experiment.json
          60a2adc1aa8ec08e341c645c5e0eda1415e3f1d8a5993f9331479a50065650e6  original-github-actions-artifact.zip
          EOF
          cat > "$dest/README.md" <<'EOF'
          # First autonomous dataset discovery proof

          Exact frozen outputs from GitHub Actions run `33876486327`, artifact `9938053158`.

          Upstream:
          - diagnosis: `diag-b6b21afc926ffa31` (`data_coverage`, confidence `0.825`)
          - DatasetSearchRequest: `dataset-search-4c7158b167aff959`
          - intervention: `intervention-0b05ae5169cd5943`
          - one primary variable: `dataset_mixture`
          - tokenizer: `sha256:123745ffe03aadf5d275c90bceb4e3bfb71678548a5ed936410ebe1e8c85e4ce`

          Result:
          - Hugging Face metadata candidates discovered: `30`
          - fully audited candidates surviving immutable provenance and tokenizer gates: `3`
          - selected dataset: `sail/symbolic-instruction-tuning`
          - selected immutable revision: `c0b1111933a7b87bef0e5b3221d8e5f76b5ac27c`
          - selected license: `mit`
          - selected candidate score: `0.60715556`
          - selection decision: `dataset-selection-fd8699f8cbd8b4957ca2`
          - selection confidence: `0.49357699`
          - selected tokenizer preview: 17,720 tokens, 0 unknown tokens
          - next ExperimentProposal: `experiment-d0e911d6bd1fb7ae`
          - experiment primary variable: `dataset_mixture`
          - experiment status: `pending`
          - required approval: `dataset_selection_approval`

          Planner was not called until the selection status was `selected` and the selected candidate had completed immutable-provenance, bounded coverage, and tokenizer compatibility checks.

          No dataset was acquired, no approval was applied, and no training was launched.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"
          git commit -m 'Freeze first autonomous dataset discovery proof'
          git push
