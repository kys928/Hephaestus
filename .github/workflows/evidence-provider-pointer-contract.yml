name: Evidence storage provider contract validation
on:
  push:
    branches: ['feature/research-evidence-provider-pointers-20261028']
  pull_request:
    paths:
      - 'src/hephaestus/storage/external_evidence_pointer.py'
      - 'tests/test_external_evidence_pointer.py'
      - '.github/workflows/evidence-provider-pointer-contract.yml'
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_external_evidence_pointer.py
      - run: python -m py_compile src/hephaestus/storage/external_evidence_pointer.py
