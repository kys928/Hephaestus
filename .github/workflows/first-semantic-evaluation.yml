name: First semantic evaluation

on:
  push:
    branches: [integration/first-semantic-evaluation]
    paths:
      - .github/workflows/first-semantic-evaluation.yml
      - scripts/run_first_semantic_evaluation.py
      - scripts/launch_first_semantic_evaluation.py
      - src/hephaestus/control/semantic_judge.py
      - tests/test_semantic_judge_integration.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-semantic-evaluation-cviwpryzao
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install launcher and test dependencies
        run: python -m pip install -e '.[s3,test]'
      - name: Verify semantic Judge boundary and frozen evaluator contracts
        run: |
          python -m pytest -q \
            tests/test_semantic_judge_integration.py \
            tests/test_semantic_evaluation.py \
            tests/test_generation_bridge.py
      - name: Compile evaluation drivers
        run: |
          python -m py_compile src/hephaestus/control/semantic_judge.py
          python -m py_compile scripts/run_first_semantic_evaluation.py
          python -m py_compile scripts/launch_first_semantic_evaluation.py
      - name: Generate, compare, Judge, verify, and tear down bounded GPU evaluation
        run: python scripts/launch_first_semantic_evaluation.py
      - name: Upload semantic evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-semantic-evaluation
          path: |
            first_semantic_evaluation_launcher.json
            first_semantic_evaluation_verification.json
          if-no-files-found: warn
          retention-days: 30
