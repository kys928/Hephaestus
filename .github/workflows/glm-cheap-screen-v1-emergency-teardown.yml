name: GLM Cheap Screen V1 emergency teardown
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/glm-cheap-screen-v1-emergency-teardown.yml
permissions:
  contents: read
jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      TARGET_POD_ID: jt4mtqmv9osjtl
    steps:
      - name: Delete incompatible Blackwell pod and verify absence
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base=(os.environ.get('RUNPOD_API_BASE_URL') or 'https://rest.runpod.io/v1').rstrip('/')
          pod=os.environ['TARGET_POD_ID']
          headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY'],'Accept':'application/json','User-Agent':'Hephaestus-Emergency-Teardown/1.0'}
          def call(method,url):
              req=urllib.request.Request(url,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status, r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8','replace')
          status,body=call('DELETE',base+'/pods/'+pod)
          print('DELETE',status,body[:500])
          if status not in (204,404):
              raise SystemExit('unexpected RunPod delete status '+str(status))
          for i in range(12):
              status,body=call('GET',base+'/pods/'+pod)
              if status==404:
                  print('TEARDOWN_VERIFIED_ABSENT '+pod)
                  raise SystemExit(0)
              print('VERIFY',i+1,status,body[:300])
              time.sleep(2)
          raise SystemExit('pod still present after teardown retries')
          PY
