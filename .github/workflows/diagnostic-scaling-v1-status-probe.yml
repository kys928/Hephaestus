name: Diagnostic Scaling V1 RunPod status probe

on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/diagnostic-scaling-v1-status-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      TARGET_RUN_ID: diagnostic-scaling-v1-35131969313
    steps:
      - name: Read current Diagnostic Scaling Pods and GLM details
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=(os.environ.get('RUNPOD_API_BASE_URL') or 'https://rest.runpod.io/v1').rstrip('/')
          headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY'],'Accept':'application/json','User-Agent':'Hephaestus-Diagnostic-Scaling-Diagnostic-Probe/1.0'}
          def get(url):
              req=urllib.request.Request(url,headers=headers,method='GET')
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          payload=get(base+'/pods')
          rows=(payload.get('pods') or payload.get('items') or payload.get('data') or []) if isinstance(payload,dict) else payload
          matches=[p for p in rows if isinstance(p,dict) and os.environ['TARGET_RUN_ID'] in str(p.get('name') or '')]
          slim=[]
          glm_id=''
          for p in matches:
              name=str(p.get('name') or '')
              if 'GLM-4.7-Flash' in name: glm_id=str(p.get('id') or '')
              slim.append({'id':p.get('id'),'name':name,'desiredStatus':p.get('desiredStatus'),'lastStatusChange':p.get('lastStatusChange')})
          detail=None
          if glm_id:
              try:
                  raw=get(base+'/pods/'+glm_id)
                  if isinstance(raw,dict):
                      for k in ('env','dockerArgs','dockerStartCmd'):
                          if k in raw: raw[k]='<redacted>'
                  detail=raw
              except Exception as e: detail={'error':type(e).__name__+': '+str(e)}
          out={'target_run_id':os.environ['TARGET_RUN_ID'],'matching_pods':slim,'glm_pod_id':glm_id,'glm_detail':detail}
          json.dump(out,open('diagnostic_scaling_status_probe.json','w'),indent=2,sort_keys=True)
          print('RUNPOD_STATUS_JSON '+json.dumps(out,sort_keys=True))
          PY

      - name: Snapshot GLM container logs only
        run: |
          POD_ID=$(python - <<'PY'
          import json
          print(json.load(open('diagnostic_scaling_status_probe.json')).get('glm_pod_id') or '')
          PY
          )
          : > diagnostic_scaling_glm_container_logs.txt
          if [ -n "$POD_ID" ]; then
            set +e
            curl -sS -N --max-time 10 \
              -H "Authorization: Bearer $RUNPOD_API_KEY" \
              -H 'Accept: text/event-stream' \
              "https://api.runpod.io/v2/pods/${POD_ID}/logs?tail=5000&source=container" \
              > diagnostic_scaling_glm_container_logs.txt
            STATUS=$?
            set -e
            echo "GLM_CONTAINER_LOG_SNAPSHOT pod_id=${POD_ID} curl_status=${STATUS} bytes=$(wc -c < diagnostic_scaling_glm_container_logs.txt)"
            tail -n 260 diagnostic_scaling_glm_container_logs.txt || true
          fi

      - name: Install S3 probe dependency
        run: python -m pip install --quiet 'boto3>=1.35,<2'

      - name: Inspect completed terminal records and baseline raw outputs
        run: |
          python - <<'PY'
          import json, os
          import boto3
          from botocore.config import Config
          run_id=os.environ['TARGET_RUN_ID']; bucket=os.environ['RUNPOD_NETWORK_VOLUME_ID']
          c=boto3.client('s3',endpoint_url=os.environ['RUNPOD_S3_ENDPOINT_URL'].rstrip('/'),region_name=os.environ['RUNPOD_DATACENTER_ID'],aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],config=Config(retries={'mode':'standard','max_attempts':5}))
          def raw(key):
              r=c.get_object(Bucket=bucket,Key=key); b=r['Body']
              try:return b.read()
              finally:b.close()
          models=['Qwen--Qwen3-14B','deepseek-ai--DeepSeek-R1-Distill-Qwen-14B']
          samples={}
          for model_slug in models:
              for role in ('diagnosis','controller'):
                  key=f'hephaestus/scientific/v1/diagnostic_scaling/{run_id}/models/{model_slug}/roles/{role}/samples/role_step_000.jsonl'
                  try:
                      lines=[x for x in raw(key).decode('utf-8').splitlines() if x.strip()]
                      parsed=[json.loads(x) for x in lines[:2]]
                      samples[f'{model_slug}:{role}']=[{
                          'case_id':p.get('case_id'),'score':p.get('score'),'reasoning_projection_applied':p.get('reasoning_projection_applied'),
                          'raw_output':str(p.get('raw_output') or '')[:1600],'scored_output':str(p.get('output') or '')[:1000]
                      } for p in parsed]
                  except Exception as e:
                      samples[f'{model_slug}:{role}']={'error':type(e).__name__+': '+str(e)}
          terminals=[]
          prefix=f'hephaestus/scientific/v1/executions/{run_id}-'
          for page in c.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix):
              for item in page.get('Contents',[]):
                  key=str(item.get('Key',''))
                  if key.endswith('/driver_result.json'):
                      r=json.loads(raw(key)); terminals.append({'model_id':r.get('model_id'),'status':r.get('status'),'disposition':r.get('disposition'),'error':r.get('error'),'attempt':r.get('attempt')})
          out={'terminal_records':terminals,'baseline_samples':samples}
          json.dump(out,open('diagnostic_scaling_reasoning_probe.json','w'),indent=2,sort_keys=True)
          print('REASONING_BASELINE_PROBE_JSON '+json.dumps(out,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-scaling-v1-diagnostic-probe
          path: |
            diagnostic_scaling_status_probe.json
            diagnostic_scaling_glm_container_logs.txt
            diagnostic_scaling_reasoning_probe.json
          if-no-files-found: error
          retention-days: 7
