name: Prometheus Unbound private diagnosis evidence-ref audit (read-only)
on:
  push:
    branches: [ops/prometheus-unbound-global-20261114]
    paths: [.github/workflows/prometheus-global-evidence-ref-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8038aaa1651b37746838604f4b14e97ee27c77dd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[s3]'
      - name: Compare private generated citations with admitted source refs (no raw text)
        run: |
          python - <<'PY'
          import json,re,hashlib
          from hephaestus.development.prometheus_global_supervision import campaign_prefix,get_bytes,s3_client
          prefix=campaign_prefix("prometheus-unbound-global-20261114-01","8038aaa1651b37746838604f4b14e97ee27c77dd")
          s3=s3_client()
          obj="result/files/output/cycle/decision/inference-receipts/objects/sha256/70/705c6ea69e621caf09b61856c455097be5ac9ca3b6f715a666ef16166d7f9542"
          record=json.loads(get_bytes(s3,prefix+"/"+obj,3000000))
          answer=json.loads(record["raw_output"])
          valid=record["evidence_refs"]
          cited=answer.get("evidence_refs")
          assert isinstance(valid,list) and isinstance(cited,list)
          secret_safe=lambda value:(
            "sha256_citation" if re.fullmatch(r"sha256:[0-9a-f]{64}",value) else
            "case_reference" if re.fullmatch(r"[A-Za-z0-9_:/.#-]{1,130}",value) else
            "unstructured_text")
          doc={
            "schema":"prometheus-diagnosis-citation-admission-audit.v1",
            "allowed_ref_count":len(valid),
            "cited_ref_count":len(cited),
            "unique_cited_ref_count":len(set(str(x) for x in cited)),
            "exact_match_count":sum(x in valid for x in cited),
            "all_valid":bool(cited) and len(cited)==len(set(cited)) and all(x in valid for x in cited),
            "citation_types":[secret_safe(x) if isinstance(x,str) else type(x).__name__ for x in cited],
            "allowed_types":[secret_safe(x) if isinstance(x,str) else type(x).__name__ for x in valid],
            "cited_lengths":[len(x) if isinstance(x,str) else None for x in cited],
            "allowed_lengths":[len(x) if isinstance(x,str) else None for x in valid],
            "citation_equals_allowed_after_trim":sum(isinstance(x,str) and x.strip() in valid for x in cited),
            "contains_empty":any(not isinstance(x,str) or not x for x in cited),
            "full_allowed_digest_occurrence_counts":[sum(ref in text for text in cited if isinstance(text,str)) for ref in valid],
            "embedded_sha256_reference_count":[len(re.findall(r"sha256:[0-9a-f]{64}",text)) for text in cited if isinstance(text,str)],
            "sha256_prefix_occurrence_counts":[text.count("sha256:") for text in cited if isinstance(text,str)],

          }
          print("PROMETHEUS_EVIDENCE_CITATION_AUDIT="+json.dumps(doc,sort_keys=True),flush=True)
          PY

# Additional hash-only citation repair feasibility probe.
