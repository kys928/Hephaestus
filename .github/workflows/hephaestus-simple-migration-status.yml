name: Hephaestus simple migration live status snapshot
on:
  push:
    branches: [ops/czech-bulk-snapshot-20261113]
    paths:
      - .github/workflows/hephaestus-simple-migration-status.yml
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Read only exact recovery Pod and private Czech S3 status
        run: |
          python - <<'PY'
          import os,json,urllib.request,boto3
          from botocore.exceptions import ClientError
          rid='43408461787'
          api='https://api.runpod.io/v2/pods'
          req=urllib.request.Request(api,headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY']})
          with urllib.request.urlopen(req,timeout=30) as resp: data=json.load(resp)
          items=data if isinstance(data,list) else data.get('pods',data.get('data',[]))
          expected='hephaestus-hf-czech-simple-'+rid
          found=[p for p in items if isinstance(p,dict) and p.get('name')==expected]
          print('SIMPLE_MIGRATION_LIVE_POD_COUNT='+str(len(found)))
          if found:print('SIMPLE_MIGRATION_LIVE_POD_STATUS='+str(found[0].get('desiredStatus',found[0].get('status'))))
          s3=boto3.client('s3',endpoint_url='https://s3api-eu-cz-1.runpod.io/',region_name='EU-CZ-1',aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'])
          try:
              response=s3.get_object(Bucket='cviwpryzao',Key='hephaestus/recovery-status/'+rid+'.json')
          except ClientError as e:
              if str(e.response.get('Error',{}).get('Code')) not in {'404','NoSuchKey','NotFound'}:raise
              print('SIMPLE_MIGRATION_STATUS=not-yet-written')
          else:
              with response['Body'] as f:data=json.load(f)
              allowed=['status','checked','missing','verified','downloaded','candidate_files','hf_evidence_verified','czech_archive_files','czech_archive_bytes','error_class']
              print('SIMPLE_MIGRATION_STATUS='+json.dumps({k:data[k] for k in allowed if k in data},sort_keys=True))
          PY
