name: Anvil live readiness (no allocation)
on:
  push:
    branches: [ops/anvil-live-readiness-v2-20261125]
    paths: [.github/workflows/anvil-live-readiness.yml]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1 && github.ref == 'refs/heads/ops/anvil-live-readiness-v2-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,independent-certification,postgres]'
      - run: python -m compileall -q src/hephaestus/control/anvil_live.py scripts/anvil_live_worker.py scripts/anvil_live_gpu_watchdog.py scripts/anvil_live_readiness.py scripts/anvil_live_pod_gateway.py
      - run: python -m pytest -q tests/test_anvil_live.py tests/test_anvil_live_lease.py tests/test_anvil_attestation.py tests/test_anvil_live_gateway.py
      - name: Read-only live scope and quote
        env:
          ANVIL_POSTGRES_DSN: ${{ secrets.ANVIL_POSTGRES_DSN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PYTHONPATH: src
        run: python scripts/anvil_live_readiness.py
