name: Audit exact pinned five-role CUDA worker cache footprint (CPU metadata only)
on:
  push:
    branches: [fix/cuda45-r4-hf-cache-budget-20261030]
    paths: ['.github/workflows/audit-five-role-cache-budget-cpu.yml']
permissions: {contents: read}
jobs:
  immutable-model-blob-footprint:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'huggingface-hub>=1.2,<2'
      - name: Compute read-only exact five-role model cache weight bytes by frozen commit
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          import json
          from huggingface_hub import HfApi
          j=json.load(open('configs/models/hephaestus_role_model_stack_v1.json'))
          api=HfApi()
          total=0
          for role in ('controller','diagnosis','planner','evaluator','judge'):
              p=j['roles'][role]
              info=api.model_info(p['model_id'],revision=p['revision'],files_metadata=True)
              blobs=[s for s in info.siblings if s.rfilename.endswith('.safetensors')
                     and not s.rfilename.endswith('consolidated.safetensors')]
              missing=sum(getattr(s,'size',None) is None for s in blobs)
              size=sum(int(s.size or 0) for s in blobs)
              total+=size
              print(f'FROZEN_ROLE={role} WEIGHT_GIB={size/(1024**3):.2f} SAFETENSOR_FILES={len(blobs)} UNKNOWN_SIZES={missing}')
          print(f'FROZEN_FIVE_ROLE_WEIGHT_CACHE_TOTAL_GIB={total/(1024**3):.2f}')
          print('ORIGINAL_R4_POD_EPHEMERAL_DISK_GIB=40')
          print('MODEL_WEIGHTS_DOWNLOADED=false')
          print('GPU_PODS_CREATED=0')
          PY
