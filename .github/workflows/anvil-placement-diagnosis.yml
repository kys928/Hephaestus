name: Anvil exact A40 stock recheck
on:
  push:
    branches: [ops/anvil-placement-recheck-20261125-1744]
    paths: [.github/workflows/anvil-placement-diagnosis.yml]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate read-only exact placement gate
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider
          from hephaestus.providers.runpod.anvil_live_lease import GLOBAL, GPU, REGION, REGIONAL, MAX_RATE, DISK_ALLOWANCE
          from hephaestus.providers.runpod.config import RunPodConfig
          from hephaestus.providers.runpod.cost_intelligence import ReadOnlyRunPodPricing
          from hephaestus.providers.runpod.execution import RunPodExecutionAdapter, RunPodApiError
          stage="quote"
          try:
              p=ReadOnlyRunPodPricing(bearer_token=os.environ["RUNPOD_API_KEY"])
              q=p.quote_gpu(gpu_id=GPU,datacenter_id=REGION)
              stage="regional_catalog"
              data=p._request(f"https://api.runpod.io/v2/catalog/datacenters/{REGION}?include=GPU_AVAILABILITY","GET",None)
              rows=[x.get("availability") for x in data.get("gpuAvailability",[]) if x.get("id")==GPU]
              print("ANVIL_PLACEMENT_CATALOG="+json.dumps({"region_matches":data.get("id")==REGION,"gpu":GPU,"exact_sku_rows":len(rows),"stock":rows,"gpu_rate_usd":str(q.price_usd_per_hour),"vram_gb":q.gpu_memory_gb}),flush=True)
              cfg=RunPodConfig(REGION,REGIONAL,"https://s3api-eu-cz-1.runpod.io","https://api.runpod.io/v2")
              adapter=RunPodExecutionAdapter(cfg,EnvironmentSecretsProvider(),state_root=Path("/tmp/anvil-placement-observation"))
              stage="adapter_select_gpu"
              try:
                  selected=adapter.select_gpu([GPU])
                  print("ANVIL_PLACEMENT_SELECTION="+json.dumps({"exact_gpu_selected":selected==GPU}),flush=True)
              except RunPodApiError as e:
                  reason="no_allowed_stock" if str(e).startswith("No allowed GPU available") else "catalog_identity_or_transport"
                  print("ANVIL_PLACEMENT_SELECTION="+json.dumps({"exact_gpu_selected":False,"reason":reason,"http_status":e.status_code}),flush=True)
              stage="volume_readback"
              volume=p._request(f"https://api.runpod.io/v2/global-volumes/{GLOBAL}","GET",None)
              stage="account"
              account=p.account()
              total=q.price_usd_per_hour+DISK_ALLOWANCE
              print("ANVIL_PLACEMENT_BUDGET="+json.dumps({"global_confirmed":volume.get("id")==GLOBAL,"all_in_conservative_hour_usd":str(total),"within_approved_ceiling":total<=MAX_RATE,"prepaid_fundable":not account.autopay_enabled and account.credit_balance_usd>total+account.already_spending_usd_per_hour,"allocation_attempted":False}),flush=True)
          except Exception as e:
              print("ANVIL_PLACEMENT_FAILURE="+json.dumps({"stage":stage,"exception":type(e).__name__,"http_status":getattr(e,"status_code",getattr(e,"code",None))}),flush=True)
              raise SystemExit(1)
          PY
