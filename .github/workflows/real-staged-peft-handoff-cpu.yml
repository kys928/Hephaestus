name: Real staged PEFT evidence and lifecycle handoff (CPU)
on:
  push:
    branches: [feature/real-staged-peft-handoff-20261025]
  pull_request:
    paths:
      - 'src/hephaestus/production/staged_training.py'
      - 'src/hephaestus/production/composition.py'
      - 'tests/test_staged_real_training_handoff.py'
      - '.github/workflows/real-staged-peft-handoff-cpu.yml'
permissions: {contents: read}
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core tests (no GPU)
        run: python -m pip install -e '.[test]'
      - name: Verify actual staged training adapter and negative cases
        run: |
          python -m compileall -q src/hephaestus/production/staged_training.py
          pytest -q tests/test_staged_real_training_handoff.py
      - name: Full CPU regression suite
        run: pytest -q tests/
