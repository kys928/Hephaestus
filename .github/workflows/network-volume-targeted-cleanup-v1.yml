name: Hephaestus network volume targeted cleanup V1

on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/network-volume-targeted-cleanup-v1.yml
      - configs/maintenance/network_volume_targeted_cleanup_v1.json
      - scripts/run_network_volume_targeted_cleanup_v1.py
      - scripts/launch_network_volume_targeted_cleanup_v1.py
      - scripts/scan_network_volume_s3_v1.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-volume-targeted-cleanup-cviwpryzao
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-network-volume-targeted-cleanup-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governed RunPod/S3 launcher
        run: python -m pip install -e '.[s3]'
      - name: Compile exact-prefix maintenance code
        run: |
          python -m py_compile scripts/run_network_volume_targeted_cleanup_v1.py
          python -m py_compile scripts/launch_network_volume_targeted_cleanup_v1.py
          python -m py_compile scripts/scan_network_volume_s3_v1.py
      - name: Execute S3-reviewed exact-prefix cleanup on mounted Network Volume
        run: |
          set -o pipefail
          python scripts/launch_network_volume_targeted_cleanup_v1.py | tee targeted_cleanup_run.log
      - name: Rescan actual Network Volume through S3 after deletion
        if: always()
        run: |
          set -o pipefail
          python scripts/scan_network_volume_s3_v1.py | tee network_volume_post_cleanup_s3_scan.log
      - name: Preserve targeted cleanup audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-volume-targeted-cleanup-v1-evidence
          path: |
            targeted_cleanup_report.json
            targeted_cleanup_verification.json
            targeted_cleanup_launcher.json
            targeted_cleanup_run.log
            network_volume_s3_inventory.json
            network_volume_s3_largest.tsv
            network_volume_post_cleanup_s3_scan.log
          if-no-files-found: warn
          retention-days: 90
