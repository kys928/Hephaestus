name: Inspect Corrected Diagnosis Foundation V1 breakdown
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/diagnosis-foundation-v1-breakdown.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      PREFIX: hephaestus/scientific/v1/diagnosis_foundation_bakeoff/diagnosis-foundation-v1-35515098798
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet boto3
      - name: Analyze finalists
        run: |
          python - <<'PY'
          import boto3,json,os,statistics,collections
          from botocore.config import Config
          def req(k):
              v=(os.environ.get(k) or '').strip()
              if not v: raise SystemExit('missing '+k)
              return v
          s3=boto3.client('s3',endpoint_url=req('RUNPOD_S3_ENDPOINT_URL').rstrip('/'),region_name=req('RUNPOD_DATACENTER_ID'),aws_access_key_id=req('RUNPOD_S3_ACCESS_KEY_ID'),aws_secret_access_key=req('RUNPOD_S3_SECRET_ACCESS_KEY'),config=Config(retries={'mode':'standard','max_attempts':8}))
          b=req('RUNPOD_NETWORK_VOLUME_ID'); p=req('PREFIX').rstrip('/')
          for cand in ['granite42-3b','ministral3-3b-reasoning']:
              resp=s3.list_objects_v2(Bucket=b,Prefix=f'{p}/samples/{cand}/')
              keys=sorted(x['Key'] for x in resp.get('Contents',[]) if x['Key'].endswith('.json'))
              rows=[json.loads(s3.get_object(Bucket=b,Key=k)['Body'].read()) for k in keys]
              print('\n###FINALIST',cand)
              by=collections.defaultdict(list)
              for r in rows: by[r['root_case_id']].append(r)
              for root in sorted(by):
                  xs=by[root]
                  print('ROOT',root,json.dumps({
                      'n':len(xs),
                      'quality_mean':sum(x['score']['quality_100'] for x in xs)/len(xs),
                      'schema_rate':sum(bool(x['score']['schema_compliant']) for x in xs)/len(xs),
                      'hallucination_mean':sum(x['score']['hallucination_rate'] for x in xs)/len(xs),
                      'grounding_mean':sum(x['score']['components']['evidence_grounding'] for x in xs)/len(xs),
                      'calibration_mean':sum(x['score']['components']['confidence_calibration'] for x in xs)/len(xs),
                      'exact_rate':sum(x['score']['quality_100']>=99.999 for x in xs)/len(xs),
                      'mean_latency':sum(x['generation']['total_latency_seconds'] for x in xs)/len(xs),
                      'mean_tokens':sum(x['generation']['generated_tokens'] for x in xs)/len(xs),
                  },sort_keys=True))
              print('FAILURES')
              for r in rows:
                  sc=r['score']
                  if sc['quality_100']<99.999 or sc['hallucination_rate']>0 or not sc['schema_compliant']:
                      parsed=sc.get('parsed')
                      if parsed is None:
                          try: parsed=json.loads(r['output'])
                          except: parsed=None
                      print('CASE',r['case_id'],json.dumps({
                          'quality':sc['quality_100'],
                          'schema':sc['schema_compliant'],
                          'hallucination':sc['hallucination_rate'],
                          'components':sc['components'],
                          'expected':sc.get('expected'),
                          'parsed':parsed,
                          'output':r['output'][:1200],
                          'finish':r['generation']['finish_reason'],
                          'tokens':r['generation']['generated_tokens'],
                          'latency':r['generation']['total_latency_seconds'],
                      },ensure_ascii=False,sort_keys=True))
          PY
