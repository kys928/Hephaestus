name: Staged production trace and independent semantic custody (CPU)
on:
  pull_request:
    paths:
      - 'src/hephaestus/production/staged_composition.py'
      - 'src/hephaestus/production/staged_trace.py'
      - 'src/hephaestus/production/staged_driver.py'
      - 'src/hephaestus/evaluation/semantic_custody.py'
      - 'src/hephaestus/evaluation/independent_holdout_review.py'
      - 'tests/test_staged_production_composition.py'
      - 'tests/test_durable_multicycle_campaign.py'
      - 'tests/test_independent_evaluator_holdout_review.py'
      - '.github/workflows/staged-production-trace-and-custody-cpu.yml'
permissions: {contents: read}
jobs:
  bounded-integrity-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standard tests and signature verifier
        run: python -m pip install -e '.[test]' 'cryptography>=44,<47'
      - name: Verify complete staged receipt tracing and independent leakage admission
        run: pytest -q tests/test_staged_production_composition.py tests/test_durable_multicycle_campaign.py tests/test_independent_evaluator_holdout_review.py
      - name: Re-run full CPU regression suite
        run: pytest -q tests/
