name: RunPod account credit probe

on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/runpod-account-credit-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Query RunPod GraphQL credit state
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body=json.dumps({'query':'query { myself { clientBalance underBalance minBalance currentSpendPerHr } }'}).encode()
          req=urllib.request.Request(
              'https://api.runpod.io/graphql',
              data=body,
              headers={
                  'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY'],
                  'Content-Type':'application/json',
                  'Accept':'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          safe=((data.get('data') or {}).get('myself') or {})
          print('RUNPOD_ACCOUNT_CREDIT_JSON '+json.dumps(safe,sort_keys=True))
          PY
