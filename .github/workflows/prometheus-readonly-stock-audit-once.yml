name: Temporary Prometheus read-only RunPod capacity audit

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  read-only-stock:
    if: >-
      github.actor == 'kys928' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/prometheus-model-backed-scientific-decision' &&
      github.event.pull_request.number == 201
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact EU-CZ-1 datacenter and POD GPU stock; never create
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          if not os.environ.get("RUNPOD_API_KEY"):
              raise PermissionError("No authenticated RunPod credential")
          base="https://api.runpod.io/v2/"
          sku="NVIDIA RTX PRO 6000 Blackwell Server Edition"
          def get(path):
              req=urllib.request.Request(base+path,
                  headers={"Authorization":"Bearer "+os.environ["RUNPOD_API_KEY"]})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("READ_ONLY_CATALOG_HTTP_STATUS="+str(e.code))
                  return None
          dc=get("catalog/datacenters/EU-CZ-1?include=GPU_AVAILABILITY")
          if isinstance(dc,dict):
              print("DC_ID="+str(dc.get("id")))
              rows=dc.get("gpuAvailability")
              print("DC_STOCK_FIELD="+("list" if isinstance(rows,list) else "missing"))
              if isinstance(rows,list):
                  print("DC_STOCK_MATCHES="+json.dumps([
                      {"gpuId":v.get("gpuId",v.get("id")),
                       "stockStatus":v.get("stockStatus",v.get("availability"))}
                      for v in rows if isinstance(v,dict)
                      and v.get("gpuId",v.get("id"))==sku]))
          else: print("DC_CATALOG_UNAVAILABLE=true")
          gpus=get("catalog/gpus?include=AVAILABILITY&product=POD&count=1&cloud=SECURE")
          if not isinstance(gpus,dict) or not isinstance(gpus.get("gpus"),list):
              print("GPU_CATALOG_WITH_SECURE_FILTER_UNAVAILABLE=true")
              gpus=get("catalog/gpus?include=AVAILABILITY&product=POD")
          found=[]
          if isinstance(gpus,dict) and isinstance(gpus.get("gpus"),list):
              found=[g for g in gpus["gpus"] if isinstance(g,dict) and g.get("id")==sku]
          print("EXACT_GPU_CATALOG_MATCHES="+str(len(found)))
          if len(found)==1:
              gpu=found[0]
              print("EXACT_GPU_SECURE="+str(gpu.get("secure")))
              print("EXACT_GPU_MEMORY_GB="+str(gpu.get("memory")))
              centers=gpu.get("dataCenters")
              print("GPU_DATACENTERS_FIELD="+("list" if isinstance(centers,list) else "missing"))
              matches=[{"id":c.get("id"),"availability":c.get("availability")}
                       for c in centers if isinstance(c,dict) and c.get("id")=="EU-CZ-1"] if isinstance(centers,list) else []
              print("EU_CZ_1_EXACT_GPU_STOCK="+json.dumps(matches))
              ok=(gpu.get("secure") is True and isinstance(gpu.get("memory"),int)
                  and gpu["memory"]>=48 and any(
                      isinstance(m.get("availability"),str)
                      and m["availability"].upper() in ("LOW","MEDIUM","HIGH")
                      for m in matches))
              print("GPU_STOCK_AUTHENTICATED_POSITIVE="+str(ok).lower())
          else: print("GPU_STOCK_AUTHENTICATED_POSITIVE=false")
          PY
