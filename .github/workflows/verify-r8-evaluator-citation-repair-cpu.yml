name: Verify original r8 Evaluator citation repair and frozen role policy (CPU only)
on:
  push:
    branches: [fix/cuda45-r8-evaluator-citation-repair-20261030]
    paths:
      - '.github/workflows/verify-r8-evaluator-citation-repair-cpu.yml'
      - 'src/hephaestus/production/tier_a_cuda_role_stages.py'
      - 'tests/test_tier_a_cuda_role_stages.py'
permissions: {contents: read}
jobs:
  evaluator-strict-evidence-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q -e '.[test,s3,independent-certification]'
      - name: Test actual original frozen role parser and missing/foreign receipt safeguards
        run: |
          python -m pytest -q tests/test_tier_a_cuda_role_stages.py tests/test_certified_role_inference.py tests/test_original_cuda45_prepaid_launch_contract.py tests/test_cuda_role_ephemeral_cache_lifecycle.py
          python -m compileall -q src/hephaestus/production
          echo 'ORIGINAL_EVALUATOR_STRICT_CITATION_CPU_REGRESSION=PASS'
          echo 'MODEL_WEIGHTS_DOWNLOADED=false'
          echo 'GPU_PODS_CREATED=0'
