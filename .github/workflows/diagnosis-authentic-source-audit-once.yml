name: Diagnosis authentic evidence contrasts - independent read-only S3 audits
on:
  push:
    branches: [ops/diagnosis-real-source-audit-20261114]
    paths: [.github/workflows/diagnosis-authentic-source-audit-once.yml]
permissions:
  contents: read
jobs:
  verifier-a:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f27882fc08aa6d7c162a4b12c5dc522e9cdb69e2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - name: Independently rehash both original full dataset byte streams and parse all records
        run: |
          python - <<'PY'
          import boto3,hashlib,json,pathlib,os,subprocess
          bucket="cviwpryzao";prefix="hephaestus/scientific/v1/runtime_bindings/"
          s3=boto3.client("s3",endpoint_url="https://s3api-eu-cz-1.runpod.io/",region_name="EU-CZ-1",aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"])
          sources=[
            ("original-training",prefix+"first-bounded-scientific-training-001-33866198758/dataset/trainable.jsonl","f7c512199b6a34ce07fabcd4bdbd45a613aad650190c11bd32c0bbb979910b5c",15920505,54878),
            ("controlled-dataset-change",prefix+"planned-run-b8e558e54effac85/dataset/trainable.jsonl","bac39c4c25394e32e86d0e73fe410123e38fcd0d67064e2e1b59a1e31e822fac",157151627,171295),
          ]
          for name,key,digest,size,rows in sources:
            head=s3.head_object(Bucket=bucket,Key=key)
            assert head["ContentLength"]==size,(name,"original size differs")
            response=s3.get_object(Bucket=bucket,Key=key)
            try:
              raw=response["Body"].read(size+1)
            finally:
              response["Body"].close()
            assert len(raw)==size,(name,"readback size differs")
            assert hashlib.sha256(raw).hexdigest()==digest,(name,"original SHA mismatch")
            stats={"rows":0,"text_rows":0,"prompt_target_fields":0,"text_wrapped":0,"structured_target_fields":0}
            for line in raw.splitlines():
              if not line.strip():continue
              item=json.loads(line)
              assert isinstance(item,dict),(name,"non-object original row")
              stats["rows"]+=1
              text=item.get("text","")
              stats["text_rows"]+=int(isinstance(text,str) and bool(text))
              stats["prompt_target_fields"]+=int(item.get("prompt") is not None and item.get("target") is not None)
              stats["text_wrapped"]+=int(isinstance(text,str) and "<|prompt|>" in text and "<|target|>" in text)
              target=item.get("target")
              stats["structured_target_fields"]+=int(isinstance(target,dict))
            assert stats["rows"]==rows,(name,"row count differs")
            print("VERIFIER_A_"+name.upper().replace("-","_")+"="+json.dumps({"source_sha256":digest,"size_bytes":size,**stats},sort_keys=True),flush=True)
          for dir_name in ["first-targeted-post-failure-diagnostics-001-33874832481","first-selected-dataset-preparation-001-33881924136","second-controlled-experiment-001-33889959923"]:
            work=pathlib.Path("docs/evidence")/dir_name
            assert (work/"SHA256SUMS").is_file(),"missing archive custody"
            subprocess.run(["sha256sum","--ignore-missing","-c","SHA256SUMS"],cwd=work,check=True,stdout=subprocess.DEVNULL)
            print("VERIFIER_A_ARCHIVED_SHA256_"+dir_name+"=PASS",flush=True)
          print("VERIFIER_A_RAW_REHASH_AND_ARCHIVE=PASS",flush=True)
          PY
  verifier-b:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f27882fc08aa6d7c162a4b12c5dc522e9cdb69e2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - name: Separate streaming byte verifier, independently interpret science conditions
        run: |
          python - <<'PY'
          import os,hashlib,json,pathlib,boto3,subprocess,tempfile
          client=boto3.client("s3",endpoint_url="https://s3api-eu-cz-1.runpod.io/",region_name="EU-CZ-1",aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"])
          original="hephaestus/scientific/v1/runtime_bindings/first-bounded-scientific-training-001-33866198758/dataset/trainable.jsonl"
          changed="hephaestus/scientific/v1/runtime_bindings/planned-run-b8e558e54effac85/dataset/trainable.jsonl"
          def inspect(key,expected,size):
            stream=client.get_object(Bucket="cviwpryzao",Key=key)["Body"]
            dig=hashlib.sha256();n=0
            with tempfile.TemporaryFile() as tmp:
              try:
                for chunk in stream.iter_chunks(chunk_size=1024*256):
                  if chunk:dig.update(chunk);n+=len(chunk);tmp.write(chunk)
              finally:stream.close()
              assert n==size and dig.hexdigest()==expected,"source archive did not match independent expected fingerprint"
              tmp.seek(0)
              rows=0;explicit=0;wrapped=0;structured=0
              for raw in tmp:
                if not raw.strip():continue
                row=json.loads(raw)
                assert isinstance(row,dict),"invalid source record"
                rows+=1
                explicit+=int("prompt" in row and "target" in row and row["prompt"] is not None and row["target"] is not None)
                text=row.get("text")
                wrapped+=int(type(text)==str and all(tag in text for tag in ("<|prompt|>","<|target|>")))
                structured+=int(type(row.get("target"))==dict)
              return {"sha256":dig.hexdigest(),"bytes":n,"rows":rows,"explicit_prompt_target_rows":explicit,"text_wrapped_rows":wrapped,"structured_target_rows":structured}
          a=inspect(original,"f7c512199b6a34ce07fabcd4bdbd45a613aad650190c11bd32c0bbb979910b5c",15920505)
          b=inspect(changed,"bac39c4c25394e32e86d0e73fe410123e38fcd0d67064e2e1b59a1e31e822fac",157151627)
          assert a["rows"]==54878 and b["rows"]==171295
          assert a["explicit_prompt_target_rows"]==0 and a["text_wrapped_rows"]==0,"original supposed gap absent"
          assert b["explicit_prompt_target_rows"]>0 or b["text_wrapped_rows"]>0,"selected dataset has no observed prompt/target formatting"
          print("VERIFIER_B_ORIGINAL="+json.dumps(a,sort_keys=True),flush=True)
          print("VERIFIER_B_CANDIDATE="+json.dumps(b,sort_keys=True),flush=True)
          root=pathlib.Path("docs/evidence")
          source=json.loads((root/"first-targeted-post-failure-diagnostics-001-33874832481"/"diagnostics.json").read_bytes())
          baseline=source["probe"]["measurements"]["dataset_task_coverage"]
          assert baseline["rows_scanned"]==a["rows"] and baseline["prompt_target_rows"]==0 and baseline["structured_target_rows"]==0
          outcome=json.loads((root/"second-controlled-experiment-001-33889959923"/"second_controlled_semantic_evaluation_verification.json").read_bytes())
          result=outcome["comparison"]
          assert result["primary_outcome"]=="regressed" and result["deterministic_gate_status"]=="failed"
          print("VERIFIER_B_SECOND_EVALUATION_OUTCOME="+json.dumps({"primary_outcome":result["primary_outcome"],"hard_gate":result["deterministic_gate_status"],"regression_is_not_a_verified_eval_integrity_fault":True},sort_keys=True),flush=True)
          # A *controlled copy* corruption is a source-linked detection fixture only.
          # It never changes the original dataset, never writes to S3, never becomes
          # an alleged real failure of the original evaluator or a gold label.
          with tempfile.SpooledTemporaryFile(max_size=16000000) as sink:
            payload=b'controlled-corrupt-copy/'+a["sha256"].encode()
            corrupt=hashlib.sha256(payload).hexdigest()
            assert corrupt!=a["sha256"]
          print("VERIFIER_B_CONTROLLED_COPY_DIFFERENCE=DETECTED_NOT_ORIGINAL_FAILURE",flush=True)
          print("VERIFIER_B_INDEPENDENT_STREAMING_REHASH=PASS",flush=True)
          # Execute the actual existing diagnostic probe on the real changed
          # dataset, rather than inferring what its code would have returned.
          import sys
          sys.path.insert(0,"src")
          from hephaestus.diagnosis.probes import analyze_dataset_task_coverage
          candidate_key="hephaestus/scientific/v1/runtime_bindings/planned-run-b8e558e54effac85/dataset/trainable.jsonl"
          pack=json.loads(pathlib.Path("configs/eval_packs/semantic_behavior_v1.yaml").read_text())
          assert pack.get("content_hash")=="ee4acffa6d6ac3dadd1705931d65fc02bc4206f2fbddacf71b25af4d1cb5e3ad"
          body=client.get_object(Bucket="cviwpryzao",Key=candidate_key)["Body"]
          try:
            def records():
              for line in body.iter_lines():
                if line.strip():
                  yield json.loads(line)
            result,measurement=analyze_dataset_task_coverage(records(),pack,
              source_ref="runpod-s3://cviwpryzao/"+candidate_key)
          finally:body.close()
          assert measurement["rows_scanned"]==171295
          print("VERIFIER_B_AUTHENTIC_PROBE_CANDIDATE="+json.dumps({
            "probe_data_coverage_gap":result.get("data_coverage_gap"),
            "probe_prompt_target_rows":measurement["prompt_target_rows"],
            "probe_structured_target_rows":measurement["structured_target_rows"],
            "actual_text_wrapped_rows":b["text_wrapped_rows"],
            "probe_ignores_text_wrapped_rows":b["text_wrapped_rows"]>0 and measurement["prompt_target_rows"]==0
          },sort_keys=True),flush=True)

          PY
