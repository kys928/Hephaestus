name: Analyze missing Czech S3 source object shapes
on:
  push:
    branches: [ops/global-volume-recovery-20261112]
    paths:
      - .github/workflows/hephaestus-missing-s3-shapes.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - run: python -u scripts/hephaestus_missing_s3_shapes.py
