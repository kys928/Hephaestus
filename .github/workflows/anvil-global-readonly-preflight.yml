name: Anvil Global read-only preflight

on:
  push:
    branches: [feature/anvil-integration]
    paths: [.github/workflows/anvil-global-readonly-preflight.yml]

permissions:
  contents: read

jobs:
  authenticated-observation:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Read authenticated account, volume, CPU catalog and receipt metadata
        shell: bash
        run: |
          python - <<'PY'
          from decimal import Decimal, InvalidOperation
          from hashlib import sha256
          import json
          import os
          from urllib.request import Request, urlopen

          import boto3
          from botocore.exceptions import ClientError

          global_id = "cmw51pjsk000007l9a0mv1jga"
          regional_id = "cviwpryzao"
          api_key = os.environ["RUNPOD_API_KEY"]
          if not api_key or not all(os.environ.get(key) for key in (
              "RUNPOD_S3_ACCESS_KEY_ID", "RUNPOD_S3_SECRET_ACCESS_KEY",
          )):
              raise SystemExit("Missing scoped RunPod repository credentials")

          def read_provider(path, query=None):
              data = None if query is None else json.dumps({"query": query}).encode()
              req = Request("https://api.runpod.io/" + path, data=data, headers={
                  "Authorization": "Bearer " + api_key, "Content-Type": "application/json",
              })
              with urlopen(req, timeout=25) as response:
                  return json.load(response)

          account = read_provider("graphql", "query { myself { clientBalance currentSpendPerHr isAutoPayEnabled } }")
          account = account["data"]["myself"]
          balance, spend = (Decimal(str(account[key])) for key in ("clientBalance", "currentSpendPerHr"))
          if not all(value.is_finite() and value >= 0 for value in (balance, spend)):
              raise SystemExit("Invalid authenticated account values")
          print("PREPAID_ABOVE_2_USD=" + str(balance >= 2), flush=True)
          print("AUTOPAY_DISABLED=" + str(account["isAutoPayEnabled"] is False), flush=True)
          volume = read_provider("v2/global-volumes/" + global_id)
          if volume.get("id") != global_id:
              raise SystemExit("Global Volume API identity did not match")
          volume_summary = {key: volume[key] for key in ("objectCount", "fileCount", "sizeBytes", "usedBytes")
                            if type(volume.get(key)) is int}
          print("GLOBAL_VOLUME_METADATA=" + json.dumps(volume_summary, sort_keys=True), flush=True)
          try:
              catalog = read_provider("v2/catalog/cpus?include=AVAILABILITY&product=POD")
              cpu_rows = catalog if isinstance(catalog, list) else catalog.get("cpus", [])
              for row in cpu_rows:
                  if row.get("id") == "cpu3c":
                      print("CPU_PRICE_FIELD_NAMES=" + json.dumps(sorted(row)), flush=True)
                      prices = row.get("price", row.get("prices", {}))
                      for key, value in prices.items() if isinstance(prices, dict) else ():
                          try:
                              quoted = Decimal(str(value))
                          except InvalidOperation:
                              continue
                          if key in {"secure", "securePrice", "hourly", "onDemand"} and quoted.is_finite() and quoted > 0:
                              print("CPU_CATALOG_USD_HOURLY=" + str(quoted), flush=True)
          except Exception as exc:
              print("CPU_CATALOG_ERROR_TYPE=" + type(exc).__name__, flush=True)

          storage = boto3.client(
              "s3", endpoint_url="https://s3api-eu-cz-1.runpod.io", region_name="EU-CZ-1",
              aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"],
          )

          def read_regional(key, ceiling):
              item = storage.get_object(Bucket=regional_id, Key=key)
              body = item["Body"]
              try:
                  raw = body.read(ceiling + 1)
              finally:
                  body.close()
              if len(raw) > ceiling:
                  raise ValueError("Migration evidence exceeds allowed read size")
              return raw

          raw = read_regional("hephaestus/recovery-audit/source-inventory-43256848721.json", 12 * 1024 * 1024)
          expected = "046dde9ebe9a712665081794586d502de5722f7f815a61567377414b680f5fb8"
          if sha256(raw).hexdigest() != expected:
              raise SystemExit("Historical regional inventory digest differs")
          print("REGIONAL_MIGRATION_INVENTORY_DIGEST_VERIFIED=true", flush=True)
          for run_id in ("43305182543", "43402079574"):
              try:
                  raw = read_regional(f"hephaestus/recovery-status/{run_id}.json", 32 * 1024)
              except ClientError as exc:
                  if exc.response.get("Error", {}).get("Code") not in {"NoSuchKey", "404", "NotFound"}:
                      raise
                  print(f"MIGRATION_STATUS_{run_id}=missing", flush=True)
                  continue
              status = json.loads(raw)
              if status.get("run_id") != run_id:
                  raise SystemExit("Migration status run identity differs")
              state = status.get("status")
              print(f"MIGRATION_STATUS_{run_id}=" + str(state if state in {
                  "RUNNING", "COMPLETE", "COMPLETE_WITH_SOURCE_EXCEPTIONS", "FAILED",
              } else "unknown"), flush=True)
              for field in ("verified", "source_inventory_references", "unrestorable_source_aliases"):
                  if type(status.get(field)) is int:
                      print(f"{run_id}_{field}={status[field]}", flush=True)
              receipt = status.get("receipt_sha256")
              anchored = isinstance(receipt, str) and len(receipt) == 64 and all(c in "0123456789abcdef" for c in receipt)
              print(f"{run_id}_RECEIPT_ANCHORED={anchored}", flush=True)
          PY
