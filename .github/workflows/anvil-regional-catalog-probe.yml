name: Anvil authenticated regional catalog probe
on:
  push:
    branches: [feature/anvil-integration]
    paths: [.github/workflows/anvil-regional-catalog-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read only provider catalog and approval state
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          PYTHONPATH: src
        run: |
          python -m pip install '.[s3]'
          python - <<'PY'
          import json, os
          from pathlib import Path
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider
          from hephaestus.providers.runpod.config import RunPodConfig
          from hephaestus.providers.runpod.storage import RunPodNetworkVolumeStorage
          from hephaestus.providers.runpod.execution import RunPodExecutionAdapter
          from hephaestus.providers.runpod.cost_intelligence import ReadOnlyRunPodPricing
          from hephaestus.providers.runpod.anvil_dynamic_placement import discover
          from hephaestus.providers.runpod.anvil_renewed_allocation import APPROVAL, PLAN, RenewedAnvilAllocation
          from hephaestus.providers.runpod.anvil_live_lease import AnvilPodIdentity
          from hephaestus.providers.runpod.anvil_hardware import GPU_NAMES
          from hephaestus.providers.runpod.anvil_live_retention import AnvilRetainedReader
          sec=EnvironmentSecretsProvider()
          p=ReadOnlyRunPodPricing(bearer_token=os.environ["RUNPOD_API_KEY"])
          def config(region):
              return RunPodConfig(region,"cviwpryzao","https://s3api-eu-cz-1.runpod.io","https://api.runpod.io/v2")
          storage=RunPodNetworkVolumeStorage.from_boto3(config("EU-CZ-1"),sec)
          storage.head_volume()
          a=RenewedAnvilAllocation(storage.client,"cviwpryzao",os.environ["GITHUB_SHA"],APPROVAL)
          provider=RunPodExecutionAdapter(config("EU-SE-1"),sec,state_root=Path("/tmp/anvil-regional-probe"))
          a.verify_previous(provider)
          assert a.allocation_intent(PLAN) is None
          failed="7969332eb7516f87b9b11b5cbca5b4b112a16103"
          old=AnvilRetainedReader(storage.client,"cviwpryzao",failed)
          # Reader has object-only access. Exact mission marker absence must hold.
          assert not AnvilPodIdentity(failed).discover(provider)
          print("ANVIL_PROBE_APPROVAL_UNCONSUMED_AND_NO_POD=true",flush=True)
          candidates=discover(p,lambda d:print("ANVIL_PROBE_DISCOVERY="+json.dumps(d,sort_keys=True),flush=True))
          regions=sorted(set(["EU-SE-1","CA-MTL-1","EU-NL-1","CA-MTL-4","US-TX-3","AP-JP-1","OC-AU-1","US-MO-2"]+[c["region"] for c in candidates]))
          def shape(d,r):
              if not isinstance(d,dict): return {"type":type(d).__name__}
              avail=d.get("gpuAvailability")
              return {"type":"dict","id_present":"id" in d,"id_matches":d.get("id")==r,
                      "availability_present":"gpuAvailability" in d,"availability_type":type(avail).__name__,
                      "availability_count":len(avail) if isinstance(avail,list) else None,
                      "known_fields_present":[k for k in ["id","name","gpuAvailability","data","dataCenter","datacenter","error","message","gpus"] if k in d],
                      "known_skus":[{"gpu":x["id"],"stock":x.get("availability") if x.get("availability") in {"HIGH","MEDIUM","LOW","NONE","UNAVAILABLE"} else "UNKNOWN"} for x in avail if isinstance(x,dict) and x.get("id") in GPU_NAMES] if isinstance(avail,list) else []}
          for region in regions:
              provider=RunPodExecutionAdapter(config(region),sec,state_root=Path("/tmp/anvil-regional-probe"))
              path="catalog/datacenters/"+region+"?include=GPU_AVAILABILITY"
              for i in range(2):
                  for label,call in [("pricing",lambda:(200,p._request("https://api.runpod.io/v2/"+path,"GET",None))),("adapter",lambda:provider._request("GET",path))]:
                      try:
                          status,raw=call()
                          doc=dict(shape(raw,region),http_status=status)
                      except Exception as e:
                          doc={"exception":type(e).__name__,"http_status":getattr(e,"status_code",getattr(e,"code",None))}
                      print("ANVIL_PROBE_SHAPE="+json.dumps(dict(doc,region=region,client=label,sample=i),sort_keys=True),flush=True)
          PY
