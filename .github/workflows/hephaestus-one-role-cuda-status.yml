name: Hephaestus pinned CUDA role smoke status (read only)
on:
  push:
    branches: [ops/boot-hephaestus-global-20261113]
    paths: [.github/workflows/hephaestus-one-role-cuda-status.yml]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Read only exact GPU Pod and S3 inference result
        run: |
          python - <<'PY'
          import os,json,urllib.request,boto3
          from botocore.exceptions import ClientError
          rid='43427869731'
          q=urllib.request.Request('https://api.runpod.io/v2/pods',headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY']})
          with urllib.request.urlopen(q,timeout=30) as r: got=json.load(r)
          pods=got if isinstance(got,list) else got.get('pods',got.get('data',[]))
          exact='hephaestus-global-controller-cuda-'+rid
          items=[p for p in pods if isinstance(p,dict) and p.get('name')==exact]
          print('CUDA_SMOKE_LIVE_POD_COUNT='+str(len(items)))
          if items:print('CUDA_SMOKE_LIVE_POD_STATUS='+str(items[0].get('desiredStatus',items[0].get('status'))))
          s3=boto3.client('s3',endpoint_url='https://s3api-eu-cz-1.runpod.io/',region_name='EU-CZ-1',aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'])
          try:
              o=s3.get_object(Bucket='cviwpryzao',Key='hephaestus/gpu-smoke-status/'+rid+'.json')
          except ClientError as e:
              if str(e.response.get('Error',{}).get('Code')) not in {'404','NoSuchKey','NotFound'}:raise
              print('CUDA_SMOKE_STATUS=not-yet-written')
          else:
              with o['Body'] as r: record=json.load(r)
              fields=('status','role','gpu','generated_tokens','base_and_lora_loaded_on_cuda','error_class','error_summary','token_ids_sha256')
              print('CUDA_SMOKE_STATUS='+json.dumps({k:record[k] for k in fields if k in record},sort_keys=True))
          PY
