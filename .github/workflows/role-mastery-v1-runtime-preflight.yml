name: Role Mastery V1 runtime preflight
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - scripts/build_role_mastery_v1.py
      - scripts/run_role_mastery_v1.py
      - configs/experiments/hephaestus_role_mastery_v1.json
      - .github/workflows/role-mastery-v1-runtime-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install --quiet -e '.[s3]' 'transformers==5.17.0' 'huggingface-hub==1.31.0' 'accelerate==1.15.0' 'mistral-common==1.11.7' 'peft==0.21.0'
      - name: Verify models, LoRA surfaces and every training transcript
        run: |
          python - <<'PY'
          import importlib.util,json,re
          from pathlib import Path
          from accelerate import init_empty_weights
          from transformers import AutoConfig,AutoModelForCausalLM,AutoTokenizer,Mistral3ForConditionalGeneration,MistralCommonBackend
          import run_role_mastery_v1 as rm
          root=Path('.')
          cfg=json.loads((root/'configs/experiments/hephaestus_role_mastery_v1.json').read_text())
          ps=importlib.util.spec_from_file_location('pack',root/cfg['corpus']['builder_path'])
          pm=importlib.util.module_from_spec(ps);ps.loader.exec_module(pm);pack=pm.build_pack();pm.validate(pack)
          assert pm.canonical_sha256(pack)==cfg['corpus']['canonical_sha256']
          maxlen=int(cfg['training']['max_sequence_length'])
          for role,cand0 in cfg['candidates'].items():
              cand=dict(cand0);cand['candidate_id']=role
              acfg=AutoConfig.from_pretrained(cand['model_id'],revision=cand['revision'],trust_remote_code=False)
              with init_empty_weights():
                  model=Mistral3ForConditionalGeneration(acfg) if cand['load_kind']=='mistral3' else AutoModelForCausalLM.from_config(acfg,trust_remote_code=False)
              pat=re.compile(cand['lora_target_regex'])
              matched=[n for n,_ in model.named_modules() if pat.match(n)]
              if not matched: raise SystemExit(f'no LoRA targets for {role}')
              if cand['load_kind']=='mistral3' and any('vision_tower' in n for n in matched): raise SystemExit(f'vision target leak for {role}')
              tok=(MistralCommonBackend.from_pretrained(cand['model_id'],revision=cand['revision']) if cand['load_kind']=='mistral3'
                   else AutoTokenizer.from_pretrained(cand['model_id'],revision=cand['revision'],trust_remote_code=False))
              lengths=[];supervised=[]
              for case in pack['partitions'][role]['train']:
                  ex=rm.training_example(tok,cand,pack,case,role,maxlen)
                  lengths.append(int(ex['nonpad_tokens']));supervised.append(int(ex['supervised_tokens']))
              cert_prompt_lengths=[]
              for case in pack['partitions'][role]['certification']:
                  q=rm.prompt(pack,case,role)
                  ids=rm.template_ids(tok,cand,[{'role':'user','content':q}],True)
                  cert_prompt_lengths.append(len(ids))
              print('ROLE_MASTERY_PREFLIGHT_JSON '+json.dumps({
                'role':role,'model_id':cand['model_id'],'revision':cand['revision'],
                'matched_lora_modules':len(matched),'first_targets':matched[:8],
                'train_cases':len(lengths),'max_train_tokens':max(lengths),'min_train_tokens':min(lengths),
                'max_supervised_tokens':max(supervised),'max_cert_prompt_tokens':max(cert_prompt_lengths),
                'max_sequence_length':maxlen
              },sort_keys=True))
          PY
