name: Diagnostic Scaling Recovery V1 RunPod status probe

on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/diagnostic-scaling-recovery-v1-status-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      TARGET_RUN_ID: diagnostic-scaling-recovery-v1-35246035168
    steps:
      - name: Read every current RunPod Pod
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=(os.environ.get('RUNPOD_API_BASE_URL') or 'https://rest.runpod.io/v1').rstrip('/')
          headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY'],'Accept':'application/json','User-Agent':'Hephaestus-Recovery-Probe/4.0'}
          def get(url):
              req=urllib.request.Request(url,headers=headers,method='GET')
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          payload=get(base+'/pods')
          rows=(payload.get('pods') or payload.get('items') or payload.get('data') or []) if isinstance(payload,dict) else payload
          all_pods=[]
          for p in rows:
              if not isinstance(p,dict):
                  continue
              pod_id=str(p.get('id') or '')
              detail={}
              if pod_id:
                  try:
                      detail=get(base+'/pods/'+pod_id)
                  except Exception as exc:
                      detail={'detail_error':type(exc).__name__+': '+str(exc)}
              all_pods.append({
                  'id':pod_id,
                  'name':p.get('name'),
                  'desiredStatus':p.get('desiredStatus'),
                  'lastStatusChange':p.get('lastStatusChange'),
                  'costPerHr':detail.get('costPerHr') if isinstance(detail,dict) else None,
                  'gpuCount':detail.get('gpuCount') if isinstance(detail,dict) else None,
                  'gpu':detail.get('gpu') if isinstance(detail,dict) else p.get('gpu'),
                  'machineId':detail.get('machineId') if isinstance(detail,dict) else None,
                  'imageName':detail.get('imageName') if isinstance(detail,dict) else None,
              })
          target=os.environ['TARGET_RUN_ID']
          out={
              'target_run_id':target,
              'all_pods':all_pods,
              'target_pods':[p for p in all_pods if target in str(p.get('name') or '')],
              'hephaestus_pods':[p for p in all_pods if 'hephaestus' in str(p.get('name') or '').lower()],
          }
          print('RUNPOD_ALL_PODS_JSON '+json.dumps(out,sort_keys=True))
          json.dump(out,open('diagnostic_scaling_recovery_status_probe.json','w'),indent=2,sort_keys=True)
          PY

      - name: Snapshot live target container and system logs
        run: |
          python - <<'PY' > target_pod_ids.txt
          import json
          d=json.load(open('diagnostic_scaling_recovery_status_probe.json'))
          for p in d.get('target_pods',[]):
              if p.get('id'):
                  print(p['id'])
          PY
          : > diagnostic_scaling_recovery_container_logs.txt
          : > diagnostic_scaling_recovery_system_logs.txt
          while IFS= read -r POD_ID; do
            [ -z "$POD_ID" ] && continue
            for SOURCE in container system; do
              OUT="diagnostic_scaling_recovery_${SOURCE}_logs.txt"
              echo "===== POD ${POD_ID} SOURCE ${SOURCE} =====" | tee -a "$OUT"
              set +e
              curl -sS -N --max-time 10 \
                -H "Authorization: Bearer $RUNPOD_API_KEY" \
                -H 'Accept: text/event-stream' \
                "https://api.runpod.io/v2/pods/${POD_ID}/logs?tail=1600&source=${SOURCE}" \
                >> "$OUT"
              STATUS=$?
              set -e
              echo "" >> "$OUT"
              echo "LOG_CURL_STATUS pod=${POD_ID} source=${SOURCE} status=${STATUS} bytes=$(wc -c < "$OUT")"
            done
          done < target_pod_ids.txt
          echo '--- CONTAINER TAIL ---'
          tail -n 240 diagnostic_scaling_recovery_container_logs.txt || true
          echo '--- SYSTEM TAIL ---'
          tail -n 240 diagnostic_scaling_recovery_system_logs.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-scaling-recovery-v1-status-probe
          path: |
            diagnostic_scaling_recovery_status_probe.json
            diagnostic_scaling_recovery_container_logs.txt
            diagnostic_scaling_recovery_system_logs.txt
          if-no-files-found: error
          retention-days: 7
