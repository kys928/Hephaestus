name: Original Tier A RunPod GPU execution custody contracts (no allocation)
on:
  push:
    branches: ['feature/tier-a-cuda-runpod-execution-custody-20261028']
    paths:
      - 'src/hephaestus/production/signed_cuda_grants.py'
      - 'scripts/run_original_tier_a_cuda_worker.py'
      - 'tests/test_signed_cuda_compute_authorization.py'
      - 'scripts/freeze_original_tier_a_cuda_archive.py'
      - 'scripts/cold_verify_original_tier_a_cuda_archive.py'
      - 'tests/test_original_cuda_cold_archive.py'
      - '.github/workflows/original-tier-a-gpu-worker-custody.yml'
  pull_request:
    paths:
      - 'src/hephaestus/production/signed_cuda_grants.py'
      - 'scripts/run_original_tier_a_cuda_worker.py'
      - 'tests/test_signed_cuda_compute_authorization.py'
      - 'scripts/freeze_original_tier_a_cuda_archive.py'
      - 'scripts/cold_verify_original_tier_a_cuda_archive.py'
      - 'tests/test_original_cuda_cold_archive.py'
      - '.github/workflows/original-tier-a-gpu-worker-custody.yml'
permissions:
  contents: read
jobs:
  no-gpu-independent-operator-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,independent-certification]'
      - name: Validate externally signed nine original CUDA operations and no self-issued compute
        run: |
          python -m pytest -q tests/test_signed_cuda_compute_authorization.py \
            tests/test_tier_a_cuda_target.py \
            tests/test_tier_a_cuda_role_stages.py \
            tests/test_original_cuda_service_composition.py \
            tests/test_original_cuda_cold_archive.py
      - name: Verify worker entrypoint and original preadmission interfaces
        run: |
          python -m py_compile scripts/run_original_tier_a_cuda_worker.py \
            src/hephaestus/production/signed_cuda_grants.py \
            scripts/freeze_original_tier_a_cuda_archive.py \
            scripts/cold_verify_original_tier_a_cuda_archive.py
      - name: Confirm no GPU allocation, model training or external certificate occurred in CI
        run: echo "Structural tests only. GPU original 45-stage campaign remains unexecuted."
