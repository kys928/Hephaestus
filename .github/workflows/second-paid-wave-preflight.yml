name: Second paid wave preflight

on:
  push:
    branches: [integration/second-paid-gpu-wave]
    paths:
      - .github/workflows/second-paid-wave-preflight.yml
      - scripts/inspect_second_paid_wave_preflight.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: second-paid-wave-preflight
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only S3 dependency
        run: python -m pip install boto3
      - name: Inspect failed candidate samples and prepared training head
        run: python scripts/inspect_second_paid_wave_preflight.py
