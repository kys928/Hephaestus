name: Inspect Diagnosis Foundation V1 samples
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/diagnosis-foundation-v1-inspect-samples.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      PREFIX: hephaestus/scientific/v1/diagnosis_foundation_bakeoff/diagnosis-foundation-v1-35497153907
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet boto3
      - name: Print representative raw samples and summaries
        run: |
          python - <<'PY'
          import boto3,json,os
          from botocore.config import Config
          def req(k):
              v=(os.environ.get(k) or '').strip()
              if not v: raise SystemExit('missing '+k)
              return v
          s3=boto3.client('s3',endpoint_url=req('RUNPOD_S3_ENDPOINT_URL').rstrip('/'),region_name=req('RUNPOD_DATACENTER_ID'),aws_access_key_id=req('RUNPOD_S3_ACCESS_KEY_ID'),aws_secret_access_key=req('RUNPOD_S3_SECRET_ACCESS_KEY'),config=Config(retries={'mode':'standard','max_attempts':8}))
          b=req('RUNPOD_NETWORK_VOLUME_ID'); p=req('PREFIX').rstrip('/')
          for cand in ['granite42-3b','ministral3-3b-reasoning','causeanalyzer-7b-control','phi4-mini-reasoning-control']:
              print('\n###',cand)
              for suffix in ['summary.json']:
                  key=f'{p}/models/{cand}/{suffix}'
                  obj=json.loads(s3.get_object(Bucket=b,Key=key)['Body'].read())
                  print(key); print(json.dumps(obj,indent=2,ensure_ascii=False))
              for n in [1,2,3,6,7,10,15,20,25,30]:
                  resp=s3.list_objects_v2(Bucket=b,Prefix=f'{p}/samples/{cand}/{n:03d}-')
                  keys=[x['Key'] for x in resp.get('Contents',[]) if x['Key'].endswith('.json')]
                  if not keys: continue
                  obj=json.loads(s3.get_object(Bucket=b,Key=keys[0])['Body'].read())
                  print('\nSAMPLE',n,keys[0])
                  print(json.dumps(obj,indent=2,ensure_ascii=False))
          PY
