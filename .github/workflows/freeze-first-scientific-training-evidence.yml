name: Freeze first scientific training evidence

on:
  push:
    branches: [evidence/freeze-first-scientific-training]
    paths:
      - .github/workflows/freeze-first-scientific-training-evidence.yml

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download original successful-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9934115699/zip" \
            -o /tmp/first-bounded-scientific-training.zip
          echo '6b5218f6996f95da31094366c70970c3774a81f8e8accb7faf46b48560938d1e  /tmp/first-bounded-scientific-training.zip' | sha256sum -c -
          mkdir -p /tmp/frozen
          unzip -q /tmp/first-bounded-scientific-training.zip -d /tmp/frozen
          echo 'd38e59a96ffdd6f6554172d456d71ceff9b5a2c28b637ed91e918c9558a589c0  /tmp/frozen/first_bounded_scientific_training_launcher.json' | sha256sum -c -
          echo 'c4b1873da483fb672c146248b6a9116af11065d4fa103658fac40bc7aab4774b  /tmp/frozen/first_bounded_scientific_training_verification.json' | sha256sum -c -
      - name: Freeze exact evidence bytes into repository
        run: |
          set -Eeuo pipefail
          dest='docs/evidence/first-bounded-scientific-training-001-33866198758'
          mkdir -p "$dest"
          cp /tmp/frozen/first_bounded_scientific_training_launcher.json "$dest/launcher.json"
          cp /tmp/frozen/first_bounded_scientific_training_verification.json "$dest/verification.json"
          cat > "$dest/SHA256SUMS" <<'EOF'
          d38e59a96ffdd6f6554172d456d71ceff9b5a2c28b637ed91e918c9558a589c0  launcher.json
          c4b1873da483fb672c146248b6a9116af11065d4fa103658fac40bc7aab4774b  verification.json
          6b5218f6996f95da31094366c70970c3774a81f8e8accb7faf46b48560938d1e  original-github-actions-artifact.zip
          EOF
          cat > "$dest/README.md" <<'EOF'
          # Frozen evidence: first bounded scientific training

          This directory preserves the exact UTF-8 JSON evidence bytes emitted by the successful first bounded scientific training workflow.

          - scientific run: `first-bounded-scientific-training-001-33866198758`
          - GitHub Actions run: `33866198758`
          - GitHub artifact ID: `9934115699`
          - execution commit: `29e64530bc54560df84e4b4d93959b8dfdee38e2`
          - RunPod Pod: `gm5vea0zpdm8y8`
          - checkpoint manifest: `sha256:7a6be1e0cee47f29d5dd47d41bc01beed066c4de64e24ee18544ff4edcb3f4c3`

          `launcher.json` and `verification.json` were re-downloaded from the original GitHub Actions artifact and SHA-256 checked before being committed. They are intentionally not reformatted.

          The original ZIP is not duplicated in Git because it is only a transport container for these JSON files. Its exact SHA-256 is retained in `SHA256SUMS`, so the original workflow artifact can still be independently matched byte-for-byte.

          This is execution-chain evidence only. It proves the governed launch/training/checkpoint/verification/teardown path worked; it does not assert semantic model quality or promotion eligibility.
          EOF
          sha256sum -c <(head -n 2 "$dest/SHA256SUMS" | sed "s#  #  $dest/#")
      - name: Commit frozen evidence and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          git config user.name 'hephaestus-evidence-freezer'
          git config user.email '122738904+kys928@users.noreply.github.com'
          git rm .github/workflows/freeze-first-scientific-training-evidence.yml
          git add docs/evidence/first-bounded-scientific-training-001-33866198758
          git commit -m 'Freeze first bounded scientific training evidence'
          git push origin HEAD:evidence/freeze-first-scientific-training
