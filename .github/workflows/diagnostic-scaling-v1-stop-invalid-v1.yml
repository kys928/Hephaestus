name: Stop invalid Diagnostic Scaling V1 continuation

on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/diagnostic-scaling-v1-stop-invalid-v1.yml

permissions:
  contents: read
  actions: write

jobs:
  stop-invalid-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      TARGET_GITHUB_RUN_ID: '35131969313'
      TARGET_POD_ID: 'l3db0unle0fore'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Delete exited GLM Pod exactly
        run: |
          set +e
          HTTP=$(curl -sS -o /tmp/runpod-delete.out -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H 'Accept: application/json' \
            "${RUNPOD_API_BASE_URL%/}/pods/${TARGET_POD_ID}")
          STATUS=$?
          set -e
          echo "runpod_delete_curl_status=${STATUS} http=${HTTP}"
          cat /tmp/runpod-delete.out || true
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi
          case "$HTTP" in 200|202|204|404) ;; *) exit 1 ;; esac

      - name: Cancel scientifically invalid original cohort continuation
        run: |
          HTTP=$(curl -sS -o /tmp/github-cancel.out -w '%{http_code}' -L -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_GITHUB_RUN_ID}/cancel")
          echo "github_cancel_http=${HTTP}"
          cat /tmp/github-cancel.out || true
          case "$HTTP" in 202|409) ;; *) exit 1 ;; esac

      - name: Verify GLM is no longer active
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=(os.environ.get('RUNPOD_API_BASE_URL') or 'https://rest.runpod.io/v1').rstrip('/')
          req=urllib.request.Request(base+'/pods',headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY'],'Accept':'application/json'},method='GET')
          with urllib.request.urlopen(req,timeout=30) as r: payload=json.load(r)
          rows=(payload.get('pods') or payload.get('items') or payload.get('data') or []) if isinstance(payload,dict) else payload
          match=[p for p in rows if isinstance(p,dict) and str(p.get('id'))==os.environ['TARGET_POD_ID']]
          print('TARGET_POD_REMAINING '+json.dumps(match,sort_keys=True))
          if any(str(p.get('desiredStatus','')).upper() in {'RUNNING','CREATED','RESTARTING'} for p in match):
              raise SystemExit('target GLM pod remains active')
          PY
