name: Fresh governed campaign custody (zero history, no science claims)
on:
  push:
    branches: [integration/new-durable-governed-campaign-20261027]
  pull_request:
    paths:
      - 'src/hephaestus/production/durable_campaign.py'
      - 'tests/test_durable_campaign.py'
      - '.github/workflows/new-durable-campaign-custody.yml'
permissions: {contents: read}
jobs:
  verify-cold-start-state:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test tools
        run: python -m pip install -e '.[test]'
      - name: Verify actual SQLite and hashed custody
        run: pytest -q tests/test_durable_campaign.py tests/test_governed_campaign_admission.py -rs
