name: Phase I Role Mastery V1 Judge Recovery
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths: [.github/workflows/role-mastery-v1-judge-recovery.yml]
permissions: {contents: read}
jobs:
  judge-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    env:
      PYTHONPATH: src:scripts
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      HEPHAESTUS_ROLE_MASTERY_LAUNCH_AUTHORIZED: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c831bbfc0e2054d54fccd1ef374fd84722612c79
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Recover frozen Judge role into original run
        run: |
          python - <<'PY'
          import os,sys
          from pathlib import Path
          scripts=Path('scripts').resolve()
          if str(scripts) not in sys.path: sys.path.insert(0,str(scripts))
          os.environ['GITHUB_SHA']='c831bbfc0e2054d54fccd1ef374fd84722612c79'
          os.environ['GITHUB_RUN_ID']='35596791201'
          import launch_role_mastery_v1
          launch_role_mastery_v1.execute('judge')
          PY
