name: Inspect GLM Cheap Screen V1 samples
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/glm-cheap-screen-v1-inspect-samples.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      PREFIX: hephaestus/scientific/v1/glm_cheap_screen/glm-cheap-screen-v1-35451812853
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet boto3
      - name: Download five persisted samples
        run: |
          python - <<'PY'
          import boto3,json,os,pathlib
          from botocore.config import Config
          def req(k):
              v=(os.environ.get(k) or '').strip()
              if not v: raise SystemExit('missing '+k)
              return v
          s3=boto3.client('s3',endpoint_url=req('RUNPOD_S3_ENDPOINT_URL').rstrip('/'),region_name=req('RUNPOD_DATACENTER_ID'),aws_access_key_id=req('RUNPOD_S3_ACCESS_KEY_ID'),aws_secret_access_key=req('RUNPOD_S3_SECRET_ACCESS_KEY'),config=Config(retries={'mode':'standard','max_attempts':8}))
          bucket=req('RUNPOD_NETWORK_VOLUME_ID'); prefix=req('PREFIX').rstrip('/')
          resp=s3.list_objects_v2(Bucket=bucket,Prefix=prefix+'/samples/')
          keys=sorted(x['Key'] for x in resp.get('Contents',[]) if x['Key'].endswith('.json'))
          pathlib.Path('samples').mkdir(exist_ok=True)
          bundle=[]
          for key in keys:
              raw=s3.get_object(Bucket=bucket,Key=key)['Body'].read()
              obj=json.loads(raw)
              name=key.rsplit('/',1)[-1]
              pathlib.Path('samples',name).write_bytes(raw)
              bundle.append(obj)
              print('SAMPLE_FILE',name)
              print(json.dumps(obj,ensure_ascii=False,indent=2,sort_keys=True))
          pathlib.Path('glm_cheap_screen_samples.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print('SAMPLE_COUNT',len(bundle))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: glm-cheap-screen-v1-samples
          path: |
            samples/
            glm_cheap_screen_samples.json
          if-no-files-found: error
          retention-days: 14
