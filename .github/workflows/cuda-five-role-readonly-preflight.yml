name: CUDA five-role campaign — billing and model preflight (read only)
on:
  push:
    branches: [feature/cuda-five-role-preflight-20261025]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check RunPod v2 API and refuse unsupported credit/model assumptions
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          HEPHAESTUS_CUDA_PREFLIGHT_OUTPUT: evidence/cuda_preflight.json
        run: python scripts/preflight_cuda_five_role_campaign.py
      - name: Install role registry checks and S3 read-only SDK
        run: python -m pip install -e '.[test]' boto3
      - name: Verify five frozen role adapters from actual S3 bytes
        env:
          RUNPOD_S3_ENDPOINT_URL: ${{ secrets.RUNPOD_S3_ENDPOINT_URL }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ secrets.RUNPOD_NETWORK_VOLUME_ID }}
          RUNPOD_DATACENTER_ID: ${{ secrets.RUNPOD_DATACENTER_ID }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          HEPHAESTUS_ROLE_ASSET_REPORT: evidence/cuda_role_assets.json
        run: python scripts/preflight_five_role_s3_artifacts.py
      - name: Upload evidence without keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-role-cuda-readonly-preflight
          path: |
            evidence/cuda_preflight.json
            evidence/cuda_role_assets.json
          retention-days: 7
          if-no-files-found: error
