name: Planner Judge Bakeoff V1 validate
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - scripts/build_planner_judge_bakeoff_v1.py
      - configs/experiments/hephaestus_planner_judge_bakeoff_v1.json
      - configs/experiments/planner_judge_bakeoff_v1.launch.json
      - scripts/validate_planner_judge_bakeoff_v1.py
      - scripts/run_planner_judge_bakeoff_v1.py
      - scripts/launch_planner_judge_bakeoff_v1.py
      - tests/test_planner_judge_bakeoff_v1.py
      - .github/workflows/planner-judge-bakeoff-v1-launch.yml
      - .github/workflows/planner-judge-bakeoff-v1-validate.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {PYTHONPATH: src}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet -e '.[test,s3]'
      - run: python scripts/build_planner_judge_bakeoff_v1.py
      - run: python scripts/validate_planner_judge_bakeoff_v1.py
      - run: python -m py_compile scripts/build_planner_judge_bakeoff_v1.py scripts/validate_planner_judge_bakeoff_v1.py scripts/run_planner_judge_bakeoff_v1.py scripts/launch_planner_judge_bakeoff_v1.py
      - run: pytest -q tests/test_planner_judge_bakeoff_v1.py
      - run: python scripts/launch_planner_judge_bakeoff_v1.py
