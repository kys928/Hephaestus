name: Anvil approved CPU model transfer
on:
  push:
    branches: [feature/anvil-integration]
    paths: [.github/workflows/anvil-model-transfer.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anvil-approved-model-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 59
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/anvil_model_transfer_control.py control readback
