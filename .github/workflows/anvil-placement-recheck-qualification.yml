name: Anvil bounded placement recheck qualification
on:
  push:
    branches: [feature/anvil-integration]
    paths: [.github/workflows/anvil-placement-recheck-qualification.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,postgres,s3,independent-certification]'
      - run: python -m pytest -q tests/test_anvil_live_retention.py tests/test_anvil_live_mission.py tests/test_anvil_live_startup.py tests/test_anvil_live_gateway.py tests/test_anvil_live_lease.py tests/test_anvil_dynamic_placement.py tests/test_anvil_placement_diagnostics.py
      - name: Verify existing authorization remains unused and no prior worker exists
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider
          from hephaestus.providers.runpod.config import RunPodConfig
          from hephaestus.providers.runpod.storage import RunPodNetworkVolumeStorage
          from hephaestus.providers.runpod.execution import RunPodExecutionAdapter
          from hephaestus.providers.runpod.anvil_renewed_allocation import APPROVAL, PLAN, RenewedAnvilAllocation
          from hephaestus.providers.runpod.anvil_live_lease import AnvilPodIdentity
          c=RunPodConfig("EU-CZ-1","cviwpryzao","https://s3api-eu-cz-1.runpod.io","https://api.runpod.io/v2")
          secrets=EnvironmentSecretsProvider()
          storage=RunPodNetworkVolumeStorage.from_boto3(c,secrets)
          storage.head_volume()
          provider=RunPodExecutionAdapter(c,secrets,state_root=Path("/tmp/anvil-recheck-preflight"))
          mailbox=RenewedAnvilAllocation(storage.client,"cviwpryzao",os.environ["GITHUB_SHA"],APPROVAL)
          mailbox.verify_previous(provider)
          assert mailbox.allocation_intent(PLAN) is None
          assert not AnvilPodIdentity("7969332eb7516f87b9b11b5cbca5b4b112a16103").discover(provider)
          print("ANVIL_RECHECK_APPROVAL_UNCONSUMED_NO_PRIOR_POD=true")
          PY
