name: Independent Prometheus GPU termination watchdog (TEMPORARY, remove before merge)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prometheus-once-watchdog-201
  cancel-in-progress: false

jobs:
  independent-off-pod-termination:
    if: >-
      github.event.label.name == 'prometheus-gpu-go' &&
      github.actor == 'kys928' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/prometheus-model-backed-scientific-decision' &&
      github.event.pull_request.number == 201
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact pinned GPU source for independent watchdog
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install separate off-pod RunPod provider adapter
        working-directory: source
        run: python -m pip install -q -e '.[test,s3]'
      - name: Verify Prometheus source and provider negative paths before any secrets are loaded
        working-directory: source
        run: pytest -q tests/test_prometheus_scientific_decision.py tests/test_prometheus_granite_public_measurement.py tests/test_prometheus_gpu_provider_guard.py
      - name: Publish independently authenticated readiness and enforce finite paid Pod deletion
        working-directory: source
        timeout-minutes: 140
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          RUNPOD_API_BASE_URL: https://api.runpod.io/v2
          RUNPOD_DATACENTER_ID: EU-CZ-1
          RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
          RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
        run: |
          set -Eeuo pipefail
          python -u -m scripts.watch_prometheus_gpu_once \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --state-root "$RUNNER_TEMP/prometheus-independent-watchdog-state"
      - name: Preserve execution status
        if: always()
        run: |
          echo "Independent off-Pod cleanup job ended. Inspect failure as a possible billed Pod before retry."
