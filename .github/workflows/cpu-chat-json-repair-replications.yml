name: Replicate 96-step correct JSON generation on two independent CPU seeds
on:
  push:
    branches: ['feature/cpu-json-repair-replication-20261028']
    paths:
      - 'scripts/run_cpu_chat_json_repair.py'
      - 'configs/research/cpu_chat_json_repair_seed*.json'
      - 'tests/test_cpu_chat_json_repair_replication.py'
      - '.github/workflows/cpu-chat-json-repair-replications.yml'
  pull_request:
    paths:
      - 'scripts/run_cpu_chat_json_repair.py'
      - 'configs/research/cpu_chat_json_repair_seed*.json'
      - 'tests/test_cpu_chat_json_repair_replication.py'
      - '.github/workflows/cpu-chat-json-repair-replications.yml'
permissions:
  contents: read
jobs:
  replica:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        seed: [2227, 3337]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,peft-training]'
      - run: python -m pytest -q tests/test_cpu_chat_json_repair.py tests/test_cpu_chat_json_repair_replication.py
      - name: Exactly 96 real CPU LoRA steps for an independently configured seed
        run: python scripts/run_cpu_chat_json_repair.py --protocol configs/research/cpu_chat_json_repair_seed${{ matrix.seed }}.json --output /tmp/cpu-json-repair-seed${{ matrix.seed }}
      - name: Original member SHA256 commitments
        if: success()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          for root in pathlib.Path('/tmp').glob('cpu-json-repair-seed*'):
              files={p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(root.rglob('*')) if p.is_file()}
              (root/'archive_sha256.json').write_text(json.dumps(files,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-json-repair-cpu-seed${{ matrix.seed }}
          path: /tmp/cpu-json-repair-seed${{ matrix.seed }}/
  protocol-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_cpu_chat_json_repair.py tests/test_cpu_chat_json_repair_replication.py
