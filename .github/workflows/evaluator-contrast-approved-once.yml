name: D single-pod paired counterfactual inference (approved once)
on:
  push:
    branches: [experiment/evaluator-contrast-inference-20261019]
permissions:
  contents: read
concurrency:
  group: hephaestus-D-contrast-one-use-20261019
  cancel-in-progress: false
jobs:
  infer:
    if: contains(github.event.head_commit.message, '[launch-approved-D-contrasts-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_CONTRAST_AUTHORIZED: SINGLE_D_CONTRAST_PROBE
      HEPHAESTUS_CONTRAST_RUN_ID: D-contrast-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3,test]'
      - name: Prepaid CPU-only proof and independent prompt identity
        run: |
          pytest -q tests/test_evaluator_contrast_inference.py tests/test_evaluator_effect_polarity_contrasts.py
          python scripts/launch_evaluator_contrast_probe.py
      - name: Allocate exactly one bounded D inference pod
        run: python scripts/launch_evaluator_contrast_probe.py --execute
  independent-audit:
    needs: infer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_CONTRAST_RUN_ID: D-contrast-${{ github.run_id }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Verify saved outputs and independently re-score all pairs
        run: python scripts/assess_evaluator_contrast_readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: D-paired-contrast-independent-score
          path: D-contrast-inference-independent.json
