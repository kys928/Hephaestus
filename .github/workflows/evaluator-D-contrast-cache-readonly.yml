name: D contrast read-only S3 checkpoint and cache readiness (NO GPU)
on:
  push:
    branches: [experiment/D-contrast-flex-gpu-budget2-20261023]
permissions:
  contents: read
jobs:
  archived-checkpoint-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts:src:.
      PYTHONDONTWRITEBYTECODE: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Check S3 frozen adapter bytes and read-only volume cache hints
        run: python scripts/inspect_D_model_cache_S3_readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: D-contrast-prelaunch-cache-readiness-S3-GET-only
          path: D-contrast-S3-cache-readiness.json
          retention-days: 60
