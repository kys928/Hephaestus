name: Interface Repair V3 Evaluator full run

on:
  push:
    branches: [experiment-interface-repair-v3-evaluator-boundary]
    paths:
      - configs/experiments/interface_repair_v3_evaluator.launch.json

permissions: {contents: read}
concurrency:
  group: interface-repair-v3-evaluator-full
  cancel-in-progress: false

jobs:
  full:
    if: contains(github.event.head_commit.message, '[launch-interface-repair-v3-evaluator-full]')
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      HEPHAESTUS_INTERFACE_REPAIR_RUN_ID: interface-repair-v3-evaluator-full-${{ github.run_id }}
      HEPHAESTUS_INTERFACE_REPAIR_V3_EVALUATOR_AUTHORIZED: LAUNCH_INTERFACE_REPAIR_V3_EVALUATOR_FULL
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Verify authorization state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/experiments/hephaestus_interface_repair_v3_evaluator.json').read_text())
          marker=json.loads(Path('configs/experiments/interface_repair_v3_evaluator.launch.json').read_text())
          assert cfg['trainable_roles']==['evaluator']
          assert cfg['governance']['paid_preflight_allowed'] is False
          assert cfg['governance']['paid_full_launch_allowed'] is True
          assert cfg['governance']['production_promotion_allowed'] is False
          assert cfg['governance']['automatic_role_dispatch_allowed'] is False
          assert cfg['governance']['preserved_planner_mutation_allowed'] is False
          assert marker['preflight_authorized'] is False
          assert marker['full_launch_authorized'] is True
          assert marker['preflight_evidence_key']
          assert marker['preflight_repo_sha']
          PY
      - run: python scripts/launch_interface_repair_v3_evaluator.py --full --execute
