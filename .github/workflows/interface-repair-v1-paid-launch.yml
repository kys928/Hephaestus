name: Interface Repair V1 paid experiment
on:
  push:
    branches: [experiment-interface-repair-v1]
    paths:
      - configs/experiments/interface_repair_v1.launch.json
permissions: {contents: read}
concurrency:
  group: interface-repair-v1-paid
  cancel-in-progress: true
jobs:
  abort-cleanup:
    if: "!contains(github.event.head_commit.message, '[launch-interface-repair-v1]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
    steps:
      - name: Delete orphaned planner pod and verify absence
        run: |
          python - <<'PY'
          import os, time, urllib.error, urllib.request
          pod_id='ri18wxnya0f5ji'
          base=(os.environ.get('RUNPOD_API_BASE_URL') or 'https://rest.runpod.io/v1').rstrip('/')
          key=os.environ['RUNPOD_API_KEY']
          headers={
              'Accept':'application/json',
              'Authorization':f'Bearer {key}',
              'User-Agent':'Mozilla/5.0 (compatible; Hephaestus-RunPod/1.0)',
          }
          def request(method):
              req=urllib.request.Request(f'{base}/pods/{pod_id}', headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, response.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, ''
                  raise
          status, _=request('GET')
          print(f'ABORT_CLEANUP_PREDELETE pod_id={pod_id} status={status}')
          if status != 404:
              status, _=request('DELETE')
              if status != 204:
                  raise RuntimeError(f'unexpected delete status {status}')
          for attempt in range(1, 11):
              time.sleep(2)
              status, _=request('GET')
              print(f'ABORT_CLEANUP_VERIFY pod_id={pod_id} attempt={attempt} status={status}')
              if status == 404:
                  print(f'ABORT_CLEANUP_VERIFIED_ABSENT pod_id={pod_id}')
                  break
          else:
              raise RuntimeError(f'pod {pod_id} still present after delete')
          PY
