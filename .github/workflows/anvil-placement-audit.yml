name: Anvil Global placement audit
on:
  push:
    branches: [ops/anvil-placement-audit-20261125]
    paths: [.github/workflows/anvil-placement-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,s3,independent-certification,postgres]'
      - run: python -m pytest -q tests/test_anvil_placement_diagnostics.py tests/test_anvil_live_mission.py tests/test_anvil_live_lease.py
      - name: Read-only provider reconciliation and regional survey
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import json, os, re
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider
          from hephaestus.providers.runpod.anvil_live_lease import *
          from hephaestus.providers.runpod.anvil_live_retention import AnvilRetainedWriter
          from hephaestus.providers.runpod.anvil_placement_diagnostics import safe_failure, inspect_placement, PlacementFailure
          from hephaestus.providers.runpod.config import RunPodConfig
          from hephaestus.providers.runpod.cost_intelligence import ReadOnlyRunPodPricing
          from hephaestus.providers.runpod.execution import RunPodExecutionAdapter
          from hephaestus.providers.runpod.storage import RunPodNetworkVolumeStorage
          marker="3a00bef807cec0a14b67052b6d39a5ddf2cfe405"
          plan=json.loads(Path("configs/research/anvil_diagnosis_planner_first_live_v1.json").read_bytes())["plan"]["ref"]
          secrets=EnvironmentSecretsProvider()
          config=RunPodConfig(REGION,REGIONAL,"https://s3api-eu-cz-1.runpod.io","https://api.runpod.io/v2")
          p=RunPodExecutionAdapter(config,secrets,state_root=Path("/tmp/anvil-read-only-placement"))
          store=RunPodNetworkVolumeStorage.from_boto3(RunPodConfig("EU-CZ-1",REGIONAL,config.s3_endpoint_url,config.api_base_url),secrets)
          reader=AnvilRetainedWriter(store.client,REGIONAL,marker)
          intent=reader.allocation_intent(plan)
          active=AnvilPodIdentity(marker).discover(p)
          print("ANVIL_PREVIOUS_ATTEMPT="+json.dumps({"approval_consumed":intent is not None,"matching_pods":len(active),"allocation_attempted_by_audit":False}),flush=True)
          pricing=ReadOnlyRunPodPricing(bearer_token=os.environ["RUNPOD_API_KEY"])
          try:
              inspect_placement(pricing,p,region=REGION,report=lambda d:print("ANVIL_PLACEMENT_DIAGNOSTIC="+json.dumps(d,sort_keys=True),flush=True))
          except PlacementFailure:
              pass
          volume=pricing._request("https://api.runpod.io/v2/global-volumes/"+GLOBAL,"GET",None)
          if volume.get("id")!=GLOBAL:
              raise PermissionError("Global identity not verified")
          quote=pricing.quote_gpu(gpu_id=GPU,datacenter_id=REGION)
          total=quote.price_usd_per_hour+DISK_ALLOWANCE
          account=pricing.account()
          regions={"EU-CZ-1","EU-RO-1","EU-SE-1","EU-NL-1","EU-FR-1","EU-DE-1","EU-FI-1","EU-NO-1"}
          discovery="known_eu_regions"
          try:
              catalog=pricing._request("https://api.runpod.io/v2/catalog/datacenters","GET",None)
              rows=catalog.get("dataCenters",catalog.get("datacenters",[])) if isinstance(catalog,dict) else catalog
              found={r["id"] for r in rows if isinstance(r,dict) and re.fullmatch(r"[A-Z]{2}-[A-Z0-9]+-[0-9]+",str(r.get("id","")))}
              if found:
                  regions|=found
                  discovery="provider_catalog_plus_known_eu"
          except Exception as e:
              print("ANVIL_REGION_DISCOVERY_LIMIT="+json.dumps(safe_failure("list_regions",e)),flush=True)
          def observe(region):
              try:
                  c=pricing._request("https://api.runpod.io/v2/catalog/datacenters/"+region+"?include=GPU_AVAILABILITY","GET",None)
                  if c.get("id")!=region or not isinstance(c.get("gpuAvailability"),list):
                      return {"region":region,"status":"catalog_schema_mismatch"}
                  rows=[r for r in c["gpuAvailability"] if r.get("id")==GPU]
                  stock=[r.get("availability") if r.get("availability") in {"LOW","MEDIUM","HIGH","NONE","UNAVAILABLE"} else "UNKNOWN" for r in rows]
                  return {"region":region,"status":"observed","stock":stock,"candidate":len(stock)==1 and stock[0] in {"LOW","MEDIUM","HIGH"}}
              except Exception as e:
                  return {"region":region,"status":"unverified",**safe_failure("regional_catalog",e)}
          with ThreadPoolExecutor(max_workers=4) as pool:
              result=list(pool.map(observe,sorted(regions)))
          print("ANVIL_GLOBAL_REGION_SURVEY="+json.dumps({"discovery":discovery,"global_confirmed":True,"gpu":GPU,"vram_gb":quote.gpu_memory_gb,"all_in_estimated_hour_usd":str(total),"prepaid_fundable":not account.autopay_enabled and account.credit_balance_usd>total+account.already_spending_usd_per_hour,"observations":result,"mount_compatibility_per_region_verified":False,"allocation_attempted":False},sort_keys=True),flush=True)
          PY
