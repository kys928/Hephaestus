name: Anvil Czech certified adapter readback
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/anvil-czech-readonly-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'kys928/Hephaestus' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/anvil-czech-volume-readonly-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf31eb4eddfc67983110ce5570a852d48ca2bf7e
          persist-credentials: false
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Independently rehash the five original registered role adapter archives
        env:
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import sha256
          import json
          import os
          from pathlib import Path

          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          key_id = os.environ.get("RUNPOD_S3_ACCESS_KEY_ID")
          secret = os.environ.get("RUNPOD_S3_SECRET_ACCESS_KEY")
          if not key_id or not secret:
              raise SystemExit("RunPod S3 references are unavailable.")
          roles = json.loads(Path("configs/models/hephaestus_role_model_stack_v1.json").read_text())["roles"]
          expected_roles = {"controller", "diagnosis", "planner", "evaluator", "judge"}
          if set(roles) != expected_roles:
              raise SystemExit("The source registry differs from the exact five-role scope.")
          client = boto3.client(
              "s3",
              region_name="EU-CZ-1",
              endpoint_url="https://s3api-eu-cz-1.runpod.io/",
              aws_access_key_id=key_id,
              aws_secret_access_key=secret,
              config=Config(connect_timeout=10, read_timeout=35, retries={"total_max_attempts": 3}),
          )

          def verify(role):
              expected = roles[role]["adapter"]
              try:
                  response = client.get_object(Bucket="cviwpryzao", Key=expected["s3_key"])
                  with response["Body"] as body:
                      declared_size = response.get("ContentLength")
                      if declared_size is not None and declared_size != expected["bytes"]:
                          return role, "provider_size_mismatch"
                      digest = sha256()
                      size = 0
                      for chunk in body.iter_chunks(chunk_size=1024 * 1024):
                          size += len(chunk)
                          if size > expected["bytes"]:
                              return role, "stream_exceeded_expected_size"
                          digest.update(chunk)
                  if size != expected["bytes"]:
                      return role, "stream_size_mismatch"
                  return role, "verified" if digest.hexdigest() == expected["sha256"] else "digest_mismatch"
              except ClientError as exc:
                  return role, "http_" + str(exc.response.get("ResponseMetadata", {}).get("HTTPStatusCode", 0))
              except Exception as exc:
                  return role, type(exc).__name__

          with ThreadPoolExecutor(max_workers=3) as pool:
              checks = dict(pool.map(verify, sorted(roles)))
          for role, result in checks.items():
              print(f"Role archive readback {role}: {result}")
          if any(result != "verified" for result in checks.values()):
              raise SystemExit("One or more scoped archive readbacks could not be verified.")
          PY
