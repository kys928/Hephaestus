name: Interface Repair V2 paid experiment
on:
  push:
    branches: [experiment-interface-repair-v2]
    paths:
      - configs/experiments/interface_repair_v2.launch.json
permissions: {contents: read}
concurrency:
  group: interface-repair-v2-paid
  cancel-in-progress: false
jobs:
  full-stack:
    if: contains(github.event.head_commit.message, '[launch-interface-repair-v2-full]')
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      PYTHONPATH: src:scripts
      HEPHAESTUS_INTERFACE_REPAIR_RUN_ID: interface-repair-v2-full-${{ github.run_id }}
      HEPHAESTUS_INTERFACE_REPAIR_V2_AUTHORIZED: LAUNCH_INTERFACE_REPAIR_V2_FULL
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Verify explicit V2 full-run authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/experiments/hephaestus_interface_repair_v2.json').read_text())
          marker=json.loads(Path('configs/experiments/interface_repair_v2.launch.json').read_text())
          assert cfg['governance']['paid_full_launch_allowed'] is True
          assert marker['full_launch_authorized'] is True
          assert marker['preflight_evidence_key']
          assert marker['preflight_repo_sha']
          assert cfg['frozen_diagnosis'] is True
          assert cfg['governance']['production_promotion_allowed'] is False
          assert cfg['governance']['automatic_role_dispatch_allowed'] is False
          assert cfg['execution']['gpu_type_ids']==['NVIDIA A40']
          assert cfg['execution']['parallel_training_roles']==1
          assert cfg['execution']['hard_wall_seconds_stack']==14400
          assert cfg['execution']['max_estimated_total_usd_stack']==2.50
          PY
      - run: python scripts/launch_interface_repair_v2.py --full --execute
