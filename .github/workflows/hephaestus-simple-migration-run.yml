name: Hephaestus simple HF-to-Global plus Czech-only archive (20GB disk)
on:
  workflow_dispatch:
  push:
    branches: [ops/czech-bulk-snapshot-20261113]
    paths:
      - .github/workflows/hephaestus-simple-migration-run.yml
permissions:
  contents: read
concurrency:
  group: hephaestus-simple-migration-single-pod
  cancel-in-progress: false
jobs:
  copy:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 205
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate worker and controller before any paid operation
        run: |
          python -m py_compile scripts/hephaestus_simple_migration.py
          python -m py_compile scripts/hephaestus_simple_migration_controller.py
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Bounded single CPU Pod - reuse models/data, repair missing HF evidence, copy only Czech extras
        run: python -u scripts/hephaestus_simple_migration_controller.py
  cleanup:
    if: ${{ always() }}
    needs: copy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Independently delete only this workflow's migration Pod
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get('RUNPOD_API_KEY','')
          rid=os.environ.get('GITHUB_RUN_ID','')
          if not token or not rid.isdigit():raise RuntimeError('No safe cleanup identity')
          name='hephaestus-hf-czech-simple-'+rid
          api='https://api.runpod.io/v2'
          def req(method,path):
              q=urllib.request.Request(api+path,method=method,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(q,timeout=40) as resp:
                  blob=resp.read();return json.loads(blob) if blob else {}
          response=req('GET','/pods')
          pods=response if isinstance(response,list) else response.get('pods',response.get('data',[]))
          if not isinstance(pods,list):raise RuntimeError('Invalid provider Pod list')
          matches=[p for p in pods if isinstance(p,dict) and p.get('name')==name]
          if len(matches)>1:raise RuntimeError('Multiple Pods with exact recovery name')
          if matches:
              pid=matches[0].get('id')
              if not isinstance(pid,str) or not pid:raise RuntimeError('Invalid Pod identity')
              try:req('DELETE','/pods/'+pid)
              except urllib.error.HTTPError as exc:
                  if exc.code!=404:raise
              print('SIMPLE_MIGRATION_CLEANUP_REQUESTED=true')
          else:print('NO_SIMPLE_MIGRATION_POD_LEFT=true')
          PY
