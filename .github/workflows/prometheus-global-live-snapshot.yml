name: Prometheus Unbound live campaign status snapshot (read-only)
on:
  push:
    branches: [ops/prometheus-unbound-global-20261114]
    paths: [.github/workflows/prometheus-global-live-snapshot.yml]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8038aaa1651b37746838604f4b14e97ee27c77dd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[s3]'
      - name: Read exact campaign and model-inference progress (no writes)
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from hephaestus.development.prometheus_global_supervision import (
            campaign_prefix, matching_pods, read_json, s3_client,
            verify_manifest, GLOBAL_ID, balance, verify_pod,
          )
          prefix=campaign_prefix(
              "prometheus-unbound-global-20261114-01",
              "8038aaa1651b37746838604f4b14e97ee27c77dd")
          s3=s3_client()
          read=lambda key: read_json(s3,prefix+"/"+key)
          ready=read("status/watchdog-ready.json")
          beat=read("status/watchdog-heartbeat.json")
          alloc=read("allocation.json")
          progress=read("status/worker-progress.json")
          exit_=read("status/worker-exit.json")
          pods=matching_pods(prefix)
          for pod in pods:
              verify_pod(pod,prefix,require_gpu_identity=False)
          credit,spending=balance()
          summary={
              "schema":"prometheus-readonly-current-status.v1",
              "watchdog_ready":bool(ready),
              "watchdog_heartbeat_recent":False,
              "global_gpu_pod_count":len(pods),
              "pod_state":[p.get("desiredStatus",p.get("status","unknown")) for p in pods],
              "allocation_receipt_present":bool(alloc),
              "worker_phase":progress.get("phase") if progress else None,
              "receipt_count":progress.get("receipt_count") if progress else None,
              "worker_exit":exit_.get("code") if exit_ else None,
              "scientific_manifest_present":False,
              "source_pinned":True,
              "budget_positive":credit>0,
          }
          if beat and beat.get("observed_at"):
              t=datetime.fromisoformat(beat["observed_at"])
              if t.tzinfo:
                  age=(datetime.now(timezone.utc)-t).total_seconds()
                  summary["watchdog_heartbeat_recent"]=-15<=age<=90
          manifest=read("result/manifest.json")
          if manifest:
              verify_manifest(s3,prefix)
              summary["scientific_manifest_present"]=True
              summary["scientific_receipt_files"]=len(manifest["files"])
          print("PROMETHEUS_LIVE_STATUS="+json.dumps(summary,sort_keys=True),flush=True)
          PY

# Safe status refresh: observe campaign while CUDA Pod is active; no paid action.
