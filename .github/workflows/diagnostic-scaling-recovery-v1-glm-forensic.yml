name: Diagnostic Scaling Recovery V1 large-model forensic

on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/diagnostic-scaling-recovery-v1-glm-forensic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet boto3
      - name: Read exact large-model terminal records
        run: |
          python - <<'PY'
          import json, os
          import boto3
          from botocore.config import Config
          s3=boto3.client('s3',endpoint_url=os.environ['RUNPOD_S3_ENDPOINT_URL'].rstrip('/'),region_name=os.environ['RUNPOD_DATACENTER_ID'],aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],config=Config(retries={'mode':'standard','max_attempts':6}))
          keys={
            'GLM':'hephaestus/scientific/v1/executions/diagnostic-scaling-recovery-v1-35246035168-zai-org--GLM-4.7-Flash/attempt-1/driver_result.json',
            'QWEN30':'hephaestus/scientific/v1/executions/diagnostic-scaling-recovery-v1-35246035168-Qwen--Qwen3-30B-A3B-Thinking-2507/attempt-1/driver_result.json',
          }
          for label,key in keys.items():
              raw=s3.get_object(Bucket=os.environ['RUNPOD_NETWORK_VOLUME_ID'],Key=key)['Body'].read()
              d=json.loads(raw)
              safe={k:d.get(k) for k in ['status','disposition','error','traceback','model_id','revision','repo_sha','training_performed','completed_at_unix']}
              print(label+'_TERMINAL_JSON '+json.dumps(safe,sort_keys=True))
          PY
