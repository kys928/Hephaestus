name: D contrast failed-pod S3 forensics (read only)
on:
  push:
    branches: [diagnostic/D-contrast-39299580607-s3-readonly]
permissions:
  contents: read
jobs:
  inspect-failed-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts:src:.
      PYTHONDONTWRITEBYTECODE: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3,test]'
      - name: Compile and test exact fixed-run S3 read-only inspector
        run: |
          python -m py_compile scripts/inspect_D_contrast_run_s3_readonly.py
          pytest -q tests/test_D_contrast_s3_readonly_inspection.py
      - name: Inventory bootstrap, checkpoint materialization, progress and recoverable shards via S3 only
        run: python scripts/inspect_D_contrast_run_s3_readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: D-contrast-39299580607-S3-forensic-report
          path: D-contrast-39299580607-S3-readonly-inspection.json
          retention-days: 60
