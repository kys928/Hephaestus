name: Autonomous recovery repairs (CPU only)
on:
  pull_request:
    paths:
      - 'src/hephaestus/**'
      - 'tests/**'
      - 'scripts/verify_frozen_role_contract.py'
      - '.github/workflows/autonomy-repairs.yml'
permissions: {contents: read}
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python scripts/verify_frozen_role_contract.py
      - run: python -m pytest -q
