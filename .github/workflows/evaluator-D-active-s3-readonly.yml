name: D Workstation pod bootstrap-failure S3 forensics (READ ONLY)
on:
  push:
    branches: [diagnostic/D-contrast-39987687857-bootfail-readonly]
permissions:
  contents: read
jobs:
  live-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: scripts:src:.
      PYTHONDONTWRITEBYTECODE: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify active run persisted S3 events and inference shard progress without modifying S3
        run: python scripts/inspect_D_active_S3_readonly.py
