name: Interface Repair V3 Evaluator validate

on:
  push:
    branches: [experiment-interface-repair-v3-evaluator-boundary]
    paths:
      - src/hephaestus/control/evaluator_boundary.py
      - src/hephaestus/control/deterministic_role_boundary.py
      - src/hephaestus/control/__init__.py
      - configs/experiments/hephaestus_interface_repair_v3_evaluator.json
      - configs/experiments/interface_repair_v3_evaluator.launch.json
      - configs/models/hephaestus_phase_ii_repair_candidates_v1.json
      - scripts/build_interface_repair_v3_evaluator.py
      - scripts/build_interface_repair_v3_1_evaluator.py
      - scripts/run_interface_repair_v3_evaluator.py
      - scripts/run_interface_repair_v3_1_evaluator.py
      - scripts/launch_interface_repair_v3_evaluator.py
      - scripts/launch_interface_repair_v3_1_evaluator.py
      - tests/test_evaluator_boundary.py
      - tests/test_interface_repair_v3_evaluator.py
      - tests/test_interface_repair_v3_launch.py
      - docs/deterministic_role_boundary.md
      - docs/evidence/interface-repair-v3-evaluator/DESIGN.md
      - .github/workflows/interface-repair-v3-evaluator-validate.yml
      - .github/workflows/interface-repair-v3-evaluator-preflight.yml
      - .github/workflows/interface-repair-v3-evaluator-paid-launch.yml
  pull_request:
    paths:
      - src/hephaestus/control/evaluator_boundary.py
      - src/hephaestus/control/deterministic_role_boundary.py
      - configs/experiments/hephaestus_interface_repair_v3_evaluator.json
      - configs/experiments/interface_repair_v3_evaluator.launch.json
      - scripts/build_interface_repair_v3_1_evaluator.py
      - scripts/run_interface_repair_v3_1_evaluator.py
      - scripts/launch_interface_repair_v3_1_evaluator.py
      - tests/test_evaluator_boundary.py
      - tests/test_interface_repair_v3_evaluator.py
      - tests/test_interface_repair_v3_launch.py

permissions: {contents: read}

env:
  PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e . pytest
      - name: Build and validate fresh V3.1 pack
        run: python scripts/build_interface_repair_v3_1_evaluator.py
      - name: Render guarded preflight and full launch requests without spending
        run: |
          python scripts/launch_interface_repair_v3_1_evaluator.py --preflight > /tmp/v31-preflight-render.json
          python scripts/launch_interface_repair_v3_1_evaluator.py --full > /tmp/v31-full-render.json
      - name: Targeted V3 tests
        run: python -m pytest -q tests/test_evaluator_boundary.py tests/test_interface_repair_v3_evaluator.py tests/test_interface_repair_v3_launch.py tests/test_deterministic_role_boundary.py
      - name: Full repository tests
        run: python -m pytest -q
      - name: Compile V3.1 execution path
        run: |
          python -m py_compile \
            src/hephaestus/control/evaluator_boundary.py \
            src/hephaestus/control/deterministic_role_boundary.py \
            scripts/build_interface_repair_v3_evaluator.py \
            scripts/build_interface_repair_v3_1_evaluator.py \
            scripts/run_interface_repair_v3_evaluator.py \
            scripts/run_interface_repair_v3_1_evaluator.py \
            scripts/launch_interface_repair_v3_evaluator.py \
            scripts/launch_interface_repair_v3_1_evaluator.py
      - name: Assert V3.1 governance, lineage and holdout hygiene
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path

          cfg=json.loads(Path('configs/experiments/hephaestus_interface_repair_v3_evaluator.json').read_text())
          marker=json.loads(Path('configs/experiments/interface_repair_v3_evaluator.launch.json').read_text())
          candidates=json.loads(Path('configs/models/hephaestus_phase_ii_repair_candidates_v1.json').read_text())
          spec=importlib.util.spec_from_file_location('v31pack','scripts/build_interface_repair_v3_1_evaluator.py')
          assert spec and spec.loader
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          pack=mod.build_pack(); mod.validate(pack)

          assert mod.canonical_sha256(pack)==cfg['pack']['canonical_sha256']
          assert cfg['trainable_roles']==['evaluator']
          assert cfg['training']['optimizer_steps']['evaluator'] * cfg['training']['gradient_accumulation_steps']==len(pack['partitions']['evaluator']['train'])
          assert len(pack['partitions']['evaluator']['preflight'])==8
          assert cfg['source_evaluator_adapter']['sha256']=='cd675321340f831351710f9af122cd2a7e3741dc087955a43671bd6d0eff724e'
          assert cfg['source_evaluator_adapter']['status']=='diagnostic_uncertified_v2_candidate'
          assert cfg['preserved_planner_candidate']['sha256']=='6f6b8d9d50917cda52b3554d849d71d9cb295435b480d8d25e6a06d2784e0c71'
          assert cfg['preserved_planner_candidate']['retrain_in_v3'] is False
          assert cfg['governance']['production_promotion_allowed'] is False
          assert cfg['governance']['automatic_role_dispatch_allowed'] is False
          assert cfg['governance']['preserved_planner_mutation_allowed'] is False
          assert isinstance(cfg['governance']['paid_preflight_allowed'], bool)
          assert isinstance(cfg['governance']['paid_full_launch_allowed'], bool)
          assert marker['preflight_authorized'] in {True, False}
          assert marker['full_launch_authorized'] in {True, False}
          assert candidates['production_certified'] is False
          assert candidates['automatic_role_dispatch_enabled'] is False
          assert pack['diagnostic_burned_sets']['reused_in_v3_certification'] is False
          assert pack['diagnostic_burned_sets']['reused_in_v3_regression'] is False
          assert pack['diagnostic_burned_sets']['v3_sampled_certification_cases_reused_in_v31'] is False
          groups={k:{x['context'] for x in pack['partitions']['evaluator'][k]} for k in ('train','preflight','certification','regression')}
          names=list(groups)
          for i,left in enumerate(names):
              for right in names[i+1:]:
                  assert groups[left].isdisjoint(groups[right])
          PY
