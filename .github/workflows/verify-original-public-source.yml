name: Recover pinned public baseline source bytes
on:
  pull_request:
    paths:
      - scripts/recover_original_public_model.py
      - .github/workflows/verify-original-public-source.yml
permissions:
  contents: read
jobs:
  recover-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch exact public revision and compare original retained hashes
        run: python scripts/recover_original_public_model.py /tmp/hephaestus-original-public-source
      - uses: actions/upload-artifact@v4
        with:
          name: original-public-baseline-byte-recovery
          path: /tmp/hephaestus-original-public-source
          retention-days: 90
          compression-level: 0
