name: Authenticated diagnosis contrast - source-only full CPU validation
on:
  push:
    branches: [ops/diagnosis-authenticated-contrast-cpu-20261114]
    paths: [.github/workflows/diagnosis-source-contrast-cpu-once.yml]
permissions:
  contents: read
jobs:
  complete-tests:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c96e63a0a76a5690125eb9f591b9cb90fd4ab2f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m compileall -q src tests
      - name: Full regression suite on pinned source without temporary CI file
        run: python -m pytest -q
