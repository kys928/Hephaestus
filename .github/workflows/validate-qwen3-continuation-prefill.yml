name: Validate Qwen3 continuation prefill

on:
  push:
    branches: [launch/second-real-model-positive-wave]
    paths:
      - .github/workflows/validate-qwen3-continuation-prefill.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'transformers>=5.16,<5.17' 'huggingface_hub>=1.30,<1.31'
      - name: Validate frozen assistant-prefill serialization
        run: |
          python - <<'PY'
          from transformers import AutoTokenizer

          model_id = 'Qwen/Qwen3-8B'
          revision = 'b968826d9c46dd6066d109eabc6255188de91218'
          prompt = 'The observatory lost power just as the storm arrived.'
          tok = AutoTokenizer.from_pretrained(model_id, revision=revision, trust_remote_code=False)

          rendered = tok.apply_chat_template(
              [{'role': 'assistant', 'content': prompt}],
              tokenize=False,
              continue_final_message=True,
          )
          assert prompt in rendered, rendered
          assert rendered.count(prompt) == 1, rendered

          encoded = tok.apply_chat_template(
              [{'role': 'assistant', 'content': prompt}],
              tokenize=True,
              return_dict=True,
              return_tensors='pt',
              continue_final_message=True,
          )
          decoded = tok.decode(encoded['input_ids'][0], skip_special_tokens=False)
          assert prompt in decoded, decoded
          print({
              'model_id': model_id,
              'revision': revision,
              'frozen_prompt': prompt,
              'rendered': rendered,
              'decoded': decoded,
              'token_count': int(encoded['attention_mask'][0].sum()),
              'continuation_mode': 'assistant_prefill:continue_final_message',
          })
          PY
