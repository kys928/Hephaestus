name: Anvil PostgreSQL qualification
on:
  pull_request:
    paths:
      - scripts/anvil_postgres_qualification.py
      - .github/workflows/anvil-postgres-qualification.yml
permissions:
  contents: read
jobs:
  synthetic-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: anvil_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - run: python scripts/anvil_postgres_qualification.py
        env:
          ANVIL_QUALIFICATION_DSN: postgresql://postgres:fixture@127.0.0.1:5432/anvil_fixture
