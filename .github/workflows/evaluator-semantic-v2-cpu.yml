name: Evaluator Semantic V2 CPU evidence and validation
on:
  push:
    branches: [repair/evaluator-semantic-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts:src:.
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/audit_evaluator_semantic_repair_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-frozen-evidence
          path: semantic-v2-evidence-audit.json
