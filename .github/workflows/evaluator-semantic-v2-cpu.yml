name: Evaluator Semantic V2 CPU evidence and validation
on:
  push:
    branches: [repair/evaluator-semantic-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts:src:.
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/audit_evaluator_semantic_repair_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-frozen-evidence
          path: semantic-v2-evidence-audit.json
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts:src:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU verification dependencies
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' 'transformers==5.17.0' 'huggingface-hub==1.31.0'
      - name: Compile additive V2 implementation
        run: python -m compileall -q src/hephaestus scripts tests
      - name: Run repository suite
        run: pytest -q
      - name: Validate frozen development and every ablation
        run: python scripts/validate_evaluator_semantic_repair_v2.py > semantic-v2-curriculum-validation.json
      - name: Verify real frozen Granite tokenization and CPU loss
        run: python scripts/check_evaluator_semantic_v2_tokenizer.py --output semantic-v2-tokenizer-proof.json
      - name: Prepare immutable non-paid experiment manifests
        run: |
          for arm in B C D E; do
            python scripts/prepare_evaluator_semantic_repair_v2.py --arm "$arm" --output "semantic-v2-manifest-$arm.json"
          done
          python scripts/prepare_evaluator_semantic_repair_v2.py --arm E --matched-handoff-control --output semantic-v2-manifest-D-matched.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-cpu-validation
          path: semantic-v2-*.json
  inspect-approved-launch:
    if: contains(github.event.head_commit.message, '[inspect-v2-budget]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: scripts:src:.
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/inspect_evaluator_semantic_v2_budget.py
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-budget-inspection
          path: semantic-v2-budget-inspection.json

  assess-approved-C:
    if: contains(github.event.head_commit.message, '[assess-v2-C]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: scripts:src:.
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/assess_evaluator_semantic_v2_run.py
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v2-independent-assessment
          path: semantic-v2-assessment.json
