name: Interface Repair V2 recovery inspect

on:
  push:
    branches: [feature/first-scientific-manifest]
    paths:
      - .github/workflows/interface-repair-v2-recovery-inspect.yml
      - scripts/inspect_interface_repair_v2_run.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      HEPHAESTUS_INTERFACE_REPAIR_RUN_ID: interface-repair-v2-full-36627393869
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Inspect V2 run evidence read-only
        run: python scripts/inspect_interface_repair_v2_run.py
      - uses: actions/upload-artifact@v4
        with:
          name: interface-repair-v2-recovery-inspect
          path: interface_repair_v2_recovery_inspect.json
          if-no-files-found: error
          retention-days: 7
