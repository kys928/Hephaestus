name: Hephaestus regional-to-Global readable evidence recovery (exception-ledger)
on:
  push:
    branches: [ops/global-volume-recovery-20261112]
    paths:
      - .github/workflows/hephaestus-dual-mount-recovery.yml
permissions:
  contents: read
concurrency:
  group: hephaestus-dual-mount-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax gate before compute allocation
        run: |
          python -m py_compile scripts/hephaestus_regional_to_global_direct_worker.py
          python -m py_compile scripts/hephaestus_dual_mount_recovery_controller.py
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Mount original regional volume and Global library; copy and rehash selected evidence
        run: python -u scripts/hephaestus_dual_mount_recovery_controller.py
  cleanup:
    if: ${{ always() }}
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Kill only this run's dual-mounted recovery Pod
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          key=os.environ.get('RUNPOD_API_KEY','')
          run=os.environ['GITHUB_RUN_ID']
          if not key or not run.isdigit():raise RuntimeError('Cannot safely clean up Pod')
          name='hephaestus-regional-global-recovery-'+run
          api='https://api.runpod.io/v2'
          def fetch(method,path):
              with urllib.request.urlopen(urllib.request.Request(api+path,method=method,headers={'Authorization':'Bearer '+key}),timeout=40) as resp:
                  data=resp.read();return json.loads(data) if data else {}
          data=fetch('GET','/pods')
          rows=data if isinstance(data,list) else data.get('pods',data.get('data',[]))
          if not isinstance(rows,list):raise RuntimeError('Unknown Pod list response')
          matches=[p for p in rows if isinstance(p,dict) and p.get('name')==name]
          if len(matches)>1:raise RuntimeError('Duplicate exact dual-mounted Pod names')
          if matches:
              pid=matches[0].get('id')
              if not isinstance(pid,str) or not pid:raise RuntimeError('Invalid Pod identity')
              try:fetch('DELETE','/pods/'+pid)
              except urllib.error.HTTPError as ex:
                  if ex.code!=404:raise
              print('DUAL_MOUNT_RECOVERY_POD_TERMINATION_REQUESTED=true')
          else:print('DUAL_MOUNT_RECOVERY_POD_ALREADY_ABSENT=true')
          PY
