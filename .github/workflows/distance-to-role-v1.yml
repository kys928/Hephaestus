name: Hephaestus distance to role V1

# Test 3 implementation. GPU proof launches only from an explicit launch marker
# after the exact commit has passed CPU/S3 admission and integration CI.
on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/distance-to-role-v1.yml
      - configs/experiments/hephaestus_distance_to_role_v1.json
      - scripts/preflight_distance_to_role_v1.py
      - scripts/run_distance_to_role_v1.py
      - scripts/run_distance_to_role_v1_bridge.py
      - scripts/launch_distance_to_role_v1.py
      - scripts/launch_distance_to_role_v1_bridge.py
      - scripts/collect_distance_to_role_v1.py
      - tests/test_distance_to_role_v1.py
      - tests/test_distance_precision_bridge_v1.py
      - configs/experiments/hephaestus_adaptation_elasticity_v1.json
      - configs/eval_packs/hephaestus_cognitive_topology_v1.json
      - configs/eval_packs/semantic_behavior_v1.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distance-to-role-cviwpryzao
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_XET: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen distance admission dependencies
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[s3,test]' 'transformers==5.17.0' 'accelerate==1.15.0' 'safetensors==0.8.0' 'huggingface-hub==1.31.0' 'peft==0.20.0'
      - name: Test distance protocol and safety geometry
        run: python -m pytest -q tests/test_distance_to_role_v1.py tests/test_distance_precision_bridge_v1.py tests/test_model_admission.py tests/test_autonomy_boundary_policy.py
      - name: Compile distance experiment
        run: python -m compileall -q scripts/preflight_distance_to_role_v1.py scripts/run_distance_to_role_v1.py scripts/run_distance_to_role_v1_bridge.py scripts/launch_distance_to_role_v1.py scripts/launch_distance_to_role_v1_bridge.py scripts/collect_distance_to_role_v1.py
      - name: Admit immutable Test 2 source evidence and distance protocol
        run: python scripts/preflight_distance_to_role_v1.py
      - name: Preserve distance admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distance-to-role-v1-admission
          path: distance_to_role_preflight/
          if-no-files-found: warn
          retention-days: 90

  prove:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-distance-to-role-v1]')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [olmo-granite, qwen-ministral]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      HEPHAESTUS_DTR_RUN_ID: distance-to-role-v1-${{ github.run_id }}
      HEPHAESTUS_DISTANCE_SHARD: ${{ matrix.shard }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governed RunPod/S3 launcher
        run: python -m pip install -e '.[s3]'
      - name: Execute frozen distance shard
        run: |
          set -o pipefail
          python scripts/launch_distance_to_role_v1_bridge.py | tee "distance_to_role_${HEPHAESTUS_DISTANCE_SHARD}.log"
      - name: Retrieve shard evidence and independently verify teardown
        if: always()
        run: python scripts/collect_distance_to_role_v1.py --shard "$HEPHAESTUS_DISTANCE_SHARD"
      - name: Preserve compact shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distance-to-role-v1-${{ matrix.shard }}-evidence
          path: |
            distance_to_role_evidence/
            distance_to_role_launcher_${{ matrix.shard }}.json
            distance_to_role_verification_${{ matrix.shard }}.json
            distance_to_role_${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 90

  finalize:
    needs: [preflight, prove]
    if: (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-distance-to-role-v1]')) && always() && needs.preflight.result == 'success' && needs.prove.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      HEPHAESTUS_DTR_RUN_ID: distance-to-role-v1-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install S3 finalizer
        run: python -m pip install -e '.[s3]'
      - name: Build and read back final distance map
        run: python scripts/collect_distance_to_role_v1.py --finalize
      - name: Preserve final distance map evidence
        uses: actions/upload-artifact@v4
        with:
          name: distance-to-role-v1-final-evidence
          path: distance_to_role_evidence/
          if-no-files-found: error
          retention-days: 90
