name: Second paid GPU wave — governed positive promotion

on:
  push:
    branches: [launch/second-real-model-positive-wave]
    paths:
      - .github/workflows/second-paid-wave-launch.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: second-paid-gpu-wave-governed-promotion
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install launcher and test dependencies
        run: python -m pip install -e '.[s3,test]'
      - name: Verify production loop and governed promotion boundaries
        run: |
          python -m pytest -q \
            tests/test_production_loop_v1.py \
            tests/test_semantic_judge_integration.py \
            tests/test_promotion_reject_rollback_branch_gates.py \
            tests/test_runpod_provider.py \
            tests/test_runpod_gpu_execution.py
      - name: Guard frozen evaluation protocol
        run: |
          python - <<'PY'
          from pathlib import Path
          from hephaestus.evaluation.pack_loader import load_eval_pack
          expected = 'ee4acffa6d6ac3dadd1705931d65fc02bc4206f2fbddacf71b25af4d1cb5e3ad'
          pack = load_eval_pack('semantic_behavior_v1', config_dir=Path('configs'))
          assert pack['frozen'] is True
          assert pack['content_hash_verified'] is True
          assert pack['content_hash'] == expected
          normalized = pack['eval_pack']
          assert normalized['decoding_config'] == {
              'temperature': 0.0, 'top_p': 1.0, 'max_new_tokens': 96, 'seeds': [11, 29, 47]
          }
          print({'frozen_eval_pack_hash': pack['content_hash'], 'decoding_config': normalized['decoding_config']})
          PY
      - name: Compile positive promotion proof
        run: |
          python -m py_compile src/hephaestus/control/semantic_judge.py
          python -m py_compile src/hephaestus/production/actions.py
          python -m py_compile src/hephaestus/production/composition.py
          python -m py_compile src/hephaestus/production/loop.py
          python -m py_compile scripts/run_positive_promotion_proof.py
          python -m py_compile scripts/run_positive_promotion_proof_v2.py
          python -m py_compile scripts/launch_positive_promotion_proof.py
          python -m py_compile scripts/launch_positive_promotion_proof_v2.py
      - name: Launch corrected real GPU promotion and certification chain
        run: python scripts/launch_positive_promotion_proof_v2.py
      - name: Upload positive-promotion proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-paid-gpu-wave-proof
          path: |
            positive_promotion_launcher.json
            positive_promotion_verification.json
          if-no-files-found: warn
          retention-days: 30
