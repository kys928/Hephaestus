name: CPU prospective three-seed learning study
on:
  push:
    branches: ['feature/cpu-prospective-multiseed-evidence-20261028']
    # Expensive genuine CPU replications only when scientific inputs change.
    # Test-only and documentation fixes use the ordinary fast regression CI.
    paths:
      - 'src/hephaestus/data/generated_factory.py'
      - 'src/hephaestus/data/generated_validation.py'
      - 'src/hephaestus/evaluation/cpu_prospective.py'
      - 'src/hephaestus/production/cpu_research.py'
      - 'src/hephaestus/training/cpu_research.py'
      - 'scripts/run_cpu_research_campaign.py'
      - 'configs/research/cpu_prospective_seed*.json'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  prospective-seed:
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,peft-training,independent-certification]'
      - name: Prove campaign isolation and aggregation fail-closed checks
        run: python -m pytest -q tests/test_cpu_campaign_config.py tests/test_cpu_prospective_replications.py tests/test_internal_research_policy.py
      - name: Start one new genuine eight-update native CPU campaign
        run: |
          python scripts/run_cpu_research_campaign.py \
            --config configs/research/cpu_prospective_seed${{ matrix.seed }}.json \
            --output /tmp/cpu-prospective-seed${{ matrix.seed }}
      - name: Reopen authentic 45-step run without recounting or retraining
        run: |
          python scripts/run_cpu_research_campaign.py --resume \
            --config configs/research/cpu_prospective_seed${{ matrix.seed }}.json \
            --output /tmp/cpu-prospective-seed${{ matrix.seed }}
      - name: Verify original SQLite/operation and checkpoint receipts
        run: |
          python scripts/run_cpu_research_campaign.py --verify-only \
            --config configs/research/cpu_prospective_seed${{ matrix.seed }}.json \
            --output /tmp/cpu-prospective-seed${{ matrix.seed }}
      - name: Hash all archived evidence bytes
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sqlite3
          for root in pathlib.Path('/tmp').glob('cpu-prospective-seed*'):
              if not (root / 'state.sqlite').exists():
                  continue
              db = sqlite3.connect(root / 'state.sqlite')
              db.execute('PRAGMA wal_checkpoint(TRUNCATE)')
              db.close()
              files = {p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                       for p in sorted(root.rglob('*')) if p.is_file() and not p.is_symlink()
                       and p.name != 'archive_sha256.json'}
              (root/'archive_sha256.json').write_text(json.dumps(files,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-prospective-seed-${{ matrix.seed }}
          path: /tmp/cpu-prospective-seed${{ matrix.seed }}/

  analyze:
    needs: prospective-seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: cpu-prospective-seed-*
          path: /tmp/cpu-prospective-evidence
      - name: Independently aggregate three complete same-holdout campaigns
        run: |
          python scripts/analyze_cpu_prospective_replications.py \
            --output /tmp/cpu-prospective-summary.json \
            /tmp/cpu-prospective-evidence/cpu-prospective-seed-*/cpu_campaign_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-prospective-independent-three-seed-summary
          path: /tmp/cpu-prospective-summary.json
