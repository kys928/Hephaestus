# Independent watchdog for separately approved one-shot Global GPU activation.
name: Anvil live GPU watchdog
on:
  push:
    branches: [feature/anvil-integration]
    paths: [.github/workflows/anvil-live-gpu-watchdog.yml]
permissions:
  contents: read
  actions: read
jobs:
  watchdog:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[s3]"
      - name: Prime exact audit watchdog
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          ANVIL_FIRST_LIVE_ACTIVATION: operator-20261125-second-one-gpu-0.65-usd-3600s
          PYTHONPATH: src
        run: python scripts/anvil_live_gpu_watchdog.py prime
      - name: Watch for exact audit Pod
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ANVIL_FIRST_LIVE_ACTIVATION: operator-20261125-second-one-gpu-0.65-usd-3600s
          PYTHONPATH: src
        run: python scripts/anvil_live_gpu_watchdog.py watch
