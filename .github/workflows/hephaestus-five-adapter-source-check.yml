name: Check original five Czech role adapter archives (read only)
on:
  push:
    branches: [ops/boot-hephaestus-global-20261113]
    paths: [.github/workflows/hephaestus-five-adapter-source-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: HEAD and one-byte range on each pinned original adapter key
        run: |
          python - <<'PY'
          import os,json,boto3
          from botocore.exceptions import ClientError
          reg=json.load(open('configs/models/hephaestus_role_model_stack_v1.json'))
          s3=boto3.client('s3',endpoint_url='https://s3api-eu-cz-1.runpod.io/',region_name='EU-CZ-1',aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'])
          for role,desc in reg['roles'].items():
              key=desc['adapter']['s3_key']
              try:
                  head=s3.head_object(Bucket='cviwpryzao',Key=key)
                  assert int(head['ContentLength'])==int(desc['adapter']['bytes'])
                  stream=s3.get_object(Bucket='cviwpryzao',Key=key,Range='bytes=0-0')['Body']
                  with stream:stream.read(1)
                  status='READABLE'
              except ClientError as e:status='HTTP_'+str(e.response.get('Error',{}).get('Code','Unknown'))
              print('ROLE_SOURCE='+json.dumps({'role':role,'bytes':desc['adapter']['bytes'],'s3_status':status}))
          PY
