name: Prometheus Unbound independent RunPod GPU watchdog (one-shot)
on:
  push:
    branches: [ops/prometheus-unbound-global-20261114]
    paths: [.github/workflows/prometheus-global-watchdog.yml]
permissions:
  contents: read
  issues: write
concurrency:
  group: prometheus-unbound-global-20261114-watchdog-source8038
  cancel-in-progress: false
jobs:
  independent-watchdog:
    if: ${{ github.repository == 'kys928/Hephaestus' && github.event.head_commit.message == 'PROMETHEUS_UNBOUND_ARM_WATCHDOG' }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      PROMETHEUS_GLOBAL_CAMPAIGN: prometheus-unbound-global-20261114-01
      PROMETHEUS_SOURCE_SHA: 8038aaa1651b37746838604f4b14e97ee27c77dd
      PROMETHEUS_ACTION_LOG: /tmp/prometheus-logs/watchdog.jsonl
      PROMETHEUS_LOG_LABEL: watchdog
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8038aaa1651b37746838604f4b14e97ee27c77dd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish start GitHub Actions run locator to Prometheus PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_LABEL: start
          JOB_RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url="https://github.com/kys928/Hephaestus/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          status=os.environ["STATUS_LABEL"]
          result=os.environ["JOB_RESULT"] if status=="completion" else "started"
          label=os.environ.get("PROMETHEUS_LOG_LABEL","prometheus")
          body=f"Prometheus {label}: {status} ({result}) — {url}. Run ID {os.environ['GITHUB_RUN_ID']}; no scientific result implied."
          req=urllib.request.Request("https://api.github.com/repos/kys928/Hephaestus/issues/206/comments",
            data=json.dumps({"body":body}).encode(),method="POST",
            headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                     "Content-Type":"application/json","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=25) as response:
              print("PROMETHEUS_ACTION_RUN_LINK_PUBLISHED="+str(response.status==201))
          PY
      - name: Exact source and Python syntax preflight
        run: |
          test "$(git rev-parse HEAD)" = "$PROMETHEUS_SOURCE_SHA"
          python -m compileall -q src/hephaestus/development/prometheus_global_*.py
      - run: python -m pip install '.[s3]'
      - name: Heartbeat and independently terminate exact Global Pod on worker exit or deadline
        run: python -u -m hephaestus.development.prometheus_global_watchdog
      - name: Publish independent watchdog timeline in Actions summary
        if: ${{ always() }}
        run: |
          PYTHONPATH=src python -m hephaestus.development.prometheus_global_observability summary --path "$PROMETHEUS_ACTION_LOG" --job watchdog >> "$GITHUB_STEP_SUMMARY"
      - name: Archive metadata-only independent watchdog events (30 days)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-global-watchdog-metadata
          path: /tmp/prometheus-logs/watchdog.jsonl
          retention-days: 30
          if-no-files-found: warn
      - name: Publish completion GitHub Actions run locator to Prometheus PR
        continue-on-error: true
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_LABEL: completion
          JOB_RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url="https://github.com/kys928/Hephaestus/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          status=os.environ["STATUS_LABEL"]
          result=os.environ["JOB_RESULT"] if status=="completion" else "started"
          label=os.environ.get("PROMETHEUS_LOG_LABEL","prometheus")
          body=f"Prometheus {label}: {status} ({result}) — {url}. Run ID {os.environ['GITHUB_RUN_ID']}; no scientific result implied."
          req=urllib.request.Request("https://api.github.com/repos/kys928/Hephaestus/issues/206/comments",
            data=json.dumps({"body":body}).encode(),method="POST",
            headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                     "Content-Type":"application/json","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=25) as response:
              print("PROMETHEUS_ACTION_RUN_LINK_PUBLISHED="+str(response.status==201))
          PY

# Authorized one-time watchdog arm for Prometheus Unbound 2026-11-14.
