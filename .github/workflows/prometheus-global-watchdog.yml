name: Prometheus Unbound independent RunPod GPU watchdog (one-shot)
on:
  push:
    branches: [ops/prometheus-unbound-global-20261114]
    paths: [.github/workflows/prometheus-global-watchdog.yml]
permissions:
  contents: read
concurrency:
  group: prometheus-unbound-global-20261114-watchdog
  cancel-in-progress: false
jobs:
  independent-watchdog:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      PROMETHEUS_GLOBAL_CAMPAIGN: prometheus-unbound-global-20261114-01
      PROMETHEUS_SOURCE_SHA: e56372c07600824c983d19459f8ffa513945083d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e56372c07600824c983d19459f8ffa513945083d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source and Python syntax preflight
        run: |
          test "$(git rev-parse HEAD)" = "$PROMETHEUS_SOURCE_SHA"
          python -m compileall -q src/hephaestus/development/prometheus_global_*.py
      - run: python -m pip install '.[s3]'
      - name: Heartbeat and independently terminate exact Global Pod on worker exit or deadline
        run: python -u -m hephaestus.development.prometheus_global_watchdog
