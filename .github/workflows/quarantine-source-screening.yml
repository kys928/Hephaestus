name: Quarantined source screening and external custody boundary
on:
  push:
    branches: [experiment/quarantine-source-screening-custody-20261025]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: write, actions: read}
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU-only screening dependencies
        run: python -m pip install -e '.[test,dataset-preparation]' cryptography
      - name: Custody substitution, privacy output and existing approval regression checks
        run: >-
          pytest -q tests/test_quarantine_screening.py
          tests/test_staged_governed_huggingface.py
          tests/test_staged_dataset_approval_custody.py
          tests/test_independent_evaluator_holdout_review.py
          tests/test_schema_aware_public_preview_review.py
      - name: Exact operator-scoped source scans; no private references or training
        run: >-
          python scripts/run_quarantine_source_screening.py
          --accepted-scope-ref sha256:d7b3e42bad911f14095fb4b1bd9d0caa434a7eea7bec52472b70effcdffced69
      - name: Check evidence and write SHA256 index
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('quarantine_source_screening')
          summary=json.loads((root/'summary.json').read_text())
          assert summary['source_quarantine_deleted'] is True
          assert summary['all_protected_audits_complete'] is False
          assert summary['training_executed'] is False
          assert summary['dataset_approved'] is False
          assert summary['source_sha'] == __import__('os').environ['GITHUB_SHA']
          for entry in summary['reports']:
              report=entry['report']
              assert report['protected_reference_leakage']['status']=='not_run'
              assert report['semantic_contamination']['status']=='not_run'
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file() and not any(x.startswith('.') for x in p.relative_to(root).parts)}
          (root/'sha256-index.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: quarantine-source-screening
          path: quarantine_source_screening/
          if-no-files-found: error
          retention-days: 90
      - name: Archive verified aggregate findings outside Actions retention
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[freeze-source-triage]')
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > source-screening-evidence.zip
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          with zipfile.ZipFile('source-screening-evidence.zip') as z:
              index=json.loads(z.read('sha256-index.json'))
              assert set(z.namelist())==set(index)|{'sha256-index.json'}
              for name,expected in index.items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==expected
          files=['source-screening-evidence.zip']
          pathlib.Path('SHA256SUMS').write_text(''.join(hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()+'  '+f+'\n' for f in files))
          PY
          gh release create source-screening-triage-v2 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Source-only screening triage v2; normalization profiles distinguished' --notes 'Full exact train-file triage for SAF and WikiText-2 raw. Distinguishes original newline-preserving preview normalization from the separately measured whitespace-flattening study in v1. Neither profile grants dataset eligibility. Aggregate measurements only. No independent custody, protected-reference or semantic leakage clearance, dataset approval, training, certification or 45-stage completion. Source scope and limitations are inside the checksummed evidence. Hosting is not platform immutable.' source-screening-evidence.zip SHA256SUMS
          mkdir verified-release
          gh release download source-screening-triage-v2 --repo "$GITHUB_REPOSITORY" --dir verified-release
          cmp SHA256SUMS verified-release/SHA256SUMS
          cd verified-release
          sha256sum -c SHA256SUMS
