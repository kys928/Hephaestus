name: Diagnostic Scaling Recovery V1 runtime hotfix

on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/diagnostic-scaling-recovery-v1-hotfix.yml

permissions:
  contents: write
  actions: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-diagnostic-scaling-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cancel stale recovery run with no live Pods
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          curl -sS -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/35239300657/cancel"
          echo
          set -e

      - name: Apply bounded vanished-Pod and CUDA visibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          launcher = Path('scripts/launch_diagnostic_scaling_recovery_v1.py')
          text = launcher.read_text(encoding='utf-8')

          old = 'export TMPDIR=/opt/hephaestus-tmp\nmkdir -p "$HF_HOME" "$HUGGINGFACE_HUB_CACHE" "$XDG_CACHE_HOME" "$TMPDIR"\n'
          new = 'export TMPDIR=/opt/hephaestus-tmp\nexport CUDA_DEVICE_ORDER=PCI_BUS_ID\nexport CUDA_VISIBLE_DEVICES=0\nmkdir -p "$HF_HOME" "$HUGGINGFACE_HUB_CACHE" "$XDG_CACHE_HOME" "$TMPDIR"\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = '        "HF_HUB_DISABLE_XET": "1",\n        "PYTHONUNBUFFERED": "1",\n'
          new = '        "HF_HUB_DISABLE_XET": "1",\n        "CUDA_DEVICE_ORDER": "PCI_BUS_ID",\n        "CUDA_VISIBLE_DEVICES": "0",\n        "PYTHONUNBUFFERED": "1",\n'
          assert text.count(old) == 2, text.count(old)
          text = text.replace(old, new)

          old = '    observations: list[dict[str, Any]] = []\n    last_status: str | None = None\n    while time.monotonic() < deadline:\n'
          new = '    observations: list[dict[str, Any]] = []\n    last_status: str | None = None\n    missing_polls = 0\n    while time.monotonic() < deadline:\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        snapshot = storage.pod_snapshot(execution, pod_id)\n        status = str((snapshot or {}).get("desiredStatus", "unknown")).upper()\n        if status != last_status:\n            observations.append({"at": now(), "desired_status": status, "pod_snapshot": snapshot})\n            last_status = status\n        if status in TERMINAL_STATUSES:\n            raise PodExitedWithoutTerminal(pod_id, snapshot)\n'''
          new = '''        snapshot = storage.pod_snapshot(execution, pod_id)\n        if snapshot is None:\n            missing_polls += 1\n            status = "MISSING"\n        else:\n            missing_polls = 0\n            status = str(snapshot.get("desiredStatus", "unknown")).upper()\n        if status != last_status:\n            observations.append({"at": now(), "desired_status": status, "pod_snapshot": snapshot})\n            last_status = status\n        if status in TERMINAL_STATUSES:\n            raise PodExitedWithoutTerminal(pod_id, snapshot)\n        if snapshot is None and missing_polls >= 3:\n            log_snapshot = best_effort_log_snapshot(pod_id)\n            missing = {\n                "desiredStatus": "MISSING",\n                "consecutive_missing_polls": missing_polls,\n                "runpod_v2_log_snapshot": log_snapshot,\n            }\n            observations.append({"at": now(), "pod_missing_watchdog": True, **missing})\n            raise PodExitedWithoutTerminal(pod_id, missing)\n'''
          assert old in text
          text = text.replace(old, new, 1)
          launcher.write_text(text, encoding='utf-8')

          runtime = Path('scripts/run_diagnostic_scaling_v1.py')
          text = runtime.read_text(encoding='utf-8')
          old = '''    if not torch.cuda.is_available() or torch.cuda.device_count() != 1:\n        raise RuntimeError("Diagnostic Scaling V1 requires exactly one visible CUDA GPU")\n    props = torch.cuda.get_device_properties(0)\n'''
          new = '''    cuda_available = bool(torch.cuda.is_available())\n    device_count = int(torch.cuda.device_count())\n    if not cuda_available or device_count != 1:\n        diagnostic = {\n            "cuda_available": cuda_available,\n            "device_count": device_count,\n            "CUDA_VISIBLE_DEVICES": os.environ.get("CUDA_VISIBLE_DEVICES"),\n            "NVIDIA_VISIBLE_DEVICES": os.environ.get("NVIDIA_VISIBLE_DEVICES"),\n        }\n        try:\n            import subprocess\n            probe = subprocess.run(\n                ["nvidia-smi", "--query-gpu=index,name,memory.total,uuid", "--format=csv,noheader"],\n                check=False, capture_output=True, text=True, timeout=20,\n            )\n            diagnostic["nvidia_smi_returncode"] = probe.returncode\n            diagnostic["nvidia_smi_stdout"] = probe.stdout.strip()\n            diagnostic["nvidia_smi_stderr"] = probe.stderr.strip()\n        except Exception as exc:\n            diagnostic["nvidia_smi_error"] = f"{type(exc).__name__}: {exc}"\n        raise RuntimeError(\n            "Diagnostic Scaling V1 requires exactly one visible CUDA GPU; observed="\n            + json.dumps(diagnostic, sort_keys=True)\n        )\n    torch.cuda.set_device(0)\n    props = torch.cuda.get_device_properties(0)\n'''
          assert old in text
          text = text.replace(old, new, 1)
          runtime.write_text(text, encoding='utf-8')

          tests = Path('tests/test_diagnostic_scaling_recovery_v1_launcher.py')
          text = tests.read_text(encoding='utf-8')
          old = '    assert request["gpuCount"] == 1\n    shell = request["dockerStartCmd"][-1]\n'
          new = '    assert request["gpuCount"] == 1\n    assert request["env"]["CUDA_VISIBLE_DEVICES"] == "0"\n    assert request["env"]["CUDA_DEVICE_ORDER"] == "PCI_BUS_ID"\n    shell = request["dockerStartCmd"][-1]\n'
          assert old in text
          text = text.replace(old, new, 1)
          anchor = '''\ndef test_wait_terminal_aborts_silent_running_pod(monkeypatch):\n'''
          addition = '''\ndef test_wait_terminal_fails_after_bounded_missing_polls(monkeypatch):\n    class Client:\n        pass\n\n    monkeypatch.setattr(launcher.storage, "maybe_read_key", lambda *args, **kwargs: None)\n    monkeypatch.setattr(launcher.storage, "pod_snapshot", lambda *args, **kwargs: None)\n    monkeypatch.setattr(launcher, "best_effort_log_snapshot", lambda *_: {"status": "captured", "bytes": 60, "tail": "pod not found"})\n    monkeypatch.setattr(launcher.time, "sleep", lambda _: None)\n    with pytest.raises(launcher.PodExitedWithoutTerminal) as exc:\n        launcher.wait_terminal(\n            Client(), object(), execution_id="exec", attempt=1, pod_id="pod-missing", silent_start_timeout_seconds=999999\n        )\n    assert exc.value.snapshot["desiredStatus"] == "MISSING"\n    assert exc.value.snapshot["consecutive_missing_polls"] == 3\n\n'''
          assert anchor in text
          text = text.replace(anchor, addition + anchor, 1)
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Run focused recovery tests
        run: |
          python -m pip install -e '.[s3,test]'
          python -m py_compile scripts/launch_diagnostic_scaling_recovery_v1.py scripts/run_diagnostic_scaling_v1.py
          python -m pytest -q \
            tests/test_diagnostic_scaling_recovery_v1_launcher.py \
            tests/test_diagnostic_scaling_recovery_v1_runtime.py \
            tests/test_diagnostic_scaling_recovery_v1_preflight.py \
            tests/test_diagnostic_scaling_recovery_v1_contract.py

      - name: Commit validated hotfix
        run: |
          git config user.name "Hephaestus Recovery Bot"
          git config user.email "hephaestus-recovery@users.noreply.github.com"
          git add scripts/launch_diagnostic_scaling_recovery_v1.py scripts/run_diagnostic_scaling_v1.py tests/test_diagnostic_scaling_recovery_v1_launcher.py
          git diff --cached --check
          git commit -m "Fix recovery GPU visibility and vanished-pod teardown"
          git push origin HEAD:experiment-diagnostic-scaling-v1
