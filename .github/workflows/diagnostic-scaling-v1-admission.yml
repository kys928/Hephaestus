name: Diagnostic Scaling V1 launch admission

on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/diagnostic-scaling-v1-admission.yml
      - configs/experiments/hephaestus_diagnostic_scaling_v1.json
      - scripts/preflight_diagnostic_scaling_v1.py
      - scripts/validate_diagnostic_scaling_v1_contract.py
      - scripts/run_diagnostic_scaling_v1.py
      - scripts/launch_diagnostic_scaling_v1.py
      - tests/test_diagnostic_scaling_v1_contract.py
      - tests/test_diagnostic_scaling_v1_admission.py
      - tests/test_diagnostic_scaling_v1_launcher.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-scaling-v1-admission
  cancel-in-progress: false

jobs:
  admit-launch-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_XET: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install admission and frozen runtime validation dependencies
        run: |
          python -m pip install -e '.[s3,test]' \
            'transformers==5.17.0' \
            'accelerate==1.15.0' \
            'safetensors==0.8.0' \
            'huggingface-hub==1.31.0' \
            'peft==0.20.0'
      - name: Compile admission, launcher, and Pod driver
        run: python -m py_compile scripts/validate_diagnostic_scaling_v1_contract.py scripts/preflight_diagnostic_scaling_v1.py scripts/launch_diagnostic_scaling_v1.py scripts/run_diagnostic_scaling_v1.py
      - name: Run contract, admission, and launcher unit gates
        run: python -m pytest -q tests/test_diagnostic_scaling_v1_contract.py tests/test_diagnostic_scaling_v1_admission.py tests/test_diagnostic_scaling_v1_launcher.py
      - name: Reverify immutable cohort and PEFT MoE support
        run: python scripts/validate_diagnostic_scaling_v1_contract.py --remote
      - name: Build and persist immutable launch admission
        run: python scripts/preflight_diagnostic_scaling_v1.py
      - name: Render every exact Pod request without launching
        run: |
          python scripts/launch_diagnostic_scaling_v1.py --model-id 'Qwen/Qwen3-14B'
          python scripts/launch_diagnostic_scaling_v1.py --model-id 'deepseek-ai/DeepSeek-R1-Distill-Qwen-14B'
          python scripts/launch_diagnostic_scaling_v1.py --model-id 'zai-org/GLM-4.7-Flash'
          python scripts/launch_diagnostic_scaling_v1.py --model-id 'Qwen/Qwen3-30B-A3B-Thinking-2507'
      - name: Preserve launch-admission and rendered-request evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-scaling-v1-launch-admission
          path: |
            diagnostic_scaling_contract_validation.json
            diagnostic_scaling_admission/
            diagnostic_scaling_launch_request_*.json
          if-no-files-found: error
          retention-days: 90
