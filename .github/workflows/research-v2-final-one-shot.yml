name: Final bounded autonomous research v2 source-pinned verification
on:
  push:
    branches: [ops/research-v2-final-verify-20261117]
    paths: [.github/workflows/research-v2-final-one-shot.yml]
permissions: {contents: read}
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: b02219b31a79b58c47fe31e19329c2cad55d46da, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: test "$(git rev-parse HEAD)" = "b02219b31a79b58c47fe31e19329c2cad55d46da"
      - run: python -m pip install -e '.[test,independent-certification]'
      - run: python -m pytest -q tests/test_signed_research_live_runtime.py tests/test_reviewed_multi_source_discovery.py tests/test_governed_next_experiment_handoffs.py tests/test_exact_span_model_patch_contract.py tests/test_single_use_research_grant_ledger.py tests/test_deployed_research_worker_admission.py tests/test_constrained_research_self_repair.py tests/test_durable_research_objective_jobs.py tests/test_research_objective_cli.py
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {ref: b02219b31a79b58c47fe31e19329c2cad55d46da, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: test "$(git rev-parse HEAD)" = "b02219b31a79b58c47fe31e19329c2cad55d46da"
      - run: python -m pip install -e '.[test,independent-certification]'
      - run: python -m pytest -q
