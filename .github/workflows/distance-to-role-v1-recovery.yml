name: Recover distance to role V1 run 35091821250

# Recovery launch marker: validated precision bridge, original pods terminal, resume missing evidence only.
# One-off, auditable recovery for the original Test 3 run after the FP16->BF16
# dose-zero guard classified an intentional precision bridge as unexplained drift.
# GPU recovery still requires an explicit [recover-distance-to-role-v1] marker.
on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/distance-to-role-v1-recovery.yml
      - scripts/run_distance_to_role_v1_bridge.py
      - scripts/launch_distance_to_role_v1_bridge.py
      - tests/test_distance_precision_bridge_v1.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distance-to-role-recovery-35091821250
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_XET: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen recovery admission dependencies
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[s3,test]' 'transformers==5.17.0' 'accelerate==1.15.0' 'safetensors==0.8.0' 'huggingface-hub==1.31.0' 'peft==0.20.0'
      - name: Verify distance protocol and precision bridge
        run: python -m pytest -q tests/test_distance_to_role_v1.py tests/test_distance_precision_bridge_v1.py tests/test_model_admission.py tests/test_autonomy_boundary_policy.py
      - name: Compile recovery drivers
        run: python -m compileall -q scripts/preflight_distance_to_role_v1.py scripts/run_distance_to_role_v1.py scripts/run_distance_to_role_v1_bridge.py scripts/launch_distance_to_role_v1.py scripts/launch_distance_to_role_v1_bridge.py scripts/collect_distance_to_role_v1.py
      - name: Re-admit immutable source evidence for recovery commit
        run: python scripts/preflight_distance_to_role_v1.py
      - name: Preserve recovery admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distance-to-role-v1-recovery-admission
          path: distance_to_role_preflight/
          if-no-files-found: warn
          retention-days: 90

  recover:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[recover-distance-to-role-v1]')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [olmo-granite, qwen-ministral]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      HEPHAESTUS_DTR_RUN_ID: distance-to-role-v1-35091821250
      HEPHAESTUS_DISTANCE_SHARD: ${{ matrix.shard }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governed recovery launcher
        run: python -m pip install -e '.[s3]'
      - name: Resume or reuse frozen distance shard
        run: |
          set -o pipefail
          python scripts/launch_distance_to_role_v1_bridge.py | tee "distance_to_role_recovery_${HEPHAESTUS_DISTANCE_SHARD}.log"
      - name: Retrieve recovery evidence and independently verify teardown
        if: always()
        run: python scripts/collect_distance_to_role_v1.py --shard "$HEPHAESTUS_DISTANCE_SHARD"
      - name: Preserve compact recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distance-to-role-v1-recovery-${{ matrix.shard }}
          path: |
            distance_to_role_evidence/
            distance_to_role_launcher_${{ matrix.shard }}.json
            distance_to_role_verification_${{ matrix.shard }}.json
            distance_to_role_recovery_${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 90

  finalize:
    needs: [preflight, recover]
    if: (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[recover-distance-to-role-v1]')) && always() && needs.preflight.result == 'success' && needs.recover.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      HEPHAESTUS_DTR_RUN_ID: distance-to-role-v1-35091821250
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install S3 finalizer
        run: python -m pip install -e '.[s3]'
      - name: Build and read back recovered final distance map
        run: python scripts/collect_distance_to_role_v1.py --finalize
      - name: Preserve recovered final distance map evidence
        uses: actions/upload-artifact@v4
        with:
          name: distance-to-role-v1-recovered-final-evidence
          path: distance_to_role_evidence/
          if-no-files-found: error
          retention-days: 90
