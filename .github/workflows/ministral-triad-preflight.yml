name: Hephaestus Ministral triad live RunPod preflight no spend
on:
  push:
    branches: [ops/ministral-triad-live-preflight-20261124]
    paths: [.github/workflows/ministral-triad-preflight.yml]
permissions: {contents: read}
concurrency: {group: hephaestus-ministral-triad-preflight-20261124, cancel-in-progress: false}
jobs:
  independent-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io
      RUNPOD_API_BASE_URL: https://api.runpod.io/v2
    steps:
      - uses: actions/checkout@v4
        with: {ref: 5787e6db2c8a1423cf4b25f3ecc7121d64eb2e3a, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: test "$(git rev-parse HEAD)" = 5787e6db2c8a1423cf4b25f3ecc7121d64eb2e3a
      - run: python -m pip install -e '.[s3,independent-certification]'
      - name: Probe authenticated prepaid account, volume adapter hashes and secure GPU stock
        run: |
          python - <<'PY'
          import os
          from hephaestus.providers.runpod.cost_intelligence import ReadOnlyRunPodPricing
          from hephaestus.providers.runpod.config import RunPodConfig
          from hephaestus.providers.runpod.execution import RunPodExecutionAdapter,RunPodApiError
          from hephaestus.providers.runpod.storage import RunPodNetworkVolumeStorage
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider
          from hephaestus.production.original_cuda_identity import verified_original_roles,registry_digest
          from pathlib import Path
          if not os.environ.get("RUNPOD_API_KEY"):
              raise PermissionError("RUNPOD_API_KEY secret missing")
          cfg=RunPodConfig.from_env()
          assert cfg.datacenter_id=="EU-CZ-1" and cfg.network_volume_id=="cviwpryzao"
          role_stack,_=verified_original_roles(registry_digest())
          p=ReadOnlyRunPodPricing(bearer_token=os.environ["RUNPOD_API_KEY"])
          account=p.account()
          assert not account.autopay_enabled, "refuse prepaid launch while autopay enabled"
          print("LIVE_PREPAID_BALANCE_POSITIVE="+str(account.credit_balance_usd>0),flush=True)
          print("LIVE_PREPAID_MINIMUM_FIVE_USD="+str(account.credit_balance_usd>=5),flush=True)
          print("ACTIVE_CHARGES_NONZERO="+str(account.already_spending_usd_per_hour>0),flush=True)
          a=RunPodExecutionAdapter(cfg,EnvironmentSecretsProvider(),
              state_root=Path(os.environ["RUNNER_TEMP"])/"read-only-lifecycle")
          pods=a.list_pods()
          print("EXISTING_POD_COUNT="+str(len(pods)),flush=True)
          sku="NVIDIA RTX PRO 6000 Blackwell Server Edition"
          rate=p.quote_gpu(gpu_id=sku,datacenter_id=cfg.datacenter_id)
          print("QUOTE_GPU_SKU="+rate.gpu_id,flush=True)
          print("QUOTE_GPU_VRAM_GB="+str(rate.gpu_memory_gb),flush=True)
          print("QUOTE_SECURE_USD_PER_HOUR="+str(rate.price_usd_per_hour),flush=True)
          try:
              selected=a.select_gpu([sku])
              print("LIVE_PINNED_GPU_AVAILABLE="+str(selected==sku),flush=True)
          except RunPodApiError:
              print("LIVE_PINNED_GPU_AVAILABLE=false",flush=True)
          if (not os.environ.get("RUNPOD_S3_ACCESS_KEY_ID")
                or not os.environ.get("RUNPOD_S3_SECRET_ACCESS_KEY")):
              print("S3_ROLE_ARCHIVES_AVAILABLE=unknown_missing_existing_secret",flush=True)
          else:
              client=RunPodNetworkVolumeStorage.from_boto3(
                  cfg,EnvironmentSecretsProvider()).client
              for role in ("diagnosis","planner"):
                  spec=role_stack.resolve(role)
                  head=client.head_object(Bucket=cfg.network_volume_id,Key=spec.adapter.s3_key)
                  print("ORIGINAL_"+role.upper()+"_ADAPTER_S3_HEAD_OK="+str(
                      int(head["ContentLength"])==spec.adapter.bytes),flush=True)
          print("LIVE_READONLY_PREFLIGHT_COMPLETED=true",flush=True)
          PY
