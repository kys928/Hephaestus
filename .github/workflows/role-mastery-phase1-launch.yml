name: Role Mastery Phase I paid launch
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - configs/experiments/role_mastery_phase1_v1.launch.json
permissions:
  contents: read
concurrency:
  group: role-mastery-phase1-paid
  cancel-in-progress: false
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[launch-role-mastery-phase1-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONPATH: src:scripts}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test,s3]'
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('configs/experiments/hephaestus_role_mastery_phase1_v1.json').read_text())
          m=json.loads(Path('configs/experiments/role_mastery_phase1_v1.launch.json').read_text())
          assert m['authorized'] is True
          assert c['governance']['paid_launch_allowed'] is True
          assert c['governance']['launch_authorized'] is True
          assert m['protocol_id']==c['protocol_id']
          assert set(m['roles'])==set(c['candidate_registry'])
          assert c['governance']['promotion_allowed'] is False
          assert c['governance']['lineage_mutation_allowed'] is False
          PY
      - run: python scripts/validate_role_mastery_phase1_v1.py
      - run: python -m py_compile scripts/role_mastery_common_v1.py scripts/run_role_mastery_phase1_v1.py scripts/launch_role_mastery_phase1_v1.py scripts/aggregate_role_mastery_phase1_v1.py
  launch:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        role: [controller, diagnosis, planner, evaluator, judge]
    runs-on: ubuntu-latest
    timeout-minutes: 255
    env:
      PYTHONPATH: src:scripts
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      HEPHAESTUS_ROLE_MASTERY_LAUNCH_AUTHORIZED: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/launch_role_mastery_phase1_v1.py --role ${{ matrix.role }} --execute
  aggregate:
    needs: launch
    if: always() && needs.launch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:scripts
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/aggregate_role_mastery_phase1_v1.py
