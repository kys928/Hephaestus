# One-shot activation under the existing 1 A40 / USD 0.65 / 3600 s approval.
name: Anvil first live Diagnosis-Planner investigation
on:
  push:
    branches: [feature/anvil-integration]
    paths: [.github/workflows/anvil-live-gpu-mission.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anvil-first-live-diagnosis-planner-v1
  cancel-in-progress: false
jobs:
  reviewer:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: anvil_fixture
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[postgres,s3,independent-certification]'
      - name: Independently review live evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          ANVIL_POSTGRES_DSN: ${{ secrets.ANVIL_POSTGRES_DSN }}
          ANVIL_FIRST_LIVE_ACTIVATION: approved-one-a40-0.65-usd-3600s
          ANVIL_RESTORE_DSN: postgresql://postgres:fixture@127.0.0.1:5432/anvil_fixture
          PYTHONPATH: src
        run: python scripts/anvil_live_mission.py reviewer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-anvil-live-review
          path: |
            /tmp/anvil-live-${{ github.run_id }}-reviewer/artifacts/
            /tmp/anvil-live-${{ github.run_id }}-reviewer/backup/
          if-no-files-found: warn
  controller:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[postgres,s3,independent-certification]'
      - name: Execute bounded live mission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          ANVIL_POSTGRES_DSN: ${{ secrets.ANVIL_POSTGRES_DSN }}
          ANVIL_FIRST_LIVE_ACTIVATION: approved-one-a40-0.65-usd-3600s
          PYTHONPATH: src
        run: python scripts/anvil_live_mission.py controller
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anvil-live-controller-evidence
          path: |
            /tmp/anvil-live-${{ github.run_id }}-controller/artifacts/
            /tmp/anvil-live-${{ github.run_id }}-controller/backup/
          if-no-files-found: warn
