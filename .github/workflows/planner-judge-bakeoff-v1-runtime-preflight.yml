name: Planner Judge Bakeoff V1 runtime preflight
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - .github/workflows/planner-judge-bakeoff-v1-runtime-preflight.yml
      - configs/experiments/hephaestus_planner_judge_bakeoff_v1.json
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install --quiet 'transformers==5.17.0' 'huggingface-hub==1.31.0' 'accelerate==1.15.0' 'mistral-common==1.11.7'
      - name: Verify target surfaces and chat templates
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from accelerate import init_empty_weights
          from transformers import AutoConfig,AutoModelForCausalLM,AutoTokenizer,Mistral3ForConditionalGeneration,MistralCommonBackend
          cfg=json.loads(Path('configs/experiments/hephaestus_planner_judge_bakeoff_v1.json').read_text())
          for cand in cfg['candidate_registry']:
              acfg=AutoConfig.from_pretrained(cand['model_id'],revision=cand['revision'],trust_remote_code=False)
              with init_empty_weights():
                  model=Mistral3ForConditionalGeneration(acfg) if cand['load_kind']=='mistral3' else AutoModelForCausalLM.from_config(acfg,trust_remote_code=False)
              pat=re.compile(cand['lora_target_regex'])
              matched=[n for n,m in model.named_modules() if pat.match(n)]
              if not matched:
                  raise SystemExit(f"no LoRA target modules matched for {cand['candidate_id']}")
              if cand['candidate_id'].startswith('ministral') and any('vision_tower' in n for n in matched):
                  raise SystemExit('Ministral target regex reached vision tower')
              tok=(MistralCommonBackend.from_pretrained(cand['model_id'],revision=cand['revision']) if cand['load_kind']=='mistral3' else AutoTokenizer.from_pretrained(cand['model_id'],revision=cand['revision'],trust_remote_code=False))
              role_rows={}
              for role,rcfg in cand['roles'].items():
                  user=[{'role':'user','content':'Return exactly one JSON object with decision, action, primary_variable, confidence, evidence_refs, uncertainties, rationale.'}]
                  full=user+[{'role':'assistant','content':'{"decision":"blocked","action":"request_recheck","primary_variable":"evidence","confidence":0.9,"evidence_refs":["E1"],"uncertainties":[],"rationale":"Evidence controls the decision."}'}]
                  kw=dict(rcfg.get('chat_template_kwargs') or {})
                  if cand['load_kind']=='mistral3':
                      p=tok.apply_chat_template(user,return_tensors='pt',return_dict=True,**kw)['input_ids'][0].tolist()
                      f=tok.apply_chat_template(full,return_tensors='pt',return_dict=True,continue_final_message=True,**kw)['input_ids'][0].tolist()
                  else:
                      p=tok.apply_chat_template(user,tokenize=True,add_generation_prompt=True,return_tensors='pt',return_dict=True,**kw)['input_ids'][0].tolist()
                      f=tok.apply_chat_template(full,tokenize=True,add_generation_prompt=False,return_tensors='pt',return_dict=True,**kw)['input_ids'][0].tolist()
                  lcp=0
                  for a,b in zip(p,f):
                      if a!=b: break
                      lcp+=1
                  if lcp<8 or len(f)<=lcp:
                      raise SystemExit(f"training template prefix/suffix invalid for {cand['candidate_id']} {role}: lcp={lcp} prompt={len(p)} full={len(f)}")
                  role_rows[role]={'prompt_tokens':len(p),'full_tokens':len(f),'lcp':lcp,'assistant_suffix_tokens':len(f)-lcp}
              print('PJ_RUNTIME_PREFLIGHT_JSON '+json.dumps({'candidate_id':cand['candidate_id'],'model_type':getattr(acfg,'model_type',None),'matched_lora_modules':len(matched),'first_targets':matched[:8],'roles':role_rows},sort_keys=True))
          PY
