name: Inspect reusable candidate smoke

on:
  push:
    branches: [launch/stronger-immutable-candidate-wave]
    paths: [.github/workflows/inspect-candidate-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install boto3
      - name: Read current candidate smoke evidence
        run: |
          python - <<'PY'
          import os, boto3
          client = boto3.client('s3', endpoint_url=os.environ['RUNPOD_S3_ENDPOINT_URL'].rstrip('/'), region_name=os.environ['RUNPOD_DATACENTER_ID'], aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'])
          bucket = os.environ['RUNPOD_NETWORK_VOLUME_ID']
          prefix = 'hephaestus/scientific/v1/executions/candidate-frozen-continuation-smoke-33998283122/'
          for obj in client.list_objects_v2(Bucket=bucket, Prefix=prefix, MaxKeys=100).get('Contents', []):
              key = obj['Key']; print('KEY', obj.get('Size', 0), key)
              if key.endswith('driver_result.json') or key.endswith('pod_runtime.log'):
                  raw = client.get_object(Bucket=bucket, Key=key)['Body'].read().decode('utf-8', errors='replace')
                  print(raw if key.endswith('driver_result.json') else raw[-20000:])
          PY
