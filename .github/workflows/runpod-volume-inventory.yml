name: RunPod scientific volume inventory

on:
  push:
    branches: [feature/first-scientific-manifest]
    paths:
      - .github/workflows/runpod-volume-inventory.yml
      - scripts/runpod_volume_inventory.py
      - scripts/runpod_verify_scientific_state.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runpod-scientific-volume-inventory
  cancel-in-progress: true

jobs:
  inventory:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install S3 client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Inventory scientific namespaces
        run: python scripts/runpod_volume_inventory.py
      - name: Verify artifact bytes and reconstruct first experiment bindings
        run: python scripts/runpod_verify_scientific_state.py
      - name: Upload inventory and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: runpod-scientific-state
          path: |
            volume_inventory.json
            full_object_index.json
            candidate_paths.txt
            artifact_verification.json
            first_scientific_experiment_reconstruction.json
          if-no-files-found: error
          retention-days: 7
