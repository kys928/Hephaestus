name: REAL original Ministral triad 32GB Blackwell $2 cap
on:
  push:
    branches: [ops/ministral-triad-32gb-paid-20261124]
    paths: [.github/workflows/ministral-triad-32gb-once.yml]
permissions: {contents: read}
concurrency: {group: hephaestus-original-minist-triad-202611240003, cancel-in-progress: false}
jobs:
  real-gpu-triad:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io
      RUNPOD_API_BASE_URL: https://api.runpod.io/v2
    steps:
      - uses: actions/checkout@v4
        with: {ref: 29dd82911d685e1fe89187c3fe18abeb1fad978f, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: test "$(git rev-parse HEAD)" = 29dd82911d685e1fe89187c3fe18abeb1fad978f
      - run: python -m pip install -e '.[s3,test,independent-certification]'
      - name: Build real isolated independent patch executor on the OFF-Pod host
        run: |
          docker build -t hephaestus-triad-review-sandbox:local - <<'DOCKER'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir pytest==8.4.2
          DOCKER
      - name: Actual original three models on one 32GB Blackwell, verify, delete
        run: |
          python -u scripts/launch_approved_ministral_triad_cuda.py \
            --source-commit 29dd82911d685e1fe89187c3fe18abeb1fad978f \
            --run-tag 202611240003
