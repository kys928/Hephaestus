name: GLM Cheap Screen V1 paid launch

on:
  workflow_dispatch:
    inputs:
      confirm_paid_probe:
        description: "Explicitly authorize one bounded paid GLM cheap-screen Pod"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: glm-cheap-screen-v1-paid
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.confirm_paid_probe == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -e '.[s3,test]'
      - name: Validate cheap-screen protocol and render launch
        run: |
          python scripts/validate_glm_cheap_screen_v1.py
          python scripts/launch_glm_cheap_screen_v1.py

  launch:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      HEPHAESTUS_GLM_CHEAP_SCREEN_LAUNCH_AUTHORIZED: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install launcher dependencies
        run: python -m pip install -e '.[s3]'
      - name: Launch one bounded cheap screen
        run: python scripts/launch_glm_cheap_screen_v1.py --execute