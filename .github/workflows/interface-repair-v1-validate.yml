name: Phase II targeted interface repair validate
on:
  push:
    branches: [phase-ii-targeted-interface-repair]
    paths:
      - src/hephaestus/evaluation/handoff_normalization.py
      - scripts/build_interface_repair_v1.py
      - scripts/build_interface_mastery_v1b.py
      - scripts/run_interface_normalization_ab_v1.py
      - scripts/launch_interface_normalization_ab_v1.py
      - scripts/run_interface_targeted_repair_v1.py
      - scripts/launch_interface_targeted_repair_v1.py
      - scripts/aggregate_interface_targeted_repair_v1.py
      - scripts/run_interface_mastery_v1b.py
      - scripts/launch_interface_mastery_v1b.py
      - configs/experiments/hephaestus_interface_repair_v1.json
      - configs/experiments/hephaestus_interface_mastery_v1b.json
      - configs/experiments/hephaestus_interface_normalization_ab_v1.json
      - configs/experiments/interface_normalization_ab_v1.launch.json
      - configs/experiments/hephaestus_interface_targeted_repair_v1.json
      - configs/experiments/interface_targeted_repair_v1.launch.json
      - configs/experiments/interface_mastery_v1b.launch.json
      - tests/test_interface_repair_v1.py
      - tests/test_interface_targeted_repair_v1.py
      - tests/test_interface_mastery_v1b_runtime.py
      - docs/phase_ii_targeted_interface_repair.md
      - .github/workflows/interface-repair-v1-validate.yml
      - .github/workflows/interface-normalization-ab-v1-paid-launch.yml
      - .github/workflows/interface-targeted-repair-v1-paid-launch.yml
      - .github/workflows/interface-mastery-v1b-paid-launch.yml
  pull_request:
    paths:
      - src/hephaestus/evaluation/handoff_normalization.py
      - scripts/build_interface_repair_v1.py
      - scripts/build_interface_mastery_v1b.py
      - scripts/run_interface_normalization_ab_v1.py
      - scripts/launch_interface_normalization_ab_v1.py
      - scripts/run_interface_targeted_repair_v1.py
      - scripts/launch_interface_targeted_repair_v1.py
      - scripts/aggregate_interface_targeted_repair_v1.py
      - scripts/run_interface_mastery_v1b.py
      - scripts/launch_interface_mastery_v1b.py
      - configs/experiments/hephaestus_interface_repair_v1.json
      - configs/experiments/hephaestus_interface_mastery_v1b.json
      - configs/experiments/hephaestus_interface_normalization_ab_v1.json
      - configs/experiments/interface_normalization_ab_v1.launch.json
      - configs/experiments/hephaestus_interface_targeted_repair_v1.json
      - configs/experiments/interface_targeted_repair_v1.launch.json
      - configs/experiments/interface_mastery_v1b.launch.json
      - tests/test_interface_repair_v1.py
      - tests/test_interface_targeted_repair_v1.py
      - tests/test_interface_mastery_v1b_runtime.py
      - docs/phase_ii_targeted_interface_repair.md
      - .github/workflows/interface-repair-v1-validate.yml
      - .github/workflows/interface-normalization-ab-v1-paid-launch.yml
      - .github/workflows/interface-targeted-repair-v1-paid-launch.yml
      - .github/workflows/interface-mastery-v1b-paid-launch.yml
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e . pytest
      - run: python scripts/build_interface_mastery_v1.py
      - run: python scripts/build_interface_repair_v1.py
      - run: python scripts/build_interface_mastery_v1b.py
      - run: python scripts/launch_interface_normalization_ab_v1.py > /tmp/interface-normalization-render.json
      - run: python scripts/launch_interface_targeted_repair_v1.py --role controller > /tmp/interface-repair-render.json
      - run: python scripts/launch_interface_mastery_v1b.py > /tmp/interface-iib-render.json
      - run: python -m pytest -q tests/test_interface_repair_v1.py tests/test_interface_targeted_repair_v1.py tests/test_interface_mastery_v1b_runtime.py tests/test_interface_mastery_v1.py tests/test_certified_role_stack.py
      - run: python -m pytest -q
      - run: python -m py_compile scripts/build_interface_repair_v1.py scripts/build_interface_mastery_v1b.py scripts/run_interface_normalization_ab_v1.py scripts/launch_interface_normalization_ab_v1.py scripts/run_interface_targeted_repair_v1.py scripts/launch_interface_targeted_repair_v1.py scripts/aggregate_interface_targeted_repair_v1.py scripts/run_interface_mastery_v1b.py scripts/launch_interface_mastery_v1b.py src/hephaestus/evaluation/handoff_normalization.py
      - name: Assert isolation and gating
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          repair=json.loads(Path('configs/experiments/hephaestus_interface_repair_v1.json').read_text())
          iib=json.loads(Path('configs/experiments/hephaestus_interface_mastery_v1b.json').read_text())
          ab=json.loads(Path('configs/experiments/hephaestus_interface_normalization_ab_v1.json').read_text())
          ab_marker=json.loads(Path('configs/experiments/interface_normalization_ab_v1.launch.json').read_text())
          train=json.loads(Path('configs/experiments/hephaestus_interface_targeted_repair_v1.json').read_text())
          train_marker=json.loads(Path('configs/experiments/interface_targeted_repair_v1.launch.json').read_text())
          iib_marker=json.loads(Path('configs/experiments/interface_mastery_v1b.launch.json').read_text())
          assert repair['canonical_sha256']=='58cce9a9a4b43ac4874a50af86f6c6080f50d541d56dfd343d01539e2821335f'
          assert repair['leakage_policy']['phase_ii_v1_training_use'] is False
          assert repair['leakage_policy']['phase_ii_b_training_use'] is False
          assert iib['governance']['training_use_allowed'] is False
          assert ab['governance']['weights_mutation_allowed'] is False
          assert ab['governance']['targeted_repair_training_allowed'] is False
          assert train['governance']['phase_ii_b_access_during_training_allowed'] is False
          assert train['governance']['production_promotion_allowed'] is False
          if train['normalization_gate']['required_ab_run_id'] is None:
              assert train_marker['authorized'] is False
          if iib['repair_gate']['required_repair_run_id'] is None:
              assert iib_marker['authorized'] is False
          assert train_marker['authorization_phrase']=='LAUNCH_INTERFACE_TARGETED_REPAIR_V1'
          assert ab_marker['authorization_phrase']=='LAUNCH_INTERFACE_NORMALIZATION_AB_V1'
          assert iib_marker['authorization_phrase']=='LAUNCH_PHASE_II_B_INTERFACE_MASTERY_V1'
          PY
