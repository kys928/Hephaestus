name: Boot Hephaestus on Global + Czech State (five pinned Global adapters)
on:
  push:
    branches: [ops/boot-hephaestus-global-20261113]
    paths: [.github/workflows/hephaestus-live-boot.yml]
permissions:
  contents: read
concurrency:
  group: hephaestus-live-boot-single
  cancel-in-progress: false
jobs:
  boot:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate boot worker and controller source before creating compute
        run: |
          python -m py_compile scripts/hephaestus_boot_global_pod.py
          python -m py_compile scripts/hephaestus_live_pod_controller.py
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Create a CPU Pod; boot code and all real role adapter weights
        run: python -u scripts/hephaestus_live_pod_controller.py
  lease-and-teardown:
    if: ${{ always() }}
    needs: boot
    runs-on: ubuntu-latest
    timeout-minutes: 205
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      BOOT_PASSED: ${{ needs.boot.result }}
    steps:
      - name: Keep the successful Pod available for three hours
        if: env.BOOT_PASSED == 'success'
        run: sleep 10800
      - name: Terminate only this boot's named Pod after lease or failure
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get('RUNPOD_API_KEY','')
          run=os.environ.get('GITHUB_RUN_ID','')
          if not token or not run.isdecimal():raise RuntimeError('No authorized cleanup identity')
          expected='hephaestus-global-live-'+run
          base='https://api.runpod.io/v2'
          def api(method,path):
              req=urllib.request.Request(base+path,method=method,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=35) as r:
                  content=r.read()
                  return json.loads(content) if content else {}
          result=api('GET','/pods')
          rows=result if isinstance(result,list) else result.get('pods',result.get('data',[]))
          if not isinstance(rows,list):raise RuntimeError('Unexpected RunPod Pod list')
          matches=[x for x in rows if isinstance(x,dict) and x.get('name')==expected]
          if len(matches)>1:raise RuntimeError('Ambiguous live Pod identity')
          if matches:
              pid=matches[0].get('id')
              if not isinstance(pid,str) or not pid:raise RuntimeError('Invalid cleanup Pod id')
              try:api('DELETE','/pods/'+pid)
              except urllib.error.HTTPError as exc:
                  if exc.code!=404:raise
              print('HEPHAESTUS_LIVE_POD_DELETE_REQUESTED=true')
          else:print('HEPHAESTUS_LIVE_POD_ALREADY_ABSENT=true')
          PY
