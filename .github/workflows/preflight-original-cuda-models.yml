name: Inspect exact frozen CUDA model availability and storage before full GPU-45 (no Pod)
on:
  push:
    branches: [feature/original-cuda-45-full-budget-launch-20261029]
    paths: ['.github/workflows/preflight-original-cuda-models.yml']
permissions:
  contents: read
jobs:
  pinned-models-and-current-prepaid-runway:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q huggingface_hub
      - name: Inspect all five original HF model revisions and pinned 135M target without downloading large model weights
        run: |
          python - <<'PY'
          import json
          from huggingface_hub import HfApi
          from hephaestus.llm.cpu_causal_research import MODEL_ID,MODEL_REVISION
          data=json.load(open('configs/models/hephaestus_role_model_stack_v1.json'))
          models={info['model_id']:info['revision'] for info in data['roles'].values()}
          models[MODEL_ID]=MODEL_REVISION
          api=HfApi()
          grand=0
          for name,revision in models.items():
              try:
                  info=api.model_info(name,revision=revision,files_metadata=True)
              except Exception as exc:
                  print('HF_SNAPSHOT_UNAVAILABLE='+name+' ERROR='+type(exc).__name__)
                  raise
              size=sum((s.size or 0) for s in info.siblings if s.rfilename.endswith(
                  ('.safetensors','.bin','.model','.json','.txt','.tiktoken','.vocab','.merges')))
              blobs=sum((s.size or 0) for s in info.siblings if s.rfilename.endswith('.safetensors'))
              if info.sha!=revision:
                  raise SystemExit('HF_ORIGINAL_REVISION_NOT_IMMUTABLE')
              print('PINNED_MODEL_ACCESSIBLE='+name+' GIB_EST='+str(round(size/2**30,2))
                    +' SAFETENSORS_GIB='+str(round(blobs/2**30,2)))
              grand+=size
          print('ORIGINAL_SIX_MODEL_COMBINED_SOURCE_GIB='+str(round(grand/2**30,2)))
          print('ORIGINAL_FIVE_ROLE_IDENTITIES_UNCHANGED=true')
          print('PAID_GPU_PODS_CREATED=0')
          PY
