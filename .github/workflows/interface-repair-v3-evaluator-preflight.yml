name: Interface Repair V3 Evaluator preflight

on:
  push:
    branches: [experiment-interface-repair-v3-evaluator-boundary]
    paths:
      - configs/experiments/interface_repair_v3_evaluator.launch.json

permissions: {contents: read}

concurrency:
  group: interface-repair-v3-evaluator-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[launch-interface-repair-v3-evaluator-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      HEPHAESTUS_INTERFACE_REPAIR_RUN_ID: interface-repair-v3-evaluator-preflight-${{ github.run_id }}
      HEPHAESTUS_INTERFACE_REPAIR_V3_EVALUATOR_AUTHORIZED: LAUNCH_INTERFACE_REPAIR_V3_EVALUATOR_PREFLIGHT
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Verify explicit V3.1 evaluator preflight authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/experiments/hephaestus_interface_repair_v3_evaluator.json').read_text())
          marker=json.loads(Path('configs/experiments/interface_repair_v3_evaluator.launch.json').read_text())
          assert cfg['protocol_revision']=='3.1'
          assert cfg['trainable_roles']==['evaluator']
          assert cfg['governance']['paid_preflight_allowed'] is True
          assert cfg['governance']['paid_full_launch_allowed'] is False
          assert cfg['governance']['production_promotion_allowed'] is False
          assert cfg['governance']['automatic_role_dispatch_allowed'] is False
          assert cfg['governance']['preserved_planner_mutation_allowed'] is False
          assert marker['preflight_authorized'] is True
          assert marker['full_launch_authorized'] is False
          assert marker['preflight_evidence_key'] is None
          assert marker['preflight_repo_sha'] is None
          assert cfg['preflight']['role']=='evaluator'
          assert cfg['preflight']['partition']=='preflight'
          assert cfg['preflight']['optimizer_steps']==5
          assert cfg['preflight']['evaluation_cases']==8
          assert cfg['execution']['format_retry_max_attempts']==1
          assert cfg['execution']['format_retry_target_free'] is True
          assert cfg['execution']['max_hourly_usd_per_pod']==2.20
          assert cfg['execution']['max_estimated_total_usd_preflight']==0.50
          PY
      - run: python scripts/launch_interface_repair_v3_1_evaluator.py --preflight --execute
