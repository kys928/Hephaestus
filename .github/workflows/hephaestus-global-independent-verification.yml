name: Hephaestus independent sealed Global evidence receipt validation
on:
  push:
    branches: [ops/global-volume-recovery-20261112]
    paths:
      - .github/workflows/hephaestus-global-independent-verification.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: hephaestus-global-independent-verification
  cancel-in-progress: false
jobs:
  wait-for-source:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 290
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      GH_RECOVERY_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Block until original S3 restore succeeds and Pod is gone
        run: python -u scripts/hephaestus_wait_source_recovery.py
  independently-verify:
    needs: wait-for-source
    runs-on: ubuntu-latest
    timeout-minutes: 215
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate controller and worker syntax before allocation
        run: |
          python -m py_compile scripts/hephaestus_global_receipt_verification_controller.py
          python -m py_compile scripts/hephaestus_independent_global_receipt_verifier.py
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Create bounded CPU verifier, validate Global bytes, terminate worker
        run: python -u scripts/hephaestus_global_receipt_verification_controller.py
  cleanup-verifier:
    if: ${{ always() }}
    needs: independently-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Independently terminate ONLY this exact verifier Pod
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          key=os.environ.get('RUNPOD_API_KEY','')
          run=os.environ['GITHUB_RUN_ID']
          if not key or not run.isdigit():raise RuntimeError('No verifier API credentials')
          name='hephaestus-independent-global-verify-'+run
          base='https://api.runpod.io/v2'
          def request(method,path):
              with urllib.request.urlopen(urllib.request.Request(base+path,method=method,headers={'Authorization':'Bearer '+key}),timeout=35) as resp:
                  blob=resp.read()
                  return json.loads(blob) if blob else {}
          got=request('GET','/pods')
          rows=got if isinstance(got,list) else got.get('pods',got.get('data',[]))
          if not isinstance(rows,list):raise RuntimeError('Unknown Pod list')
          matches=[x for x in rows if isinstance(x,dict) and x.get('name')==name]
          if len(matches)>1:raise RuntimeError('More than one Pod matches exact verifier name')
          if matches:
              pid=matches[0].get('id')
              if not isinstance(pid,str) or not pid:raise RuntimeError('Malformed Pod ID')
              try:request('DELETE','/pods/'+pid)
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              print('INDEPENDENT_VERIFIER_CLEANUP_REQUESTED=true')
          else:print('INDEPENDENT_VERIFIER_POD_ABSENT=true')
          PY
