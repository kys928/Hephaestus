name: Evaluator effect polarity and precedence CPU audit (read only)
on:
  push:
    branches: [diagnostic/evaluator-effect-polarity-contrasts-v1]
permissions:
  contents: read
jobs:
  oracle-contrasts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts:src:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test]'
      - name: Compile CPU counterfactual suite and effect audit
        run: python -m compileall -q scripts/evaluator_effect_polarity_contrasts.py scripts/audit_evaluator_effect_polarity_readonly.py
      - name: Validate all oracle factor vectors and 60 matched contrasts
        run: pytest -q tests/test_evaluator_effect_polarity_contrasts.py
      - name: Emit no-inference contrast manifest
        run: |
          python - <<'PY'
          from evaluator_effect_polarity_contrasts import inference_fixture_manifest
          import json
          print('EVALUATOR_CONTRAST_DESIGN '+json.dumps(inference_fixture_manifest(),sort_keys=True))
          PY
  saved-factor-analysis:
    needs: oracle-contrasts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts:src:.
      PYTHONDONTWRITEBYTECODE: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Analyze saved primary quality versus precedence and training distractors
        run: python scripts/audit_evaluator_effect_polarity_readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluator-effect-sign-and-precedence-cpu-audit
          path: evaluator-effect-polarity-audit.json
