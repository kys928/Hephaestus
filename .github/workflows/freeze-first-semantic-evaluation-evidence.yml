name: Freeze first semantic evaluation evidence

on:
  push:
    branches: [integration/first-semantic-evaluation]
    paths:
      - .github/workflows/freeze-first-semantic-evaluation-evidence.yml

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify original semantic evaluation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9935299093/zip" \
            -o /tmp/first-semantic-evaluation.zip
          echo 'f19f8b15db7c389beb00511522b7e799efcbe91d20df863aea1c5ff58afc7a01  /tmp/first-semantic-evaluation.zip' | sha256sum -c -
          mkdir -p /tmp/frozen
          unzip -q /tmp/first-semantic-evaluation.zip -d /tmp/frozen
          echo 'e8389db0f8d3d9732b784097c76474637d6cb704b8244728d7874fa6480f2624  /tmp/frozen/first_semantic_evaluation_launcher.json' | sha256sum -c -
          echo '4a3e266413a717c31e83f7f1d894e7ccd6e0bef1d59e9b1a427b67ecf178e8c4  /tmp/frozen/first_semantic_evaluation_verification.json' | sha256sum -c -
      - name: Freeze exact semantic evidence bytes into repository
        run: |
          set -Eeuo pipefail
          dest='docs/evidence/first-semantic-evaluation-001-33869352751'
          mkdir -p "$dest"
          cp /tmp/frozen/first_semantic_evaluation_launcher.json "$dest/launcher.json"
          cp /tmp/frozen/first_semantic_evaluation_verification.json "$dest/verification.json"
          cat > "$dest/SHA256SUMS" <<'EOF'
          e8389db0f8d3d9732b784097c76474637d6cb704b8244728d7874fa6480f2624  launcher.json
          4a3e266413a717c31e83f7f1d894e7ccd6e0bef1d59e9b1a427b67ecf178e8c4  verification.json
          f19f8b15db7c389beb00511522b7e799efcbe91d20df863aea1c5ff58afc7a01  original-github-actions-artifact.zip
          EOF
          cat > "$dest/README.md" <<'EOF'
          # Frozen evidence: first semantic evaluation

          This directory preserves the exact UTF-8 launcher and independent-verification JSON bytes emitted by the first real `semantic_behavior_v1` baseline-versus-trained evaluation.

          - evaluation run: `first-semantic-evaluation-001-33869352751`
          - GitHub Actions run: `33869352751`
          - GitHub artifact ID: `9935299093`
          - execution commit: `5f4fe4ebf413355b8842555dcfa09c4feef404ed`
          - RunPod Pod: `l9l8jdfqxy9fpq`
          - frozen eval pack: `semantic_behavior@1.0.0`
          - eval pack hash: `ee4acffa6d6ac3dadd1705931d65fc02bc4206f2fbddacf71b25af4d1cb5e3ad`
          - trained checkpoint manifest: `sha256:7a6be1e0cee47f29d5dd47d41bc01beed066c4de64e24ee18544ff4edcb3f4c3`
          - comparison outcome: `regressed`
          - Judge exit action: `reject_checkpoint`

          `launcher.json` and `verification.json` were re-downloaded from the original GitHub Actions artifact and SHA-256 checked before being committed. They are intentionally not reformatted.

          The original ZIP is not duplicated in Git because it is only a transport container. Its exact SHA-256 is retained in `SHA256SUMS` so the original workflow artifact can still be matched byte-for-byte.

          The Judge decision was recorded but not applied. This evidence proves the generation/evaluation/Judge chain worked; it does not mutate lineage, promote or delete a checkpoint, or authorize further training.
          EOF
          sha256sum -c <(head -n 2 "$dest/SHA256SUMS" | sed "s#  #  $dest/#")
      - name: Commit frozen evidence and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          git config user.name 'hephaestus-evidence-freezer'
          git config user.email '122738904+kys928@users.noreply.github.com'
          git rm .github/workflows/freeze-first-semantic-evaluation-evidence.yml
          git add docs/evidence/first-semantic-evaluation-001-33869352751
          git commit -m 'Freeze first semantic evaluation evidence'
          git push origin HEAD:integration/first-semantic-evaluation
