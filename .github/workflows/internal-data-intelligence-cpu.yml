name: Internal data intelligence CPU
on:
  pull_request:
    paths:
      - 'src/hephaestus/data/internal_screening.py'
      - 'src/hephaestus/data/intelligence.py'
      - 'src/hephaestus/data/generated*.py'
      - 'src/hephaestus/policy/internal_research.py'
      - 'src/hephaestus/schemas/internal_research.py'
      - 'src/hephaestus/production/cpu_research*.py'
      - 'tests/test_internal*'
      - 'tests/test_autonomous_internal*'
      - 'tests/test_generated*'
      - '.github/workflows/internal-data-intelligence-cpu.yml'
  push:
    branches: ['feature/autonomous-source-selection-20261028', 'feature/governed-original-data-20261028', 'feature/cpu-research-execution-20261028']
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,independent-certification]' tokenizers
      - run: python -m pytest -q tests/test_internal_research_policy.py tests/test_autonomous_internal_discovery.py tests/test_staged_dataset_approval_custody.py tests/test_independent_evaluator_holdout_review.py
      - name: Validate original generated task families
        run: if [ -f tests/test_generated_original_data.py ]; then python -m pytest -q tests/test_generated_original_data.py; fi
  real-discovery:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name != 'feature/autonomous-source-selection-20261028'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . tokenizers huggingface-hub
      - run: python scripts/run_internal_data_intelligence.py --output /tmp/internal-data-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-data-intelligence-evidence
          path: /tmp/internal-data-evidence
  real-cpu-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref_name == 'feature/cpu-research-execution-20261028'
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,peft-training,independent-certification]'
      - name: Policy, attacks, actual optimizer interruption and resume
        run: python -m pytest -q tests/test_internal_cpu_execution.py tests/test_generated_original_data.py tests/test_autonomous_internal_discovery.py tests/test_internal_research_policy.py tests/test_staged_production_composition.py tests/test_staged_dataset_approval_custody.py tests/test_independent_evaluator_holdout_review.py
      - name: One real original-task CPU native campaign
        run: python scripts/run_cpu_research_campaign.py --output /tmp/cpu-internal-research-evidence
      - name: Resume authentic completed state without repeating operations
        run: python scripts/run_cpu_research_campaign.py --output /tmp/cpu-internal-research-evidence --resume
      - name: Independently reopen persisted bytes and verify complete trace
        run: python scripts/run_cpu_research_campaign.py --output /tmp/cpu-internal-research-evidence --verify-only
      - name: Checkpoint SQLite and hash every evidence member
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3, hashlib, json
          root = Path('/tmp/cpu-internal-research-evidence')
          if root.exists():
              db = sqlite3.connect(root/'state.sqlite')
              db.execute('PRAGMA wal_checkpoint(TRUNCATE)')
              db.close()
              files = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                       for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'archive_sha256.json'}
              (root/'archive_sha256.json').write_text(json.dumps(files, sort_keys=True, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-internal-research-campaign-evidence
          path: /tmp/cpu-internal-research-evidence
