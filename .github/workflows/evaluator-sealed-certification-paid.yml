name: Evaluator sealed certification paid

on:
  push:
    branches:
      - feature/evaluator-certification-boundary-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    if: >-
      contains(github.event.head_commit.message, '[launch-evaluator-sealed-certification-v1]')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
      HEPHAESTUS_EVALUATOR_SEALED_CERTIFICATION_AUTHORIZED: LAUNCH_HEPHAESTUS_EVALUATOR_SEALED_CERTIFICATION_V1
      HEPHAESTUS_EVALUATOR_CERTIFICATION_RUN_ID: evaluator-sealed-cert-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]'
      - name: Verify frozen certification authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/experiments/hephaestus_evaluator_sealed_certification_v1.json').read_text())
          marker=json.loads(Path('configs/experiments/hephaestus_evaluator_sealed_certification_v1.launch.json').read_text())
          candidate=json.loads(Path('configs/experiments/hephaestus_evaluator_certification_candidate_v1.json').read_text())
          assert cfg['governance']['paid_launch_allowed'] is True
          assert cfg['governance']['training_allowed'] is False
          assert cfg['governance']['adapter_mutation_allowed'] is False
          assert cfg['governance']['candidate_weights_mutation_allowed'] is False
          assert cfg['governance']['production_promotion_allowed'] is False
          assert cfg['governance']['automatic_role_dispatch_allowed'] is False
          assert marker['launch_authorized'] is True
          assert marker['authorized_repo_sha']
          assert candidate['governance']['weights_frozen'] is True
          assert candidate['sealed_evidence']['canonical_sha256'] == cfg['pack']['canonical_sha256']
          PY
      - name: Run frozen sealed certification
        run: python scripts/launch_evaluator_sealed_certification_v1.py --execute
