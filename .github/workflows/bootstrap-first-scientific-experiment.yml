name: Bootstrap first scientific experiment

on:
  push:
    branches: [integration/first-scientific-bootstrap]
    paths:
      - .github/workflows/bootstrap-first-scientific-experiment.yml
      - scripts/bootstrap_first_scientific_experiment.py
      - scripts/run_bootstrap_first_scientific_experiment.py
      - src/hephaestus/data/**
      - src/hephaestus/providers/datasets/**
      - src/hephaestus/providers/models/**
      - src/hephaestus/planning/**
      - src/hephaestus/schemas/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-scientific-bootstrap-cviwpryzao
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      PYTHONPATH: src
      TOKENIZERS_PARALLELISM: 'false'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bootstrap dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'boto3>=1.35,<2' 'pyarrow>=17' 'tokenizers>=0.20,<1' 'transformers>=4.46,<6' 'safetensors>=0.4,<1'
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile bootstrap runner
        run: |
          python -m py_compile scripts/bootstrap_first_scientific_experiment.py
          python -m py_compile scripts/run_bootstrap_first_scientific_experiment.py
      - name: Bootstrap real scientific inputs and typed chain
        run: python scripts/run_bootstrap_first_scientific_experiment.py
      - name: Upload bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: first-scientific-bootstrap
          path: first_scientific_bootstrap/
          if-no-files-found: error
          retention-days: 14
