name: Interface Repair V2 preflight
on:
  push:
    branches: [experiment-interface-repair-v2]
    paths:
      - configs/experiments/interface_repair_v2.launch.json
permissions: {contents: read}
concurrency:
  group: interface-repair-v2-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[launch-interface-repair-v2-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:scripts
      HEPHAESTUS_INTERFACE_REPAIR_RUN_ID: interface-repair-v2-preflight-${{ github.run_id }}
      HEPHAESTUS_INTERFACE_REPAIR_V2_AUTHORIZED: LAUNCH_INTERFACE_REPAIR_V2_PREFLIGHT
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Verify explicit V2 preflight authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/experiments/hephaestus_interface_repair_v2.json').read_text())
          marker=json.loads(Path('configs/experiments/interface_repair_v2.launch.json').read_text())
          expected=[
              'NVIDIA A40',
              'NVIDIA RTX PRO 6000 Blackwell Server Edition',
              'NVIDIA RTX PRO 6000 Blackwell Workstation Edition',
          ]
          assert cfg['governance']['paid_preflight_allowed'] is True
          assert cfg['governance']['paid_full_launch_allowed'] is False
          assert marker['preflight_authorized'] is True
          assert marker['full_launch_authorized'] is False
          assert cfg['execution']['preferred_gpu_type_id']=='NVIDIA A40'
          assert cfg['execution']['gpu_type_ids']==expected
          assert cfg['execution']['compatible_fallback_gpu_type_ids']==expected[1:]
          assert cfg['execution']['capacity_fallback_policy']=='preferred_then_cheapest_compatible'
          assert cfg['execution']['minimum_gpu_memory_gib']==44
          assert cfg['execution']['hard_wall_seconds_preflight']==600
          assert cfg['execution']['hard_wall_seconds_per_role']==3600
          assert cfg['preflight']['maximum_projected_role_seconds']==3600
          assert cfg['preflight']['maximum_projected_role_seconds'] <= cfg['execution']['hard_wall_seconds_per_role']
          assert cfg['execution']['max_hourly_usd_per_pod']==2.20
          assert cfg['execution']['max_estimated_total_usd_preflight']==0.37
          PY
      - run: python scripts/launch_interface_repair_v2.py --preflight --execute
