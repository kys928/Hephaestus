name: CPU research roles and real tiny PEFT (nonproduction)
on:
  push:
    branches: [feature/cpu-real-roles-45-smoke-20261025]
  pull_request:
    paths:
      - 'src/hephaestus/llm/cpu_research_smoke.py'
      - 'tests/test_cpu_real_role_weights.py'
      - '.github/workflows/cpu-real-five-role-and-peft-smoke.yml'
permissions: {contents: read}
jobs:
  tiny-actual-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual Torch PEFT and Transformers packages
        run: python -m pip install -e '.[peft-training,test]'
      - name: Exercise five genuinely trained tiny CPU role weight predictions
        env:
          HEPHAESTUS_CPU_ROLE_SMOKE_REPORT: evidence/cpu-research-roles.json
        run: pytest -q -m real_cpu tests/test_cpu_real_role_weights.py -rs
      - name: Verify first five genuine content-addressed staged operations
        env:
          HEPHAESTUS_CPU_STAGED_ENTRY_REPORT: evidence/cpu-staged-prefix.json
        run: pytest -q tests/test_staged_real_core_science.py -rs
      - name: Execute real training, checkpoint, generation, comparison and Judge
        env:
          HEPHAESTUS_CPU_CAMPAIGN_REPORT: evidence/cpu-real-peft-and-judge.json
        run: pytest -q -m real_cpu tests/test_staged_verified_training_finalization.py -rs
      - name: Upload separated CPU scientific-scope receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-real-roles-and-peft-separated-evidence
          path: evidence/*.json
          if-no-files-found: warn
          retention-days: 14
