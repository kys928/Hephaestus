name: Diagnostic Scaling Recovery V1 paid cohort

on:
  push:
    branches: [experiment-diagnostic-scaling-v1]

permissions:
  contents: read

concurrency:
  group: diagnostic-scaling-recovery-v1-paid
  cancel-in-progress: false

jobs:
  authorize-and-admit:
    if: contains(github.event.head_commit.message, '[launch-diagnostic-scaling-recovery-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      models: ${{ steps.scope.outputs.models }}
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_XET: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      HEPHAESTUS_DIAGNOSTIC_SCALING_RECOVERY_LAUNCH_AUTHORIZED: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require new explicit recovery authorization state
        id: scope
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          marker_path = Path('configs/experiments/diagnostic_scaling_recovery_v1.launch.json')
          if not marker_path.is_file():
              raise SystemExit('recovery launch marker is absent')
          marker = json.loads(marker_path.read_text(encoding='utf-8'))
          contract = json.loads(Path('configs/experiments/hephaestus_diagnostic_scaling_recovery_v1.json').read_text(encoding='utf-8'))

          assert marker.get('authorized') is True
          assert marker.get('protocol_id') == 'hephaestus_diagnostic_scaling_recovery_v1'
          assert marker.get('authorization_source') == 'user_directive'
          assert contract['governance']['paid_launch_allowed_now'] is True
          assert contract['governance']['paid_launch_requires_new_explicit_user_go'] is True
          assert contract['governance']['promotion_allowed'] is False
          assert contract['governance']['lineage_mutation_allowed'] is False

          models = marker.get('authorized_models')
          if not isinstance(models, list) or not models or len(models) != len(set(models)):
              raise SystemExit('launch marker must contain a non-empty unique authorized_models list')
          cohort = {row['model_id'] for row in contract['candidates']}
          unknown = [model for model in models if model not in cohort]
          if unknown:
              raise SystemExit('launch marker contains model outside frozen recovery cohort: '+repr(unknown))

          unfinished = {
              'zai-org/GLM-4.7-Flash',
              'Qwen/Qwen3-30B-A3B-Thinking-2507',
          }
          if any(model not in unfinished for model in models):
              raise SystemExit('launch marker attempts to rerun an already completed candidate')

          if 'zai-org/GLM-4.7-Flash' in models:
              funnel = marker.get('glm_screening_funnel') or {}
              if funnel.get('required') is not True:
                  raise SystemExit('GLM full recovery requires the screening funnel gate')
              if not str(funnel.get('cheap_screen_result_key') or '').strip():
                  raise SystemExit('GLM full recovery lacks an explicit cheap-screen result key')
              if funnel.get('tiny_adaptation_required_before_full_recovery') is not True:
                  raise SystemExit('GLM full recovery may not bypass tiny adaptation')
              if not str(funnel.get('tiny_adaptation_result_key') or '').strip():
                  raise SystemExit('GLM full recovery lacks an explicit tiny-adaptation result key')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('models='+json.dumps(models, separators=(',', ':'))+'\n')
          print(json.dumps({'marker': marker, 'authorized_models': models, 'paid_launch_allowed_now': True}, sort_keys=True))
          PY

      - name: Install exact recovery dependencies
        run: |
          python -m pip install -e '.[s3,test]' \
            'transformers==5.17.0' \
            'accelerate==1.15.0' \
            'safetensors==0.8.0' \
            'huggingface-hub==1.31.0' \
            'peft==0.20.0'

      - name: Require passed GLM screening funnel before full recovery
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          marker = json.loads(Path('configs/experiments/diagnostic_scaling_recovery_v1.launch.json').read_text(encoding='utf-8'))
          models = marker.get('authorized_models') or []
          if 'zai-org/GLM-4.7-Flash' not in models:
              print('GLM screening funnel not applicable to this launch.')
              raise SystemExit(0)

          sys.path.insert(0, 'scripts')
          import run_diagnostic_scaling_v1 as base

          funnel = marker['glm_screening_funnel']
          client = base.s3_client()

          cheap_key = str(funnel['cheap_screen_result_key'])
          cheap = json.loads(base.read_s3(client, cheap_key))
          if cheap.get('result_version') != 'hephaestus-glm-cheap-screen.v1':
              raise SystemExit('GLM cheap-screen result schema mismatch')
          if cheap.get('status') != 'completed' or cheap.get('advance_to_tiny_adaptation') is not True:
              raise SystemExit('GLM cheap screen did not authorize progression to tiny adaptation')
          if cheap.get('model_id') != 'zai-org/GLM-4.7-Flash' or cheap.get('revision') != '7dd20894a642a0aa287e9827cb1a1f7f91386b67':
              raise SystemExit('GLM cheap-screen result identity mismatch')
          if cheap.get('training_performed') is not False or cheap.get('screening_only') is not True:
              raise SystemExit('GLM cheap-screen result has invalid scientific scope')

          tiny_key = str(funnel['tiny_adaptation_result_key'])
          tiny = json.loads(base.read_s3(client, tiny_key))
          if tiny.get('status') != 'completed' or tiny.get('advance_to_full_recovery') is not True:
              raise SystemExit('GLM tiny adaptation did not authorize full recovery')
          if tiny.get('model_id') != 'zai-org/GLM-4.7-Flash' or tiny.get('revision') != '7dd20894a642a0aa287e9827cb1a1f7f91386b67':
              raise SystemExit('GLM tiny-adaptation result identity mismatch')

          print(json.dumps({
              'glm_screening_funnel': 'passed',
              'cheap_screen_result_key': cheap_key,
              'tiny_adaptation_result_key': tiny_key,
          }, sort_keys=True))
          PY

      - name: Re-run exact recovery gates on launch commit
        run: |
          python -m py_compile \
            scripts/validate_diagnostic_scaling_recovery_v1.py \
            scripts/preflight_diagnostic_scaling_recovery_v1.py \
            scripts/run_diagnostic_scaling_recovery_v1.py \
            scripts/launch_diagnostic_scaling_recovery_v1.py
          python -m pytest -q \
            tests/test_diagnostic_scaling_recovery_v1_contract.py \
            tests/test_diagnostic_scaling_recovery_v1_runtime.py \
            tests/test_diagnostic_scaling_recovery_v1_launcher.py \
            tests/test_diagnostic_scaling_recovery_v1_preflight.py
          python scripts/validate_diagnostic_scaling_recovery_v1.py --remote
          python scripts/preflight_diagnostic_scaling_recovery_v1.py --persist-launch-admission

      - name: Preserve exact paid-launch admission
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-scaling-recovery-v1-paid-admission
          path: |
            configs/experiments/diagnostic_scaling_recovery_v1.launch.json
            configs/experiments/hephaestus_diagnostic_scaling_recovery_v1.json
            diagnostic_scaling_recovery_validation.json
            diagnostic_scaling_recovery_preflight/
          if-no-files-found: error
          retention-days: 90

  launch-model:
    needs: authorize-and-admit
    if: needs.authorize-and-admit.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: ${{ fromJSON(needs.authorize-and-admit.outputs.models) }}
    runs-on: ubuntu-latest
    timeout-minutes: 430
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      HEPHAESTUS_DIAGNOSTIC_SCALING_RECOVERY_LAUNCH_AUTHORIZED: 'YES'
      HEPHAESTUS_DIAGNOSTIC_SCALING_ALLOW_EXPENSIVE_GPU: 'YES'
      HEPHAESTUS_DS_RUN_ID: diagnostic-scaling-recovery-v1-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governed recovery launcher dependencies
        run: python -m pip install -e '.[s3]'
      - name: Launch and independently verify one ephemeral recovery candidate
        run: python scripts/launch_diagnostic_scaling_recovery_v1.py --model-id '${{ matrix.model }}' --execute
      - name: Preserve compact recovery launcher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-scaling-recovery-v1-${{ strategy.job-index }}-launcher
          path: diagnostic_scaling_recovery_launcher_*.json
          if-no-files-found: warn
          retention-days: 90