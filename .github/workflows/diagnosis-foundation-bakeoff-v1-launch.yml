name: Diagnosis Foundation Bakeoff V1 paid launch
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths: [configs/experiments/diagnosis_foundation_bakeoff_v1.launch.json]
permissions:
  contents: read
concurrency:
  group: diagnosis-foundation-bakeoff-v1-paid
  cancel-in-progress: false
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[launch-diagnosis-foundation-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {PYTHONPATH: src}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test,s3]'
      - name: Require bounded user authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('configs/experiments/diagnosis_foundation_bakeoff_v1.launch.json').read_text())
          c=json.loads(Path('configs/experiments/hephaestus_diagnosis_foundation_bakeoff_v1.json').read_text())
          assert m['authorized'] is True
          assert m['protocol_id']==c['protocol_id']
          assert m['launch_scope']=='single_bounded_zero_shot_bakeoff'
          assert m['authorization_source']=='user_directive'
          assert c['governance']['stage1_authorized'] is True
          assert c['stage2_plan']['paid_launch_allowed_now'] is False
          PY
      - run: python scripts/validate_diagnosis_foundation_bakeoff_v1.py
      - run: python scripts/launch_diagnosis_foundation_bakeoff_v1.py
  launch:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      HEPHAESTUS_DIAG_FOUNDATION_LAUNCH_AUTHORIZED: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/launch_diagnosis_foundation_bakeoff_v1.py --execute
