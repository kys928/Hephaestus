name: Hephaestus recover Global Volume evidence from Czech S3 (v2, source-parity receipt)
on:
  push:
    branches: [ops/global-volume-recovery-20261112]
    paths:
      - .github/workflows/hephaestus-global-recovery-run.yml
permissions:
  contents: read
concurrency:
  group: hephaestus-global-recovery-run
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts before any Pod allocation
        run: |
          python -m py_compile scripts/hephaestus_global_s3_evidence_worker.py
          python -m py_compile scripts/hephaestus_global_recovery_controller.py
      - name: Install off-Pod S3 transport
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Budget-gated launch, monitor, receipt, and teardown
        run: python -u scripts/hephaestus_global_recovery_controller.py
  cleanup:
    if: ${{ always() }}
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Independently terminate ONLY this exact recovery Pod if still present
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get('RUNPOD_API_KEY','')
          run_id=os.environ['GITHUB_RUN_ID']
          if not token or not run_id.isdigit():raise SystemExit('No authenticated cleanup access')
          name='hephaestus-hf-global-recovery-'+run_id
          base='https://api.runpod.io/v2'
          def request(method,path):
              req=urllib.request.Request(base+path,method=method,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=35) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else {}
          result=request('GET','/pods')
          rows=result if isinstance(result,list) else result.get('pods',result.get('data',[]))
          if not isinstance(rows,list):raise SystemExit('Unsafe Pod inventory response')
          matches=[p for p in rows if isinstance(p,dict) and p.get('name')==name]
          if len(matches)>1:raise SystemExit('Duplicate recovery Pod names: human reconciliation required')
          if matches:
              podid=matches[0].get('id')
              if not isinstance(podid,str) or not podid:raise SystemExit('Unexpected Pod identity')
              try:request('DELETE','/pods/'+podid)
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              print('INDEPENDENT_RECOVERY_POD_DELETE_REQUESTED=true')
          else:print('NO_RECOVERY_POD_REMAINING=true')
          PY
