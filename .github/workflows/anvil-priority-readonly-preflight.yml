name: Anvil priority read-only preflight
on:
  pull_request:
    paths:
      - .github/workflows/anvil-priority-readonly-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/anvil-integration' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/anvil_priority_model_manifest.py | tee priority-models.json
        shell: bash
      - name: Observe authenticated price and availability
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PYTHONPATH: src
        run: python scripts/anvil_readonly_gpu_quote.py | tee priority-quote.json
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: priority-readonly-preflight
          path: |
            priority-models.json
            priority-quote.json
