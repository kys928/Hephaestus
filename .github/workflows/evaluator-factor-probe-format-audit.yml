name: Evaluator factor-only saved-output format autopsy (read only)
on:
  push:
    branches: [diagnostic/evaluator-factor-probe-protocol-v1]
permissions:
  contents: read
jobs:
  inspect-raw:
    if: contains(github.event.head_commit.message, '[audit-factor-output-format-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts:src:.
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/audit_evaluator_factor_probe_failures.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluator-factor-64-format-postmortem
          path: evaluator-factor-probe-format-postmortem.json
