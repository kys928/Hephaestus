name: Read current first training log

on:
  push:
    branches: [feature/first-bounded-scientific-training]
    paths:
      - .github/workflows/read-current-first-training-log.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Read current persisted Pod log
        run: |
          python - <<'PY'
          import os
          import boto3
          from botocore.config import Config
          key='hephaestus/scientific/v1/executions/first-bounded-scientific-training-001-33866198758/pod_runtime.log'
          client=boto3.client('s3', endpoint_url=os.environ['RUNPOD_S3_ENDPOINT_URL'].rstrip('/'), region_name=os.environ['RUNPOD_DATACENTER_ID'], aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'], config=Config(retries={'mode':'standard','max_attempts':10}))
          try:
              body=client.get_object(Bucket=os.environ['RUNPOD_NETWORK_VOLUME_ID'],Key=key)['Body']
          except Exception as exc:
              print('LOG_NOT_PRESENT', type(exc).__name__)
              raise SystemExit(0)
          raw=body.read(); body.close()
          print(raw.decode('utf-8', errors='replace')[-16000:])
          PY
