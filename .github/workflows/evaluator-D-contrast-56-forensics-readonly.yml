name: D 56-output literal prompt and model decision forensics (CPU S3 READ ONLY)
on:
  push:
    branches: [diagnostic/D-contrast-56-output-forensics-20261023]
permissions:
  contents: read
jobs:
  forensic-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts:src:.
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU and S3 read-only analysis dependencies
        run: python -m pip install -e '.[s3,test]'
      - name: Check code compiles and execute read-only scientific forensics
        run: |
          python -m py_compile scripts/forensic_D_contrast_56_readonly.py
          python scripts/forensic_D_contrast_56_readonly.py
      - name: Preserve complete evidence, confusion and source observations
        uses: actions/upload-artifact@v4
        with:
          name: D-contrast-56-prompt-label-model-forensics
          path: D-contrast-56-forensic/
          if-no-files-found: error
          retention-days: 90
