name: Forensically inspect unexpected original CUDA45 r7 S3 namespace (read-only)
on:
  push:
    branches: [feature/cuda45-r7-rtx3090-fallback-20261030]
    paths: ['.github/workflows/audit-existing-r7-namespace-readonly.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q 'boto3>=1.35,<2'
      - name: List namespace, cold verify immutable manifest and native state without mutation
        run: |
          python - <<'PY'
          import boto3,hashlib,json,os,re,sqlite3,tempfile
          from pathlib import Path
          from botocore.exceptions import ClientError
          assert os.environ["RUNPOD_NETWORK_VOLUME_ID"]=="cviwpryzao"
          assert os.environ["RUNPOD_DATACENTER_ID"]=="EU-CZ-1"
          assert "s3api-eu-cz-1.runpod.io" in os.environ["RUNPOD_S3_ENDPOINT_URL"]
          bucket="cviwpryzao"
          wf="cuda-json-45-original-five-20261030-r7"
          run="cuda-json-45-new-1117-r7"
          prefix="hephaestus/scientific/original_cuda_45/"+wf+"/"
          s3=boto3.client("s3",endpoint_url=os.environ["RUNPOD_S3_ENDPOINT_URL"],
            region_name="eu-cz-1",
            aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"])
          objects={}
          for page in s3.get_paginator("list_objects_v2").paginate(Bucket=bucket,Prefix=prefix):
              for x in page.get("Contents",[]):
                  rel=x["Key"][len(prefix):]
                  if not rel or rel.startswith("/") or rel in objects:raise PermissionError("invalid S3 key")
                  objects[rel]=x
          print("R7_NAMESPACE_EXISTS="+str(bool(objects)).lower())
          print("R7_NAMESPACE_OBJECT_COUNT="+str(len(objects)))
          print("R7_NAMESPACE_FIRST_UPLOAD_UTC="+str(min((x["LastModified"] for x in objects.values()),default="none")))
          def get(rel):
              if rel not in objects:return None
              return s3.get_object(Bucket=bucket,Key=prefix+rel)["Body"].read()
          raw=get("_fresh_admission_manifest.json")
          print("R7_PREPARED_MANIFEST_PRESENT="+str(raw is not None).lower())
          status="missing"
          requested=None
          if raw is not None:
              try:
                  j=json.loads(raw)
                  files=j.get("source_files_sha256")
                  assert isinstance(files,dict) and files
                  assert j.get("schema")=="fresh-original-cuda45-prepared.v1"
                  assert j.get("workflow_id")==wf and j.get("run_id")==run
                  assert j.get("native_operations_completed")==0
                  assert j.get("gpu_optimizer_steps_completed")==0
                  assert j.get("operator_signature_present") is False
                  assert all(re.fullmatch(r"[0-9a-f]{64}",v) for v in files.values())
                  expected=set(files)|{"_fresh_admission_manifest.json"}
                  print("R7_SEALED_SOURCE_FILE_COUNT="+str(len(files)))
                  print("R7_MISSING_SEALED_SOURCE_FILES="+str(len(expected-set(objects))))
                  print("R7_UNEXPECTED_EXTRA_OBJECTS="+str(len(set(objects)-expected)))
                  if expected==set(objects):
                      for rel,dig in files.items():
                          val=get(rel)
                          if hashlib.sha256(val).hexdigest()!=dig:raise PermissionError("sealed source drift")
                          if rel.startswith("artifacts/objects/sha256/") and val and rel.rsplit("/",1)[-1]!=dig:
                              raise PermissionError("content-addressed source drift")
                      status="verified_complete"
                  else:status="partial_or_altered"
              except Exception as e:
                  print("R7_MANIFEST_VERIFICATION_EXCEPTION="+type(e).__name__)
                  status="invalid"
          print("R7_SEALED_SOURCE_STATUS="+status)
          req=get("cuda-grant-unsigned-request.json")
          if req is not None:
              requested=json.loads(req)
              print("R7_UNSIGNED_REQUEST_SCOPE_MATCH="+str(
                  requested.get("workflow_id")==wf and requested.get("run_id")==run and
                  requested.get("status")=="requested" and len(requested.get("operations",{}))==9).lower())
              print("R7_SOURCE_POLICY_REF="+str(requested.get("source_policy_ref","unknown"))[:80])
              print("R7_TRAINABLE_REF="+str(requested.get("reviewed_trainable_ref","unknown"))[:80])
              if raw is not None and requested is not None:
                  print("R7_MANIFEST_SCOPE_MATCH="+str(
                    j.get("source_policy_ref")==requested.get("source_policy_ref") and
                    j.get("reviewed_trainable_ref")==requested.get("reviewed_trainable_ref")).lower())
          db=get("state.sqlite")
          print("R7_NATIVE_SQLITE_PRESENT="+str(db is not None).lower())
          if db is not None:
              with tempfile.TemporaryDirectory() as td:
                  path=Path(td)/"state.sqlite";path.write_bytes(db)
                  con=sqlite3.connect("file:"+str(path)+"?mode=ro",uri=True)
                  try:
                      ok=con.execute("PRAGMA quick_check").fetchone()[0]
                      rows=con.execute("SELECT collection,payload_json FROM state_records ORDER BY sequence").fetchall()
                  finally:con.close()
              states=[json.loads(v) for k,v in rows if k=="staged_workflow_states"]
              state=states[-1] if states else {}
              print("R7_SQLITE_QUICK_CHECK="+str(ok))
              print("R7_STATE_MATCHES_NEW_SCOPE="+str(state.get("workflow_id")==wf and state.get("run_id")==run).lower())
              print("R7_STATE_STATUS="+str(state.get("status"))[:60])
              print("R7_STATE_COMPLETION_MARKER="+str(state.get("completion_marker"))[:12])
              print("R7_STATE_COMPLETED_STEPS="+str(sum(x.get("completion_marker") is True for x in state.get("steps",{}).values())))
              print("R7_NATIVE_RECORD_COUNT="+str(sum(k=="staged_workflow_records" for k,_ in rows)))
              print("R7_OPTIMIZER_RECEIPT_COUNT="+str(sum(k=="cuda_target_optimizer_steps" for k,_ in rows)))
          print("R7_TEMPORARY_WORKER_LOG_COUNT="+str(sum(rel.startswith("worker_stdout") for rel in objects)))
          print("R7_S3_MUTATIONS_PERFORMED=0")
          print("GPU_PODS_ALLOCATED=0")
          PY
