name: Prometheus Unbound one-shot bounded Global CUDA science
on:
  push:
    branches: [ops/prometheus-unbound-global-20261114]
    paths: [.github/workflows/prometheus-global-launch.yml]
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: prometheus-unbound-global-20261114-single-launch
  cancel-in-progress: false
jobs:
  cuda-science:
    if: ${{ github.repository == 'kys928/Hephaestus' && github.event.head_commit.message == 'PROMETHEUS_UNBOUND_ARM_LAUNCH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PROMETHEUS_GLOBAL_CAMPAIGN: prometheus-unbound-global-20261114-01
      PROMETHEUS_SOURCE_SHA: 1686293b99b38e3c4abcbaa85623db4351d51fb0
      PROMETHEUS_GLOBAL_APPROVED: single-bounded-science-20261114
      PROMETHEUS_ACTION_LOG: /tmp/prometheus-logs/launcher.jsonl
      PROMETHEUS_LOG_LABEL: GPU-launcher
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1686293b99b38e3c4abcbaa85623db4351d51fb0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish start GitHub Actions run locator to Prometheus PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_LABEL: start
          JOB_RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url="https://github.com/kys928/Hephaestus/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          status=os.environ["STATUS_LABEL"]
          result=os.environ["JOB_RESULT"] if status=="completion" else "started"
          label=os.environ.get("PROMETHEUS_LOG_LABEL","prometheus")
          body=f"Prometheus {label}: {status} ({result}) — {url}. Run ID {os.environ['GITHUB_RUN_ID']}; no scientific result implied."
          req=urllib.request.Request("https://api.github.com/repos/kys928/Hephaestus/issues/206/comments",
            data=json.dumps({"body":body}).encode(),method="POST",
            headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                     "Content-Type":"application/json","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=25) as response:
              print("PROMETHEUS_ACTION_RUN_LINK_PUBLISHED="+str(response.status==201))
          PY
      - name: Reject unpinned research source before Python/RunPod
        run: test "$(git rev-parse HEAD)" = "$PROMETHEUS_SOURCE_SHA"
      - run: python -m pip install '.[test,s3]' requests
      - name: Compile all deployment and scientific decision paths before money is spent
        run: |
          python -m compileall -q src/hephaestus/development
          python -m py_compile tests/test_prometheus_global_supervised_launch.py
          python -m py_compile tests/test_prometheus_global_adapter_source.py
      - name: Run isolated offline negative-path and scientific admission checks
        run: |
          pytest -q tests/test_prometheus_global_supervised_launch.py tests/test_prometheus_global_adapter_source.py tests/test_prometheus_gpu_provider_guard.py tests/test_prometheus_scientific_decision.py
      - name: Retrieve immutable historical source reports and execute one supervised original CUDA research decision
        run: python -u -m hephaestus.development.prometheus_global_launcher
      - name: Publish launcher timeline in the GitHub Actions run summary
        if: ${{ always() }}
        run: |
          PYTHONPATH=src python -m hephaestus.development.prometheus_global_observability summary --path "$PROMETHEUS_ACTION_LOG" --job launcher >> "$GITHUB_STEP_SUMMARY"
      - name: Archive metadata-only launcher timeline (30 days)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-global-launcher-metadata
          path: /tmp/prometheus-logs/launcher.jsonl
          retention-days: 30
          if-no-files-found: warn
      - name: Publish completion GitHub Actions run locator to Prometheus PR
        continue-on-error: true
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_LABEL: completion
          JOB_RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url="https://github.com/kys928/Hephaestus/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          status=os.environ["STATUS_LABEL"]
          result=os.environ["JOB_RESULT"] if status=="completion" else "started"
          label=os.environ.get("PROMETHEUS_LOG_LABEL","prometheus")
          body=f"Prometheus {label}: {status} ({result}) — {url}. Run ID {os.environ['GITHUB_RUN_ID']}; no scientific result implied."
          req=urllib.request.Request("https://api.github.com/repos/kys928/Hephaestus/issues/206/comments",
            data=json.dumps({"body":body}).encode(),method="POST",
            headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                     "Content-Type":"application/json","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=25) as response:
              print("PROMETHEUS_ACTION_RUN_LINK_PUBLISHED="+str(response.status==201))
          PY
  cleanup:
    if: ${{ always() && github.event.head_commit.message == 'PROMETHEUS_UNBOUND_ARM_LAUNCH' }}
    needs: cuda-science
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      PROMETHEUS_GLOBAL_CAMPAIGN: prometheus-unbound-global-20261114-01
      PROMETHEUS_SOURCE_SHA: 1686293b99b38e3c4abcbaa85623db4351d51fb0
      PROMETHEUS_ACTION_LOG: /tmp/prometheus-logs/cleanup.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1686293b99b38e3c4abcbaa85623db4351d51fb0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Independent end-of-job exact Pod cleanup (never touch unrelated Pods)
        run: |
          python - <<'PY'
          import os,time
          from hephaestus.development.prometheus_global_supervision import (
            campaign_prefix, matching_pods, delete_exact_pod)
          from hephaestus.development.prometheus_global_observability import event
          event("cleanup","START","start")
          try:
              key=campaign_prefix(os.environ["PROMETHEUS_GLOBAL_CAMPAIGN"],
                                  os.environ["PROMETHEUS_SOURCE_SHA"])
              for _ in range(4):
                  matches=matching_pods(key)
                  if not matches:
                      event("cleanup","CLEANUP_CONFIRMED","pass")
                      print("PROMETHEUS_GLOBAL_CLEANUP_POD_ABSENT=true",flush=True)
                      break
                  event("cleanup","CLEANUP_REQUESTED","progress",pod_id=matches[0]["id"])
                  delete_exact_pod(matches[0],key)
                  time.sleep(4)
              else:
                  if matching_pods(key):
                      raise RuntimeError("One-shot Pod remains after exact cleanup attempts")
                  event("cleanup","CLEANUP_CONFIRMED","pass")
          except Exception as exc:
              event("cleanup","FAILED","fail",reason_code=type(exc).__name__)
              raise SystemExit(1) from None
          PY
      - name: Publish exact-Pod cleanup result in GitHub Actions summary
        if: ${{ always() }}
        run: |
          PYTHONPATH=src python -m hephaestus.development.prometheus_global_observability summary --path "$PROMETHEUS_ACTION_LOG" --job cleanup >> "$GITHUB_STEP_SUMMARY"
      - name: Archive metadata-only cleanup timeline (30 days)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-global-cleanup-metadata
          path: /tmp/prometheus-logs/cleanup.jsonl
          retention-days: 30
          if-no-files-found: warn
