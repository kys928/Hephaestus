name: Phase II Interface Mastery paid launch
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Exact launch phrase required'
        required: true
        type: string
permissions: {contents: read}
concurrency:
  group: phase-ii-interface-mastery-paid
  cancel-in-progress: false
jobs:
  launch:
    if: ${{ inputs.confirm == 'LAUNCH_PHASE_II_INTERFACE_MASTERY_V1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      PYTHONPATH: src:scripts
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      HEPHAESTUS_PHASE_II_LAUNCH_AUTHORIZED: 'LAUNCH_PHASE_II_INTERFACE_MASTERY_V1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Require frozen authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/experiments/hephaestus_interface_mastery_v1.json').read_text())
          marker=json.loads(Path('configs/experiments/interface_mastery_v1.launch.json').read_text())
          assert cfg['pack']['canonical_sha256']=='2d712d7bdd9dc51dfefc677389aca97ce80e64c4825df38243bc0d6cfe13bad0'
          assert cfg['role_stack']['required_source_run_id']=='role-mastery-v1-35596791201'
          assert cfg['governance']['paid_launch_allowed'] is True
          assert cfg['governance']['weights_mutation_allowed'] is False
          assert cfg['governance']['production_promotion_allowed'] is False
          assert cfg['governance']['automatic_role_dispatch_allowed'] is False
          assert marker['authorized'] is True
          assert marker['authorization_phrase']=='LAUNCH_PHASE_II_INTERFACE_MASTERY_V1'
          assert marker['authorized_by']
          assert marker['authorized_at']
          PY
      - run: python scripts/build_interface_mastery_v1.py
      - run: python scripts/launch_interface_mastery_v1.py --execute