name: Verify original Tier A CUDA research handoff without GPU
on:
  push:
    branches: [feature/tier-a-original-cuda-native-role-stage-20261028]
  pull_request:
    paths:
      - 'src/hephaestus/production/tier_a_cuda_research.py'
      - 'src/hephaestus/production/tier_a_cuda_role_stages.py'
      - 'tests/test_tier_a_cuda_research.py'
      - 'tests/test_tier_a_cuda_role_stages.py'
permissions:
  contents: read
  actions: read
jobs:
  original-source-and-role-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_tier_a_cuda_research.py tests/test_tier_a_cuda_role_stages.py
      - run: python -m py_compile scripts/verify_original_tier_a_cuda_handoff.py src/hephaestus/production/tier_a_cuda_research.py src/hephaestus/production/tier_a_cuda_role_stages.py
