name: Prometheus Unbound semantic diagnosis admission audit (private read-only)
on:
  push:
    branches: [ops/prometheus-evidence-calibration-gpu-20261114]
    paths: [.github/workflows/prometheus-global-semantic-admission-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aeca3f49119d2c3cf205cb2cad47f7708657aa22
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[s3]'
      - name: Compare admitted real Diagnostician decision against independent deterministic hypotheses
        run: |
          python - <<'PY'
          import json,hashlib
          from hephaestus.development.prometheus_global_supervision import campaign_prefix,get_bytes,s3_client,verify_manifest
          from hephaestus.policy.model_proposals import DIAGNOSIS_DOMAINS
          prefix=campaign_prefix("prometheus-unbound-global-20261114-03","aeca3f49119d2c3cf205cb2cad47f7708657aa22")
          s3=s3_client(); manifest=verify_manifest(s3,prefix)
          refs=[f["path"] for f in manifest["files"] if f["path"].startswith("output/cycle/decision/inference-receipts/objects/sha256/")]
          found=[]
          for ref in refs:
              body=get_bytes(s3,prefix+"/result/files/"+ref,3000000); d=json.loads(body)
              if d.get("schema")!="role-inference.v1":continue
              answer=d.get("answer") or json.loads(d["raw_output"])
              found.append({
                "role":d.get("role"),"status":d.get("status"),
                "decision":answer.get("decision"),"action":answer.get("action"),
                "primary_variable":answer.get("primary_variable"),
                "confidence":answer.get("confidence"),
                "cited_source_count":len(answer.get("evidence_refs",[])),
                "decision_has_supported_failure_domain":answer.get("decision") in DIAGNOSIS_DOMAINS,
                "receipt_sha256":hashlib.sha256(body).hexdigest(),
              })
          p=json.loads(get_bytes(s3,prefix+"/result/files/output/cycle/decision/precommit.json",500000))
          diagnosis=p.get("diagnosis",{})
          hypotheses=diagnosis.get("hypotheses",[])
          offered=[]
          for h in hypotheses:
              offered.append({
                "failure_domain":h.get("failure_domain"),
                "confidence":h.get("confidence"),
                "supporting_refs":len(h.get("supporting_evidence_refs",[])),
                "contradicting_refs":len(h.get("contradicting_evidence_refs",[])),
              })
          print("PROMETHEUS_SEMANTIC_ADMISSION="+json.dumps({
            "schema":"prometheus-semantic-admission-audit.v1",
            "observed_model_outputs":found,
            "deterministic_hypotheses":offered,
            "diagnosis_status":diagnosis.get("status"),
            "inconclusive_was_allowed":True,
            "planner_receipt_present":any(x.get("role")=="planner" for x in found),
            "training_executed":False,
            "independent_holdout_accessed":False,
          },sort_keys=True),flush=True)
          PY
