name: Durable multicycle scientific campaign (CPU)
on:
  push:
    branches: [feature/durable-multicycle-campaign-20261025]
  pull_request:
    paths:
      - 'src/hephaestus/production/loop.py'
      - 'src/hephaestus/production/staged_driver.py'
      - 'tests/test_durable_multicycle_campaign.py'
      - '.github/workflows/durable-multicycle-campaign-cpu.yml'
permissions: {contents: read}
jobs:
  control-flow-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU tests only
        run: python -m pip install -e '.[test]'
      - name: Prove three staged cycles, evidence history and process rebuild
        run: pytest -q tests/test_durable_multicycle_campaign.py
      - name: Full CPU regression suite
        run: pytest -q tests/
