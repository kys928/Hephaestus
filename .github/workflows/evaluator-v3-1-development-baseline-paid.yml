name: Evaluator V3.1 development baseline paid

on:
  push:
    branches:
      - diagnostic/evaluator-sealed-v1-autopsy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    if: >-
      contains(github.event.head_commit.message, '[launch-evaluator-v3-1-dev-baseline]')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
      HEPHAESTUS_EVALUATOR_DEV_BASELINE_AUTHORIZED: LAUNCH_HEPHAESTUS_EVALUATOR_V3_1_DEV_BASELINE
      HEPHAESTUS_EVALUATOR_DEV_BASELINE_RUN_ID: evaluator-v3-1-dev-baseline-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]'
      - name: Verify inference-only baseline contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/experiments/hephaestus_evaluator_sealed_certification_v1.json').read_text())
          candidate=json.loads(Path('configs/experiments/hephaestus_evaluator_certification_candidate_v1.json').read_text())
          assert cfg['governance']['training_allowed'] is False
          assert cfg['governance']['adapter_mutation_allowed'] is False
          assert cfg['governance']['candidate_weights_mutation_allowed'] is False
          assert cfg['governance']['production_promotion_allowed'] is False
          assert cfg['governance']['automatic_role_dispatch_allowed'] is False
          assert candidate['candidate_id'] == 'evaluator-v3.1-boundary-v1'
          assert candidate['governance']['weights_frozen'] is True
          assert candidate['model']['adapter_sha256'] == '913797ddb8d9d95f83d09a244e8efe430d7bfc4383e589499c2fcc2d943487ed'
          PY
      - name: Launch frozen V3.1 development baseline
        run: python scripts/launch_evaluator_v3_1_development_baseline.py --execute
