name: Frozen immutable candidate GPU smoke

on:
  push:
    branches: [launch/stronger-immutable-candidate-wave]
    paths:
      - .github/workflows/frozen-candidate-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-immutable-candidate-gpu-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      HEPHAESTUS_CANDIDATE_MODEL_ID: ibm-granite/granite-3.3-8b-instruct
      HEPHAESTUS_CANDIDATE_REVISION: 51dd4bc2ade4059a6bd87649d68aa11e4fb2529b
      HEPHAESTUS_CANDIDATE_LICENSE: apache-2.0
      PYTHONPATH: src:scripts
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install launcher dependencies
        run: python -m pip install -e '.[s3]'
      - name: Guard frozen protocol and compile smoke harness
        run: |
          python - <<'PY'
          from pathlib import Path
          from hephaestus.evaluation.pack_loader import load_eval_pack
          expected = 'ee4acffa6d6ac3dadd1705931d65fc02bc4206f2fbddacf71b25af4d1cb5e3ad'
          pack = load_eval_pack('semantic_behavior_v1', config_dir=Path('configs'))
          assert pack['frozen'] is True and pack['content_hash_verified'] is True
          assert pack['content_hash'] == expected
          assert pack['eval_pack']['decoding_config'] == {
              'temperature': 0.0, 'top_p': 1.0, 'max_new_tokens': 96, 'seeds': [11, 29, 47]
          }
          task = pack['eval_pack']['continuation_prompts'][0]
          assert task['task_id'] == 'observatory_continuation'
          assert task['prompt'] == 'The observatory lost power just as the storm arrived.'
          print({'frozen_eval_pack_hash': expected, 'candidate': 'ibm-granite/granite-3.3-8b-instruct'})
          PY
          python -m py_compile scripts/run_frozen_candidate_smoke.py scripts/launch_frozen_candidate_smoke_v2.py
      - name: Launch bounded candidate smoke
        run: python scripts/launch_frozen_candidate_smoke_v2.py
      - name: Upload candidate smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-candidate-smoke
          path: frozen_candidate_smoke.json
          if-no-files-found: warn
          retention-days: 30
