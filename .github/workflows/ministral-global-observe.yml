name: Recover original triad failure evidence and reconcile watchdog
on:
  push:
    branches: [ops/ministral-global-allocation-observe-20261124]
    paths: [.github/workflows/ministral-global-observe.yml]
permissions: {contents: read}
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io
      RUNPOD_API_BASE_URL: https://api.runpod.io/v2
    steps:
      - uses: actions/checkout@v4
        with: {ref: 8cb972a4bc72231a016b2aedcdd3549db872faf4, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Inspect preserved first-start evidence and close reconciled watchdog
        run: |
          python - <<'PY'
          from hephaestus.providers.runpod.config import RunPodConfig
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider
          from hephaestus.providers.runpod.execution import RunPodExecutionAdapter
          from hephaestus.providers.runpod.storage import RunPodNetworkVolumeStorage
          from pathlib import Path
          import os,json,time
          cfg=RunPodConfig.from_env()
          a=RunPodExecutionAdapter(cfg,EnvironmentSecretsProvider(),state_root=Path(os.environ["RUNNER_TEMP"])/"global-readonly")
          tag="45372244159"
          own=[p for p in a.list_pods() if str(p.get("name","")).startswith("hephaestus-ministral-triad-"+tag+"-")]
          print("GLOBAL_TRIAD_LIVE_POD_COUNT="+str(len(own)),flush=True)
          for p in own:
              if p["id"]!="kwg294uf879h8w" or p.get("name")!="hephaestus-ministral-triad-45372244159-global-1":raise PermissionError("unexpected Pod identity; refusing deletion")
              from hephaestus.providers.runpod.execution import RunPodApiError
              try:
                  status,_=a._request("DELETE","pods/"+p["id"])
                  assert status in (200,202,204,404)
              except RunPodApiError as exc:
                  if exc.status_code!=404:raise
              print("FAILED_TRIAD_POD_DELETE_REQUESTED=true",flush=True)
          for _ in range(12):
              own=[p for p in a.list_pods() if str(p.get("name","")).startswith("hephaestus-ministral-triad-"+tag+"-")]
              if not own:break
              time.sleep(5)
          assert not own,"Failed campaign Pod still exists"
          print("FAILED_TRIAD_POD_ABSENCE_CONFIRMED=true",flush=True)
          for pod in own:
              p=a.get_pod(pod["id"])
              print("GLOBAL_TRIAD_PROVIDER="+json.dumps({"id":p.get("id"),"status":p.get("status"),"datacenter":p.get("dataCenterId"),"gpu":p.get("gpu"),"rate":p.get("costPerHr",p.get("cost")),"mounts":p.get("mounts")},sort_keys=True),flush=True)
          s3=RunPodNetworkVolumeStorage.from_boto3(cfg,EnvironmentSecretsProvider()).client
          prefix="hephaestus/operations/ministral-triad/"+tag+"/"
          import io,zipfile,re
          for name in ("worker-phase.json","worker-exit.txt","final-evidence.zip"):
              try:
                  stream=s3.get_object(Bucket=cfg.network_volume_id,Key=prefix+name)["Body"]
                  try:raw=stream.read(8_000_001)
                  finally:stream.close()
              except Exception as exc:
                  if str(getattr(exc,"response",{}).get("Error",{}).get("Code","")) in ("404","NoSuchKey","NotFound"):continue
                  raise
              if name=="final-evidence.zip":
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      print("RECOVERED_EVIDENCE_MEMBERS="+json.dumps(z.namelist()),flush=True)
                      for entry in z.namelist():
                          if entry.endswith("worker-result.json") or entry.endswith("observation.json"):
                              doc=json.loads(z.read(entry))
                              print("RECOVERED_STAGE="+json.dumps({"entry":entry,"status":doc.get("status"),"error_class":doc.get("error_class"),"role":doc.get("role"),"steps":len(doc.get("steps",[])),"model_success_count":doc.get("model_success_count"),"model_id":doc.get("model_id"),"elapsed_seconds":doc.get("elapsed_seconds")}),flush=True)
                          elif entry.startswith("model-artifacts/objects/sha256/"):
                              doc=json.loads(z.read(entry))
                              if isinstance(doc,dict) and ("status" in doc or "error" in doc):
                                  print("RECOVERED_RECEIPT="+json.dumps({"entry":entry,"status":doc.get("status"),"error":str(doc.get("error",""))[:200],"role":doc.get("role"),"model":doc.get("model_id"),"finish_reason":doc.get("finish_reason"),"tokens":len(doc.get("execution",{}).get("generated_token_ids",[])),"output_tail":str(doc.get("raw_output",""))[-1200:],"device":doc.get("execution",{}).get("device")}),flush=True)
              else:print("RECOVERED_"+name+"="+raw.decode()[:300],flush=True)
          assert not own
          s3.put_object(Bucket=cfg.network_volume_id,Key=prefix+"controller-finished.json",Body=json.dumps({"run_tag":tag,"accepted":False,"emergency_cleanup_confirmed":True}).encode())
          for name in ("transport-probe.bin","active-lease.json","attempt-1.zip","attempt-2.zip","worker-exit.txt","final-evidence.zip","controller-finished.json","watchdog-heartbeat.json","worker-phase.json"):
              try:
                  h=s3.head_object(Bucket=cfg.network_volume_id,Key=prefix+name)
              except Exception as exc:
                  if str(getattr(exc,"response",{}).get("Error",{}).get("Code","")) not in {"404","NoSuchKey","NotFound"}:raise
              else:print("GLOBAL_TRIAD_EVIDENCE_PRESENT="+name+" bytes="+str(h["ContentLength"]),flush=True)
          PY
