name: Read-only actual Global triad allocation and evidence observer
on:
  push:
    branches: [ops/ministral-global-allocation-observe-20261124]
    paths: [.github/workflows/ministral-global-observe.yml]
permissions: {contents: read}
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io
      RUNPOD_API_BASE_URL: https://api.runpod.io/v2
    steps:
      - uses: actions/checkout@v4
        with: {ref: 8cb972a4bc72231a016b2aedcdd3549db872faf4, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Read actual provider and immutable current evidence only
        run: |
          python - <<'PY'
          from hephaestus.providers.runpod.config import RunPodConfig
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider
          from hephaestus.providers.runpod.execution import RunPodExecutionAdapter
          from hephaestus.providers.runpod.storage import RunPodNetworkVolumeStorage
          from pathlib import Path
          import os,json,time
          cfg=RunPodConfig.from_env()
          a=RunPodExecutionAdapter(cfg,EnvironmentSecretsProvider(),state_root=Path(os.environ["RUNNER_TEMP"])/"global-readonly")
          tag="45375181356"
          own=[p for p in a.list_pods() if str(p.get("name","")).startswith("hephaestus-ministral-triad-"+tag+"-")]
          print("GLOBAL_TRIAD_LIVE_POD_COUNT="+str(len(own)),flush=True)
          for pod in own:
              p=a.get_pod(pod["id"])
              print("GLOBAL_TRIAD_PROVIDER="+json.dumps({"id":p.get("id"),"status":p.get("status"),"datacenter":p.get("dataCenterId"),"gpu":p.get("gpu"),"rate":p.get("costPerHr",p.get("cost")),"mounts":p.get("mounts")},sort_keys=True),flush=True)
          s3=RunPodNetworkVolumeStorage.from_boto3(cfg,EnvironmentSecretsProvider()).client
          prefix="hephaestus/operations/ministral-triad/"+tag+"/"
          for name in ("transport-probe.bin","active-lease.json","attempt-1.zip","attempt-2.zip","worker-exit.txt","final-evidence.zip","controller-finished.json","watchdog-heartbeat.json","worker-phase.json"):
              try:
                  h=s3.head_object(Bucket=cfg.network_volume_id,Key=prefix+name)
              except Exception as exc:
                  if str(getattr(exc,"response",{}).get("Error",{}).get("Code","")) not in {"404","NoSuchKey","NotFound"}:raise
              else:
                  print("GLOBAL_TRIAD_EVIDENCE_PRESENT="+name+" bytes="+str(h["ContentLength"]),flush=True)
                  if name in ("worker-phase.json","worker-exit.txt"):
                      b=s3.get_object(Bucket=cfg.network_volume_id,Key=prefix+name)["Body"]
                      try: print("GLOBAL_TRIAD_PHASE_RECEIPT="+b.read(300).decode(),flush=True)
                      finally:b.close()
          PY

# Second read-only observation after launch admission.
