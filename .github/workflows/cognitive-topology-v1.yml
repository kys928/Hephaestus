name: Hephaestus cognitive topology V1

on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/cognitive-topology-v1.yml
      - configs/eval_packs/hephaestus_cognitive_topology_v1.json
      - scripts/preflight_cognitive_topology_v1.py
      - scripts/run_cognitive_topology_v1.py
      - scripts/launch_cognitive_topology_v1.py
      - scripts/collect_cognitive_topology_v1.py
      - tests/test_cognitive_topology_v1.py
      - src/hephaestus/providers/models/**
      - src/hephaestus/policy/action_registry.py
      - src/hephaestus/control/semantic_judge.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitive-topology-cviwpryzao
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_XET: '1'
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install immutable admission dependencies
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[s3,test]' 'transformers==5.17.0' 'accelerate>=1,<2' 'safetensors>=0.4,<1'
      - name: Test frozen topology protocol and governance bindings
        run: python -m pytest -q tests/test_cognitive_topology_v1.py tests/test_model_admission.py tests/test_semantic_judge_integration.py tests/test_promotion_reject_rollback_branch_gates.py tests/test_autonomy_boundary_policy.py
      - name: Compile topology adapters
        run: python -m compileall -q scripts/run_cognitive_topology_v1.py scripts/launch_cognitive_topology_v1.py scripts/collect_cognitive_topology_v1.py scripts/preflight_cognitive_topology_v1.py
      - name: Admit all four immutable model identities and persist protocol lock
        run: python scripts/preflight_cognitive_topology_v1.py
      - name: Preserve topology admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-topology-v1-admission
          path: |
            cognitive_topology_preflight/admission.json
            cognitive_topology_preflight/requirements.txt
          if-no-files-found: warn
          retention-days: 90

  prove:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-cognitive-topology-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governed RunPod/S3 launcher
        run: python -m pip install -e '.[s3]'
      - name: Inspect existing Pod inventory
        run: python scripts/collect_cognitive_topology_v1.py --inventory-only
      - name: Execute frozen four-model role cohort
        run: python scripts/launch_cognitive_topology_v1.py | tee cognitive_topology_run.log
      - name: Retrieve Network Volume evidence and independently verify teardown
        if: always()
        run: python scripts/collect_cognitive_topology_v1.py
      - name: Preserve complete cohort evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-topology-v1-evidence
          path: |
            cognitive_topology_evidence/
            cognitive_topology_launcher.json
            cognitive_topology_verification.json
            cognitive_topology_run.log
          if-no-files-found: warn
          retention-days: 90
