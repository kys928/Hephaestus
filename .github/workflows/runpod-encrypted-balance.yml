name: Read live RunPod balance into ephemeral encrypted evidence (no public amounts)
on:
  push:
    branches: ['feature/verify-live-runpod-credentials-20261029']
    paths:
      - '.github/workflows/runpod-encrypted-balance.yml'
permissions:
  contents: read
jobs:
  encrypt-private-balance-readonly:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q cryptography
      - name: Encrypt exact account balance before storing any artifact
        env:
          EPHEMERAL_SESSION_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAm7lHlQ/VPsOm8UBvFEjv
            beg0L2vf8pNSafKF6/kTkQl9d47KQFA1ND/2rvuqe9KRzG4glCzV7BlXcu842Da0
            ewVBzh0qeZXkQnAmMc45UwOKVRi1tLNBuDaBfDdCmugQ1aoFNyQDmOhW12/dKKyJ
            FvxviQfeo1rkT/4ZDm6u5ruW4EzH2DRJZIQn6N8WMsFcZ2QDiv7TAjchtVoArVtX
            VjMLehCuLmMKk8W/t5ew8RTUQJOMZZmu7/VEYrDcZtPg9lzgtG4P79dAn87+fr0t
            SVN3OUgmw9ZZ7HqK6/5dqMxx8h8fc5LY1ARIKJBqT0VA2Kx1woELSYoAesL0saOv
            5rMdX9pJp+nPiewaNkQ1FOoxr6sfkBHxKw4rtngNyKWzqpyYyYbcrP7+qct04D3K
            R3FIJ3K46cMZ7Y3UoMGH4obQToWrAlHqFLwrRYHouJmIHgo+8Cg6R8uCimpkNRPZ
            +okyspjp61LDGQIImdx0zLTrJfXn7BuOmURGxGpZ89PPAgMBAAE=
            -----END PUBLIC KEY-----
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request
          from datetime import datetime,timezone
          from decimal import Decimal
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          api=os.environ.get("RUNPOD_API_KEY","")
          if not api:
              raise SystemExit("READONLY_ACCOUNT_KEY_MISSING")
          query={'query':'query PrivateRunPodBalanceReadOnly { myself { clientBalance currentSpendPerHr isAutoPayEnabled } }'}
          req=urllib.request.Request(
              'https://api.runpod.io/graphql',method='POST',
              data=json.dumps(query).encode(),headers={
                  'Authorization':'Bearer '+api,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as response:
              data=json.load(response)
          if data.get("errors") or not isinstance((data.get("data") or {}).get("myself"),dict):
              raise SystemExit("ACCOUNT_BALANCE_NOT_AVAILABLE")
          user=data["data"]["myself"]
          balance=Decimal(str(user["clientBalance"]))
          existing=Decimal(str(user["currentSpendPerHr"]))
          autopay=user["isAutoPayEnabled"]
          if not balance.is_finite() or not existing.is_finite() or type(autopay) is not bool:
              raise SystemExit("INVALID_PRIVATE_BALANCE_RESULT")
          record=json.dumps({"snapshot_utc":datetime.now(timezone.utc).isoformat(),
              "balance_usd":str(balance),"current_spend_per_hour_usd":str(existing),
              "autopay_enabled":autopay},sort_keys=True,separators=(",",":")).encode()
          pub=serialization.load_pem_public_key(
              os.environ["EPHEMERAL_SESSION_PUBLIC_KEY"].encode())
          cipher=pub.encrypt(record,padding.OAEP(
              mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          with open('/tmp/runpod-private-balance-encrypted.txt','w') as f:
              f.write(base64.b64encode(cipher).decode())
          print('RUNPOD_EXACT_BALANCE_ENCRYPTED_WITH_EPHEMERAL_PUBLIC_KEY')
          print('FINANCIAL_AMOUNTS_NEVER_PRINTED_IN_PUBLIC_LOGS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-ephemeral-private-runpod-account-snapshot
          path: /tmp/runpod-private-balance-encrypted.txt
          retention-days: 1
