name: Inspect Qwen3-8B frozen continuation failures

on:
  push:
    branches: [launch/second-real-model-positive-wave]
    paths:
      - .github/workflows/inspect-qwen3-8b-continuations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - name: Print candidate-2 continuation sample evidence
        run: |
          python - <<'PY'
          import json, os
          import boto3
          bucket = os.environ['RUNPOD_NETWORK_VOLUME_ID']
          client = boto3.client(
              's3', endpoint_url=os.environ['RUNPOD_S3_ENDPOINT_URL'].rstrip('/'),
              region_name=os.environ['RUNPOD_DATACENTER_ID'],
              aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
          )
          base = ('hephaestus/scientific/v1/positive_promotion/'
                  'positive-real-model-promotion-001-33962003574/evaluations/')
          for repeat in (1, 2, 3):
              prefix = (base + f'positive-real-model-promotion-001-33962003574-candidate-2-repeat-{repeat}/'
                        'semantic_generation/')
              token = None
              found = []
              while True:
                  kw = {'Bucket': bucket, 'Prefix': prefix, 'MaxKeys': 1000}
                  if token: kw['ContinuationToken'] = token
                  page = client.list_objects_v2(**kw)
                  for obj in page.get('Contents', []):
                      key = obj['Key']
                      if '/samples/' not in key or not key.endswith('.json'):
                          continue
                      raw = client.get_object(Bucket=bucket, Key=key)['Body'].read()
                      try: payload = json.loads(raw.decode('utf-8'))
                      except Exception: continue
                      if payload.get('task_id') == 'observatory_continuation':
                          found.append((key, payload))
                  if not page.get('IsTruncated'): break
                  token = page['NextContinuationToken']
              for key, payload in sorted(found, key=lambda item: int(item[1].get('seed', 0))):
                  print(json.dumps({
                      'repeat': repeat,
                      'key': key,
                      'seed': payload.get('seed'),
                      'output': payload.get('output'),
                      'output_hash': payload.get('output_hash'),
                      'finish_reason': payload.get('finish_reason'),
                      'generated_tokens': payload.get('generated_tokens'),
                      'prompt_tokens': payload.get('prompt_tokens'),
                      'metadata': payload.get('metadata'),
                  }, ensure_ascii=False, sort_keys=True))
          PY
