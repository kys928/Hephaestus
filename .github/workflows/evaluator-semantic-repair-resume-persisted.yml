name: Evaluator semantic repair resume from persisted checkpoints

on:
  push:
    branches:
      - diagnostic/evaluator-sealed-v1-autopsy

permissions:
  contents: read

concurrency:
  group: evaluator-semantic-repair-resume-37005231044
  cancel-in-progress: false

jobs:
  verify-persisted:
    if: contains(github.event.head_commit.message, '[resume-evaluator-semantic-repair-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18613e00a798ddd98bf3c4050fe92ebf408fb3c8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]'
      - name: Verify frozen training run, all six checkpoint archives, and completed step 64
        run: |
          python - <<'PY'
          import json
          import run_interface_repair_v1 as v1
          sha = '18613e00a798ddd98bf3c4050fe92ebf408fb3c8'
          prefix = 'hephaestus/scientific/v4/evaluator_semantic_invariance_repair/evaluator-semantic-repair-37005231044'
          s3 = v1.s3_client()
          bucket = v1.bucket()
          s3.head_bucket(Bucket=bucket)
          def get(key):
              response = s3.get_object(Bucket=bucket, Key=key)
              try:
                  return json.loads(response['Body'].read().decode('utf-8'))
              finally:
                  response['Body'].close()
          training = get(f'{prefix}/training/result.json')
          assert training['status'] == 'training_complete'
          assert training['repo_sha'] == sha
          assert training['parent_adapter_sha256'] == '913797ddb8d9d95f83d09a244e8efe430d7bfc4383e589499c2fcc2d943487ed'
          assert training['curriculum_sha256'] == '0d01fe1853742d1259a333fa9a92dec46e8789b69f2019ed34e17d815fc01a3c'
          assert training['burned_sealed_partition_used'] is False
          assert training['development_diagnostic_touched'] is False
          checkpoints = {int(c['optimizer_step']): c['artifact'] for c in training['checkpoint_artifacts']}
          assert set(checkpoints) == {16, 32, 48, 64, 80, 96}
          for step, artifact in sorted(checkpoints.items()):
              obj = s3.head_object(Bucket=bucket, Key=artifact['s3_key'])
              assert int(obj['ContentLength']) == int(artifact['bytes']), f'archive size mismatch at {step}'
              assert len(artifact['sha256']) == 64
              print(f'PERSISTED_CHECKPOINT_OK step={step} sha256={artifact["sha256"]}', flush=True)
          done64 = get(f'{prefix}/checkpoints/step-064/evaluation/result.json')
          assert done64['status'] == 'evaluation_complete'
          assert done64['repo_sha'] == sha
          assert done64['checkpoint_adapter']['sha256'] == checkpoints[64]['sha256']
          assert done64['burned_sealed_partition_used'] is False
          print('RECOVERY_PREREQUISITES_OK training complete; all six checkpoints persisted; step 64 already evaluated; no retraining', flush=True)
          PY

  evaluate:
    needs: verify-persisted
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        step: [16, 32, 48, 80, 96]
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
      HEPHAESTUS_EVALUATOR_REPAIR_AUTHORIZED: LAUNCH_HEPHAESTUS_EVALUATOR_SEMANTIC_INVARIANCE_REPAIR_V1
      HEPHAESTUS_EVALUATOR_REPAIR_RUN_ID: evaluator-semantic-repair-37005231044
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18613e00a798ddd98bf3c4050fe92ebf408fb3c8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]'
      - name: Evaluate immutable checkpoint with capacity-only retries
        shell: bash
        run: |
          set -euo pipefail
          sha=18613e00a798ddd98bf3c4050fe92ebf408fb3c8
          test "$(git rev-parse HEAD)" = "$sha"
          for attempt in 1 2 3 4; do
            echo "RECOVERY_EVALUATION_ATTEMPT step=${{ matrix.step }} attempt=$attempt"
            set +e
            GITHUB_SHA="$sha" python scripts/launch_evaluator_semantic_invariance_repair_v1.py --mode evaluate --step ${{ matrix.step }} --execute 2>&1 | tee /tmp/checkpoint-evaluation.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              echo "RECOVERY_EVALUATION_COMPLETE step=${{ matrix.step }}"
              exit 0
            fi
            if ! grep -Eqi 'compatible GPU capacity unavailable|no instances currently available' /tmp/checkpoint-evaluation.log; then
              echo "Non-capacity failure; refusing blind repeat"
              exit "$status"
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "No GPU capacity after four bounded launcher attempts"
              exit "$status"
            fi
            sleep 75
          done

  select:
    needs: [verify-persisted, evaluate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
      HEPHAESTUS_EVALUATOR_REPAIR_RUN_ID: evaluator-semantic-repair-37005231044
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18613e00a798ddd98bf3c4050fe92ebf408fb3c8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]'
      - name: Apply fixed development checkpoint selection rules
        run: |
          sha=18613e00a798ddd98bf3c4050fe92ebf408fb3c8
          test "$(git rev-parse HEAD)" = "$sha"
          GITHUB_SHA="$sha" python scripts/select_evaluator_semantic_invariance_repair_v1.py
