name: Prometheus calibrated diagnosis CPU checks (temporary research branch)
on:
  push:
    branches: [feature/prometheus-diagnosis-evidence-calibration-20261114]
    paths: [.github/workflows/prometheus-diagnosis-calibration-cpu-once.yml]
permissions:
  contents: read
jobs:
  focused-tests:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m compileall -q src/hephaestus tests
      - name: Evidence-calibration and frozen specialist gate regressions
        run: python -m pytest -q
