name: Verify first scientific bootstrap volume

on:
  push:
    branches: [integration/first-scientific-bootstrap]
    paths:
      - .github/workflows/verify-first-scientific-bootstrap-volume.yml
      - scripts/verify_first_scientific_bootstrap_volume.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-first-scientific-bootstrap-cviwpryzao
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only verifier dependency
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Compile verifier
        run: python -m py_compile scripts/verify_first_scientific_bootstrap_volume.py
      - name: Re-read and verify paid-volume scientific state
        run: python scripts/verify_first_scientific_bootstrap_volume.py
      - name: Upload independent verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: first-scientific-volume-verification
          path: first_scientific_volume_verification.json
          if-no-files-found: error
          retention-days: 14
