name: Autonomous Evaluator scientific certification (CPU)
on:
  push:
    branches: [feature/autonomous-repair-certification-activation-20261024]
  pull_request:
    paths:
      - 'src/hephaestus/evaluation/scientific_state_certification.py'
      - 'tests/test_scientific_state_certification.py'
      - '.github/workflows/autonomous-repair-certification-cpu.yml'
permissions: {contents: read}
jobs:
  scientific-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline CPU test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test immutable scientific state and adversarial cases
        run: |
          python -m compileall -q src/hephaestus/evaluation/scientific_state_certification.py
          pytest -q tests/test_scientific_state_certification.py
      - name: Full repository CPU regressions
        run: pytest -q tests/
