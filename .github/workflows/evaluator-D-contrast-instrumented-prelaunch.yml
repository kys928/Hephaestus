name: D contrast instrumented CPU-only prelaunch (NO GPU)
on:
  push:
    branches: [experiment/D-contrast-instrumented-prelaunch-20261022]
permissions:
  contents: read
jobs:
  instrumented-prelaunch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts:src:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU-only test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile instrumented loader and run path
        run: |
          python -m py_compile scripts/evaluator_D_durable_timing.py scripts/interface_repair_v2_bootstrap.py scripts/run_interface_repair_v1.py scripts/run_evaluator_contrast_probe.py scripts/report_D_contrast_instrumented_prelaunch.py scripts/launch_evaluator_contrast_probe.py
      - name: Validate immutable science, no launch, budget, timing receipts
        run: |
          pytest -q tests/test_D_contrast_durable_timing_prelaunch.py tests/test_evaluator_contrast_inference.py tests/test_evaluator_effect_polarity_contrasts.py tests/test_preflight_D_contrast_region_stock.py
      - name: Verify offline pod request without allocation
        run: python scripts/launch_evaluator_contrast_probe.py
      - name: Generate prelaunch scientific model and data report without GPU
        run: python scripts/report_D_contrast_instrumented_prelaunch.py
      - uses: actions/upload-artifact@v4
        with:
          name: D-contrast-instrumented-prelaunch-CPU-only
          path: D-contrast-instrumented-prelaunch.json
          retention-days: 60
