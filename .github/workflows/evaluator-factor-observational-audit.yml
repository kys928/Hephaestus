name: Evaluator six-factor error audit (CPU and read-only S3)
on:
  push:
    branches: [diagnostic/evaluator-factor-attribution-v1]
permissions:
  contents: read
jobs:
  factor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts:src:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU-only testing dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile factor audit and unit tests
        run: python -m compileall -q scripts/evaluator_semantic_factor_attribution.py scripts/audit_evaluator_semantic_factors_readonly.py tests/test_evaluator_semantic_factor_attribution.py
      - name: Test truth-table attribution and identifiability limits
        run: pytest -q tests/test_evaluator_semantic_factor_attribution.py
  persisted-audit:
    needs: factor-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts:src:.
      PYTHONDONTWRITEBYTECODE: '1'
      RUNPOD_S3_ACCESS_KEY_ID: \${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: \${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install read-only S3 dependencies
        run: python -m pip install -e '.[s3]'
      - name: Analyze immutable V1 C D outputs by factor and precedence oracle
        run: python scripts/audit_evaluator_semantic_factors_readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluator-six-factor-observational-audit
          path: semantic-factor-observational-audit.json
