name: Interface Repair V3.1 neutral holdout paid diagnostic

on:
  push:
    branches: [experiment-interface-repair-v3-neutral-holdout]
    paths:
      - configs/experiments/interface_repair_v3_1_neutral_holdout.launch.json

permissions: {contents: read}
concurrency:
  group: interface-repair-v3-neutral-holdout
  cancel-in-progress: false

jobs:
  diagnostic:
    if: contains(github.event.head_commit.message, '[launch-interface-repair-v3-neutral-holdout]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
      HEPHAESTUS_INTERFACE_REPAIR_RUN_ID: v3-neutral-holdout-${{ github.run_id }}
      HEPHAESTUS_INTERFACE_REPAIR_V3_1_NEUTRAL_AUTHORIZED: LAUNCH_INTERFACE_REPAIR_V3_1_NEUTRAL_HOLDOUT
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Verify inference-only authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/experiments/hephaestus_interface_repair_v3_1_neutral_holdout.json').read_text())
          marker=json.loads(Path('configs/experiments/interface_repair_v3_1_neutral_holdout.launch.json').read_text())
          assert cfg['diagnostic_only'] is True
          assert cfg['training_performed'] is False
          assert cfg['governance']['paid_launch_allowed'] is True
          assert cfg['governance']['training_allowed'] is False
          assert cfg['governance']['adapter_mutation_allowed'] is False
          assert cfg['governance']['production_promotion_allowed'] is False
          assert cfg['governance']['automatic_role_dispatch_allowed'] is False
          assert cfg['governance']['certification_claim_allowed'] is False
          assert marker['launch_authorized'] is True
          assert marker['authorized_repo_sha']
          assert marker['authorization_phrase']=='LAUNCH_INTERFACE_REPAIR_V3_1_NEUTRAL_HOLDOUT'
          PY
      - name: Run frozen V3.1 neutral holdout
        run: python scripts/launch_interface_repair_v3_1_neutral_holdout.py --execute
