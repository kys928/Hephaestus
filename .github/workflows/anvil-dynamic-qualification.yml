name: Anvil dynamic placement qualification
on:
  push:
    branches: [ops/anvil-dynamic-qualification-20261125]
    paths: [.github/workflows/anvil-dynamic-qualification.yml]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,independent-certification,postgres,s3]'
      - run: |
          python -m compileall -q scripts/anvil_live*.py scripts/anvil_qualify_cuda_offline.py src/hephaestus/control/anvil_live*.py src/hephaestus/providers/runpod/anvil*.py
          python -m pytest -q tests/test_anvil_dynamic_placement.py tests/test_anvil_placement_diagnostics.py tests/test_anvil_live.py tests/test_anvil_live_lease.py tests/test_anvil_live_gateway.py tests/test_anvil_attestation.py tests/test_anvil_live_runtime.py tests/test_anvil_live_retention.py tests/test_anvil_live_mission.py
      - name: Verify real unconsumed approval and dynamic placement
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider
          from hephaestus.providers.runpod.anvil_live_lease import *
          from hephaestus.providers.runpod.config import RunPodConfig
          from hephaestus.providers.runpod.anvil_live_retention import AnvilRetainedWriter
          from hephaestus.providers.runpod.storage import RunPodNetworkVolumeStorage
          from hephaestus.providers.runpod.execution import RunPodExecutionAdapter
          from hephaestus.providers.runpod.cost_intelligence import ReadOnlyRunPodPricing
          from hephaestus.providers.runpod.anvil_dynamic_placement import discover
          from hephaestus.providers.runpod.anvil_placement_diagnostics import inspect_placement,PlacementFailure
          secrets=EnvironmentSecretsProvider()
          cfg=RunPodConfig("EU-CZ-1",REGIONAL,"https://s3api-eu-cz-1.runpod.io","https://api.runpod.io/v2")
          storage=RunPodNetworkVolumeStorage.from_boto3(cfg,secrets)
          mailbox=AnvilRetainedWriter(storage.client,REGIONAL,os.environ["GITHUB_SHA"])
          plan=json.loads(Path("configs/research/anvil_diagnosis_planner_first_live_v1.json").read_bytes())["plan"]["ref"]
          if mailbox.allocation_intent(plan) is not None: raise PermissionError("approval already consumed")
          p=ReadOnlyRunPodPricing(bearer_token=os.environ["RUNPOD_API_KEY"])
          rows=discover(p,lambda d:print("ANVIL_DYNAMIC_QUALIFICATION="+json.dumps(d,sort_keys=True),flush=True))
          for row in rows:
              adapter=RunPodExecutionAdapter(RunPodConfig(row["region"],REGIONAL,cfg.s3_endpoint_url,cfg.api_base_url),secrets,state_root=Path("/tmp/anvil-dynamic-readonly"))
              try: doc=inspect_placement(p,adapter,region=row["region"],gpu=row["gpu"],report=lambda d:None)
              except PlacementFailure: continue
              print("ANVIL_DYNAMIC_READY="+json.dumps(doc,sort_keys=True),flush=True)
              break
          else: print("ANVIL_DYNAMIC_NO_STOCK=true",flush=True)
          PY
