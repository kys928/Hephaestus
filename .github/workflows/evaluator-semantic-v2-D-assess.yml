name: Evaluator Semantic V2 D independent screen assessment (read only)
on:
  push:
    branches: [repair/evaluator-semantic-v2-D]
permissions:
  contents: read
jobs:
  assess-D:
    if: contains(github.event.head_commit.message, '[assess-D-screen-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts:src:.
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Verify D screen samples and original V1 same-case comparison
        run: python scripts/assess_evaluator_semantic_v2_D.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluator-semantic-v2-D-independent-screen
          path: semantic-v2-D-independent-assessment.json
