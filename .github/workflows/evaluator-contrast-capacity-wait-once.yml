name: D Blackwell region capacity watch and one-use inference retry
on:
  push:
    branches: [experiment/evaluator-contrast-capacity-retry-20261019]
permissions:
  contents: read
concurrency:
  group: hephaestus-D-contrast-capacity-once-20261019
  cancel-in-progress: false
jobs:
  capacity-gated-one-use:
    if: contains(github.event.head_commit.message, '[watch-D-blackwell-in-region-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_CONTRAST_AUTHORIZED: SINGLE_D_CONTRAST_PROBE
      HEPHAESTUS_CONTRAST_RUN_ID: D-contrast-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU-only precheck and scientific dependencies
        run: python -m pip install -e '.[s3,test]'
      - name: Verify single-authorized protocol and price tests without a pod
        run: |
          pytest -q tests/test_preflight_D_contrast_region_stock.py tests/test_evaluator_contrast_inference.py tests/test_evaluator_effect_polarity_contrasts.py
          python scripts/launch_evaluator_contrast_probe.py
      - name: Require Medium/High Blackwell Secure Cloud availability IN EU-CZ-1
        run: python scripts/preflight_D_contrast_region_stock.py
      - name: Exactly one $0.75 maximum matched-D inference allocation
        run: python scripts/launch_evaluator_contrast_probe.py --execute
  verify-result:
    needs: capacity-gated-one-use
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_CONTRAST_RUN_ID: D-contrast-${{ github.run_id }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Independently rescore all persisted D contrast pairs
        run: python scripts/assess_evaluator_contrast_readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: D-in-region-capacity-retry-independent-report
          path: D-contrast-inference-independent.json
