name: Prometheus Unbound forensic failure classification (read-only)
on:
  push:
    branches: [ops/prometheus-unbound-global-20261114]
    paths: [.github/workflows/prometheus-global-forensic-classify.yml]
permissions:
  contents: read
jobs:
  forensic:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8038aaa1651b37746838604f4b14e97ee27c77dd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[s3]'
      - name: Read only preserved failure metadata and classify traceback frames
        run: |
          python - <<'PY'
          import json,re
          from pathlib import PurePosixPath
          from hephaestus.development.prometheus_global_supervision import (
            campaign_prefix, get_bytes, s3_client, read_json)
          prefix=campaign_prefix("prometheus-unbound-global-20261114-01",
             "8038aaa1651b37746838604f4b14e97ee27c77dd")
          s3=s3_client()
          manifest=read_json(s3,prefix+"/result/manifest.json")
          assert manifest and manifest.get("schema")=="prometheus-global-evidence-manifest.v1"
          names=sorted(x["path"] for x in manifest["files"])
          summary={
            "schema":"prometheus-private-failure-classification.v1",
            "file_inventory":names,
            "worker_code":manifest.get("worker_exit_code"),
            "worker_status":None,
            "research_failure":None,
            "trace_classes":[],
            "trace_frames":[],
          }
          def retrieve(rel,cap=4000000):
              if rel not in names:return None
              return get_bytes(s3,prefix+"/result/files/"+rel,cap)
          status=retrieve("logs/worker-status.json",20000)
          if status:
              doc=json.loads(status)
              summary["worker_status"]={k:doc.get(k) for k in
                ("stage","error_class","worker_exit_code","global_volume_id")}
          failure=retrieve("output/cycle/failure.json",20000)
          if failure:
              doc=json.loads(failure)
              summary["research_failure"]={k:doc.get(k) for k in
                ("schema","status","error_class")}
          trace=retrieve("logs/scientific-worker.log")
          if trace:
              lines=trace.decode(errors="replace").splitlines()
              classes=[]
              frames=[]
              for line in lines:
                  m=re.match(r"^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception|Warning|OSError)):",line.strip())
                  if m:classes.append(m.group(1).split(".")[-1])
                  f=re.match(r'^\s*File "([^"]+)", line ([0-9]+), in ([A-Za-z_][A-Za-z0-9_]*)',line)
                  if f:
                      name=PurePosixPath(f.group(1)).name
                      if re.fullmatch(r"[A-Za-z0-9_.-]{1,90}",name):
                          frames.append({"file":name,"line":int(f.group(2)),"function":f.group(3)})
              summary["trace_classes"]=classes[-8:]
              summary["trace_frames"]=frames[-9:]
              summary["trace_line_count"]=len(lines)
              summary["trace_sha256"]=__import__("hashlib").sha256(trace).hexdigest()
          print("PROMETHEUS_PRIVATE_FAILURE_CLASS="+json.dumps(summary,sort_keys=True),flush=True)
          PY
