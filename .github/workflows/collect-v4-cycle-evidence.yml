name: Collect V4 cycle evidence

on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/collect-v4-cycle-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      HEPHAESTUS_PROOF_RUN_ID: positive-real-model-promotion-001-34765826521
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install S3 client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Pull complete V4 cycle directories from Network Volume
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import boto3
          from botocore.config import Config

          run_id = os.environ['HEPHAESTUS_PROOF_RUN_ID']
          bucket = os.environ['RUNPOD_NETWORK_VOLUME_ID']
          endpoint = os.environ['RUNPOD_S3_ENDPOINT_URL']
          out = Path('v4_remote_cycles')
          out.mkdir(parents=True, exist_ok=True)
          s3 = boto3.client(
              's3',
              endpoint_url=endpoint,
              aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
              region_name='EU-CZ-1',
              config=Config(signature_version='s3v4', retries={'max_attempts': 3}),
          )

          prefixes = [
              f'hephaestus/scientific/v1/positive_promotion/{run_id}/cycles/cycle-01/',
              f'hephaestus/scientific/v1/positive_promotion/{run_id}/cycles/cycle-02/',
              f'hephaestus/scientific/v1/executions/{run_id}/attempt-1/',
          ]
          manifest = []
          for prefix in prefixes:
              token = None
              while True:
                  kwargs = {'Bucket': bucket, 'Prefix': prefix, 'MaxKeys': 1000}
                  if token:
                      kwargs['ContinuationToken'] = token
                  resp = s3.list_objects_v2(**kwargs)
                  for item in resp.get('Contents', []):
                      key = item['Key']
                      raw = s3.get_object(Bucket=bucket, Key=key)['Body'].read()
                      rel = key.removeprefix('hephaestus/scientific/v1/')
                      path = out / rel
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(raw)
                      manifest.append({
                          'key': key,
                          'bytes': len(raw),
                          'sha256': hashlib.sha256(raw).hexdigest(),
                      })
                  if not resp.get('IsTruncated'):
                      break
                  token = resp.get('NextContinuationToken')

          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          cycle1 = [x for x in manifest if '/cycle-01/' in x['key']]
          cycle2 = [x for x in manifest if '/cycle-02/' in x['key']]
          print(json.dumps({
              'run_id': run_id,
              'files': len(manifest),
              'cycle_01_files': len(cycle1),
              'cycle_02_files': len(cycle2),
          }, sort_keys=True))
          if not cycle1 or not cycle2:
              raise RuntimeError('both persisted V4 cycle directories were not found')
          PY
      - name: Upload complete V4 cycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: v4-remote-cycle-evidence-34765826521
          path: v4_remote_cycles/
          if-no-files-found: error
          retention-days: 30
