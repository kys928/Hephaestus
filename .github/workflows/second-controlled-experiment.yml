name: Second controlled experiment

on:
  push:
    branches: [integration/second-controlled-experiment]
    paths:
      - .github/workflows/second-controlled-experiment.yml
      - scripts/run_second_controlled_training.py
      - scripts/run_second_controlled_training_v2.py
      - scripts/launch_second_controlled_training.py
      - scripts/launch_second_controlled_training_v2.py
      - scripts/launch_second_controlled_training_v3.py
      - scripts/run_second_controlled_semantic_evaluation.py
      - scripts/run_second_controlled_semantic_evaluation_v2.py
      - scripts/launch_second_controlled_semantic_evaluation.py
      - scripts/launch_second_controlled_semantic_evaluation_v2.py
      - scripts/launch_second_controlled_semantic_evaluation_v3.py
      - scripts/runpod_capacity_selection.py
      - docs/integration_notes/integration-second-controlled-experiment.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: second-controlled-experiment-cviwpryzao
  cancel-in-progress: false

jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-second-controlled-experiment]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install launcher and test dependencies
        run: python -m pip install -e '.[s3,test]'
      - name: Verify controlled training, RunPod, semantic evaluation, and Judge boundaries
        run: |
          python -m pytest -q \
            tests/test_runpod_provider.py \
            tests/test_runpod_gpu_execution.py \
            tests/test_real_hf_training.py \
            tests/test_semantic_judge_integration.py \
            tests/test_semantic_evaluation.py \
            tests/test_evaluation_generation_bridge.py \
            tests/test_generation_hardening.py
      - name: Compile controlled experiment drivers
        run: |
          python -m py_compile scripts/runpod_capacity_selection.py
          python -m py_compile scripts/run_second_controlled_training.py
          python -m py_compile scripts/run_second_controlled_training_v2.py
          python -m py_compile scripts/launch_second_controlled_training.py
          python -m py_compile scripts/launch_second_controlled_training_v2.py
          python -m py_compile scripts/launch_second_controlled_training_v3.py
          python -m py_compile scripts/run_second_controlled_semantic_evaluation.py
          python -m py_compile scripts/run_second_controlled_semantic_evaluation_v2.py
          python -m py_compile scripts/launch_second_controlled_semantic_evaluation.py
          python -m py_compile scripts/launch_second_controlled_semantic_evaluation_v2.py
          python -m py_compile scripts/launch_second_controlled_semantic_evaluation_v3.py
      - name: Launch controlled 100-step training, verify checkpoint, and tear down Pod
        run: python scripts/launch_second_controlled_training_v3.py
      - name: Run frozen semantic comparison and Judge, verify evidence, and tear down Pod
        run: python scripts/launch_second_controlled_semantic_evaluation_v3.py
      - name: Upload complete second controlled experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-controlled-experiment
          path: |
            second_controlled_training_launcher.json
            second_controlled_training_verification.json
            second_controlled_semantic_evaluation_launcher.json
            second_controlled_semantic_evaluation_verification.json
          if-no-files-found: warn
          retention-days: 30
