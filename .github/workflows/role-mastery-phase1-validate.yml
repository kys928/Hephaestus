name: Role Mastery Phase I validate
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - scripts/build_role_mastery_phase1_v1.py
      - tests/test_role_mastery_phase1_v1.py
      - configs/experiments/hephaestus_role_mastery_phase1_v1.json
      - configs/experiments/role_mastery_phase1_v1.launch.json
      - scripts/role_mastery_common_v1.py
      - scripts/validate_role_mastery_phase1_v1.py
      - scripts/run_role_mastery_phase1_v1.py
      - scripts/launch_role_mastery_phase1_v1.py
      - scripts/aggregate_role_mastery_phase1_v1.py
      - .github/workflows/role-mastery-phase1-launch.yml
      - .github/workflows/role-mastery-phase1-validate.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONPATH: src}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet -e '.[test,s3]'
      - run: python scripts/build_role_mastery_phase1_v1.py
      - run: pytest -q tests/test_role_mastery_phase1_v1.py
      - run: python -m py_compile scripts/role_mastery_common_v1.py scripts/validate_role_mastery_phase1_v1.py scripts/run_role_mastery_phase1_v1.py scripts/launch_role_mastery_phase1_v1.py scripts/aggregate_role_mastery_phase1_v1.py
      - name: Render all locked launch requests
        env: {PYTHONPATH: src:scripts}
        run: |
          for role in controller diagnosis planner evaluator judge; do
            python scripts/launch_role_mastery_phase1_v1.py --role "$role"
          done
      - name: Require prepared state remains locked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('configs/experiments/hephaestus_role_mastery_phase1_v1.json').read_text())
          m=json.loads(Path('configs/experiments/role_mastery_phase1_v1.launch.json').read_text())
          assert c['governance']['paid_launch_allowed'] is False
          assert c['governance']['launch_authorized'] is False
          assert m['authorized'] is False
          PY
