name: One-time GPU 5090 exact stock check (delete after use)
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: read
jobs:
  stock:
    if: >-
      github.actor == 'kys928' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/prometheus-model-backed-scientific-decision' &&
      github.event.pull_request.number == 201
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query EXACT GPU hardware and region from REST v2; no allocations
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, os
          gpu_id="NVIDIA GeForce RTX 5090"
          url="https://api.runpod.io/v2/catalog/gpus/"+urllib.parse.quote(gpu_id,safe="")+"?include=AVAILABILITY&product=POD&count=1"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["RUNPOD_API_KEY"]})
          with urllib.request.urlopen(req,timeout=25) as resp:
              d=json.load(resp)
          print("5090_GPU_ID="+str(d.get("id")))
          print("5090_DISPLAY_NAME="+str(d.get("displayName")))
          print("5090_MEMORY_GB="+str(d.get("memoryInGb",d.get("memoryInGB",d.get("memory",None)))))
          print("5090_AVAILABILITY_ENTRIES="+str(len(d.get("dataCenters",[]) or [])))
          for e in d.get("dataCenters",[]) or []:
              if isinstance(e,dict) and str(e.get("dataCenterId",e.get("id",""))).startswith("EU-"):
                  print("EU_GPU_STOCK="+json.dumps({k:v for k,v in e.items() if k in ("dataCenterId","id","cloudType","availability","stockStatus","stock","cudaVersions","count","gpuCount")},sort_keys=True))
          print("5090_AVAILABILITY="+json.dumps(d.get("availability"),sort_keys=True))
          print("5090_DATACENTERS="+json.dumps(d.get("dataCenters"),sort_keys=True))
          print("5090_SECURE="+json.dumps(d.get("secure"),sort_keys=True))
          print("5090_TOP_KEYS="+",".join(sorted(d.keys())))
          PY
