name: GLM Tiny Adaptation V1 validation

on:
  push:
    branches: [feature/glm-tiny-adaptation-v1]
    paths:
      - configs/experiments/hephaestus_glm_tiny_adaptation_v1.json
      - scripts/run_glm_tiny_adaptation_v1.py
      - scripts/launch_glm_tiny_adaptation_v1.py
      - scripts/validate_glm_tiny_adaptation_v1.py
      - tests/test_glm_tiny_adaptation_v1.py
      - .github/workflows/glm-tiny-adaptation-v1-validation.yml
      - .github/workflows/glm-tiny-adaptation-v1-launch.yml
      - .github/workflows/diagnostic-scaling-recovery-v1-launch.yml
  pull_request:
    branches: [experiment-diagnostic-scaling-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -e '.[s3,test]' 'peft==0.20.0'
      - name: Compile implementation
        run: python -m py_compile scripts/run_glm_tiny_adaptation_v1.py scripts/launch_glm_tiny_adaptation_v1.py scripts/validate_glm_tiny_adaptation_v1.py
      - name: Validate protocol
        run: python scripts/validate_glm_tiny_adaptation_v1.py
      - name: Run tests
        run: python -m pytest -q tests/test_glm_tiny_adaptation_v1.py
      - name: Verify render-only launcher
        run: python scripts/launch_glm_tiny_adaptation_v1.py --screen-result-key placeholder/result.json