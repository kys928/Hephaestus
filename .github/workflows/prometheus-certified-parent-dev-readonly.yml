name: One-time Prometheus certified parent development forensic (read-only)

on:
  pull_request:
    paths:
      - "scripts/audit_granite_original_parent_dev_readonly.py"
      - "tests/test_granite_original_parent_dev_audit.py"
      - ".github/workflows/prometheus-certified-parent-dev-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-parent-dev-forensic:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact current PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: current
      - name: Checkout immutable original role-mastery training source
        uses: actions/checkout@v4
        with:
          ref: c831bbfc0e2054d54fccd1ef374fd84722612c79
          persist-credentials: false
          path: historical
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core/CPU and read-only storage dependencies
        working-directory: current
        run: python -m pip install -q -e '.[test,s3]'
      - name: Regenerate original source-certified six-state development case refs without S3 credentials
        env:
          PYTHONPATH: historical/scripts:historical/src
        run: |
          test "$(git -C historical rev-parse HEAD)" = c831bbfc0e2054d54fccd1ef374fd84722612c79
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import build_role_mastery_v1 as builder
          cfg = json.loads(Path("historical/configs/experiments/hephaestus_role_mastery_v1.json").read_text())
          pack = builder.build_pack()
          builder.validate(pack)
          assert builder.canonical_sha256(pack) == "6f4bb3b8c8312a4189136ea961e8fa32629c02fa5459e18fa960670badb203b3"
          assert cfg["pack"]["canonical_sha256"] == builder.canonical_sha256(pack)
          parent = cfg["candidates"]["evaluator"]
          assert parent["model_id"] == "ibm-granite/granite-3.3-8b-instruct"
          assert parent["revision"] == "51dd4bc2ade4059a6bd87649d68aa11e4fb2529b"
          assert cfg["training"]["dev_checkpoints_by_role"]["evaluator"] == [125,250,375]
          dev = pack["splits"]["evaluator"]["dev"]
          assert len(dev) == 200 and all(x["split"] == "dev" for x in dev)
          manifest = {
            "schema": "granite-original-parent-exposed-development.v1",
            "source_repo_sha": "c831bbfc0e2054d54fccd1ef374fd84722612c79",
            "training_pack_sha256": cfg["pack"]["canonical_sha256"],
            "ontology": "frozen-role-mastery-evaluator.v1",
            "model_id": parent["model_id"],
            "model_revision": parent["revision"],
            "selected_adapter_sha256": "e60497854ea64655fc18be7962dec29f13091c75ea91e576726b0fa5c6eb2325",
            "selected_dev_step": 250,
            "development_cases": [
              {"case_id": x["case_id"],"root_case_id": x["root_case_id"],"skill":x["skill"],
               "expected_decision": x["expected"]["decision"],"expected_action":x["expected"]["action"],
               "expected_primary_variable":x["expected"]["primary_variable"]}
              for x in dev
            ],
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "granite-certified-parent-original-dev-refs.json"
          target.write_text(json.dumps(manifest, sort_keys=True) + "\n")
          print("ORIGINAL_CERTIFIED_PARENT_DEVELOPMENT_REFERENCES", len(dev))
          PY
      - name: Run offline source provenance, no-certification and forged-score checks
        working-directory: current
        run: pytest -q tests/test_granite_original_parent_dev_audit.py tests/test_granite_dev_scoring.py
      - name: Read ONLY original step-250 development samples and role result from S3
        working-directory: current
        env:
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
        run: |
          python scripts/audit_granite_original_parent_dev_readonly.py \
            --references "${{ runner.temp }}/granite-certified-parent-original-dev-refs.json" \
            --output "granite-original-parent-dev-aggregate.json"
      - name: Store only aggregate, source receipts and scientific limitation flags
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-granite-certified-parent-dev-aggregate
          path: current/granite-original-parent-dev-aggregate.json
          retention-days: 30
