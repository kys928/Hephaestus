name: Diagnose original CUDA45 first-stage boundary (S3 read only)
on:
  push:
    branches: [fix/cuda45-first-role-advisory-veto-20261029]
    paths:
      - '.github/workflows/diagnose-original-cuda45-first-stage-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-persisted-worker-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install S3 read-only dependency
        run: python -m pip install 'boto3>=1.34,<2'
      - name: Inspect fixed old run's stage markers only; never print private log bytes
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          import boto3
          bucket=os.environ["RUNPOD_NETWORK_VOLUME_ID"]
          endpoint=os.environ["RUNPOD_S3_ENDPOINT_URL"]
          if bucket!="cviwpryzao" or "s3api-eu-cz-1.runpod.io" not in endpoint:
              raise PermissionError("unrecognized original RunPod evidence storage")
          client=boto3.client(
              "s3",endpoint_url=endpoint,region_name="eu-cz-1",
              aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"])
          key="hephaestus/scientific/original_cuda_45/worker_stdout-40861984230.log"
          size=client.head_object(Bucket=bucket,Key=key)["ContentLength"]
          if not 0<size<=262144:
              raise PermissionError("original worker log exceeds bounded read-only diagnostic")
          raw=client.get_object(Bucket=bucket,Key=key)["Body"].read()
          if len(raw)!=size:
              raise PermissionError("incomplete original worker log")
          lines=raw.decode("utf-8",errors="replace").splitlines()
          marks=(
              "resource_grant_start","resource_grant_approved",
              "domain_delegate_start","domain_delegate_returned",
              "certified_inference_start","certified_inference_returned",
              "receipt_verification_start")
          seen={m:False for m in marks}
          for line in lines:
              match=re.fullmatch(
                  r"ORIGINAL_CUDA_ROLE_BOUNDARY=([a-z_]+) role=controller(?: status=[a-z_]+)?",
                  line.strip())
              if match and match.group(1) in seen:
                  seen[match.group(1)]=True
          # All output is fixed allowlisted labels, never model text, traceback,
          # source data, secret fragments, full logs, or private prompt content.
          for marker in marks:
              print("FIRST_STAGE_"+marker.upper()+"="+str(seen[marker]).lower())
          if not seen["resource_grant_start"]:
              category="before_role_resource_gate"
          elif not seen["resource_grant_approved"]:
              category="role_resource_grant"
          elif not seen["domain_delegate_start"] or not seen["domain_delegate_returned"]:
              category="native_domain_delegate"
          elif not seen["certified_inference_start"] or not seen["certified_inference_returned"]:
              category="role_model_inference_or_parsing"
          elif not seen["receipt_verification_start"]:
              category="post_inference_advisory_action_gate"
          else:
              category="inference_receipt_or_after"
          print("FIRST_STAGE_LAST_REACHED_BOUNDARY="+category)
          print("PRIVATE_LOG_EXPOSED=false")
          print("GPU_ALLOCATED=false")
          PY
