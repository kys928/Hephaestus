name: Diagnose original genuine CUDA45 native block from persisted SQLite (read-only)
on:
  push:
    branches: ['feature/verify-live-runpod-credentials-20261029']
    paths: ['.github/workflows/diagnose-original-cuda45-native-block-20261029.yml']
permissions: {contents: read}
jobs:
  describe-protected-original-stage-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q boto3
      - name: Read native incomplete stage, no source/prompt/model text
        run: |
          python - <<'PY'
          import os,boto3,sqlite3,json,tempfile,collections,pathlib
          from botocore.exceptions import ClientError
          s3=boto3.client('s3',endpoint_url=os.environ['RUNPOD_S3_ENDPOINT_URL'],
              aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
              region_name='eu-cz-1')
          bucket=os.environ['RUNPOD_NETWORK_VOLUME_ID']
          prefix='hephaestus/scientific/original_cuda_45/cuda-json-45-original-five-20261028/'
          keys=[x['Key'] for page in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix)
                for x in page.get('Contents',[])]
          print('ORIGINAL_STATE_SQLITE_PRESENT='+str(prefix+'state.sqlite' in keys))
          for key in keys:
              if key.startswith(prefix+'cuda-native-report-') and key.endswith('.json'):
                  record=json.loads(s3.get_object(Bucket=bucket,Key=key)['Body'].read())
                  print('ORIGINAL_NATIVE_REPORT_STATUS='+str(record.get('status')))
                  print('ORIGINAL_NATIVE_REPORT_COMPLETED_OPS='+str(record.get('completed_operations')))
          with tempfile.TemporaryDirectory() as tmp:
              path=pathlib.Path(tmp)/'state.sqlite'
              path.write_bytes(s3.get_object(Bucket=bucket,Key=prefix+'state.sqlite')['Body'].read())
              for suffix in ('-wal','-shm'):
                  if prefix+'state.sqlite'+suffix in keys:
                      (pathlib.Path(tmp)/('state.sqlite'+suffix)).write_bytes(
                          s3.get_object(Bucket=bucket,Key=prefix+'state.sqlite'+suffix)['Body'].read())
              db=sqlite3.connect(str(path))
              print('SQLITE_QUICK_CHECK='+str(db.execute('PRAGMA quick_check').fetchone()[0]))
              rows=db.execute("SELECT collection,payload_json FROM state_records ORDER BY sequence").fetchall()
              db.close()
          print('TOTAL_PERSISTED_NATIVE_RECORDS='+str(len(rows)))
          summary=collections.Counter(kind for kind,_ in rows)
          print('RECORD_COLLECTION_COUNTS='+json.dumps(dict(summary),sort_keys=True))
          states=[json.loads(raw) for collection,raw in rows if collection=='staged_workflow_states']
          if not states:
              print('NATIVE_STAGE_STATE_MISSING=true')
          else:
              latest=states[-1]
              print('LAST_NATIVE_STAGE_PHASE='+str(latest.get('current_phase','')))
              print('LAST_NATIVE_STAGE_SUBSTEP='+str(latest.get('current_substep','')))
              print('LAST_NATIVE_STAGE_STATUS='+str(latest.get('status','')))
              print('NATIVE_TOTAL_STEP_COUNT='+str(len(latest.get('steps',{}))))
              print('NATIVE_COMPLETED_STEP_COUNT='+str(sum(v.get('completion_marker') is True for v in latest.get('steps',{}).values())))
              steps=latest.get('steps',{})
              phase=str(latest.get('current_phase',''))
              sub=str(latest.get('current_substep',''))
              step=steps.get(phase+'.'+sub,{})
              print('LAST_STEP_STATUS='+str(step.get('status')))
              print('LAST_STEP_ATTEMPT='+str(step.get('attempt')))
              print('LAST_STEP_APPROVAL_REQUEST='+str(bool(step.get('approval_request'))))
              print('LAST_STEP_ISSUES_COUNT='+str(len(step.get('blocking_issues',[]))))
              # Issue codes may include model output; print only allowlisted
              # stable systemic permission, service, resource classifications.
              safe=('missing','approval','inconclusive','blocked','unavailable',
                    'budget','model','checkpoint','role','evidence','runtime','policy')
              for v in step.get('blocking_issues',[])[:6]:
                  s=str(v).lower()
                  print('LAST_STEP_ISSUE_CLASS='+next((name for name in safe if name in s),'other'))
          print('THIS_READONLY_DIAG_ALLOCATED_GPU_PODS=0')
          PY
