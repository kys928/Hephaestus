name: Interface targeted repair V1 paid launch
on:
  push:
    branches: [phase-ii-targeted-interface-repair]
    paths:
      - configs/experiments/interface_targeted_repair_v1.launch.json
permissions: {contents: read}
concurrency:
  group: interface-targeted-repair-v1-paid
  cancel-in-progress: false
env:
  PYTHONPATH: src:scripts
  RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
  RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
  RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
  RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
  RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
  RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
  RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
  HEPHAESTUS_INTERFACE_REPAIR_AUTHORIZED: 'LAUNCH_INTERFACE_TARGETED_REPAIR_V1'
jobs:
  controller:
    if: contains(github.event.head_commit.message, '[launch-interface-targeted-repair-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/launch_interface_targeted_repair_v1.py --role controller --execute
  evaluator:
    needs: controller
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/launch_interface_targeted_repair_v1.py --role evaluator --execute
  judge:
    needs: evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/launch_interface_targeted_repair_v1.py --role judge --execute
  aggregate:
    needs: judge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEPHAESTUS_INTERFACE_REPAIR_RUN_ID: interface-repair-v1-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - run: python scripts/aggregate_interface_targeted_repair_v1.py
