name: Phase I Role Mastery paid launch
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths: [configs/experiments/role_mastery_v1.launch.json]
permissions:
  contents: read
concurrency:
  group: phase-i-role-mastery-paid
  cancel-in-progress: false
jobs:
  launch:
    if: contains(github.event.head_commit.message, '[launch-role-mastery-v1]')
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        role: [controller, diagnosis, planner, evaluator, judge]
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      PYTHONPATH: src:scripts
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      HEPHAESTUS_ROLE_MASTERY_LAUNCH_AUTHORIZED: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Require frozen authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('configs/experiments/hephaestus_role_mastery_v1.json').read_text())
          m=json.loads(Path('configs/experiments/role_mastery_v1.launch.json').read_text())
          assert c['corpus']['canonical_sha256']=='eb70310da56e79a2066df838cc12ad2f513f5e3ad286dd96ffb2bff8bd863c6e'
          assert c['governance']['paid_launch_allowed'] is True
          assert m['authorized'] is True
          assert m['authorization_source']=='user_directive'
          assert len(c['candidates'])==5
          PY
      - run: python scripts/launch_role_mastery_v1.py --role ${{ matrix.role }} --execute
