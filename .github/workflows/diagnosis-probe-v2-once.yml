name: Diagnosis probe v2 independent source verification (one-shot)
on:
  push:
    branches: [ops/diagnosis-wrapper-fix-verify-20261114]
    paths: [.github/workflows/diagnosis-probe-v2-once.yml]
permissions:
  contents: read
jobs:
  test-full-suite:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58ef88db33081ec53af5a290b94ada6dd2b03bab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: test "$(git rev-parse HEAD)" = "58ef88db33081ec53af5a290b94ada6dd2b03bab"
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
  verify-real-s3:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58ef88db33081ec53af5a290b94ada6dd2b03bab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[s3]'
      - name: Re-evaluate independently rehashed real historic dataset bytes with fixed v2 probe
        run: |
          python - <<'PY'
          import os,boto3,hashlib,json
          from hephaestus.diagnosis.probes import analyze_dataset_task_coverage
          s3=boto3.client("s3",endpoint_url="https://s3api-eu-cz-1.runpod.io/",
             region_name="EU-CZ-1",aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
             aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"])
          pack=json.load(open("configs/eval_packs/semantic_behavior_v1.yaml"))
          assert pack["content_hash"]=="ee4acffa6d6ac3dadd1705931d65fc02bc4206f2fbddacf71b25af4d1cb5e3ad"
          prefix="hephaestus/scientific/v1/runtime_bindings/"
          specs=[
           ("original",prefix+"first-bounded-scientific-training-001-33866198758/dataset/trainable.jsonl","f7c512199b6a34ce07fabcd4bdbd45a613aad650190c11bd32c0bbb979910b5c",15920505,54878),
           ("candidate",prefix+"planned-run-b8e558e54effac85/dataset/trainable.jsonl","bac39c4c25394e32e86d0e73fe410123e38fcd0d67064e2e1b59a1e31e822fac",157151627,171295)]
          for name,key,expected,expected_bytes,expected_rows in specs:
            source=s3.get_object(Bucket="cviwpryzao",Key=key)["Body"]
            try:
              body=source.read(expected_bytes+1)
            finally: source.close()
            assert len(body)==expected_bytes, "source size changed"
            assert hashlib.sha256(body).hexdigest()==expected, "source SHA changed"
            def records():
              for line in body.splitlines():
                if line.strip():yield json.loads(line)
            evidence,metrics=analyze_dataset_task_coverage(records(),pack,
                source_ref="runpod-s3://cviwpryzao/"+key)
            assert metrics["coverage_probe_version"]==2
            assert metrics["rows_scanned"]==expected_rows
            assert metrics["explicit_prompt_target_rows"]==0
            assert metrics["structured_target_rows"]==0
            assert evidence["data_coverage_gap"] is True
            if name=="original":
              assert metrics["prompt_target_rows"]==0
              assert metrics["embedded_marker_pair_rows"]==0
              assert metrics["supervised_instruction_coverage_present"] is False
            else:
              assert metrics["embedded_marker_pair_rows"]==35774
              assert 0 < metrics["embedded_valid_prompt_target_rows"] <= 35568
              assert metrics["prompt_target_rows"]==metrics["embedded_valid_prompt_target_rows"]
              assert metrics["embedded_empty_or_malformed_rows"]>=206
              assert metrics["supervised_instruction_coverage_present"] is True
              assert metrics["supervised_structure_coverage_present"] is False
            keys=("coverage_probe_version","rows_scanned","explicit_prompt_target_rows",
                  "embedded_marker_pair_rows","embedded_valid_prompt_target_rows",
                  "embedded_empty_or_malformed_rows","prompt_target_rows","structured_target_rows",
                  "supervised_instruction_coverage_present","supervised_structure_coverage_present")
            print("DIAGNOSIS_V2_VERIFIED_"+name.upper()+"="+json.dumps({k:metrics[k] for k in keys},
                    sort_keys=True),flush=True)
          print("DIAGNOSIS_PROBE_V2_REAL_SOURCE_ACCEPTANCE=PASS",flush=True)
          PY
