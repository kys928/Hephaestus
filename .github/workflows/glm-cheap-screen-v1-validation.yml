name: GLM Cheap Screen V1 validation

on:
  push:
    branches: [feature/glm-cheap-screen-v1]
    paths:
      - configs/experiments/hephaestus_glm_cheap_screen_v1.json
      - scripts/run_glm_cheap_screen_v1.py
      - scripts/launch_glm_cheap_screen_v1.py
      - scripts/validate_glm_cheap_screen_v1.py
      - tests/test_glm_cheap_screen_v1.py
      - .github/workflows/glm-cheap-screen-v1-validation.yml
  pull_request:
    branches: [experiment-diagnostic-scaling-v1]
    paths:
      - configs/experiments/hephaestus_glm_cheap_screen_v1.json
      - scripts/run_glm_cheap_screen_v1.py
      - scripts/launch_glm_cheap_screen_v1.py
      - scripts/validate_glm_cheap_screen_v1.py
      - tests/test_glm_cheap_screen_v1.py
      - .github/workflows/glm-cheap-screen-v1-validation.yml
      - .github/workflows/glm-cheap-screen-v1-launch.yml
      - .github/workflows/diagnostic-scaling-recovery-v1-launch.yml
      - configs/experiments/diagnostic_scaling_recovery_v1.launch.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -e '.[s3,test]'
      - name: Compile cheap-screen implementation
        run: |
          python -m py_compile             scripts/run_glm_cheap_screen_v1.py             scripts/launch_glm_cheap_screen_v1.py             scripts/validate_glm_cheap_screen_v1.py
      - name: Validate bounded protocol
        run: python scripts/validate_glm_cheap_screen_v1.py
      - name: Run cheap-screen tests
        run: python -m pytest -q tests/test_glm_cheap_screen_v1.py
      - name: Verify render-only launcher cannot create paid compute
        run: python scripts/launch_glm_cheap_screen_v1.py