name: Hephaestus Boot GPU Quote (read only)
on:
  push:
    branches: [ops/boot-hephaestus-global-20261113]
    paths: [.github/workflows/hephaestus-boot-gpu-catalog.yml]
permissions:
  contents: read
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Inspect real Czech DC GPU availability and secure per-hour rate
        run: |
          python - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://api.runpod.io/v2/catalog/gpus?include=AVAILABILITY&product=POD',headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY']})
          with urllib.request.urlopen(req,timeout=40) as r:got=json.load(r)
          gpus=got.get('gpus',[]) if isinstance(got,dict) else got
          choices=('NVIDIA GeForce RTX 4090','NVIDIA L40S','NVIDIA RTX PRO 6000 Blackwell Server Edition','NVIDIA RTX 6000 Ada Generation','NVIDIA GeForce RTX 5090','NVIDIA L4')
          for g in gpus:
              if g.get('id') not in choices:continue
              dcs=g.get('dataCenters',[]) or []
              cz=[x for x in dcs if x.get('id',x.get('dataCenterId'))=='EU-CZ-1']
              print('GPU_QUOTE='+json.dumps({'id':g['id'],'memory_gb':g.get('memory'),'secure_usd_per_hr':g.get('price',{}).get('secure'),'cz_availability':cz,'availability':g.get('availability')},sort_keys=True)[:1600])
          print('GPU_QUOTE_COMPLETE=true')
          PY
