name: Post-training red-team V1 validate
on:
  push:
    branches: [experiment-post-training-redteam-v1]
    paths:
      - scripts/build_post_training_redteam_v1.py
      - tests/test_post_training_redteam_v1.py
      - .github/workflows/post-training-redteam-v1-validate.yml
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e . pytest
      - run: python scripts/build_post_training_redteam_v1.py
      - run: python -m pytest -q tests/test_post_training_redteam_v1.py
      - run: python -m py_compile scripts/build_post_training_redteam_v1.py
