name: Retire obsolete pending Server D workflow before WK retry (NO GPU)
on:
  push:
    branches: [experiment/D-contrast-WK-bootstrap-repair-20261023]
permissions:
  actions: write
  contents: read
jobs:
  cancel-pending-old-run:
    if: contains(github.event.head_commit.message, '[cancel-stale-server-D]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel old preallocation Server branch GitHub Actions run 39986768639
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/39986768639/cancel"
          echo "Requested cancellation of superseded Server Edition run"
