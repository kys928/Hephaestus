name: Evaluator Semantic V2 explicitly approved C proof
on:
  push:
    branches: [repair/evaluator-semantic-v2]
permissions:
  contents: read
concurrency:
  group: evaluator-semantic-v2-approved-C
  cancel-in-progress: false
jobs:
  training:
    if: contains(github.event.head_commit.message, '[launch-approved-evaluator-semantic-v2-C]')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_EVALUATOR_V2_AUTHORIZED: LAUNCH_APPROVED_EVALUATOR_SEMANTIC_V2
      HEPHAESTUS_EVALUATOR_V2_RUN_ID: evaluator-semantic-v2-C-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3,test]'
      - name: Validate reproducible protocol before allocation
        run: python scripts/validate_evaluator_semantic_repair_v2.py
      - name: Train one explicitly approved C proof
        run: python scripts/launch_evaluator_semantic_repair_v2.py --mode train --execute
  evaluate:
    needs: training
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_EVALUATOR_V2_AUTHORIZED: LAUNCH_APPROVED_EVALUATOR_SEMANTIC_V2
      HEPHAESTUS_EVALUATOR_V2_RUN_ID: evaluator-semantic-v2-C-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Evaluate only the predeclared step-96 checkpoint
        run: python scripts/launch_evaluator_semantic_repair_v2.py --mode evaluate --execute
