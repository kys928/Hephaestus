name: Temporary read-only Prometheus RunPod GPU datacenter stock audit

on:
  pull_request:
    types: [converted_to_draft]

permissions:
  contents: read

concurrency:
  group: prometheus-capacity-audit-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  read-only-stock:
    if: >-
      github.actor == 'kys928' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/prometheus-model-backed-scientific-decision' &&
      github.event.pull_request.number == 201
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read live v2 availability without Pod creation, S3 modification or training
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os,json,urllib.request,datetime
          token=os.environ.get("RUNPOD_API_KEY")
          if not token:
              raise PermissionError("no RunPod catalog authentication")
          endpoint="https://api.runpod.io/v2/catalog/datacenters?include=GPU_AVAILABILITY"
          req=urllib.request.Request(endpoint,headers={"Authorization":"Bearer "+token})
          with urllib.request.urlopen(req,timeout=20) as conn:
              if conn.status!=200:
                  raise RuntimeError("RunPod datacenter GPU catalog not available")
              raw=json.load(conn)
          if not isinstance(raw,dict):
              raise RuntimeError("invalid RunPod catalog response")
          rows=raw.get("dataCenters")
          if not isinstance(rows,list):
              raise RuntimeError("RunPod catalog missing dataCenters")
          print("PROMETHEUS_READ_ONLY_STOCK_TIMESTAMP="+datetime.datetime.now(datetime.timezone.utc).isoformat())
          print("PROMETHEUS_CATALOG_DATACENTER_COUNT="+str(len(rows)))
          for d in rows:
              if not isinstance(d,dict):
                  continue
              identifier=str(d.get("id",""))
              if identifier!="EU-CZ-1" and not identifier.startswith("EU-"):
                  continue
              avail=d.get("gpuAvailability")
              print("PROMETHEUS_DC="+identifier+" "+"GPU_LIST="+str(type(avail).__name__)+" COUNT="+str(len(avail) if isinstance(avail,list) else 0))
              if isinstance(avail,list):
                  for item in avail:
                      if not isinstance(item,dict):
                          continue
                      ident=str(item.get("gpuId",item.get("id","")))[:90]
                      stock=str(item.get("stockStatus",item.get("availability","UNKNOWN")))[:30]
                      if stock.upper() in ("HIGH","MEDIUM","LOW"):
                          print("  GPU="+ident+" STOCK="+stock)
          # Do not issue any create, storage, account mutation, or provider Pod API.
          PY
          echo PROMETHEUS_READ_ONLY_STOCK_COMPLETE=true
