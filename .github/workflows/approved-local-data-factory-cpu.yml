name: Approved local scientific data factory (CPU)
on:
  push:
    branches: [feature/approved-local-data-factory-handoff-20261025]
  pull_request:
    paths:
      - 'src/hephaestus/production/staged_data_factory.py'
      - 'src/hephaestus/production/staged_discovery.py'
      - 'src/hephaestus/production/composition.py'
      - 'tests/test_staged_approved_local_data_factory.py'
      - '.github/workflows/approved-local-data-factory-cpu.yml'
permissions: {contents: read}
jobs:
  data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests only (no GPU or network acquisitions)
        run: python -m pip install -e '.[test]'
      - name: Verify local source approval, hashing, preprocessing and contamination evidence
        run: |
          python -m compileall -q src/hephaestus/production/staged_data_factory.py
          pytest -q tests/test_staged_approved_local_data_factory.py
      - name: Full CPU regression suite
        run: pytest -q tests/
