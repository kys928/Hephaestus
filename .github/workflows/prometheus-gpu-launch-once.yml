name: One-time Prometheus GPU scientific decision (TEMPORARY, remove before merge)

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: prometheus-once-launch-201
  cancel-in-progress: false

jobs:
  launch-prometheus-gpu:
    if: >-
      github.actor == 'kys928' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/prometheus-model-backed-scientific-decision' &&
      github.event.pull_request.number == 201
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - name: Checkout EXACT admitted PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover original published aggregate files from authentic GitHub Actions artifacts
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/prometheus-parent" "$RUNNER_TEMP/prometheus-D"
          gh run download 41645367124 --repo "$GITHUB_REPOSITORY" --name prometheus-granite-certified-parent-dev-aggregate --dir "$RUNNER_TEMP/prometheus-parent"
          gh run download 41609821443 --repo "$GITHUB_REPOSITORY" --name prometheus-granite-d-readonly-rescore --dir "$RUNNER_TEMP/prometheus-D"
          test -f "$RUNNER_TEMP/prometheus-parent/granite-original-parent-dev-aggregate.json"
          test -f "$RUNNER_TEMP/prometheus-D/granite-d-readonly-rescore.json"
          test "$(sha256sum "$RUNNER_TEMP/prometheus-parent/granite-original-parent-dev-aggregate.json" | cut -d' ' -f1)" = 2d1ffa37a9e14939c5c0e9c3365a5fe0a4220a37b502678a1f72f5def366378f
          test "$(sha256sum "$RUNNER_TEMP/prometheus-D/granite-d-readonly-rescore.json" | cut -d' ' -f1)" = 7398eeed835422151678e4e1a79ee4c0d8ead4daf9dba61dd4333aa9acfbf953
          echo PROMETHEUS_BOTH_ORIGINAL_REPORT_BYTES_VERIFIED=true
      - name: Prepare immutable PR code bundle without repository credentials
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          tar --exclude=.git --exclude=.pytest_cache --exclude=__pycache__ --exclude='*.pyc' -czf "$RUNNER_TEMP/prometheus-code.tar.gz" -C source .
          test -s "$RUNNER_TEMP/prometheus-code.tar.gz"
          sha256sum "$RUNNER_TEMP/prometheus-code.tar.gz"
      - name: Install CPU-only provider adapter
        working-directory: source
        run: python -m pip install -q -e '.[test,s3]'
      - name: Verify Prometheus source and provider negative paths before any secrets are loaded
        working-directory: source
        run: pytest -q tests/test_prometheus_scientific_decision.py tests/test_prometheus_granite_public_measurement.py tests/test_prometheus_gpu_provider_guard.py
      - name: Launch ONE genuine GPU Pod only after independently authenticated watchdog readiness
        working-directory: source
        timeout-minutes: 135
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          RUNPOD_API_BASE_URL: https://api.runpod.io/v2
          RUNPOD_DATACENTER_ID: EU-CZ-1
          RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
          RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
        run: |
          set -Eeuo pipefail
          python -u -m scripts.launch_prometheus_gpu_once \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --code-bundle "$RUNNER_TEMP/prometheus-code.tar.gz" \
            --parent-report "$RUNNER_TEMP/prometheus-parent/granite-original-parent-dev-aggregate.json" \
            --d-report "$RUNNER_TEMP/prometheus-D/granite-d-readonly-rescore.json" \
            --state-root "$RUNNER_TEMP/prometheus-operator-state"
      - name: Report sources of scientific truth, never raw model text
        if: always()
        run: |
          echo "Project Prometheus PR #201 genuine GPU event requested."
          echo "Original reference adapter remains immutable."
          echo "Authoritative worker evidence is stored under the exact source SHA on the network volume."
