name: Planner Judge Bakeoff V1 skill report
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths: [.github/workflows/planner-judge-bakeoff-v1-skill-report.yml]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:scripts
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Print concise per-skill report
        run: |
          python - <<'PY'
          import json
          import launch_first_bounded_scientific_training as storage
          run='planner-judge-bakeoff-v1-35538704330'
          key=f'hephaestus/scientific/v1/planner_judge_bakeoff/{run}/result.json'
          obj=json.loads(storage.read_key(storage.s3_client(),key))
          out={'run_id':run,'status':obj['status'],'completed_eval_samples':obj['completed_eval_samples'],'roles':{}}
          for role in ('planner','judge'):
              role_rows={}
              for pair,rec in obj['pair_results'].items():
                  if rec['role']!=role: continue
                  roots={}
                  for rid,rv in rec['comparison']['root_skill_pre_post'].items():
                      roots[rid]={
                        'skill':rv['skill'],'pre':rv['pre'],'post':rv['post'],'delta':rv['delta'],
                        'post_schema':rec['post']['roots'][rid]['schema_compliance'],
                        'post_grounding':rec['post']['roots'][rid]['evidence_grounding'],
                        'post_calibration':rec['post']['roots'][rid]['confidence_calibration'],
                        'post_hallucination':rec['post']['roots'][rid]['hallucination_rate'],
                        'post_exact':rec['post']['roots'][rid]['exact_contract_pass_rate'],
                      }
                  role_rows[rec['candidate_id']]={
                    'zero_shot':rec['zero_shot']['quality_100'],
                    'pre':rec['pre']['quality_100'],
                    'post':rec['post']['quality_100'],
                    'gain':rec['comparison']['quality_gain'],
                    'post_schema':rec['post']['schema_compliance'],
                    'post_grounding':rec['post']['evidence_grounding'],
                    'post_calibration':rec['post']['confidence_calibration'],
                    'post_hallucination':rec['post']['hallucination_rate'],
                    'post_exact':rec['post']['exact_contract_pass_rate'],
                    'latency_pre':rec['pre']['mean_latency_seconds'],
                    'latency_post':rec['post']['mean_latency_seconds'],
                    'mastered_regressions':rec['comparison']['mastered_capability_regressions'],
                    'roots':roots,
                  }
              out['roles'][role]=role_rows
          print('PJ_SKILL_REPORT_JSON '+json.dumps(out,sort_keys=True))
          PY
