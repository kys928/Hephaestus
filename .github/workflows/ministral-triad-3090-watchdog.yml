name: Independent bounded 3090 Coder CUDA RunPod watchdog
on:
  push:
    branches: [ops/ministral-triad-3090-independent-watchdog-20261124]
    paths: [.github/workflows/ministral-triad-3090-watchdog.yml]
permissions: {contents: read}
jobs:
  independent-terminator:
    runs-on: ubuntu-latest
    timeout-minutes: 112
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io
      RUNPOD_API_BASE_URL: https://api.runpod.io/v2
    steps:
      - uses: actions/checkout@v4
        with: {ref: c8c883497b8d8dd97373aa7bb98c148acac7f11b, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: test "$(git rev-parse HEAD)" = c8c883497b8d8dd97373aa7bb98c148acac7f11b
      - run: python -m pip install -e '.[s3,independent-certification]'
      - name: Enforce balance, own-Pod 75m maximum and independent hard deletion
        run: python -u scripts/watchdog_approved_ministral_triad_cuda.py --run-tag 202611240002
