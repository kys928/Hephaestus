name: Independent Evaluator Holdout Review (CPU; no activation)
on:
  push:
    branches: [feature/verified-training-proposal-finalization-20261025]
  pull_request:
    paths:
      - 'src/hephaestus/evaluation/independent_holdout_review.py'
      - 'tests/test_independent_evaluator_holdout_review.py'
      - '.github/workflows/independent-evaluator-holdout-review-cpu.yml'
permissions: {contents: read}
jobs:
  externally-attested-review:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and independent signature verifier
        run: python -m pip install -e '.[test]' 'cryptography>=44,<47'
      - name: Verify attested holdout and adversarial no-certification boundaries
        run: pytest -q tests/test_independent_evaluator_holdout_review.py tests/test_scientific_state_certification.py
      - name: Full standard CPU regression suite
        run: pytest -q tests/
