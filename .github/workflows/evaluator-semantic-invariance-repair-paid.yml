name: Evaluator semantic-invariance repair paid

on:
  push:
    branches:
      - diagnostic/evaluator-sealed-v1-autopsy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluator-semantic-invariance-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  training:
    if: >-
      contains(github.event.head_commit.message, '[launch-evaluator-semantic-repair-v1]')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
      HEPHAESTUS_EVALUATOR_REPAIR_AUTHORIZED: LAUNCH_HEPHAESTUS_EVALUATOR_SEMANTIC_INVARIANCE_REPAIR_V1
      HEPHAESTUS_EVALUATOR_REPAIR_RUN_ID: evaluator-semantic-repair-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]'
      - name: Validate repair protocol before paid launch
        run: |
          python scripts/build_evaluator_semantic_invariance_repair_v1.py
          python -m py_compile \
            scripts/run_evaluator_semantic_invariance_repair_v1.py \
            scripts/evaluator_semantic_repair_common.py \
            scripts/evaluator_semantic_repair_train.py \
            scripts/evaluator_semantic_repair_eval.py \
            scripts/launch_evaluator_semantic_invariance_repair_v1.py \
            scripts/select_evaluator_semantic_invariance_repair_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/experiments/hephaestus_evaluator_semantic_invariance_repair_v1.json').read_text())
          parent=json.loads(Path('configs/experiments/hephaestus_evaluator_certification_candidate_v1.json').read_text())
          assert cfg['required_parent_adapter_sha256'] == '913797ddb8d9d95f83d09a244e8efe430d7bfc4383e589499c2fcc2d943487ed'
          assert parent['model']['adapter_sha256'] == cfg['required_parent_adapter_sha256']
          assert cfg['pack']['canonical_sha256'] == '0d01fe1853742d1259a333fa9a92dec46e8789b69f2019ed34e17d815fc01a3c'
          assert cfg['training']['learning_rate'] == 0.000002
          assert cfg['training']['checkpoint_steps'] == [16,32,48,64,80,96]
          assert cfg['governance']['burned_sealed_partition_use_allowed'] is False
          assert cfg['governance']['certification_claim_allowed'] is False
          assert cfg['governance']['production_promotion_allowed'] is False
          PY
      - name: Train semantic-invariance repair checkpoints
        run: python scripts/launch_evaluator_semantic_invariance_repair_v1.py --mode train --execute

  evaluate:
    needs: training
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        step: [16, 32, 48, 64, 80, 96]
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
      HEPHAESTUS_EVALUATOR_REPAIR_AUTHORIZED: LAUNCH_HEPHAESTUS_EVALUATOR_SEMANTIC_INVARIANCE_REPAIR_V1
      HEPHAESTUS_EVALUATOR_REPAIR_RUN_ID: evaluator-semantic-repair-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]'
      - name: Evaluate checkpoint on fixed development diagnostic
        run: python scripts/launch_evaluator_semantic_invariance_repair_v1.py --mode evaluate --step ${{ matrix.step }} --execute

  select:
    needs: [training, evaluate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/src:${{ github.workspace }}
      HEPHAESTUS_EVALUATOR_REPAIR_RUN_ID: evaluator-semantic-repair-${{ github.run_id }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]'
      - name: Select checkpoint only if every development gate passes
        run: python scripts/select_evaluator_semantic_invariance_repair_v1.py
