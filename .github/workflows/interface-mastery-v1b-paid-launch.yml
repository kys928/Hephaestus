name: Phase II-B adversarial interface recertification
on:
  push:
    branches: [phase-ii-targeted-interface-repair]
    paths:
      - configs/experiments/interface_mastery_v1b.launch.json
permissions: {contents: read}
concurrency:
  group: interface-mastery-v1b-paid
  cancel-in-progress: false
jobs:
  launch:
    if: contains(github.event.head_commit.message, '[launch-interface-mastery-v1b]')
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      PYTHONPATH: src:scripts
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      HEPHAESTUS_PHASE_II_B_LAUNCH_AUTHORIZED: 'LAUNCH_PHASE_II_B_INTERFACE_MASTERY_V1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Require frozen Phase II-B authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/experiments/hephaestus_interface_mastery_v1b.json').read_text())
          marker=json.loads(Path('configs/experiments/interface_mastery_v1b.launch.json').read_text())
          assert cfg['pack']['canonical_sha256']=='e71f02a1965e53d1c157e5c6f1d3adba23216560569325c25b18661967b1a9ed'
          assert cfg['repair_gate']['required_repair_run_id']
          assert cfg['governance']['training_use_allowed'] is False
          assert cfg['governance']['weights_mutation_allowed'] is False
          assert cfg['governance']['production_promotion_allowed'] is False
          assert marker['authorized'] is True and marker['authorized_by'] and marker['authorized_at']
          assert marker['authorization_phrase']=='LAUNCH_PHASE_II_B_INTERFACE_MASTERY_V1'
          PY
      - run: python scripts/build_interface_mastery_v1b.py
      - run: python scripts/launch_interface_mastery_v1b.py --execute
