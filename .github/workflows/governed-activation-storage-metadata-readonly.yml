name: Read-only source and genuine role storage readiness (governed campaign)
on:
  push:
    branches:
      - integration/governed-45-resume-admission-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-only-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit-only metadata client and test dependencies
        run: python -m pip install -e '.[test]' 'boto3>=1.34,<2'
      - name: Verify immutable 45-stage prefix and strict production role admission
        run: pytest -q tests/test_governed_campaign_admission.py tests/test_staged_production_composition.py
      - name: Audit existing frozen S3 role adapters and possible stored campaign state (HEAD/list only)
        run: python scripts/audit_governed_activation_storage_metadata.py
      - name: SHA custody of metadata-only audit output
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('governed_activation_storage_metadata.json')
          payload={'schema':'hephaestus-governed-readonly-storage-custody.v1',
                   'source_commit':os.environ.get('GITHUB_SHA'),
                   'report_exists':p.is_file(),
                   'report_sha256':('sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()) if p.is_file() else None,
                   'dataset_acquisition_performed':False,
                   'gpu_training_executed':False,
                   'stage_12_approval_created':False}
          pathlib.Path('governed_activation_storage_custody.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governed-campaign-storage-metadata-only
          path: |
            governed_activation_storage_metadata.json
            governed_activation_storage_custody.json
          if-no-files-found: error
          retention-days: 30
