name: Inspect Phase II Interface Mastery evidence

on:
  push:
    branches: [phase-ii-interface-mastery]
    paths:
      - .github/workflows/interface-mastery-v1-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install boto3
      - name: Aggregate frozen Phase II sample evidence
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter, defaultdict
          import boto3
          from botocore.config import Config

          run_id = "interface-mastery-v1-35734212862"
          prefix = f"hephaestus/scientific/v1/interface_mastery/{run_id}/samples/"
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["RUNPOD_S3_ENDPOINT_URL"].rstrip("/"),
              region_name=os.environ["RUNPOD_DATACENTER_ID"],
              aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"],
              config=Config(retries={"mode": "standard", "max_attempts": 5}),
          )
          bucket = os.environ["RUNPOD_NETWORK_VOLUME_ID"]

          def extract(raw):
              text = str(raw).strip()
              candidates=[]; depth=0; start=None; ins=False; esc=False
              for i,ch in enumerate(text):
                  if ins:
                      if esc: esc=False
                      elif ch=="\\": esc=True
                      elif ch=='"': ins=False
                      continue
                  if ch=='"': ins=True
                  elif ch=="{":
                      if depth==0: start=i
                      depth+=1
                  elif ch=="}" and depth:
                      depth-=1
                      if depth==0 and start is not None:
                          try:
                              v=json.loads(text[start:i+1])
                              if isinstance(v,dict): candidates.append(v)
                          except Exception:
                              pass
                          start=None
              return candidates[-1] if candidates else None

          keys=[]
          token=None
          while True:
              kwargs={"Bucket":bucket,"Prefix":prefix}
              if token: kwargs["ContinuationToken"]=token
              page=client.list_objects_v2(**kwargs)
              keys += [x["Key"] for x in page.get("Contents",[]) if x["Key"].endswith(".json")]
              if not page.get("IsTruncated"): break
              token=page.get("NextContinuationToken")

          agg=defaultdict(lambda:{
              "cases":0,"producer_exact":0,"consumer_exact":0,"producer_schema":0,"consumer_schema":0,
              "boundary_pass":0,"evidence_grounded":0,"deadline_hits":0,
              "failures":Counter(),"producer_mismatch_fields":Counter(),"consumer_mismatch_fields":Counter(),
              "failed_case_ids":[],"boundary_failed_cases":[]
          })
          overall_failures=Counter()
          for key in sorted(keys):
              response=client.get_object(Bucket=bucket,Key=key)
              data=json.loads(response["Body"].read())
              case=data["case"]; sc=data["scorecard"]; iface=case["interface_id"]
              prod=extract(data["producer_generation"]["projected_output"])
              cons=extract(data["consumer_generation"]["projected_output"])
              a=agg[iface]; a["cases"]+=1
              for metric,field in [
                  ("producer_exact","producer_contract_exact"),
                  ("consumer_exact","consumer_contract_exact"),
                  ("producer_schema","producer_schema_valid"),
                  ("consumer_schema","consumer_schema_valid"),
                  ("boundary_pass","deterministic_boundary_passed"),
                  ("evidence_grounded","evidence_grounded")
              ]:
                  a[metric]+=int(bool(sc[field]))
              a["deadline_hits"] += int(bool(data["producer_generation"].get("deadline_hit"))) + int(bool(data["consumer_generation"].get("deadline_hit")))
              for f in sc["failures"]:
                  a["failures"][f]+=1; overall_failures[f]+=1
              if sc["failures"]:
                  a["failed_case_ids"].append(case["case_id"])
              if not sc["deterministic_boundary_passed"]:
                  a["boundary_failed_cases"].append({
                      "case_id":case["case_id"],
                      "boundary":data.get("deterministic_boundary")
                  })
              for role,actual,expected,counter in [
                  ("producer",prod,case["producer_expected"],a["producer_mismatch_fields"]),
                  ("consumer",cons,case["consumer_expected"],a["consumer_mismatch_fields"])
              ]:
                  if not isinstance(actual,dict):
                      counter["not_json"]+=1
                      continue
                  for field in ("decision","action","primary_variable"):
                      if str(actual.get(field)) != str(expected.get(field)):
                          counter[field]+=1
                  try:
                      c=float(actual.get("confidence",-1))
                      if not (float(expected.get("confidence_min",0)) <= c <= float(expected.get("confidence_max",1))):
                          counter["confidence"]+=1
                  except Exception:
                      counter["confidence"]+=1

          serial={}
          for iface,a in sorted(agg.items()):
              serial[iface]={**{k:v for k,v in a.items() if not isinstance(v,Counter)},
                  "failures":dict(a["failures"]),
                  "producer_mismatch_fields":dict(a["producer_mismatch_fields"]),
                  "consumer_mismatch_fields":dict(a["consumer_mismatch_fields"])}
          report={"interfaces":serial,"overall_failures":dict(overall_failures),"total_sample_files":len(keys)}
          print("PHASE_II_AGGREGATE_JSON "+json.dumps(report,separators=(",",":"),sort_keys=True))
          PY
