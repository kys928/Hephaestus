name: Inspect Phase II Interface Mastery evidence

on:
  push:
    branches: [phase-ii-interface-mastery]
    paths:
      - .github/workflows/interface-mastery-v1-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install boto3
      - name: Inspect frozen Phase II sample evidence
        run: |
          python - <<'PY'
          import json, os
          import boto3
          from botocore.config import Config

          run_id = "interface-mastery-v1-35734212862"
          prefix = f"hephaestus/scientific/v1/interface_mastery/{run_id}/samples/"
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["RUNPOD_S3_ENDPOINT_URL"].rstrip("/"),
              region_name=os.environ["RUNPOD_DATACENTER_ID"],
              aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"],
              config=Config(retries={"mode": "standard", "max_attempts": 5}),
          )
          bucket = os.environ["RUNPOD_NETWORK_VOLUME_ID"]

          def extract(raw):
              text = str(raw).strip()
              candidates=[]
              depth=0; start=None; ins=False; esc=False
              for i,ch in enumerate(text):
                  if ins:
                      if esc: esc=False
                      elif ch=="\\": esc=True
                      elif ch=='"': ins=False
                      continue
                  if ch=='"': ins=True
                  elif ch=="{":
                      if depth==0: start=i
                      depth+=1
                  elif ch=="}" and depth:
                      depth-=1
                      if depth==0 and start is not None:
                          try:
                              v=json.loads(text[start:i+1])
                              if isinstance(v,dict): candidates.append(v)
                          except Exception:
                              pass
                          start=None
              return candidates[-1] if candidates else None

          keys=[]
          token=None
          while True:
              kwargs={"Bucket":bucket,"Prefix":prefix}
              if token: kwargs["ContinuationToken"]=token
              page=client.list_objects_v2(**kwargs)
              keys += [x["Key"] for x in page.get("Contents",[]) if x["Key"].endswith(".json")]
              if not page.get("IsTruncated"): break
              token=page.get("NextContinuationToken")

          rows=[]
          for key in sorted(keys):
              response=client.get_object(Bucket=bucket,Key=key)
              data=json.loads(response["Body"].read())
              case=data["case"]; score=data["scorecard"]
              prod=extract(data["producer_generation"]["projected_output"])
              cons=extract(data["consumer_generation"]["projected_output"])
              def slim(x):
                  if not isinstance(x,dict): return None
                  return {k:x.get(k) for k in ("decision","action","primary_variable","confidence","evidence_refs")}

              rows.append({
                  "case_id":case["case_id"],
                  "interface_id":case["interface_id"],
                  "producer_expected":{k:case["producer_expected"].get(k) for k in ("decision","action","primary_variable","confidence_min","confidence_max")},
                  "producer_actual":slim(prod),
                  "consumer_expected":{k:case["consumer_expected"].get(k) for k in ("decision","action","primary_variable","confidence_min","confidence_max")},
                  "consumer_actual":slim(cons),
                  "scorecard":score,
                  "deterministic_boundary":data.get("deterministic_boundary"),
                  "producer_deadline_hit":data["producer_generation"].get("deadline_hit"),
                  "consumer_deadline_hit":data["consumer_generation"].get("deadline_hit"),
              })

          print("PHASE_II_CASE_REPORT_JSON "+json.dumps(rows,separators=(",",":"),sort_keys=True))
          PY
