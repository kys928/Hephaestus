name: Hephaestus Global Volume Bootstrap Once

on:
  push:
    branches:
      - chore/global-volume-bootstrap-20261106

permissions:
  contents: read

concurrency:
  group: hephaestus-global-volume-bootstrap
  cancel-in-progress: false

jobs:
  provision-empty-global-volume:
    if: >-
      github.repository == 'kys928/Hephaestus' &&
      github.ref == 'refs/heads/chore/global-volume-bootstrap-20261106' &&
      github.event.head_commit.message == 'Bootstrap empty Hephaestus Global Volume using authenticated one-shot v2 API'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check and provision one empty global volume; no pods, copies, or deletion
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "https://api.runpod.io/v2"
          NAME = "hephaestus-global-artifacts"
          token = os.getenv("RUNPOD_API_KEY", "")
          if not token:
              raise SystemExit("BLOCKED: RUNPOD_API_KEY secret missing, no volume created")

          def api(method, resource, payload=None):
              req = urllib.request.Request(
                  BASE + resource,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f"RunPod Global Volume API {method} returned HTTP {exc.code}; no automatic retry") from None

          found = []
          cursor = None
          seen = set()
          for _ in range(100):
              suffix = "?limit=100"
              if cursor is not None:
                  suffix += "&cursor=" + urllib.parse.quote(cursor, safe="")
              status, data = api("GET", "/global-volumes" + suffix)
              if status != 200 or not isinstance(data, dict) or not isinstance(data.get("globalVolumes"), list):
                  raise RuntimeError("Cannot verify existing global volumes; refusing create")
              for volume in data["globalVolumes"]:
                  if isinstance(volume, dict) and volume.get("name") == NAME:
                      found.append(volume)
              page = data.get("pagination")
              if not isinstance(page, dict) or page.get("hasNextPage") is not True:
                  break
              cursor = page.get("nextCursor")
              if not isinstance(cursor, str) or not cursor or cursor in seen:
                  raise RuntimeError("Global Volume listing pagination ambiguous; refusing create")
              seen.add(cursor)
          else:
              raise RuntimeError("Global Volume listing exceeded bounded pagination; refusing create")

          if len(found) > 1:
              raise RuntimeError("Multiple global volumes have the target name; refusing ambiguous selection")
          if found:
              ident = found[0].get("id")
              print("HEPHAESTUS_GLOBAL_VOLUME_RESULT=already_exists")
          else:
              print("HEPHAESTUS_GLOBAL_VOLUME_CREATING_EMPTY=true", flush=True)
              status, created = api("POST", "/global-volumes", {"name": NAME})
              if status != 201 or not isinstance(created, dict):
                  raise RuntimeError("Global Volume creation result not a verified 201 record")
              ident = created.get("id")
              print("HEPHAESTUS_GLOBAL_VOLUME_RESULT=created")
          if not isinstance(ident, str) or not ident.startswith("gsb_"):
              raise RuntimeError("Global Volume identity absent/unexpected; creation outcome requires manual reconciliation")
          status, actual = api("GET", "/global-volumes/" + urllib.parse.quote(ident, safe=""))
          if status != 200 or not isinstance(actual, dict) or actual.get("id") != ident or actual.get("name") != NAME:
              raise RuntimeError("Global Volume read-back mismatch; do not create another")
          print("HEPHAESTUS_GLOBAL_VOLUME_ID=" + ident)
          print("HEPHAESTUS_GLOBAL_VOLUME_NAME=" + NAME)
          print("HEPHAESTUS_GLOBAL_VOLUME_VERIFIED=true")
          print("HEPHAESTUS_VOLUME_DATA_MIGRATED=false")
          print("HEPHAESTUS_EXISTING_EU_CZ_1_VOLUME_UNCHANGED=true")
          print("HEPHAESTUS_GPU_PODS_CREATED=0")
          PY
