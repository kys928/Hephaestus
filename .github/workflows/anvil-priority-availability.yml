name: Anvil Czech GPU availability read
on:
  pull_request:
    paths:
      - .github/workflows/anvil-priority-availability.yml
permissions:
  contents: read
jobs:
  quote:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/anvil-integration' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact candidate availability and price
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PYTHONPATH: src
        run: python scripts/anvil_readonly_gpu_quote.py
