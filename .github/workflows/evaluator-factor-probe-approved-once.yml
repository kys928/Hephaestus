name: Evaluator D factor-only inference ONE approved allocation
on:
  push:
    branches: [experiment/evaluator-factor-only-D-20261016]
permissions:
  contents: read
concurrency:
  group: hephaestus-one-factor-only-D-20261016
  cancel-in-progress: false
jobs:
  infer:
    if: contains(github.event.head_commit.message, '[launch-approved-factor-only-D-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_FACTOR_PROBE_AUTHORIZED: ONE_APPROVED_FACTOR_INFERENCE_ONLY
      HEPHAESTUS_FACTOR_PROBE_RUN_ID: factor-only-D-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU-only launcher and test dependencies
        run: python -m pip install -e '.[s3,test]'
      - name: Verify immutable probe scope, strict budget and startup route
        run: |
          python scripts/preflight_evaluator_factor_probe.py
          python scripts/launch_evaluator_factor_probe.py
          pytest -q tests/test_evaluator_factor_probe_paid_guard.py
      - name: Allocate one bounded GPU pod for 64 factor reports
        run: python scripts/launch_evaluator_factor_probe.py --execute
  independent-audit:
    needs: infer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_FACTOR_PROBE_RUN_ID: factor-only-D-${{ github.run_id }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install S3-only assessment dependencies
        run: python -m pip install -e '.[s3]'
      - name: Re-score all 64 saved factor outputs against original D cases
        run: python scripts/assess_evaluator_factor_probe_readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluator-D-factor-probe-independent-assessment
          path: evaluator-factor-probe-assessment.json
