name: Hephaestus recovery status snapshot (read-only)
on:
  push:
    branches: [ops/global-volume-recovery-20261112]
    paths:
      - .github/workflows/hephaestus-recovery-status.yml
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      TARGET_RUN_ID: '43248214667'
    steps:
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Read Pod and S3 progress only
        run: |
          python - <<'PY'
          import os,json,urllib.request,boto3
          from botocore.exceptions import ClientError
          runid=os.environ['TARGET_RUN_ID']
          url='https://api.runpod.io/v2/pods'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY']}),timeout=30) as response: data=json.load(response)
          pods=data if isinstance(data,list) else data.get('pods',data.get('data',[]))
          matches=[p for p in pods if isinstance(p,dict) and p.get('name')=='hephaestus-hf-global-recovery-'+runid]
          print('RECOVERY_POD_MATCHES='+str(len(matches)))
          for p in matches: print('RECOVERY_POD_ID='+str(p.get('id'))+' STATUS='+str(p.get('desiredStatus',p.get('status'))))
          s3=boto3.client('s3',region_name='EU-CZ-1',endpoint_url='https://s3api-eu-cz-1.runpod.io/',aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'])
          try:
              obj=s3.get_object(Bucket='cviwpryzao',Key='hephaestus/recovery-status/'+runid+'.json')
          except ClientError as e:
              if e.response.get('Error',{}).get('Code') not in {'404','NoSuchKey','NotFound'}:raise
              print('RECOVERY_S3_STATUS=not-yet-written')
          else:
              raw=json.load(obj['Body'])
              print('RECOVERY_S3_STATUS='+json.dumps(raw,sort_keys=True))
          PY
