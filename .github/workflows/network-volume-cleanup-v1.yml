name: Hephaestus network volume cleanup V1

on:
  push:
    branches: [feature/production-loop-v1]
    paths:
      - .github/workflows/network-volume-cleanup-v1.yml
      - scripts/run_network_volume_cleanup_v1.py
      - scripts/launch_network_volume_cleanup_v1.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-volume-cleanup-cviwpryzao
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[launch-network-volume-cleanup-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governed RunPod/S3 launcher
        run: python -m pip install -e '.[s3]'
      - name: Compile maintenance scripts
        run: python -m py_compile scripts/run_network_volume_cleanup_v1.py scripts/launch_network_volume_cleanup_v1.py
      - name: Launch conservative cleanup pod on persistent Network Volume
        run: python scripts/launch_network_volume_cleanup_v1.py
      - name: Preserve cleanup audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-volume-cleanup-v1-report
          path: |
            storage_cleanup_report.json
            storage_cleanup_launcher.json
          if-no-files-found: warn
          retention-days: 90
