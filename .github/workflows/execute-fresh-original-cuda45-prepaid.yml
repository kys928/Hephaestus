name: Execute genuine fresh original CUDA45 r2 with independently bounded prepaid RTX4090
on:
  push:
    branches: [feature/cuda45-fresh-admission-20261029]
    paths: ['.github/workflows/execute-fresh-original-cuda45-prepaid.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: original-full-five-cuda45-r2-user-prepaid-once
  cancel-in-progress: false
jobs:
  independently-verify-admission:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_API_BASE_URL: https://api.runpod.io/v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test,s3,independent-certification]'
      - name: Check original deterministic Controller regression and prepaid source admission
        run: |
          python -m pytest -q tests/test_tier_a_cuda_role_stages.py tests/test_original_cuda45_prepaid_launch_contract.py tests/test_signed_cuda_compute_authorization.py
          python - <<'PY'
          import os,sys
          sys.path.insert(0,"scripts")
          from launch_user_delegated_full_cuda45 import (
              client_s3,require_source,decide_budget,GPU,WORKFLOW,RUN)
          from hephaestus.providers.runpod.config import RunPodConfig
          from hephaestus.providers.runpod.cost_intelligence import ReadOnlyRunPodPricing
          from decimal import Decimal
          cfg=RunPodConfig.from_env()
          if cfg.datacenter_id!="EU-CZ-1" or cfg.network_volume_id!="cviwpryzao":
              raise PermissionError("unauthorized RunPod science storage")
          req=require_source(client_s3(cfg),cfg.network_volume_id)
          assert req["workflow_id"]==WORKFLOW and req["run_id"]==RUN
          provider=ReadOnlyRunPodPricing(bearer_token=os.environ["RUNPOD_API_KEY"])
          account=provider.account()
          rate=provider.quote_gpu(gpu_id=GPU,datacenter_id=cfg.datacenter_id)
          if rate.gpu_memory_gb<24 or rate.price_usd_per_hour>Decimal("0.89"):
              raise PermissionError("unapproved RTX4090 quote")
          seconds=decide_budget(account,rate)
          if seconds<3600:
              raise PermissionError("prepaid campaign has insufficient safe budget")
          print("FRESH_ORIGINAL_CUDA45_CPU_FIRST_STAGE_REGRESSION=PASSED")
          print("FRESH_ORIGINAL_CUDA45_READONLY_ADMISSION=PASSED")
          print("FRESH_ORIGINAL_CUDA45_COST_CEILING_SECONDS="+str(seconds))
          print("PREALLOC_GPU_PODS_CREATED=0")
          PY
  full-45-original-cuda-science:
    needs: [independently-verify-admission]
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 275
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_API_BASE_URL: https://api.runpod.io/v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3,independent-certification]'
      - name: Rent at most one actual prepaid RTX4090 with freshly signed, exact-source grant and perform real original five-role CUDA45
        env:
          GITHUB_WORKFLOW_RUN_TAG: ${{ github.run_id }}
          GITHUB_BRANCH_COMMIT: ${{ github.sha }}
        run: |
          python -u scripts/launch_user_delegated_full_cuda45.py \
            --commit-sha "$GITHUB_BRANCH_COMMIT" \
            --run-tag "$GITHUB_WORKFLOW_RUN_TAG"
      - name: No historical independent certification or model promotion claimed
        if: always()
        run: |
          echo 'SUCCESS requires 45 native scientific records, 5 real original GPU role inferences and 96 genuine CUDA optimizer receipts.'
          echo 'Independent cold verification executes only after the Pod has been deleted.'
          echo 'No historical independent scientific certification or model promotion is claimed.'
  independent-hard-budget-pod-watchdog:
    needs: [independently-verify-admission]
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 285
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
      RUNPOD_API_BASE_URL: https://api.runpod.io/v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Independent live prepaid credit and hard duration stop on exact new r2 GitHub run Pod
        env:
          GITHUB_WORKFLOW_RUN_TAG: ${{ github.run_id }}
        run: |
          python -u scripts/watchdog_user_delegated_full_cuda45.py \
            --run-tag "$GITHUB_WORKFLOW_RUN_TAG"
