name: D RTX PRO 6000 Blackwell Workstation fallback one-shot $1.80
on:
  push:
    branches: [experiment/D-contrast-Blackwell-Workstation-fallback-20261023]
permissions:
  contents: read
concurrency:
  group: hephaestus-D-shared-approval-BLACKWELL-EURIS2-20261023
  cancel-in-progress: false
jobs:
  guarded-inference:
    # Only an explicit unique launch marker may create one Blackwell pod. Original
    # S3 archive remains in EU-CZ-1 and is accessed via HTTPS, not mounted.
    if: contains(github.event.head_commit.message, '[explicit-launch-approved-D-instrumented-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 205
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_CONTRAST_AUTHORIZED: SINGLE_D_CONTRAST_PROBE
      HEPHAESTUS_CONTRAST_RUN_ID: D-contrast-${{ github.run_id }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: https://rest.runpod.io/v1
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
      HEPHAESTUS_GPU_DATACENTER_ID: EU-CZ-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install CPU dependencies
        run: python -m pip install -e '.[s3,test]'
      - name: Verify frozen protocol, timing and spending/approval controls
        run: pytest -q tests/test_D_contrast_durable_timing_prelaunch.py tests/test_evaluator_contrast_inference.py tests/test_evaluator_effect_polarity_contrasts.py tests/test_preflight_D_contrast_region_stock.py
      - name: Poll RTX PRO 6000 Workstation 1x EU-CZ-1 Secure Cloud stock for up to 15 minutes (no claim)
        shell: bash
        run: |
          for i in $(seq 1 30); do
            echo "D_BLACKWELL_CAPACITY_POLL attempt=$i of 30 (preallocation only)"
            if python scripts/preflight_D_contrast_region_stock.py; then
              echo "D_BLACKWELL_CAPACITY_POLL positive_verified"
              exit 0
            fi
            sleep 30
          done
          echo "D_BLACKWELL_CAPACITY_POLL exhausted_without_gpu"
          exit 75
      - name: ONE explicitly approved GPU inference with immutable S3 timing
        run: python scripts/launch_evaluator_contrast_probe.py --execute
  independent-verification:
    needs: guarded-inference
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts:src:.
      HEPHAESTUS_CONTRAST_RUN_ID: D-contrast-${{ github.run_id }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_S3_ENDPOINT_URL: https://s3api-eu-cz-1.runpod.io/
      RUNPOD_DATACENTER_ID: EU-CZ-1
      RUNPOD_NETWORK_VOLUME_ID: cviwpryzao
      HEPHAESTUS_GPU_DATACENTER_ID: EU-CZ-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Independently rescore exactly all 56 persisted D prompts and 60 pairs
        run: python scripts/assess_evaluator_contrast_readonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: D-instrumented-approved-run-scientific-audit
          path: D-contrast-inference-independent.json
