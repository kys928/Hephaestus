name: Inspect assistant-prefill GPU smoke

on:
  push:
    branches: [launch/second-real-model-positive-wave]
    paths:
      - .github/workflows/inspect-assistant-prefill-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3
      - name: Read exact smoke execution prefix
        run: |
          python - <<'PY'
          import json, os
          import boto3
          bucket = os.environ['RUNPOD_NETWORK_VOLUME_ID']
          client = boto3.client(
              's3', endpoint_url=os.environ['RUNPOD_S3_ENDPOINT_URL'].rstrip('/'),
              region_name=os.environ['RUNPOD_DATACENTER_ID'],
              aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
          )
          prefix = 'hephaestus/scientific/v1/executions/assistant-prefill-smoke-33997417207/'
          page = client.list_objects_v2(Bucket=bucket, Prefix=prefix, MaxKeys=100)
          for obj in page.get('Contents', []):
              key, size = obj['Key'], int(obj.get('Size', 0))
              print('KEY', size, key)
              if key.endswith('driver_result.json'):
                  raw = client.get_object(Bucket=bucket, Key=key)['Body'].read()
                  print('DRIVER_RESULT_BEGIN')
                  print(raw.decode('utf-8', errors='replace'))
                  print('DRIVER_RESULT_END')
              elif key.endswith('pod_runtime.log'):
                  raw = client.get_object(Bucket=bucket, Key=key)['Body'].read()
                  print('POD_LOG_TAIL_BEGIN')
                  print(raw.decode('utf-8', errors='replace')[-16000:])
                  print('POD_LOG_TAIL_END')
          PY
