name: Verified model/data/recipe PEFT proposal admission (CPU)
on:
  push:
    branches: [feature/verified-training-proposal-finalization-20261025]
  pull_request:
    paths:
      - 'src/hephaestus/production/staged_finalization.py'
      - 'src/hephaestus/production/composition.py'
      - 'tests/test_staged_verified_training_finalization.py'
      - '.github/workflows/verified-training-proposal-finalization-cpu.yml'
permissions: {contents: read}
jobs:
  proposal-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test requirements
        run: python -m pip install -e '.[test]'
      - name: Exercise genuine local data/model/recipe selection and tamper refusal
        run: |
          python -m compileall -q src/hephaestus/production/staged_finalization.py
          pytest -q tests/test_staged_verified_training_finalization.py
      - name: Full CPU regression suite
        run: pytest -q tests/
