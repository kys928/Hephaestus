name: Research engine one-shot verification
on:
  push:
    branches: [ops/research-engine-verify-20261114]
    paths: [.github/workflows/research-engine-one-shot.yml]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2321187f5bff158bf266d49fcc9f7b7f51b26d60
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: test "$(git rev-parse HEAD)" = "2321187f5bff158bf266d49fcc9f7b7f51b26d60"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_autonomous_evaluation_only_research.py tests/test_constrained_research_self_repair.py tests/test_autonomous_repair_episode.py tests/test_durable_research_objective_jobs.py tests/test_targeted_post_failure_probes.py
      - run: python -m pytest -q
  verify-source-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2321187f5bff158bf266d49fcc9f7b7f51b26d60
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[s3]'
      - name: Verify independent source hashes and actual evidence acquisition (no model calls)
        run: |
          python - <<'PY'
          import os,hashlib,json
          import boto3
          from hephaestus.research.autonomous_study import SourceCatalog,ResearchObjective,ReadOnlyS3SourceReader,VerifiedSourceAcquirer
          from hephaestus.storage.filesystem import FileSystemArtifactStore
          from hephaestus.storage.sqlite import SQLiteStateRepository
          from pathlib import Path
          import tempfile
          index=Path("configs/research/diagnosis_historical_source_catalog_v1.json")
          digest="sha256:"+hashlib.sha256(index.read_bytes()).hexdigest()
          print("RESEARCH_CATALOG_REVIEWED_SHA256="+digest,flush=True)
          catalog=SourceCatalog.load(index,independently_pinned_sha256=digest)
          obj=ResearchObjective.from_text("Investigate Diagnostician reliability and coverage evidence")
          originals=catalog.select(obj)
          client=boto3.client("s3",endpoint_url="https://s3api-eu-cz-1.runpod.io/",
              region_name="EU-CZ-1",aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_ACCESS_KEY"])
          with tempfile.TemporaryDirectory() as d:
            artifacts=FileSystemArtifactStore(Path(d)/"artifacts")
            state=SQLiteStateRepository(Path(d)/"state.db")
            acquirer=VerifiedSourceAcquirer(ReadOnlyS3SourceReader(client,"cviwpryzao"),artifacts,state)
            pack=json.loads(Path("configs/eval_packs/semantic_behavior_v1.yaml").read_text())
            for source in originals:
              obs=acquirer.acquire(source,pack)
              print("RESEARCH_AUTHENTIC_SOURCE="+json.dumps({"role":source.role,
                "rows":obs["counts"]["rows_scanned"],
                "valid_pairs":obs["counts"]["prompt_target_rows"],
                "structured_targets":obs["counts"]["structured_target_rows"],
                "source_ref":source.sha256_ref},sort_keys=True),flush=True)
              if source.role=="original":
                assert obs["counts"]["prompt_target_rows"]==0
              else:
                assert obs["counts"]["prompt_target_rows"]==35568
                assert obs["counts"]["structured_target_rows"]==0
          print("RESEARCH_OBJECTIVE_SOURCE_ACQUISITION=PASS",flush=True)
          PY

  verify-real-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2321187f5bff158bf266d49fcc9f7b7f51b26d60
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Build fixed unit-test Docker image in ephemeral runner (no repo tokens)
        run: |
          docker build -t hephaestus-sandbox-test:local - <<'DOCKERFILE'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir pytest==8.4.2
          DOCKERFILE
      - name: Prove real rootless offline container red-to-green without touching original checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json, tempfile, subprocess, shutil
          from hephaestus.research.constrained_repair import (
              PatchCandidate,RepairScope,ConstrainedSelfRepair,OfflineDockerPytestRunner,
          )
          from hephaestus.storage.filesystem import FileSystemArtifactStore
          from hephaestus.storage.verified import canonical_bytes
          image=subprocess.run(["docker","image","inspect","--format={{.Id}}",
              "hephaestus-sandbox-test:local"],check=True,capture_output=True,text=True).stdout.strip()
          assert image.startswith("sha256:") and len(image)==71
          with tempfile.TemporaryDirectory() as d:
            root=Path(d); workspace=root/"workspace"
            source=workspace/"src"/"hephaestus"/"diagnosis"/"probes.py"
            test=workspace/"tests"/"test_targeted_post_failure_probes.py"
            source.parent.mkdir(parents=True); test.parent.mkdir(parents=True)
            source.write_text("def diagnostic_value():\n    return 'wrong'\n")
            test.write_text("from hephaestus.diagnosis.probes import diagnostic_value\n"
               "def test_diagnosis_value():\n    assert diagnostic_value() == 'fixed'\n")
            for args in (
               ["git","init","-q",str(workspace)],
               ["git","-C",str(workspace),"config","user.name","offline-test"],
               ["git","-C",str(workspace),"config","user.email","offline@example.invalid"],
               ["git","-C",str(workspace),"add","."],
               ["git","-C",str(workspace),"commit","-qm","pinned red source"],
            ):subprocess.run(args,check=True)
            head=subprocess.run(["git","-C",str(workspace),"rev-parse","HEAD"],
                capture_output=True,text=True,check=True).stdout.strip()
            scope=RepairScope(head,"src/hephaestus/diagnosis/probes.py",
                   "tests/test_targeted_post_failure_probes.py")
            artifacts=FileSystemArtifactStore(root/"artifacts")
            fault=artifacts.put_bytes(canonical_bytes({
                "schema":"reviewed-code-failure.v1","status":"verified_failed",
                "target_file":scope.allowed_file})).artifact_ref
            candidate=PatchCandidate(scope.allowed_file,
                "sha256:"+sha256(source.read_bytes()).hexdigest(),
                "def diagnostic_value():\n    return 'fixed'\n",
                fault,"A real failing baseline must become green with the exact proposed fix.")
            runner=OfflineDockerPytestRunner(image_digest=image,
                     docker_executable=shutil.which("docker"),timeout_seconds=100)
            report=ConstrainedSelfRepair(artifacts,runner).trial(
                 checkout=workspace,scope=scope,candidate=candidate,verified_fault_ref=fault)
            assert report["red_to_green_verified"] is True,report
            assert report["baseline"]["exit_code"]!=0 and report["candidate"]["exit_code"]==0
            assert source.read_text().endswith("return 'wrong'\n")
            print("REAL_ROOTLESS_OFFLINE_DOCKER_RED_TO_GREEN=PASS",flush=True)
          PY
