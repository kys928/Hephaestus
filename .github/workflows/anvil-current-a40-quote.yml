name: Anvil Swedish A40 read-only quote
on:
  pull_request:
    paths: [.github/workflows/anvil-current-a40-quote.yml]
permissions:
  contents: read
jobs:
  quote:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/anvil-integration' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/anvil_global_gpu_inventory.py
