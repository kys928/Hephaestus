name: Hephaestus pinned HF and Czech source preflight (read only)
on:
  push:
    branches: [ops/czech-bulk-snapshot-20261113]
    paths:
      - .github/workflows/hephaestus-hf-czech-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/hephaestus_hf_czech_inventory_preflight.py
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify private HF export and Czech inventory without allocating compute
        run: python -u scripts/hephaestus_hf_czech_inventory_preflight.py
