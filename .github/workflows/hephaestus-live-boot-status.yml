name: Hephaestus corrected repository-root Pod status (read only)
on:
  push:
    branches: [ops/boot-hephaestus-global-20261113]
    paths: [.github/workflows/hephaestus-live-boot-status.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Read exact boot Pod and regional status receipt
        run: |
          python - <<'PY'
          import os,json,urllib.request,boto3
          from botocore.exceptions import ClientError
          rid='43426431029'
          request=urllib.request.Request('https://api.runpod.io/v2/pods',headers={'Authorization':'Bearer '+os.environ['RUNPOD_API_KEY']})
          with urllib.request.urlopen(request,timeout=30) as r: ps=json.load(r)
          rows=ps if isinstance(ps,list) else ps.get('pods',ps.get('data',[]))
          matches=[p for p in rows if isinstance(p,dict) and p.get('name')=='hephaestus-global-live-'+rid]
          print('HEPHAESTUS_BOOT_POD_COUNT='+str(len(matches)))
          if matches:print('HEPHAESTUS_BOOT_POD_STATUS='+str(matches[0].get('desiredStatus',matches[0].get('status'))))
          s3=boto3.client('s3',endpoint_url='https://s3api-eu-cz-1.runpod.io/',region_name='EU-CZ-1',aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'])
          try:
              o=s3.get_object(Bucket='cviwpryzao',Key='hephaestus/boot-status/'+rid+'.json')
          except ClientError as exc:
              if str(exc.response.get('Error',{}).get('Code')) not in {'404','NoSuchKey','NotFound'}:raise
              print('HEPHAESTUS_BOOT_PHASE=not-yet-written')
          else:
              with o['Body'] as f: status=json.load(f)
              permitted=['phase','error_class','error_summary','doctor','loaded_roles','role_names','model_scope','runtime_state','console','backup_sha256']
              print('HEPHAESTUS_BOOT_STATUS='+json.dumps({k:status[k] for k in permitted if k in status},sort_keys=True))
          PY
