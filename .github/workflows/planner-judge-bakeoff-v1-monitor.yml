name: Planner Judge Bakeoff V1 launch monitor
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths: [.github/workflows/planner-judge-bakeoff-v1-monitor.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:scripts
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_API_BASE_URL: ${{ vars.RUNPOD_API_BASE_URL }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Inspect active bakeoff
        run: |
          python - <<'PY'
          import json
          from hephaestus.infrastructure.secrets import EnvironmentSecretsProvider
          from hephaestus.providers.runpod import RunPodConfig,RunPodExecutionAdapter
          import launch_first_bounded_scientific_training as storage
          target='planner-judge-bakeoff-v1-35538704330'
          ex=RunPodExecutionAdapter(RunPodConfig.from_env(),EnvironmentSecretsProvider())
          status,payload=ex._request('GET','pods')
          pods=payload if isinstance(payload,list) else payload.get('pods',[]) if isinstance(payload,dict) else []
          target_pods=[{k:p.get(k) for k in ('id','name','desiredStatus','costPerHr','gpu')} for p in pods if target in str(p.get('name',''))]
          client=storage.s3_client()
          prefix=f'hephaestus/scientific/v1/planner_judge_bakeoff/{target}/'
          resp=client.list_objects_v2(Bucket=storage.bucket(),Prefix=prefix)
          objs=[{'key':x['Key'],'size':x['Size']} for x in resp.get('Contents',[])]
          progress=None;result=None
          for key,name in ((prefix+'progress.json','progress'),(prefix+'result.json','result')):
              try:
                  raw=storage.maybe_read_key(client,key)
                  if raw:
                      val=json.loads(raw)
                      if name=='progress': progress=val
                      else: result={k:val.get(k) for k in ('status','completed_eval_samples','expected_eval_samples','error_type','error')}
              except Exception as exc:
                  pass
          print('PJ_MONITOR_JSON '+json.dumps({'pods_status':status,'target_pods':target_pods,'object_count':len(objs),'progress':progress,'result':result,'recent_objects':objs[-20:]},sort_keys=True))
          PY
