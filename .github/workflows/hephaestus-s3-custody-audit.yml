name: Hephaestus read-only Czech S3 custody audit
on:
  push:
    branches: [ops/global-volume-recovery-20261112]
    paths:
      - .github/workflows/hephaestus-s3-custody-audit.yml
permissions:
  contents: read
concurrency:
  group: hephaestus-s3-custody-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Inventory original S3 storage without modifying source artifacts
        run: python -u scripts/hephaestus_source_s3_custody_audit.py
