name: Hephaestus one pinned original CUDA role inference smoke
on:
  push:
    branches: [ops/boot-hephaestus-global-20261113]
    paths: [.github/workflows/hephaestus-one-role-cuda.yml]
permissions:
  contents: read
concurrency:
  group: hephaestus-one-original-cuda-role
  cancel-in-progress: false
jobs:
  gpu-smoke:
    if: github.repository == 'kys928/Hephaestus'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax gates before paid GPU allocation
        run: |
          python -m py_compile scripts/hephaestus_one_role_cuda_smoke.py
          python -m py_compile scripts/hephaestus_one_role_cuda_controller.py
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Pinned real Controller Qwen3-4B plus original LoRA CUDA inference
        run: python -u scripts/hephaestus_one_role_cuda_controller.py
  cleanup:
    if: ${{ always() }}
    needs: gpu-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Independently terminate only this CUDA smoke Pod
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get('RUNPOD_API_KEY','')
          rid=os.environ.get('GITHUB_RUN_ID','')
          if not token or not rid.isdecimal():raise RuntimeError('Cleanup identity unavailable')
          name='hephaestus-global-controller-cuda-'+rid
          api='https://api.runpod.io/v2'
          def call(method,path):
              req=urllib.request.Request(api+path,method=method,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=45) as resp:
                  raw=resp.read()
                  return json.loads(raw) if raw else {}
          got=call('GET','/pods')
          rows=got if isinstance(got,list) else got.get('pods',got.get('data',[]))
          if not isinstance(rows,list):raise RuntimeError('Malformed Pod list')
          matches=[p for p in rows if isinstance(p,dict) and p.get('name')==name]
          if len(matches)>1:raise RuntimeError('Ambiguous CUDA Pod identity')
          if matches:
              ident=matches[0].get('id')
              if not isinstance(ident,str) or not ident:raise RuntimeError('Malformed CUDA Pod ID')
              try:call('DELETE','/pods/'+ident)
              except urllib.error.HTTPError as err:
                  if err.code!=404:raise
              print('INDEPENDENT_CUDA_SMOKE_POD_DELETE_REQUESTED=true')
          else:print('INDEPENDENT_CUDA_SMOKE_POD_ALREADY_ABSENT=true')
          PY
