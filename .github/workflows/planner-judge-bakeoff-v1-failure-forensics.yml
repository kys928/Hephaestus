name: Planner Judge Bakeoff V1 failure forensics
on:
  push:
    branches: [experiment-diagnostic-scaling-v1]
    paths: [.github/workflows/planner-judge-bakeoff-v1-failure-forensics.yml]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:scripts
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT_URL: ${{ vars.RUNPOD_S3_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[s3]'
      - name: Extract representative held-out failures
        run: |
          python - <<'PY'
          import json
          import launch_first_bounded_scientific_training as storage
          run='planner-judge-bakeoff-v1-35538704330'
          prefix=f'hephaestus/scientific/v1/planner_judge_bakeoff/{run}/samples/'
          client=storage.s3_client()
          resp=client.list_objects_v2(Bucket=storage.VOLUME_ID,Prefix=prefix)
          while resp.get('IsTruncated'):
              # continue later after current page
              break
          rows=[]
          token=None
          while True:
              kwargs={'Bucket':storage.VOLUME_ID,'Prefix':prefix}
              if token: kwargs['ContinuationToken']=token
              rr=client.list_objects_v2(**kwargs)
              for x in rr.get('Contents',[]):
                  k=x['Key']
                  if '/post/' not in k: continue
                  obj=json.loads(storage.read_key(client,k))
                  rows.append(obj)
              if not rr.get('IsTruncated'): break
              token=rr.get('NextContinuationToken')
          targets={
            ('planner','nemotron-cascade-8b'):['P3','P4','P7','P8'],
            ('planner','olmo3-7b-instruct'):['P4','P5','P8'],
            ('planner','smollm3-3b'):['P1','P3','P4'],
            ('judge','phi4-mini-instruct'):['J1','J2','J4','J5'],
            ('judge','olmo3-7b-instruct'):['J1','J4','J5','J8'],
            ('judge','smollm3-3b'):['J1','J4','J7'],
            ('judge','nemotron-cascade-8b'):['J4','J6','J8'],
          }
          out={}
          for key,roots in targets.items():
              role,cid=key
              out[cid+'@'+role]={}
              for root in roots:
                  xs=[r for r in rows if r['role']==role and r['candidate_id']==cid and r['root_case_id']==root]
                  xs=sorted(xs,key=lambda r:r['score']['quality_100'])
                  out[cid+'@'+role][root]=[{
                    'case_id':r['case_id'],
                    'quality':r['score']['quality_100'],
                    'output':r['output'][:900],
                    'schema':r['score']['schema_compliant'],
                    'grounding':r['score']['components']['evidence_grounding'],
                    'calibration':r['score']['components']['confidence_calibration'],
                    'hallucination':r['score']['hallucination_rate'],
                    'finish_reason':r['generation']['finish_reason'],
                  } for r in xs[:2]]
          print('PJ_FORENSICS_JSON '+json.dumps(out,sort_keys=True))
          PY
