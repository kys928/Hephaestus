name: Anvil Global CPU audit independent watchdog
on:
  push:
    branches: [feature/anvil-integration]
    paths: [.github/workflows/anvil-global-audit.yml]
permissions:
  contents: read
concurrency:
  group: anvil-global-audit-independent-watch
  cancel-in-progress: false
jobs:
  watchdog:
    if: github.repository == 'kys928/Hephaestus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 21
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prime exact audit watchdog
        run: PYTHONPATH=src python -u scripts/anvil_global_audit_control.py prime
      - name: Watch for exact audit Pod
        run: PYTHONPATH=src python -u scripts/anvil_global_audit_control.py watchdog
