[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hephaestus-research-engineering"
version = "0.1.0"
description = "Audit-first infrastructure and control adapters for Hephaestus"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
s3 = ["boto3>=1.35,<2"]
aws-secrets = ["boto3>=1.35,<2"]
telemetry = ["opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2"]
training = ["torch>=2.2", "transformers>=4.40", "tokenizers>=0.19"]
peft-training = ["torch>=2.5", "transformers>=4.53,<5", "peft>=0.16,<1", "safetensors>=0.5,<1"]
generation = ["torch>=2.2", "transformers>=4.40", "tokenizers>=0.19"]
ml = ["torch>=2.2", "transformers>=4.40", "tokenizers>=0.19"]
role-inference = ["torch>=2.5", "transformers>=4.53,<6", "peft>=0.16,<1", "huggingface-hub>=0.30,<2", "accelerate>=1.3,<2", "boto3>=1.35,<2", "safetensors>=0.5,<1", "mistral-common>=1.5,<2"]
independent-certification = ["cryptography>=44,<47"]
test = ["pytest>=8,<9"]
dataset-preparation = ["pyarrow>=18,<24", "boto3>=1.35,<2", "tokenizers>=0.20,<1"]

[project.scripts]
hephaestus-infrastructure = "hephaestus.infrastructure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hephaestus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_cpu: actual tiny model CPU optimization or inference, no downloaded weights"]
